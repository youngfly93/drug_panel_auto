name: Reportgen QA Gate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  qa-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-qa.txt pytest lxml
          python -m pip install -e "./backend[dev]"

      - name: Install Linux document renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer \
            fonts-noto-cjk \
            poppler-utils \
            python3-uno
          soffice --version
          pdfinfo -v
          pdftotext -v
          pdftoppm -v
          /usr/bin/python3 -c 'import uno'
          python -c 'from reportgen.utils.libreoffice_profile import font_substitution_fingerprint; print(font_substitution_fingerprint(require_available=True))'

      - name: Run backend regression tests
        env:
          RG_WEB_UPSTREAM_ROOT: ${{ github.workspace }}
        run: python -m pytest backend/tests -q

      - name: Validate historical Golden contracts
        run: |
          python scripts/check_historical_golden_release.py \
            --contracts-only \
            --output-json tmp/ci_historical_golden_contracts.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci --no-fund
          npm run lint
          npm test
          npm audit --audit-level=moderate
          npm run build

      - name: Run reportgen QA gate
        run: >-
          python -m reportgen.cli qa gate
          --output-root tmp/ci_qa_gate
          --render all
          --render-required

      - name: Upload QA gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportgen-qa-gate
          path: tmp/ci_qa_gate
          if-no-files-found: ignore
