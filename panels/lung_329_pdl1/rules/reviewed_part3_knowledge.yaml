  clinical: |-
    ROS1编码一种受体酪氨酸激酶，当发生重排时导致其结构域与其它基因发生融合从而激活酪氨酸激酶。由于ROS1和ALK的高度同源性，用于治疗ALK阳性肿瘤的药物也在ROS1阳性肿瘤中具有显著的效果。对于ROS1阳性的NSCLC患者，可以采用克唑替尼和色瑞替尼进行治疗。但用克唑替尼治疗ROS1阳性的NSCLC患者也可能产生耐药，尤其是发生中枢神经系统（CNS）转移。常见的耐药突变有ROS1的G2032R和D2033N，针对耐药突变用药的研究，目前临床正在开展中。
- gene: BRAF
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    非小细胞肺癌NCCN及CSCO指南推荐对患者进行BRAF 基因V600E突变检测。针对BRAF V600E的非小细胞肺癌患者，推荐一线治疗首选方案达拉非尼+曲美替尼，某些情况下的适用方案：维莫非尼、达拉非尼及后续治疗推荐达拉非尼+曲美替尼。
    PD-L1表达阳性（≥50%）且EGFR、ALK、ROS1、BRAF检测结果为阴性的无免疫疗法禁忌症的腺癌、大细胞肺癌、病理类型不确定的非小细胞肺癌患者一线治疗首选方案包括：帕博利珠单抗、卡铂/顺铂+培美曲塞+帕博利珠单抗、阿替利珠单抗、西米普利单抗，其它推荐方案包括：卡铂+紫杉醇+贝伐珠单抗+阿替利珠单抗、卡铂+白蛋白结合型紫杉醇+阿替利珠单抗、纳武利尤单抗+伊匹木单抗+培美曲塞+卡铂/顺铂，某些情况下的适用方案：纳武利尤单抗+伊匹木单抗；鳞状细胞非小细胞肺癌患者一线治疗首选方案包括：帕博利珠单抗、卡铂+紫杉醇/白蛋白结合型紫杉醇+帕博利珠单抗、阿替利珠单抗、西米普利单抗，其它推荐方案：纳武利尤单抗+伊匹木单抗+卡铂+紫杉醇，某些情况下的适用方案：纳武利尤单抗+伊匹木单抗；
- gene: BRAF
  type: caution
  drug_name: 见下述肺癌相关用药
  clinical: |-
    病例研究报道，NF1 相关恶性胶质瘤病人使用 MEK 抑制剂曲美替尼治疗 3 周后，获得显著缓解，病人获益超过 4 个月。该病人携带 NF1 基因失活突变，研究提示此类 NF1 基因失活突变肿瘤可能可通过接受 MEK 抑制剂治疗获益[26936308]。曲美替尼用于治疗具有NF1突变的实体瘤的II期临床试验正在招募患者[NCT02465060]。基因组变异与依维莫司敏感性研究显示，38例接受依维莫司治疗的实体瘤患者中有21例显示临床获益；目标区域捕获测序发现，其中8例患者具有激活的mTOR信号通路，包括 mTOR、TSC1、TSC2、NF1和PIK3CA基因变异；其中1例携带NF1基因突变的泪腺导管腺癌患者获得了8个月的局部缓解[2015 ASCO Abstract 11010]。依维莫司用于治疗具有NF1突变神经纤维瘤患者的一项开放标签、单臂、非随机、单阶段IIa期研究，已完成，结果暂未公布[NCT01412892]。Buparlisib联合依维莫司用于治疗具有mTOR/PI3K 信号通路激活（PIK3CA、NF1、TSC1、TSC2、mTOR、KRAS、LKB1、PTEN突变导致）的肺癌患者的I期临床试验已完成，结果尚未公布[NCT01470209]。替西罗莫司用于治疗具有mTOR、NF1、NF2、NTRK3、PIK3CA、PIK3R1、PTEN、TSC1、TSC2等基因突变的晚期实体瘤的II期临床试验正在招募患者[NCT03297606]。有研究报道，对低表达 NF1神经母细胞瘤细胞模型进行的探索提示，NF1 失活肿瘤细胞存在 RAS 信号通路激活，使用 MEK 抑制剂 贝美替尼 处理相关肿瘤细胞时，其细胞生长受到显著抑制（IC50=8nM-1.16μM，对照耐药细胞株 IC50＞15μM）。研究提示 NF1 失活可能可以作为 MEK 抑制剂药物潜在生物标记物[26925841]。贝美替尼用于治疗具有RAF、RAS、NF1或MEK突变的实体瘤II期临床试验已完成，临床获益率（CBR）为23.1%，总反应率（ORR）为2.9%，无进展生存期（PFS）为2.6个月，总生存期（OS）为8.5个月[NCT01885195]。一项ERK1/2 抑制剂 (LY3214996) 与阿贝西利联合治疗肿瘤存在 BRAF、RAF1、MEK1/2、ERK1/2 和 NF1 致病性突变的患者的II期篮子试验，目前试验在进行中[NCT04534283]。一项OKI-179联合贝美替尼用于治疗 RAS 通路激活突变的晚期实体瘤患者（1b 期）和晚期NRAS突变黑色素瘤患者（2 期）的1b/2 期研究，患者肿瘤中存在 RAS 通路中的激活突变，包括但不限于 RAS、BRAF、NF1 和 GNAQ/11，目前试验在进行中[NCT05340621]。
    一项研究中，具有EGFR激活突变的肺癌患者经阿法替尼治疗后出现耐药，经基因检测中发现，存在RET融合继发性变异，该研究表明RET重排可能为EGFR突变的NSCLC中EGFR-TKIs的潜在抗性机制[26187428]。在AURA系列研究中，EGFR C797S、MET扩增、KRAS突变、BRAF V600E突变、RET重排被鉴定为对奥希替尼耐药机制[29935846]。一例携带EGFR 19DEL的肺腺癌患者接受埃克替尼治疗，进展后，检出KIF5B-RET融合，接受卡博替尼治疗，获得疾病稳定，但长期治疗效果未达到，无进展生存期（PFS）为2个月[30366769]。
- gene: MET
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    MET基因高水平扩增的非小细胞肺癌患者推荐克唑替尼、卡马替尼、特泊替尼；MET基因14号外显子跳跃突变的非小细胞肺癌患者一线治疗及后续治疗首选方案包括：卡马替尼、特泊替尼，某些情况下的适用方案：克唑替尼；
    Ⅳ期携带MET 14外显子跳跃突变的非小细胞肺癌患者一线治疗Ⅲ级推荐卡马替尼或特泊替尼（3类）;一线治疗未用靶向治疗的携带MET 14外显子跳跃突变的非小细胞肺癌患者后线治疗Ⅱ级推荐赛沃替尼（3类），Ⅲ级推荐卡马替尼或特泊替尼（3类）；
- gene: MET
  type: caution
  drug_name: 见下述肺癌相关用药
  clinical: |-
    研究表明，MET激活突变是EGFR-TKIs耐药的机制之一，在肺癌患者使用EGFR-TKIs靶药之前，若检测到MET激活突变，则说明患者携带EGFR-TKIs原发性耐药突变。另外，比较18名发生脑转移和22名未发生脑转移的非小细胞癌患者临床病理发现，MET激活突变的患者与发生脑转移的较高风险相关[20489150]。
    一项评估MCLA-129单药在晚期实体瘤患者中的安全性、药代动力学特征和抗肿瘤活性的多中心、开放标签、I/II期研究正在进行中，入组条件包括携带EGFR突变，包括但不限于：EGFR 20ins、EGFR扩增、经EGFR-TKI三代治疗耐药；MET扩增/Ex14跳跃突变的晚期非小细胞肺癌患者[NCT04930432]。
- gene: RET
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    RET基因融合阳性的非小细胞肺癌患者一线治疗及后续治疗首选方案包括：塞尔帕替尼、普拉替尼，某些情况下的适用方案包括：卡博替尼；
    Ⅳ期携带RET融合的非小细胞肺癌患者一线治疗Ⅲ级推荐塞尔帕替尼（3类）;一线治疗未用靶向治疗的携带RET融合的非小细胞肺癌患者后线治疗Ⅱ级推荐普拉替尼（3类），Ⅲ级推荐塞尔帕替尼（3类）；
- gene: RET
  type: caution
  drug_name: 见下述肺癌相关用药
  clinical: |-
    在大约5-20%的EGFR-TKI 耐药患者中存在MET基因扩增。有研究报道，在18例使用EGFR-TKI后发生继发性耐药的肺癌患者中，有4例（22%）检测到MET基因扩增[17463250]。有研究报道，在4例接受塞普替尼治疗的RET融合阳性NSCLC患者的治疗进展后活检中发现MET扩增；临床前研究证实，RET融合阳性肿瘤细胞中MET表达的增加导致了对塞普替尼的耐药性，可以通过塞普替尼与克唑替尼联合使用来克服[33082208]。
    一项研究中，具有EGFR激活突变的肺癌患者经阿法替尼治疗后出现耐药，经基因检测中发现，存在RET融合继发性变异，该研究表明RET重排可能为EGFR突变的NSCLC中EGFR-TKIs的潜在抗性机制[26187428]。在AURA系列研究中，EGFR C797S、MET扩增、KRAS突变、BRAF V600E突变、RET重排被鉴定为对奥希替尼耐药机制[29935846]。一例携带EGFR 19DEL的肺腺癌患者接受埃克替尼治疗，进展后，检出KIF5B-RET融合，接受卡博替尼治疗，获得疾病稳定，但长期治疗效果未达到，无进展生存期（PFS）为2个月[30366769]。
- gene: ERBB2
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    ERBB2（HER2）基因突变的非小细胞肺癌患者推荐恩美曲妥珠单抗（T-DM1）、Fam-trastuzumab deruxtecan-nxki（DS-8201）；
    非小细胞肺癌NCCN及CSCO指南推荐对患者进行ERBB2基因突变检测。针对ERBB2基因突变阳性的非小细胞肺癌患者推荐使用恩美曲妥珠单抗、德曲妥珠单抗、吡咯替尼进行治疗。
- gene: TP53
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    一项临床I/II期试验，旨在评估SRA737用于治疗参与DNA修复过程的基因（包括：CCNE1、MYC、BRCA1、BRCA2、FANC、TP53、RAD50、CHEK1、ATR）相关突变/扩增的晚期癌症患者的疗效，试验结果观察到大肠癌患者（PFS：1.84个月，OS：5.72个月），高级别浆液性卵巢癌患者（PFS：1.94个月，OS：6.93个月），非小细胞肺癌患者（PFS：1.76个月，OS：6.08个月），前列腺癌患者（PFS：3.02个月），头颈部鳞状细胞癌患者（PFS：3.55个月）临床获益[NCT02797964]。
    研究显示，LY2606368可以增强携带MYC扩增或过表达的小细胞肺癌对顺铂或者PARP抑制剂奥拉帕利的敏感性[28490518]。LY2606368用于治疗具有MYC扩增、CCNE1扩增、Rb缺失或FBXW7突变的实体瘤患者的II期临床试验正在开展，4个月无进展生存率为25%[NCT02873975]。一项临床I/II期试验，旨在评估SRA737用于治疗参与DNA修复过程的基因（包括：CCNE1、MYC、BRCA1、BRCA2、FANC、TP53、RAD50、CHEK1、ATR）相关突变/扩增的晚期癌症患者的疗效，试验结果观察到大肠癌患者（PFS：1.84个月，OS：5.72个月），高级别浆液性卵巢癌患者（PFS：1.94个月，OS：6.93个月），非小细胞肺癌患者（PFS：1.76个月，OS：6.08个月），前列腺癌患者（PFS：3.02个月），头颈部鳞状细胞癌患者（PFS：3.55个月）临床获益[NCT02797964]。一项I期临床，旨在评估BTX-A51在晚期实体瘤和非霍奇金淋巴瘤患者中的安全性、毒性和药代动力学、递增剂量研究，另外还将招募超 40 名受试者，以评估 BTX-A51 对存在 MYC 基因扩增/过表达的肿瘤受试者的安全性和初步疗效[NCT04872166]。
- gene: TP53
  type: caution
  drug_name: 见下述肺癌相关用药
  clinical: |-
    奥拉帕利用于治疗具有BRCA1、BRCA2失活突变以及ATM突变或缺失的肿瘤患者的II期临床试验正在招募中[NCT02693535]。&#10;&#10;一项由美国国家癌症研究所举办的临床I期试验，旨在评估盐酸可泮利塞、奥拉帕利联合度伐利尤单抗用于治疗具有ARID1A、ATM、ATRX、BARD1、BRCA1、BRCA2、BRIP1、CDK12、CHEK1、CHEK2、MSH2等基因突变的转移性或无法手术切术的实体瘤患者的毒副作用和最佳剂量，目前该试验正在招募中[NCT03842228]。一项II期临床试验，旨在评估奥拉帕利联合帕博利珠单抗治疗携带HR突变相关基因（ARID1A/B、ARID2、ATM、ATR、BARD1、BRCA1/2、BAP1、BRIP1、CHEK2、FANCA、FANCD2、MRN11A、PALB2、RAD50、RAD51、RAD54B）的黑色素瘤患者疗效，目前正在招募中[NCT04633902]。&#10;&#10;芦卡帕利用于治疗携带一个或多个同源重组DNA修复基因突变（包括BRCA1、BRCA2、ATM、CHEK2、NBN、RAD50、RAD51C、RAD51D、PALB2、MRE11、FANCA、FANCB、FANCC、FANCD2、FANCE、FANCF、FANCG、FANCI、FANCM）的前列腺癌患者的II期临床试验，正在招募中[NCT03413995]。芦卡帕利联合阿替利珠单抗用于治疗具有ATM、BARD1、BRCA1、BRCA2、BRIP1、CDK12、CHEK2、PALB2、RAD51C、RAD51D、FANCA、NBN、RAD51、RAD54L突变和/或缺失的实体瘤患者的II期临床试验正在招募患者[NCT04276376]。&#10;&#10;一项多机构Ⅰ期剂量递增和剂量扩展试验，旨在评估尼拉帕尼联合卡铂用于治疗具有HRD（同源重组脱氧核糖核酸修复途径缺陷）的实体瘤患者的有效性和安全性。患者需通过下一代DNA测序（NGS）检测出至少一个涉及DNA损伤修复基因的突变（包括但不限于：ARID1A、ATM、ATRX、MRE11A、NBN、PTEN、RAD50/51/51B、BARD1、BLM、BRCA1、BRCA2、BRIP1、FANCA/C/D2/E/F/G/L、PALB2、WRN、CHEK2、CHEK1、BAP1、FAM175A、SLX4、MLL2 或XRCC）才能入组，目前该试验正在招募患者[NCT03209401]。&#10;&#10;他拉唑帕利用于治疗具有ATM、BRCA1、BRCA2、PALB2、ARID1A、MER11、RAD50、NBS1、ATR基因突变的晚期恶性肿瘤患者的II期临床试验正在开展，不招募患者[NCT02286687]。阿维鲁单抗联合他拉唑帕利用于治疗具有BRCA或ATM突变的实体瘤患者的II期临床试验正在进行，暂不招募患者[NCT03565991]。他拉唑帕利联合阿替利珠单抗用于治疗具有BRCA1/2、PALB2、ATM、ATR、CHEK2、FANCA、RAD51C、NBN、MLH1、MRE11A、CDK12体细胞或胚系突变的实体瘤患者的II期临床试验正在招募患者[NCT02693535]。&#10;&#10;氟唑帕利本次获批是基于一项单臂、多中心临床研究的结果，该研究共入组113例既往接受过2~4次含铂方案治疗的BRCA突变复发性卵巢癌患者，研究结果显示，在103例效果可评估的患者中，氟唑帕利治疗铂敏感复发性卵巢癌患者的ORR高达69%，中位DOR长达10.2个月，中位PFS长达12.0个月，显示出出色的疗效[2019 ESMO Abstract 4168]。&#10;&#10;帕米帕利的获批是基于一项I/II期临床试验结果，该试验的关键性II期部分在中国入组了113例既往接受过至少两线标准化疗、携有BRCA1/2突变的高级别上皮性卵巢癌（OC，包括输卵管癌或原发性腹膜癌）或高级别子宫内膜上皮样癌患者。队列1纳入了90例晚期铂敏感OC（PSOC）患者，队列2纳入了23例晚期铂耐药OC（PROC）患者，截至2020年2月2日数据截止时，患者的中位随访时间为12.2个月。该研究结果显示，队列1中PSOC患者的ORR为64.6%，有8例患者实现完全缓解（CR），45例患者实现部分缓解（PRs）。疾病控制率（DCR）为95.1%，肿瘤抗原(CA)-125应答率为79.7%。队列2中PROC患者的ORR为31.6%，有6例患者实现PRs，DCR为94.7%，CA-125应答率为38.1%[Xiaohua Wu，et al]。帕米帕利联合替雷利珠单抗用于治疗具有BRCA1/2突变或其他HR相关基因（ATM、CDK12、PALB2、ARID1A、ATRX、BLM、BARD1、BRIP1、CHEK1、CHEK2、FANCA、FANCF、FANCG、FANCI、FANCL、FANCM、MSH2、NBN、RAD50、RAD51C、RAD51D、WRN）肿瘤患者的II期临床试验正在招募患者[NCT04985721]。&#10;&#10;LY2606368用于治疗具有同源重组修复缺陷（包括BRCA1、BRCA2、PALB2、RAD51C、RAD51D、ATR、ATM、CHK2或Fanconi贫血途径基因突变）的肿瘤患者的II期临床试验，4个月无进展生存率为25%[NCT02873975]。&#10;&#10;一项临床I/II期试验，旨在评估 SRA737 用于治疗参与 DNA 修复过程的基因（包括：CCNE1、MYC、BRCA1、BRCA2、FANC、TP53、RAD50、CHEK1、ATR）相关突变/扩增的晚期癌症患者的疗效，试验结果观察到大肠癌患者（PFS：1.84 个月，OS： 5.72 个月），高级别浆液性卵巢癌患者（PFS：1.94 个月，OS：6.93 个月），非小细胞肺癌患者（PFS：1.76 个月，OS：6.08 个月），前列腺癌患者（PFS：3.02 个月），头颈部鳞状细胞癌患者（PFS：3.55 个月）临床获益[NCT02797964]。
- gene: PIK3CA
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    病例研究报道，NF1 相关恶性胶质瘤病人使用 MEK 抑制剂曲美替尼治疗 3 周后，获得显著缓解，病人获益超过 4 个月。该病人携带 NF1 基因失活突变，研究提示此类 NF1 基因失活突变肿瘤可能可通过接受 MEK 抑制剂治疗获益[26936308]。曲美替尼用于治疗具有NF1突变的实体瘤的II期临床试验正在招募患者[NCT02465060]。基因组变异与依维莫司敏感性研究显示，38例接受依维莫司治疗的实体瘤患者中有21例显示临床获益；目标区域捕获测序发现，其中8例患者具有激活的mTOR信号通路，包括 mTOR、TSC1、TSC2、NF1和PIK3CA基因变异；其中1例携带NF1基因突变的泪腺导管腺癌患者获得了8个月的局部缓解[2015 ASCO Abstract 11010]。依维莫司用于治疗具有NF1突变神经纤维瘤患者的一项开放标签、单臂、非随机、单阶段IIa期研究，已完成，结果暂未公布[NCT01412892]。Buparlisib联合依维莫司用于治疗具有mTOR/PI3K 信号通路激活（PIK3CA、NF1、TSC1、TSC2、mTOR、KRAS、LKB1、PTEN突变导致）的肺癌患者的I期临床试验已完成，结果尚未公布[NCT01470209]。替西罗莫司用于治疗具有mTOR、NF1、NF2、NTRK3、PIK3CA、PIK3R1、PTEN、TSC1、TSC2等基因突变的晚期实体瘤的II期临床试验正在招募患者[NCT03297606]。有研究报道，对低表达 NF1神经母细胞瘤细胞模型进行的探索提示，NF1 失活肿瘤细胞存在 RAS 信号通路激活，使用 MEK 抑制剂 贝美替尼 处理相关肿瘤细胞时，其细胞生长受到显著抑制（IC50=8nM-1.16μM，对照耐药细胞株 IC50＞15μM）。研究提示 NF1 失活可能可以作为 MEK 抑制剂药物潜在生物标记物[26925841]。贝美替尼用于治疗具有RAF、RAS、NF1或MEK突变的实体瘤II期临床试验已完成，临床获益率（CBR）为23.1%，总反应率（ORR）为2.9%，无进展生存期（PFS）为2.6个月，总生存期（OS）为8.5个月[NCT01885195]。一项ERK1/2 抑制剂 (LY3214996) 与阿贝西利联合治疗肿瘤存在 BRAF、RAF1、MEK1/2、ERK1/2 和 NF1 致病性突变的患者的II期篮子试验，目前试验在进行中[NCT04534283]。一项OKI-179联合贝美替尼用于治疗 RAS 通路激活突变的晚期实体瘤患者（1b 期）和晚期NRAS突变黑色素瘤患者（2 期）的1b/2 期研究，患者肿瘤中存在 RAS 通路中的激活突变，包括但不限于 RAS、BRAF、NF1 和 GNAQ/11，目前试验在进行中[NCT05340621]。
    病例研究表明，携带MTOR、TSC1、TSC2体细胞突变的肿瘤患者可能对依维莫司敏感[Martin HV.et al]。基因组变异与依维莫司敏感性研究显示，38例接受依维莫司治疗的实体瘤患者中有21例显示临床获益；目标区域捕获测序发现，其中8名患者具有激活的mTOR信号通路，包括 mTOR、TSC1、TSC2、NF1和PIK3CA基因变异[2015 ASCO Abstract 11010]。研究人员对 3 株来源于肝细胞癌患者的细胞系开展了依维莫司敏感性试验，使用依维莫司以后，在 TSC2 低表达的细胞系中 mTOR 和 p-mTOR 水平明显降低，而在 TSC2野生型的细胞系中 mTOR 和 p-mTOR 水平则没有明显改变，提示依维莫司可能对 TSC2 缺失的肝细胞癌患者有效[27751352]。临床前研究显示，TSC2 缺失或突变（包括剪接突变）的肝癌细胞系对 mTOR 抑制剂依维莫司敏感[29720580]。依维莫司用于肝癌患者的临床 III 期试验显示，在15例具有 TSC2 缺陷的患者中，与5例接受铂类治疗的患者相比，10例接受依维莫司治疗的患者具有更长的OS，提示TSC2 缺陷是肝癌患者从依维莫司治疗中获益的潜在生物标记物[25724664]。一项临床I期试验招募由TSC1/TSC2、PIK3CA、PTEN等基因突变导致的 mTOR/PI3K信号通路活化的肺癌患者以及其他晚期恶性实体肿瘤患者，评估这些患者接受依维莫司联合Buparlisib治疗的安全性，目前该试验已完成，结果尚未公布[NCT01470209]。有研究表明，在小鼠肺癌发展中TSC1缺失与KRAS活化协同作用，并对西罗莫司（雷帕霉素）敏感，提示TSC1、TSC2功能缺陷的肺癌患者接受西罗莫司治疗可能获益[19966866]。一项nab-西罗莫司用于治疗具有TSC1或TSC2基因致病性失活突变的成年和青少年恶性实体瘤患者的多中心开放标签篮子试验，正在招募患者[NCT05103358]。西罗莫司白蛋白结合纳米颗粒用于治疗晚期血管周围上皮样细胞肿瘤（PEComa）患者和具有TSC1、TSC2基因突变以及mTOR通路激活的恶性肿瘤患者的临床试验，目前已批准用于市场营销[NCT03817515]。一项大规模转移性肾细胞癌研究表明，携带MTOR、TSC1、TSC2突变的患者经依维莫司或替西罗莫司治疗，临床获益率更高，这3个基因的突变与mTOR抑制剂的PR/CR有关[Andre PF .et al]。一项Ⅱ期临床试验，旨在评估替西罗莫司用于治疗携带mTOR信号通路上基因（AKT1、AKT2、AKT3、FBXW7、FLCN、mTOR、NF1、NF2、NTRK3、PIK3CA、PIK3R1、PTEN、RHEB、STK11、TSC1、TSC2等）突变的实体瘤的疗效，正在招募患者[NCT03297606]。一项II期临床试验（MATCH筛查试验），旨在评估基因检测指导的靶向治疗，用于治疗晚期难治性实体瘤的安全性和有效性。其中一队列为Sapanisertib治疗携带TSC1、TSC2突变的肿瘤患者，该试验正在招募中[NCT02465060]。
- gene: PIK3CA
  type: caution
  drug_name: 见下述肺癌相关用药
  clinical: |-
    临床前研究表明，将PIK3CA突变引入到EGFR突变的肺癌细胞系，会导致对EGFR-TKIs耐药[16906227]。一项荟萃分析表明，PIK3CA基因突变对接受EGFR-TKIs类药物治疗的非小细胞肺癌患者的临床反应和生存产生不利影响[26175928]。在一部分对EGFR-TKIs治疗获得性耐药的EGFR突变的肺癌中已经检出PIK3CA基因突变（约5%）[21430269]。但是，一项研究认为PIK3CA突变与肺腺癌患者对EGFR-TKIs的原发性耐药无关，PIK3CA基因突变的患者与PIK3CA基因未突变的患者对EGFR-TKIs的治疗反应无显著差异[27734950]。另一项研究显示，PIK3CA突变对具有EGFR突变的肺腺癌患者接受EGFR-TKIs单药治疗的临床获益并无影响[26334752]。因此，鉴于以上研究结论不一致，建议结合临床实际情况来选择是否使用此类药物。
