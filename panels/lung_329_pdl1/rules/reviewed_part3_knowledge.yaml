- gene: KEAP1
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    KEAP1（Kelch样环氧氯丙烷相关蛋白-1）是Kelch家族的一种多区域阻遏蛋白，主要存在于细胞质中，是NRF2的胞浆抑制蛋白，正常情况下锚定于胞浆的肌动蛋白细胞骨架上[24520207]。KEAP1高表达于心和骨骼肌等组织器官中，而低表达于脑、肺、肝、小肠、结肠、卵巢、睾丸及胎盘等组织器官中。生理状态下，胞浆内的KEAP1起着结合器的作用，通过含有E3的Cul3泛素连接酶与NRF2结合在一起，NRF2作为目标被蛋白体酶降解。当氧化应激反应出现，KEAP1作为氧化还原反应的传感器，它末端敏感的半胱氨酸残基通过氧化还原反应产生高效分子（如亲电子试剂）而被修饰，导致其构象发生变化，从而使NRF2解离，转入细胞核内，与MAF蛋白结合成异质二聚体后与ARE结合，激活靶基因表达，调控Ⅱ相代谢酶、抗氧化酶或药物转运体的转录活性，从而发挥抗氧化损伤的作用，恢复细胞的内稳态[21251164，17636022]。随后，KEAP1进入细胞核内，与NRF2一起出核并使NRF2在胞浆内持续被蛋白体酶降解，NRF2水平下降，激活终止[20103708]。KEAP1基因体细胞突变与胆囊癌、卵巢癌、肺癌和肝癌等肿瘤相关，直接影响NRF2信号通路[21251164，23820265，22966037，22348534]。
    KEAP1基因编码的蛋白是调控核转录因子Nrf2活化的关键因子，KEAP1-Nrf2-ARE介导的信号通路在细胞内抗氧化应答反应中发挥关键作用。正常生理下，KEAP1与Nrf2结合而锚定与细胞质内，处于抑制状态。当细胞处于氧化应激状态时，两者分离，Nrf2转移到细胞核内，识别并结合到抗氧化反应元件上，启动抗氧化等相关靶基因的表达，进而抑制氧化应激损伤作用的发生，提高细胞的存活能力。研究表明，KEAP1的表达与肿瘤的存活及耐药的产生密切关联[26117320，25337579]。KEAP1表达降低可显著影响肺癌患者化疗效果和无进展生存期[20534738]。KEAP1基因突变可降低胆囊癌患者对化疗药物的敏感性[18692501]。
- gene: NRAS
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    临床前和临床研究显示，曲美替尼对KRAS突变的非小细胞肺癌（NSCLC）患者显示出抗肿瘤活性[27100819]。一项开放、多中心、随机的Ⅱ期临床试验，旨在比较曲美替尼和多西他赛治疗晚期KRAS突变的NSCLC患者的有效性和安全性。该试验将KRAS突变型NSCLC患者随机分组，其中86例患者接受曲美替尼治疗，43例患者接受多西他赛治疗，曲美替尼组的中位PFS为12周，多西他赛组的中位PFS为11周，HR为1.14，95% CI 0.75-1.75，P=0.5197。曲美替尼组的中位总生存期为8个月，多西他赛组的中位生存期未达到，HR为0.97，95% CI 0.52-1.83，P=0.934。两组的部分缓解率均为12%（P=1.0000）。最终的试验结果表明：在治疗先前接受过治疗的KRAS突变阳性NSCLC患者时，曲美替尼组与多西他赛组的PFS以及反应率相似[NCT01362296，25722381]。除了曲美替尼单药治疗的临床研究外，在临床Ⅰb期研究中，曲美替尼分别联合吉西他滨、培美曲塞、多西他赛针对KRAS突变的NSCLC患者进行了研究，结果显示以上这些联合治疗方法证明的耐受性和临床活性值得进一步研究[NCT01428427，23583440，Kelly K et al. 2013，Gandara DR, et al. 2013，27807303]。一项由美国国家癌症研究所主办的临床Ⅰb/Ⅱ期试验，旨在研究曲美替尼和Navitoclax用于治疗具有KRAS或NRAS突变的晚期或转移性实体瘤患者，产生的副作用以及最佳剂量。目前该试验正在招募患者[NCT02079740]。BI 1701963单药以及BI 1701963联合曲美替尼用于治疗具有KRAS突变的晚期实体瘤的I期临床试验正在开展，不招募患者[NCT04111458]。奈拉替尼联合曲美替尼用于治疗携带KRAS突变的晚期或转移性实体瘤患者的疗效、安全性和耐受性的Ⅰ期试验正在招募中[NCT03065387]。
    体外研究显示，具有KRAS突变的胰腺癌细胞系对贝美替尼（MEK162）高度敏感，在敏感细胞系中贝美替尼可阻断ERK1/2，同时抑制PI3K和S6，增强p27KIP1的水平[25167228]。贝美替尼用于RAS/RAF/MEK激活实体瘤的临床试验已完成，结果显示实体瘤在第16周时的临床受益率（CBR）为23.1%[NCT01885195]。贝美替尼联合哌柏西利用于携带KRAS基因突变的晚期非小细胞肺癌患者的临床试验正在招募患者[NCT03170206]。一项贝美替尼联合阿培利司用于实体瘤的临床IB研究显示，58名入组的患者中，18名患者具有超过6周的疾病稳定期；其中4名具有KRAS突变的卵巢癌患者中，有3名患者局部缓解；此外，1名具有NRAS突变的黑色素瘤患者及1名具有KRAS突变的子宫内膜癌患者局部缓解[2014 ASCO Abstract 9051]。一项临床前模型研究表明，MEK抑制剂与CDK4/6抑制剂哌柏西利联合有显著的抗KRAS突变的NSCLC活性，而且有放射增敏作用，为晚期KRAS突变的NSCLC患者提供了一种潜在的治疗策略[26728409]。贝美替尼联合厄洛替尼用于携带KRAS/EGFR基因突变的非小细胞肺癌患者的临床试验正在开展，不招募患者[NCT01859026]。福巴替尼联合贝美替尼用于治疗携带KRAS突变的晚期肿瘤患者疗效的Ⅰb/Ⅱ期试验正在招募中[NCT04965818]。
- gene: NRAS
  type: caution
  drug_name: 见下述肺癌相关用药
  clinical: |-
    病例研究报道，NF1 相关恶性胶质瘤病人使用 MEK 抑制剂曲美替尼治疗 3 周后，获得显著缓解，病人获益超过 4 个月。该病人携带 NF1 基因失活突变，研究提示此类 NF1 基因失活突变肿瘤可能可通过接受 MEK 抑制剂治疗获益[26936308]。曲美替尼用于治疗具有NF1突变的实体瘤的II期临床试验正在招募患者[NCT02465060]。基因组变异与依维莫司敏感性研究显示，38例接受依维莫司治疗的实体瘤患者中有21例显示临床获益；目标区域捕获测序发现，其中8例患者具有激活的mTOR信号通路，包括 mTOR、TSC1、TSC2、NF1和PIK3CA基因变异；其中1例携带NF1基因突变的泪腺导管腺癌患者获得了8个月的局部缓解[2015 ASCO Abstract 11010]。依维莫司用于治疗具有NF1突变神经纤维瘤患者的一项开放标签、单臂、非随机、单阶段IIa期研究，已完成，结果暂未公布[NCT01412892]。Buparlisib联合依维莫司用于治疗具有mTOR/PI3K 信号通路激活（PIK3CA、NF1、TSC1、TSC2、mTOR、KRAS、LKB1、PTEN突变导致）的肺癌患者的I期临床试验已完成，结果尚未公布[NCT01470209]。替西罗莫司用于治疗具有mTOR、NF1、NF2、NTRK3、PIK3CA、PIK3R1、PTEN、TSC1、TSC2等基因突变的晚期实体瘤的II期临床试验正在招募患者[NCT03297606]。有研究报道，对低表达 NF1神经母细胞瘤细胞模型进行的探索提示，NF1 失活肿瘤细胞存在 RAS 信号通路激活，使用 MEK 抑制剂 贝美替尼 处理相关肿瘤细胞时，其细胞生长受到显著抑制（IC50=8nM-1.16μM，对照耐药细胞株 IC50＞15μM）。研究提示 NF1 失活可能可以作为 MEK 抑制剂药物潜在生物标记物[26925841]。贝美替尼用于治疗具有RAF、RAS、NF1或MEK突变的实体瘤II期临床试验已完成，临床获益率（CBR）为23.1%，总反应率（ORR）为2.9%，无进展生存期（PFS）为2.6个月，总生存期（OS）为8.5个月[NCT01885195]。一项ERK1/2 抑制剂 (LY3214996) 与阿贝西利联合治疗肿瘤存在 BRAF、RAF1、MEK1/2、ERK1/2 和 NF1 致病性突变的患者的II期篮子试验，目前试验在进行中[NCT04534283]。一项OKI-179联合贝美替尼用于治疗 RAS 通路激活突变的晚期实体瘤患者（1b 期）和晚期NRAS突变黑色素瘤患者（2 期）的1b/2 期研究，患者肿瘤中存在 RAS 通路中的激活突变，包括但不限于 RAS、BRAF、NF1 和 GNAQ/11，目前试验在进行中[NCT05340621]。
