schema_version: 1
source:
  panel: lung_329_pdl1
  purpose: |-
    First-pass lung-curated Part-3 (gene_sections=机制/解析, drug_sections=药物关联 benefit/caution),
    gene-level(no c_hgvs)→覆盖该基因任意变异。Corpus-harvested(de-identified, drug段已去结直肠)+
    CIViC参考(civic_gene_reference.md)。NEEDS report-team clinical review.
  scope: gene_level_reviewed_knowledge
  source_type: lab_reviewed_final_report_text
gene_sections:
- gene: EGFR
  mutation_analysis: |-
    非小细胞肺癌NCCN及CSCO指南推荐对EGFR基因进行检测。EGFR基因突变阳性（19号外显子缺失、21号外显子L858R）推荐奥希替尼、厄洛替尼、吉非替尼、阿法替尼、达可替尼、厄洛替尼+雷莫西尤单抗、厄洛替尼+贝伐珠单抗（非鳞状非小细胞患者）为一线治疗方案，其中奥希替尼为EGFR突变患者首选方案，且为EGFR突变ⅠB-ⅢA非小细胞肺癌患者推荐术后辅助治疗方案；
- gene: KRAS
  intro: |-
    KRAS基因是致癌基因，属于RAS基因家族成员，编码P21蛋白。该蛋白在MAPK信号通路中起作用，能够与GDP/GTP结合并促进GTP酶活性。当KRAS基因发生突变时不能被水解酶水解失活，而处于持续激活状态，引起RAF/MAPK的上调，传递多种生存通路信号，从而使细胞过度生长、增殖，抵抗EGFR-TKIs的作用。KRAS突变可以导致肺癌、黏蛋白腺瘤、胰腺导管癌和结肠癌等多种恶性肿瘤。KRAS基因被激活最常见的方式是点突变，多发生在N端的第12、13、61和146密码子，其中以第12密码子突变最常见。不同突变位点对P21蛋白的活化机制不同，第12密码子突变可以减弱P21内在的GTP酶活性，并使细胞凋亡减少，细胞间接触抑制减弱。RAS家族基因在癌症中没有可用的药物直接拮抗靶点，主要影响信号通路上下游靶点药物的使用效果，突变主要导致EGFR靶药和BRAF靶药的耐药性。
  mutation_analysis: |-
    非小细胞肺癌NCCN及CSCO指南推荐对患者进行KRAS基因突变检测。KRAS基因突变常见于12号密码子，KRAS G12C突变阳性的非小细胞肺癌患者后续治疗推荐索托拉西布。携带KRAS突变的患者相比于野生型患者预后较差，且对于EGFR TKI（阿法替尼、厄洛替尼、达可替尼、吉非替尼、奥希替尼等）药物敏感性降低。
- gene: ALK
  intro: |-
    ALK基因编码的蛋白由一个胞外配体结合区、跨膜区及胞内酪氨酸激酶区组成，属于胰岛素受体家族。下游信号通路包括：AK3/STAT3、PI3K/Akt、Ras/ERK等，这些信号通路与细胞增殖、凋亡、迁移相关。ALK基因异常与肿瘤的发生、恶性转化和致癌能力相关[9053841]。ALK基因的异常涉及染色体易位、突变或扩增，其中以染色体易位最为常见。染色体易位导致ALK基因和与其配对的基因融合，如非小细胞肺癌中最常见的EML4-ALK基因融合[18083107]；在炎性肌纤维母细胞性瘤中的TMP3/4-ALK基因融合[18923523]；在间变性大细胞淋巴瘤中的NPM-ALK基因融合[7824924]。EML4-ALK由第2号染色体短臂插入引起，迄今已发现多种变异类型。经检测，所有这些融合基因均有生物学功能，其表达产物为一种嵌合酪氨酸激酶。重排导致ALK胞外结构域和跨膜结构域被EML4部分取代后导致ALK的激酶结构域组成型二聚化进而使其催化活性增加[17625570]。研究表明，EML4-ALK基因重排后ALK激酶活性增加是癌细胞生长所必需的[18593892]。
  mutation_analysis: |-
    非小细胞肺癌NCCN及CSCO指南推荐对患者进行ALK基因融合检测。ALK基因常见融合为ALK-EML4，ALK基因融合阳性非小细胞肺癌患者对ALK TKI敏感，推荐使用阿来替尼、布格替尼、洛拉替尼、塞瑞替尼、克唑替尼进行一线治疗，依据患者的不同进展情况，可考虑使用阿来替尼、布格替尼、塞瑞替尼、洛拉替尼进行后续治疗。
- gene: ROS1
  intro: |-
    ROS1基因是受体酪氨酸激酶（RTK）超家族成员之一，RTK家族由58个跨膜蛋白组成，在细胞的增殖、迁移和细胞周期进程中起作用。ROS1属于II类RTK，是一种原癌基因，其激活导致PI3K/ATK/mTOR、RAS/MAPK/ERK等信号途径的激活[16885344]。据报道，这些途径与肿瘤细胞增殖与存活、细胞形态转化、肿瘤细胞转移和迁移相关[22500682，18778756]。ROS1基因还可以通过染色体重排促进癌细胞的生长。目前已发现ROS1多种融合基因亚型，如FIG-ROS1、CD74-ROS1、SLC34A2-ROS1、TMP3-ROS1、SDC4-ROS1、EZR-ROS1、LRIG3-ROS1等，这些融合基因在肺癌、胆管细胞癌、浆液性卵巢癌、胃癌等癌症中促进肿瘤的恶性转化[22661537，23052255，22327623，22659450]。
  mutation_analysis: |-
    非小细胞肺癌NCCN及CSCO指南推荐对患者进行ROS1基因融合检测。ROS1基因常见融合为ROS1-CD74、ROS1-SLC34A2、ROS1-CCDC6、ROS1-FIG，ROS1基因融合阳性非小细胞肺癌患者对ROS1 TKI敏感，推荐使用塞瑞替尼、克唑替尼、恩曲替尼、洛拉替尼进行一线治疗及后续治疗。
- gene: BRAF
  mutation_analysis: |-
    BRAF基因V600E突变的非小细胞肺癌患者一线治疗首选方案达拉非尼+曲美替尼，某些情况下的适用方案：维莫非尼、达拉非尼，后续治疗推荐达拉非尼+曲美替尼；
- gene: MET
  intro: |-
    MET基因又称c-MET，为原癌基因。MET编码肝细胞生长因子受体（HGFR），具有受体酪氨酸激酶活性。在成人中，MET表达仅限于干细胞和祖细胞，是创伤愈合和肝细胞再生所必需的。在胚胎发育期，MET受体在上皮源性细胞中表达，对侵袭性生长和介导上皮间质转化（EMT）十分重要。MET与其配体肝生长因子（HGF）结合，可引起RAS-MAPK、PI3K-AKT、STAT3、NOTCH等多条信号通路的激活，从而促进肿瘤细胞的生长、增殖、浸润和转移[12884908，22128285]。MET基因异常激活突变会触发肿瘤生长、血管新生和转移，导致乳头状肾细胞癌、子宫内膜癌等癌症的发生[29149761]。另外，MET突变还和肿瘤的不良预后相关。
  mutation_analysis: |-
    非小细胞肺癌NCCN及CSCO指南推荐，对MET基因进行检测。针对MET基因14号外显子跳跃突变的非小细胞肺癌患者推荐卡马替尼、克唑替尼、特泊替尼、赛沃替尼进行一线或后续治疗，针对MET基因高水平扩增的非小细胞肺癌患者推荐克唑替尼、卡马替尼、特泊替尼。
- gene: RET
  mutation_analysis: |-
    非小细胞肺癌NCCN及CSCO指南推荐对患者进行RET基因融合检测。针对RET基因融合的非小细胞肺癌患者推荐使用塞尔帕替尼、普拉替尼、卡博替尼进行一线及后续治疗。
- gene: ERBB2
  mutation_analysis: |-
    非小细胞肺癌NCCN及CSCO指南推荐对患者进行ERBB2基因突变检测。针对ERBB2基因突变阳性的非小细胞肺癌患者推荐使用恩美曲妥珠单抗、Fam-trastuzumab deruxtecan-nxki、吡咯替尼进行治疗。
- gene: TP53
  intro: |-
    TP53基因是重要的抑癌基因之一，其编码蛋白为p53，大约有一半人类肿瘤呈现出TP53的失活突变，其余的恶性肿瘤中通过活化p53抑制因子、降低p53活化因子，使p53信号通路失活。p53通过其在细胞核中转录依赖和胞浆中转录不依赖两种途径发挥抑癌作用。p53作为转录因子可靶向结合特定的DNA序列，使与细胞周期停滞、凋亡、细胞代谢改变等功能相关的基因转录活化。除了细胞核内的活性，p53在胞浆中表现出转录非依赖的生物活性，研究表明细胞质中p53的活化有促进细胞凋亡的作用[19407794]。其作用机制为：DNA受损时，p53蛋白活化DNA修复蛋白并阻滞细胞生长周期的进行[22872685]。当细胞DNA受损严重不能修复时，p53蛋白与特定DNA结合，激活WAF1/CIP1等多种基因，启动细胞凋亡程序，抑制细胞分裂，从而避免携带异常遗传信息的细胞继续生长、分裂[21728981]。
  mutation_analysis: |-
    mTOR抑制剂（包括依维莫司、西罗莫司、替西罗莫司）用于治疗携带FBXW7基因突变的晚期实体瘤（包括结直肠癌、肝癌、头颈癌和卵巢癌）患者的临床研究中，418例受试者中有17例患者携带FBXW7突变，小样本的研究结果没有得到预期的数据，推测可能原因是携带FBXW7基因突变的患者，同时还存在KRAS基因、TP53基因等突变，尤其是在结直肠癌患者中；其中1例具有FBXW7基因突变的肝癌患者（无其它基因突变）接受mTOR抑制剂治疗后疾病稳定，已持续6.8个月，研究结果发表时患者仍在接受治疗[24586741]。1 例63岁确诊为肺腺癌的患者，在接受化疗和放疗后PD；1例患者基因检测显示EGFR基因、KRAS基因、BRAF基因、ALK基因重排、MET基因扩增突变均为阴性，检出FBXW7基因R465H功能失活突变；随后换用替西罗莫司，治疗2个周期后，肿大的纵隔淋巴结开始缩小，治疗8周期后观察到响应[24360397]。替西罗莫司用于治疗具有AKT1、AKT2、AKT3、FBXW7、FLCN、mTOR、NF1、NF2、NTRK3、PIK3CA、PIK3R1、PTEN、RHEB、STK11、TSC1、TSC2突变的转移性实体瘤（不包括原发性脑肿瘤）、多发性骨髓瘤或 B 细胞非霍奇金淋巴瘤（不包括 CLL、SLL 和 HCL）的成人（≥ 18 岁）患者的II期临床试验正在开展，正在招募患者[NCT03297606]。
- gene: PIK3CA
  intro: |-
    PIK3CA基因编码Ⅰ型磷酸肌醇3激酶（PI3K）的催化亚基p110α，它与p85调节亚基构成异二聚体[NCBI]。PI3K由生长因子受体和胰岛素受体激活，其主要作用是调控磷脂代谢途径和磷脂源信使分子的产生，从而调节细胞生长、分裂、生存和迁移[17916723]。p110α催化细胞膜上的PIP2，使之转变为PIP3，而PIP3可作为第二信使结合并激活多种细胞内靶蛋白，参与调节细胞的增殖、运动、粘附、侵袭转移等信号通路。例如，PIK3CA点突变和扩增导致PI3K/AKT途径的激活，导致细胞不依赖生长因子增殖，增加细胞侵袭和转移能力[17877460，19697359]。PIK3CA的突变在结肠癌、脑癌、乳腺癌、肺癌等多种肿瘤的发生发展中具有重要作用[15467468]。
  mutation_analysis: |-
    PIK3CA基因编码Ⅰ型磷酸肌醇3激酶（PI3K）的催化亚基p110α，它与p85调节亚基构成异二聚体[NCBI]。PI3K由生长因子受体和胰岛素受体激活，其主要作用是调控磷脂代谢途径和磷脂源信使分子的产生，从而调节细胞生长、分裂、生存和迁移[17916723]。p110α催化细胞膜上的PIP2，使之转变为PIP3，而PIP3可作为第二信使结合并激活多种细胞内靶蛋白，参与调节细胞的增殖、运动、粘附、侵袭转移等信号通路。例如，PIK3CA点突变和扩增导致PI3K/AKT途径的激活，导致细胞不依赖生长因子增殖，增加细胞侵袭和转移能力[17877460，19697359]。PIK3CA的突变在结肠癌、脑癌、乳腺癌、肺癌等多种肿瘤的发生发展中具有重要作用[15467468]。
- gene: STK11
  intro: |-
    STK11基因，又称LKB1，编码丝氨酸/苏氨酸蛋白激酶11[NCBI]。STK11可以通过对AMPK的变构调节，调控细胞的能量代谢[21450399]；STK11还可以通过转录因子SPI对VEGF产生负向调控，抑制细胞的增殖；还能够通过调控细胞周期，使细胞周期停滞、促进细胞凋亡，抑制细胞增殖[19204826，21192934，17676035]。STK11在细胞极性的形成中起着重要的调节作用[15705853]。STK11基因的胚系突变可导致Peutz-Jeghers综合征[26877140]。STK11基因被认为是一种抑癌基因，STK11基因的突变、杂合型缺失可导致黑色素瘤、肺癌、胰腺癌等多种肿瘤的发生[26877140]。研究表明，STK11基因调控非小细胞肺癌细胞的分化和转移[17676035]。
  mutation_analysis: |-
    STK11基因，又称LKB1，编码丝氨酸/苏氨酸蛋白激酶11[NCBI]。STK11可以通过对AMPK的变构调节，调控细胞的能量代谢[21450399]；STK11还可以通过转录因子SPI对VEGF产生负向调控，抑制细胞的增殖；还能够通过调控细胞周期，使细胞周期停滞、促进细胞凋亡，抑制细胞增殖[19204826，21192934，17676035]。STK11在细胞极性的形成中起着重要的调节作用[15705853]。STK11基因的胚系突变可导致Peutz-Jeghers综合征[26877140]。STK11基因被认为是一种抑癌基因，STK11基因的突变、杂合型缺失可导致黑色素瘤、肺癌、胰腺癌等多种肿瘤的发生[26877140]。研究表明，STK11基因调控非小细胞肺癌细胞的分化和转移[17676035]。
- gene: KEAP1
  intro: |-
    KEAP1基因编码的蛋白是调控核转录因子Nrf2活化的关键因子，KEAP1-Nrf2-ARE介导的信号通路在细胞内抗氧化应答反应中发挥关键作用。正常生理下，KEAP1与Nrf2结合而锚定与细胞质内，处于抑制状态。当细胞处于氧化应激状态时，两者分离，Nrf2转移到细胞核内，识别并结合到抗氧化反应元件上，启动抗氧化等相关靶基因的表达，进而抑制氧化应激损伤作用的发生，提高细胞的存活能力。研究表明，KEAP1的表达与肿瘤的存活及耐药的产生密切关联[26117320，25337579]。KEAP1表达降低可显著影响肺癌患者化疗效果和无进展生存期[20534738]。KEAP1基因突变可降低胆囊癌患者对化疗药物的敏感性[18692501]。
  mutation_analysis: |-
    KEAP1（Kelch样环氧氯丙烷相关蛋白-1）是Kelch家族的一种多区域阻遏蛋白，主要存在于细胞质中，是Nrf2的胞浆抑制蛋白，正常情况下锚定于胞浆的肌动蛋白细胞骨架上[24520207]。KEAP1高表达于心和骨骼肌等组织器官中，而低表达于脑、肺、肝、小肠、结肠、卵巢、睾丸及胎盘等组织器官中。生理状态下，胞浆内的KEAP1起着结合器的作用，通过含有E3的Cul3泛素连接酶与Nrf2结合在一起，Nrf2作为目标被蛋白体酶降解。当氧化应激反应出现，KEAP1作为氧化还原反应的传感器，它末端敏感的半胱氨酸残基通过氧化还原反应产生高效分子（如亲电子试剂）而被修饰，导致其构象发生变化，从而使Nrf2解离，转入细胞核内，与Maf蛋白结合成异质二聚体后与ARE结合，激活靶基因表达，调控Ⅱ相代谢酶、抗氧化酶或药物转运体的转录活性，从而发挥抗氧化损伤的作用，恢复细胞的内稳态[21251164，17636022]。随后，KEAP1进入细胞核内，与Nrf2一起出核并使Nrf2在胞浆内持续被蛋白体酶降解，Nrf2水平下降，激活终止[20103708]。KEAP1基因体细胞突变与胆囊癌、卵巢癌、肺癌和肝癌等肿瘤相关，直接影响Nrf2信号通路[21251164，23820265，22966037，22348534]。
- gene: NRAS
  intro: |-
    NRAS基因是一种N-ras原癌基因，是RAS家族之一，在ras三个异形体中，NRAS功能获得性突变在血液肿瘤中发生的频率最高。其编码的一种膜蛋白可以在高尔基体和质膜之间进行穿梭，该穿梭受高尔基复合体ZDHHC9棕榈酰化的调节。该蛋白具有内在的GTP酶活性，可被一个鸟嘌呤核苷酸交换因子激活，也可被GTP酶激活蛋白灭活。该基因的突变可导致直肠癌、甲状腺滤泡状癌、自身免疫性淋巴增生综合症、努南综合症和幼年粒-单核细胞白血病等[17517660]。
- gene: NTRK1
  intro: |-
    NTRK1基因编码的蛋白是神经营养性酪氨酸受体激酶（NTRK）家族的成员之一。该激酶是膜结合受体，其与神经营养蛋白结合，使自身和MAPK途径的成员发生磷酸化，其信号传输导致细胞分化，并且可能在指定感觉神经元亚型中发挥作用。NTRK1基因突变与先天性对疼痛不敏感、无汗、自残行为、精神发育迟缓和癌症有关，存在多个交替剪接转录突变体，但是只有三个突变体的功能被鉴定。通过对肺腺癌细胞的研究发现，MRRIP-NTRK1及CD74-NTRK1融合基因能导致TRKA激酶活性改变，从而发挥癌基因的作用[24162815]。
  mutation_analysis: |-
    NTRK1基因编码的蛋白是神经营养性酪氨酸受体激酶（NTRK）家族的成员之一。该激酶是膜结合受体，其与神经营养蛋白结合，使自身和MAPK途径的成员发生磷酸化，其信号传输导致细胞分化，并且可能在指定感觉神经元亚型中发挥作用。NTRK1基因突变与先天性对疼痛不敏感、无汗、自残行为、精神发育迟缓和癌症有关，存在多个交替剪接转录突变体，但是只有三个突变体的功能被鉴定。通过对肺腺癌细胞的研究发现，MRRIP-NTRK1及CD74-NTRK1融合基因能导致TRKA激酶活性改变，从而发挥癌基因的作用[24162815]。
- gene: KIT
  mutation_analysis: |-
    KIT是原癌基因，人类KIT基因起源于猫肉瘤病毒，编码MGF/SCF（肥大细胞生长因子/干细胞因子）的III型受体酪氨酸激酶[NCBI]。在正常情况下，KIT受体与其配体SCF结合形成二聚体，引发了特定酪氨酸残基自身磷酸化，从而激活了细胞信号传导通路中下游蛋白分子的级联放大反应，最终调节细胞的分化、凋亡及增殖[3360448]。KIT基因的突变可以刺激肿瘤细胞的持续增殖。有研究报道，在许多恶性肿瘤中，KIT呈现高水平表达，包括肥大细胞白血病、尤文氏肉瘤、神经母细胞瘤、恶性黑色素瘤、甲状腺癌、子宫内膜癌、卵巢癌和小细胞肺癌[21279973，18622894，22392489，21344772]。
drug_sections:
- gene: EGFR
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    EGFR基因突变阳性（如S768I、L861Q和/或G719X）的非小细胞肺癌患者一线治疗首选方案：阿法替尼、奥希替尼，其它推荐方案包括：厄洛替尼、达可替尼、吉非替尼；后续治疗推荐奥希替尼；
    EGFR基因T790M突变的非小细胞肺癌患者推荐奥希替尼、阿美替尼、伏美替尼，不推荐吉非替尼、厄洛替尼、阿法替尼、达可替尼；
- gene: EGFR
  type: caution
  drug_name: 见下述肺癌相关用药
  clinical: |-
    EGFR基因20号外显子插入突变（p.A763_Y764insFQEA、p.A763_Y764insLQEA除外）的非小细胞肺癌患者可能对厄洛替尼、吉非替尼、阿法替尼、达可替尼等EGFR-TKIs不敏感，后续治疗推荐Amivantamab-vmjw、莫博替尼。
    EGFR基因20号外显子插入突变（p.A763_Y764insFQEA、p.A763_Y764insLQEA除外）的非小细胞肺癌患者不推荐厄洛替尼、吉非替尼、阿法替尼、达可替尼等EGFR-TKIs；EGFR基因20号外显子插入突变阳性的非小细胞肺癌患者的后续治疗推荐Amivantamab-vmjw、莫博替尼；
- gene: KRAS
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    KRAS基因突变（最常见12号密码子突变）的非小细胞肺癌患者对EGFR-TKIs药物的敏感性降低；KRAS G12C突变阳性的非小细胞肺癌患者后续治疗推荐索托拉西布；
    美国国家综合癌症网络（NCCN）最新发布的2020年新版NSCLC指南中指出，应检测与靶向治疗相关的驱动基因：如表皮生长因子受体（EGFR）、间变性淋巴瘤激酶（ALK）、c-ros原癌基因1酪氨酸激酶（ROS1）、人类表皮生长因子受体2（HER2）、间充质上皮转化因子（MET）、v-raf鼠类肉瘤病毒癌基因同源体B1（BRAF）、鼠类肉瘤病毒癌基因（KRAS）、转染重排基因（RET）及神经营养酪氨酸激酶受体（NTRK）。这些突变基因的识别和可靶标性使临床医生可以根据肿瘤的基因分型进行个性化治疗，有效的提高患者的治愈水平，更好的改善生存预后。
- gene: KRAS
  type: caution
  drug_name: 见下述肺癌相关用药
  clinical: |-
    一项Ⅲ期临床试验，274例携带EGFR或KRAS基因突变的非小细胞肺癌患者，随机接受卡铂、紫杉醇及厄洛替尼单药或联合治疗，评估其生存期、反应及TTP；研究结果显示21%携带KRAS基因2号外显子突变的患者经厄洛替尼联合化疗治疗后，TTP及生存期显著降低[16043828]。William等人筛选了60例携带KRAS或EGFR基因突变的肺腺癌患者接受吉非替尼或厄洛替尼治疗后敏感或耐药，研究发现携带KRAS基因突变的患者对吉非替尼或厄洛替尼缺少敏感性[15696205]。临床前研究表明，存在KRAS扩增细胞系对第三代EGFR-TKIs奥希替尼也不敏感[25870145]。
    在一项克唑替尼耐药机制的研究中，对11例经克唑替尼治疗后出现获得性耐药的ALK阳性非小细胞肺癌患者的标本进行检测，在两例患者标本中分别检出KRAS基因的G12C和G12V突变[22235099]。在一项病例研究中，两例同时携带ALK重排和KRAS突变（G13D和Q61H）的患者使用克唑替尼治疗后均出现疾病进展[26898615]。在一项克唑替尼治疗ALK重排患者的研究中，一例携带KRAS G12C的患者治疗后疾病进展，另一例携带KRAS G12V的患者疾病稳定超过20个月，仅携带 EML4-ALK 易位或伴随KRAS突变的患者的中位OS分别为57.1和10.7个月[26712101]。另一项研究中，一例KRAS野生型的携带ALK重排的肺腺癌患者接受克唑替尼治疗后部分反应，但4个月后发生疾病进展，在其肿瘤细胞中检出KRAS G12C的亚克隆，该患者换用色瑞替尼治疗后疾病稳定；另一名同时携带KRAS G12S和ALK重排的患者接受克唑替尼治疗后疾病迅速发生进展[26381283]。
- gene: ALK
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    NMPA批准用于治疗小细胞肺癌、腺泡状软组织肉瘤、透明细胞肉瘤以及既往至少接受过含蒽环类化疗方案治疗后进展或复发的其它晚期软组织肉瘤患者、放射性碘难治性分化型甲状腺癌、甲状腺髓样癌、非小细胞肺癌。对于具有表皮生长因子受体（EGFR）基因突变或间变性淋巴瘤激酶（ALK）阳性的非小细胞肺癌患者，在开始盐酸安罗替尼治疗前应接受相应的靶向药物治疗后进展、且至少接受过2种系统化疗后出现进展或复发。2022年非小细胞肺癌CSCO指南推荐盐酸安罗替尼用于治疗其它治疗失败后的后线治疗。
    ALK基因重排阳性（最常见融合：ALK-EML4）的非小细胞肺癌患者一线治疗首选方案包括：阿来替尼、布格替尼、洛拉替尼，其它推荐方案：塞瑞替尼，某些情况下的适用方案：克唑替尼；后续治疗推荐阿来替尼、布格替尼、塞瑞替尼、洛拉替尼；ALK G1202R突变耐药患者，后续治疗推荐洛拉替尼；
- gene: ALK
  type: caution
  drug_name: 见下述肺癌相关用药
  clinical: |-
    ROS1编码一种受体酪氨酸激酶，当发生重排时导致其结构域与其它基因发生融合从而激活酪氨酸激酶。由于ROS1和ALK的高度同源性，用于治疗ALK阳性肿瘤的药物也在ROS1阳性肿瘤中具有显著的效果。对于ROS1阳性的NSCLC患者，可以采用克唑替尼和色瑞替尼进行治疗。但用克唑替尼治疗ROS1阳性的NSCLC患者也可能产生耐药，尤其是发生中枢神经系统（CNS）转移。常见的耐药突变有ROS1的G2032R和D2033N，针对耐药突变用药的研究，目前临床正在开展中。
    ALK基因重排阳性（最常见融合：ALK-EML4）的非小细胞肺癌患者一线治疗首选方案包括：阿来替尼、布格替尼、洛拉替尼，其它推荐方案：塞瑞替尼，某些情况下的适用方案：克唑替尼；后续治疗推荐阿来替尼、布格替尼、塞瑞替尼、洛拉替尼；ALK G1202R突变耐药患者，后续治疗推荐洛拉替尼；
- gene: ROS1
  type: benefit
  drug_name: 见下述肺癌相关用药
  clinical: |-
    ROS1基因融合阳性（常见融合：ROS1-CD74、ROS1-SLC34A2、ROS1-CCDC6、ROS1-FIG）的非小细胞肺癌患者一线治疗首选方案包括：克唑替尼、恩曲替尼，其它推荐方案：塞瑞替尼；后续治疗推荐洛拉替尼、恩曲替尼；
    PD-L1表达阳性（≥50%）且EGFR、ALK、ROS1、BRAF检测结果为阴性的无免疫疗法禁忌症的腺癌、大细胞肺癌、病理类型不确定的非小细胞肺癌患者一线治疗首选方案包括：帕博利珠单抗、卡铂/顺铂+培美曲塞+帕博利珠单抗、阿替利珠单抗、西米普利单抗，其它推荐方案包括：卡铂+紫杉醇+贝伐珠单抗+阿替利珠单抗、卡铂+白蛋白结合型紫杉醇+阿替利珠单抗、纳武利尤单抗+伊匹木单抗+培美曲塞+卡铂/顺铂，某些情况下的适用方案：纳武利尤单抗+伊匹木单抗；鳞状细胞非小细胞肺癌患者一线治疗首选方案包括：帕博利珠单抗、卡铂+紫杉醇/白蛋白结合型紫杉醇+帕博利珠单抗、阿替利珠单抗、西米普利单抗，其它推荐方案：纳武利尤单抗+伊匹木单抗+卡铂+紫杉醇，某些情况下的适用方案：纳武利尤单抗+伊匹木单抗；
- gene: ROS1
  type: caution
