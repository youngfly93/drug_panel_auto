schema_version: "1.0"
panel_id: "lung_329_pdl1"
display_name: "肺癌329基因+PD-L1"
version: "0.3.0"
status: "pilot"
description: >
  Lung 329-gene + PD-L1 controlled-pilot package. It reports structured
  molecular findings and transcribes a case-specific PD-L1 source record.
  Patient-level targeted-drug, immune-association, chemotherapy-PGx and Part-3
  knowledge conclusions remain fail-closed.

aliases:
  - "lung_329"
  - "lung329"
  - "lung_329_pdl1"

project_detector_rules:
  keywords:
    - "肺癌329"
    - "329基因+pd-l1"
    - "肺癌329基因"
  keyword_groups:
    - any:
        - "肺癌329"
        - "肺癌329基因"
        - "329基因+pd-l1"
        - "329基因+PD-L1"
      weight: 1

batch_generation:
  enabled: false
  clinical_info_mode: "per_case_required"
  reason: >
    The NGS workbook is not a PD-L1 source. A shared batch form could copy one
    patient's TPS/CPS/result or provenance into other reports, so this panel is
    restricted to single-case controlled generation.

release_governance:
  uat_policy: "uat/lung329_risk_based_release_policy.yaml"

part3_knowledge:
  enabled: false
  reason: >
    The inherited base workbook and provisional lung overlay have not completed
    event-level report-group review for all 329 genes.
  disabled_notice: >
    本项目肺癌专属知识当前未启用，暂不提供第三部分的患者级基因解释和药物解析。
    检测结果请以第二部分为准，最终临床意义须由专业医师结合病理类型、疾病分期及
    现行诊疗规范综合判断。

# 复用已参数化的兼容增强器；肺癌规则和知识内容均由本面板包隔离提供。
enhancer: "reportgen.core.enhancer_registry:CRC358Enhancer"

default_template: "lung_329_pdl1_golden_template_v2"
templates:
  - id: "lung_329_pdl1_golden_template_v2"
    file: "templates/lung_329_pdl1_golden_template_v2.docx"
    version: "0.2.0"
    status: "pilot"
    description: >
      Hardened fail-closed template. Legacy migration inputs are not registered
      or shipped because they contained historical case media. This template
      removes fixed historical patient genotypes and unreviewed treatment prose,
      uses dynamic variant/event tables, displays case-specific PD-L1 source
      provenance, and keeps unreviewed clinical modules visibly blocked.
    processors:
      - "part3_formatted_sections"
      - "rebuild_references"
      - "signature_placeholder"
      - "immune_table_notes"
      - "bullet_lists"
      - "signature_layout"
      - "front_matter_spacing"
      - "blank_page_cleanup"
      - "toc_refresh"
      - "final_refresh_cleanup"
      - "underlines_and_styles"

mappings:
  default: "config/mapping.yaml"

rules:
  panel_rules: "rules/lung.yaml"
  report_text: "rules/report_text.yaml"
  biomarkers: "rules/biomarkers.yaml"
  guideline_tables: "rules/guideline_tables.yaml"
  drugs: "rules/drugs.yaml"
  pdl1_product_contract: "rules/pdl1_product_contract.yaml"
  knowledge_coverage: "rules/knowledge_coverage.yaml"
  style: "rules/style.yaml"
  filtering: "config/filtering.yaml"
  drug_brands: "config/drug_brands.yaml"

# The provisional overlay is retained as a review candidate only. The
# part3_knowledge switch above prevents it from entering pilot reports.
reviewed_part3_overlay: "rules/reviewed_part3_knowledge.yaml"

input_contract:
  required_tables:
    - "Variations"
    - "TMB"
    - "Msisensor"
  optional_tables:
    - "QC"
    - "Cnv"
    - "Fusion"
    - "HLA"
    - "CtDrug"
  required_single_fields:
    - "patient_name"
    - "sample_id"
    - "project_name"
    - "report_date"
    - "pdl1_tps"
    - "pdl1_cps"
    - "pdl1_result"
    - "pdl1_assay_profile_id"
    - "pdl1_source_record_id"
    - "pdl1_source_record_date"
    - "pdl1_specimen_id"
    - "pdl1_image_disposition"
  required_columns:
    Variations:
      - "Gene_Symbol"
      - "cHGVS"
      - "ExistIn552"
  biomarkers:
    tmb_value:
      required: true
      minimum: 0
      source_priority: ["excel"]
    msi_status:
      required: true
      allowed_values: ["MSS", "MSI-L", "MSI-H"]
      source_priority: ["excel"]
    pdl1_tps:
      required: true
      minimum: 0
      maximum: 100
      source_priority: ["form"]
    pdl1_cps:
      required: true
      minimum: 0
      maximum: 100
      source_priority: ["form"]
    pdl1_result:
      required: true
      allowed_values: ["阳性（高表达）", "阳性（低表达）", "阴性"]
      source_priority: ["form"]
    pdl1_assay_profile_id:
      required: true
      source_priority: ["form"]
    pdl1_source_record_id:
      required: true
      source_priority: ["form"]
    pdl1_source_record_date:
      required: true
      source_priority: ["form"]
    pdl1_specimen_id:
      required: true
      source_priority: ["form"]
    pdl1_image_disposition:
      required: true
      allowed_values: ["无病例专属图像（报告不展示）"]
      source_priority: ["form"]

template_contract:
  required_variables:
    - "patient_name"
    - "sample_id"
    - "pdl1_tps"
    - "pdl1_cps"
    - "pdl1_result"
    - "pdl1_assay_provenance"
    - "pdl1_source_provenance"
  required_lists:
    - "targeted_drug_tips"
    - "variants_2_1"
    - "nccn_results"
  required_markers:
    - "__PART3_MARKER__"

processors:
  - "empty_table_rows"
  - "part3_formatted_sections"
  - "signature_placeholder"
  - "report_content"
  - "bullet_lists"
  - "signature_layout"
  - "cover_artifacts"
  - "section_spacing"
  - "page_layout"
  - "gene_list_and_qc"
  - "variant_tables"
  - "hla_tail"
  - "blank_page_cleanup"
  - "toc_refresh"
  - "final_refresh_cleanup"
  - "underlines_and_styles"

golden_cases:
  - id: "lung_329_pdl1_controlled_pilot_boundary_suite"
    runner: "scripts/validate_lung329_pilot_boundary_suite.py"
    command: >-
      python scripts/validate_lung329_pilot_boundary_suite.py
      --require-visual
    synthetic: true
    counts_as_clinical_uat: false
    expected_qa_status: "PASS"
