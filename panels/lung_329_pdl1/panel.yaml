schema_version: "1.0"
panel_id: "lung_329_pdl1"
display_name: "肺癌329基因+PD-L1"
version: "0.5.1"
status: "pilot"
description: >
  Lung 329-gene + PD-L1 controlled-pilot package. It reports structured
  molecular findings, transcribes one case-specific PD-L1 image, and exposes
  only context-bounded exact-event targeted rules plus exact historical immune
  display contracts. Part-3 knowledge is visible in report-group pilot drafts
  with a non-blocking cross-cancer residual scan; broad treatment/immune and
  chemotherapy-PGx inference remain fail-closed.

aliases:
  - "lung_329"
  - "lung329"
  - "lung_329_pdl1"

project_detector_rules:
  keywords:
    - "肺癌329"
    - "329基因+pd-l1"
    - "肺癌329基因"
  keyword_groups:
    - any:
        - "肺癌329"
        - "肺癌329基因"
        - "329基因+pd-l1"
        - "329基因+PD-L1"
      weight: 1

batch_generation:
  enabled: true
  clinical_info_mode: "case_isolated_optional"
  missing_display_defaults:
    patient_name: "未提供"
  shared_field_exclusions:
    - "pdl1_tps"
    - "pdl1_cps"
    - "pdl1_result"
    - "pdl1_image_path"
    - "pdl1_assay_profile_id"
    - "pdl1_source_record_id"
    - "pdl1_source_record_date"
    - "pdl1_specimen_id"
    - "pdl1_image_disposition"
  reason: >
    Batch generation is available for report-group pilot review. A patient name
    absent from both the workbook and case enrichment is displayed explicitly
    as not provided. PD-L1 values, provenance and images are never copied from
    the shared batch form or inferred from the NGS workbook; each batch report
    leaves them absent and displays the configured not-provided marker.

release_governance:
  uat_policy: "uat/lung329_risk_based_release_policy.yaml"

part3_knowledge:
  enabled: true
  release_mode: "report_group_pilot_draft"
  cross_cancer_residual_scan:
    enabled: true
    severity: "warn"
    scan_scope: "part3"
    runtime_action: "suppress_unsafe_fields"
    suppressed_text: >
      该段历史知识尚未完成肺癌专属审核，本轮评审稿不展示原文；
      待报告组完成肺癌专属复核后补充。
    terms:
      - "结直肠癌"
      - "结肠癌"
      - "直肠癌"
      - "大肠癌"
      - "肠癌预后"
      - "colorectal"
      - "colon cancer"
    notice: >
      第三部分仍检出未被结构化隐藏的跨癌种历史叙述；当前报告只可作为
      报告组 pilot 评审稿，命中内容须在正式临床放行前修复并复核。

# 复用已参数化的兼容增强器；肺癌规则和知识内容均由本面板包隔离提供。
enhancer: "reportgen.core.enhancer_registry:CRC358Enhancer"

default_template: "lung_329_pdl1_golden_template_v2"
templates:
  - id: "lung_329_pdl1_golden_template_v2"
    file: "templates/lung_329_pdl1_golden_template_v2.docx"
    version: "0.3.0"
    status: "pilot"
    description: >
      Hardened fail-closed template. Legacy migration inputs are not registered
      or shipped because they contained historical case media. This template
      removes fixed historical patient genotypes and unreviewed treatment prose,
      uses dynamic variant/event tables, displays one validated case-specific
      PD-L1 image, and keeps unreviewed clinical modules visibly blocked.
    processors:
      - "part3_formatted_sections"
      - "rebuild_references"
      - "signature_placeholder"
      - "pdl1_case_image"
      - "immune_table_notes"
      - "bullet_lists"
      - "signature_layout"
      - "front_matter_spacing"
      - "blank_page_cleanup"
      - "toc_refresh"
      - "final_refresh_cleanup"
      - "underlines_and_styles"

mappings:
  default: "config/mapping.yaml"

rules:
  panel_rules: "rules/lung.yaml"
  report_text: "rules/report_text.yaml"
  biomarkers: "rules/biomarkers.yaml"
  guideline_tables: "rules/guideline_tables.yaml"
  drugs: "rules/drugs.yaml"
  pdl1_product_contract: "rules/pdl1_product_contract.yaml"
  knowledge_coverage: "rules/knowledge_coverage.yaml"
  style: "rules/style.yaml"
  filtering: "config/filtering.yaml"
  drug_brands: "config/drug_brands.yaml"

# The lung overlay is visible only in report-group pilot drafts. Configured
# cross-cancer fields are hidden before rendering; the scoped QA scan catches
# any unexpected residue that escapes the structured-field boundary.
reviewed_part3_overlay: "rules/reviewed_part3_knowledge.yaml"

input_contract:
  required_tables:
    - "Variations"
    - "TMB"
    - "Msisensor"
  optional_tables:
    - "QC"
    - "Cnv"
    - "Fusion"
    - "HLA"
    - "CtDrug"
  required_single_fields:
    - "patient_name"
    - "sample_id"
    - "project_name"
    - "report_date"
  required_columns:
    Variations:
      - "Gene_Symbol"
      - "cHGVS"
      - "ExistIn552"
      - "Transcript"
  required_any_columns:
    Variations:
      - "pHGVS_S"
      - "pHGVS_A"
  biomarkers:
    tmb_value:
      required: true
      minimum: 0
      source_priority: ["excel"]
    msi_status:
      required: true
      allowed_values: ["MSS", "MSI-L", "MSI-H"]
      source_priority: ["excel"]
    pdl1_tps:
      required: false
      minimum: 0
      maximum: 100
      source_priority: ["form"]
    pdl1_cps:
      required: false
      minimum: 0
      maximum: 100
      source_priority: ["form"]
    pdl1_result:
      required: false
      allowed_values: ["阳性（高表达）", "阳性（低表达）", "阴性"]
      source_priority: ["form"]
    pdl1_image_path:
      required: false
      source_priority: ["form"]
    pdl1_assay_profile_id:
      required: false
      source_priority: ["form"]
    pdl1_source_record_id:
      required: false
      source_priority: ["form"]
    pdl1_source_record_date:
      required: false
      source_priority: ["form"]
    pdl1_specimen_id:
      required: false
      source_priority: ["form"]
    pdl1_image_disposition:
      required: false
      allowed_values: ["病例专属图像（报告展示）"]
      source_priority: ["form"]

template_contract:
  required_variables:
    - "patient_name"
    - "sample_id"
    - "pdl1_tps"
    - "pdl1_cps"
    - "pdl1_result"
  required_lists:
    - "targeted_drug_tips"
    - "variants_2_1"
    - "nccn_results"
  required_markers:
    - "__PART3_MARKER__"
    - "__PDL1_CASE_IMAGE__"

processors:
  - "empty_table_rows"
  - "part3_formatted_sections"
  - "signature_placeholder"
  - "report_content"
  - "pdl1_case_image"
  - "bullet_lists"
  - "signature_layout"
  - "cover_artifacts"
  - "section_spacing"
  - "page_layout"
  - "gene_list_and_qc"
  - "variant_tables"
  - "hla_tail"
  - "blank_page_cleanup"
  - "toc_refresh"
  - "final_refresh_cleanup"
  - "underlines_and_styles"

golden_cases:
  - id: "lung_329_pdl1_controlled_pilot_boundary_suite"
    runner: "scripts/validate_lung329_pilot_boundary_suite.py"
    command: >-
      python scripts/validate_lung329_pilot_boundary_suite.py
      --require-visual
    synthetic: true
    counts_as_clinical_uat: false
    expected_qa_status: "PASS"
