- gene: KRAS
  type: caution
  applicability: kras_oncogenic_mutation_class
  header: ''
  drug_name: 依维莫司（Everolimus）
  relation: 研究显示，在PI3K通路异常的人类肿瘤细胞中，合并致癌性KRAS突变与依维莫司低敏感性相关，其中包含结直肠癌细胞模型[20664172]。该证据属于KRAS致癌性突变层级，不是任一具体位点的专属临床证据；因此仅作慎用/低获益提示，不构成绝对耐药结论。依维莫司的既有获批适应证不等同于KRAS突变结直肠癌适应证。
  clinical: 一项小样本、跨癌种的依维莫司治疗队列中，12例KRAS突变肿瘤有11例疾病进展，而31例KRAS野生型肿瘤中16例未获益[20664172]。鉴于样本量小、癌种异质且并非具体KRAS位点专属试验，报告中仅保留为负相关/慎用证据，需结合患者病情和正式适应证判断。
