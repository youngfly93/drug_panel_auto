gene_sections:
  - gene: AXIN1
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      AXIN1编码WNT信号破坏复合体的支架蛋白，可与APC、β-catenin和GSK3等组分协同调节β-catenin稳定性，并参与细胞增殖和凋亡调控。
    mutation_analysis: >-
      AXIN1功能缺失可影响WNT通路，但普通错义变异不能仅凭基因名称判定破坏复合体失活；需结合变异类型、关键结构区域、第二等位基因和直接功能证据。AXIN1位点也不能替代APC或CTNNB1事件，更不能自动形成WNT通路用药结论。
    supersedes: base_templated_axin1_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-8312, url: https://www.ncbi.nlm.nih.gov/gene/8312}

  - gene: BCL2L11
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      BCL2L11又称BIM，编码含BH3结构域的促凋亡BCL-2家族蛋白，可与其他BCL-2家族成员相互作用并参与细胞凋亡启动。
    mutation_analysis: >-
      BCL2L11表达量、缺失、多态性和肿瘤体细胞序列变异属于不同证据类型。单个未验证位点不能证明BIM功能缺失，也不能由表达或药物反应研究直接推导治疗敏感性或耐药性。
    supersedes: base_templated_bcl2l11_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-10018, url: https://www.ncbi.nlm.nih.gov/gene/10018}

  - gene: CARD11
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      CARD11编码淋巴细胞受体信号中的支架蛋白，可通过CARD-BCL10-MALT1复合体连接抗原受体与NF-κB等下游通路。
    mutation_analysis: >-
      CARD11激活与失活事件具有不同分子后果，并高度依赖B/T细胞谱系、位点和功能证据。淋巴系统肿瘤或免疫缺陷中的事件不能迁移到结直肠癌普通错义位点，单个位点不得据此判定NF-κB激活或形成用药结论。
    supersedes: base_templated_card11_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-84433, url: https://www.ncbi.nlm.nih.gov/gene/84433}

  - gene: CCNE1
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      CCNE1编码细胞周期蛋白E1，与CDK2形成复合体并参与G1/S期转换，其蛋白丰度受细胞周期严格调控。
    mutation_analysis: >-
      CCNE1扩增或过表达与编码区序列变异不是同一事件；单个错义位点不能替代拷贝数和蛋白表达结果。未有位点级功能及结直肠癌临床证据时，不得推导细胞周期失控或CDK相关治疗获益。
    supersedes: base_templated_ccne1_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-898, url: https://www.ncbi.nlm.nih.gov/gene/898}

  - gene: CD79B
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      CD79B编码B细胞抗原受体复合体的Ig-β组分，与CD79A共同支持受体表面表达和B细胞信号传递。
    mutation_analysis: >-
      CD79B的肿瘤证据主要具有B细胞谱系、确切位点和信号功能语境；该语境不能转移到结直肠癌中偶然检出的序列变异。普通错义位点不足以证明B细胞受体通路激活、肿瘤驱动或治疗意义。
    supersedes: base_templated_cd79b_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-974, url: https://www.ncbi.nlm.nih.gov/gene/974}

  - gene: CDH11
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      CDH11编码Ⅱ型经典钙黏蛋白，是介导钙依赖性细胞间黏附的跨膜蛋白，包含多个胞外钙黏蛋白重复和胞内连接区域。
    mutation_analysis: >-
      CDH11表达、细胞黏附和迁移研究不能直接解释单个肿瘤序列位点。未验证错义变异需结合保守性、黏附功能实验及肿瘤直接证据评估，不能仅凭结构域位置判定驱动性或治疗意义。
    supersedes: base_templated_cdh11_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-1009, url: https://www.ncbi.nlm.nih.gov/gene/1009}

  - gene: CRKL
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      CRKL编码含SH2和SH3结构域的衔接蛋白，可连接受体或非受体酪氨酸激酶与RAS/JNK等下游信号，也是BCR-ABL信号底物之一。
    mutation_analysis: >-
      CRKL扩增、蛋白磷酸化或BCR-ABL背景下的信号激活不等同于CRKL编码区序列变异。单个未验证位点不能证明通路激活，也不能据此外推ABL或其他激酶抑制剂反应。
    supersedes: base_templated_crkl_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-1399, url: https://www.ncbi.nlm.nih.gov/gene/1399}

  - gene: EPAS1
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      EPAS1编码缺氧诱导因子HIF-2α，是氧浓度应答转录调控因子，可参与低氧环境下相关基因表达。
    mutation_analysis: >-
      EPAS1蛋白稳定、缺氧表达特征、胚系红细胞增多症与肿瘤体细胞位点属于不同证据层。特定稳定化事件的结论不能扩展到任意结直肠癌错义变异，需确切位点、功能和肿瘤语境证据后才能判断通路影响。
    supersedes: base_templated_epas1_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-2034, url: https://www.ncbi.nlm.nih.gov/gene/2034}

  - gene: ERRFI1
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      ERRFI1又称MIG6，编码ERBB受体信号的胞质负反馈调节蛋白，可在生长刺激和细胞应激条件下参与限制受体信号。
    mutation_analysis: >-
      明确截短、双等位失活、表达缺失和普通错义位点对ERRFI1功能的证据强度不同。单个未验证序列变异不能直接视为EGFR通路解除抑制，也不能据此形成抗EGFR药物敏感或耐药结论。
    supersedes: base_templated_errfi1_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-54206, url: https://www.ncbi.nlm.nih.gov/gene/54206}

  - gene: FGF19
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      FGF19编码成纤维细胞生长因子家族配体，可与FGFR4及共受体形成信号轴并参与代谢、生长和组织稳态调控。
    mutation_analysis: >-
      FGF19扩增、过表达或配体依赖信号与FGF19编码区序列变异不是同一事件。未验证位点不能证明FGFR4轴激活，也不能从扩增或表达研究直接推导靶向治疗获益。
    supersedes: base_templated_fgf19_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-9965, url: https://www.ncbi.nlm.nih.gov/gene/9965}

  - gene: FOXL2
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      FOXL2编码叉头框转录因子，参与卵巢发育、颗粒细胞功能和组织特异性转录调控。
    mutation_analysis: >-
      卵巢颗粒细胞肿瘤中的特定位点语境和FOXL2胚系发育性疾病证据均不能替代结直肠癌普通体细胞位点解释。需匹配确切变异、肿瘤类型和功能证据，不能仅凭FOXL2基因名推导驱动性或治疗意义。
    supersedes: base_templated_foxl2_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-668, url: https://www.ncbi.nlm.nih.gov/gene/668}

  - gene: GATA3
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      GATA3编码含双GATA型锌指的转录因子，参与T细胞分化、上皮谱系维持及多种组织发育过程。
    mutation_analysis: >-
      GATA3变异的意义依赖肿瘤谱系、变异类型、转录本和功能后果；乳腺或血液肿瘤事件及胚系HDR综合征不能直接迁移到结直肠癌位点。普通错义变异不足以证明谱系重编程或治疗意义。
    supersedes: base_templated_gata3_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-2625, url: https://www.ncbi.nlm.nih.gov/gene/2625}

  - gene: IRS1
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      IRS1编码胰岛素和胰岛素样生长因子受体下游衔接蛋白，经磷酸化后连接PI3K等信号组分。
    mutation_analysis: >-
      IRS1蛋白表达、磷酸化状态、胚系代谢相关多态性和肿瘤体细胞变异不能互相替代。单个未验证位点不足以证明PI3K通路激活或药物敏感性，需要直接功能和结直肠癌临床证据。
    supersedes: base_templated_irs1_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-3667, url: https://www.ncbi.nlm.nih.gov/gene/3667}

  - gene: JAK3
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      JAK3编码主要在免疫细胞中表达的Janus激酶，连接多种白细胞介素受体与下游信号转导。
    mutation_analysis: >-
      血液肿瘤中的激活事件、胚系双等位失活导致的免疫缺陷和结直肠癌普通体细胞位点具有不同语境。未有位点级功能证据时，不能判定JAK3激活或失活，也不能自动形成JAK抑制剂结论。
    supersedes: base_templated_jak3_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-3718, url: https://www.ncbi.nlm.nih.gov/gene/3718}

  - gene: KDR
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      KDR编码VEGFR2受体酪氨酸激酶，是VEGF介导内皮细胞增殖、存活、迁移和血管生成的重要信号受体。
    mutation_analysis: >-
      肿瘤血管生成、KDR表达和循环VEGF水平不等同于KDR肿瘤序列变异。结直肠癌抗血管生成治疗依据不能由任意KDR位点替代；未验证位点需独立的功能和临床证据后才能解释。
    supersedes: base_templated_kdr_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-3791, url: https://www.ncbi.nlm.nih.gov/gene/3791}

  - gene: KEAP1
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      KEAP1编码氧化应激感受和调节蛋白，在非应激状态下促进NRF2泛素化降解，从而限制抗氧化和细胞保护基因表达。
    mutation_analysis: >-
      KEAP1通路异常需结合变异类型、关键结合区域、等位基因状态及NRF2功能证据判断；任意错义位点不能自动视为KEAP1功能缺失。其他癌种中的预后或耐药观察不能直接外推为结直肠癌治疗结论。
    supersedes: base_templated_keap1_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-9817, url: https://www.ncbi.nlm.nih.gov/gene/9817}

  - gene: KEL
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      KEL编码Kell血型系统的Ⅱ型跨膜糖蛋白和锌金属内肽酶，与XK蛋白形成复合体；其遗传多态性主要与红细胞抗原和输血医学相关。
    mutation_analysis: >-
      血型相关胚系等位基因与肿瘤体细胞测序位点不是同一临床问题。缺少肿瘤功能和结直肠癌证据时，KEL序列变异不应解释为肿瘤驱动、遗传性血型结论或治疗标志物。
    supersedes: base_templated_kel_generic_fallback
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-3792, url: https://www.ncbi.nlm.nih.gov/gene/3792}

  - gene: LBP1B
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      Panel中的LBP1B不是独立现行基因符号，而是UBP1（NCBI Gene 7342）所编码的upstream-binding protein 1亚型LBP-1b；UBP1为序列特异性DNA结合转录调控因子。
    mutation_analysis: >-
      本条必须先按UBP1转录本和LBP-1b蛋白亚型核对变异坐标，不能把LBP1B当作另一独立基因。UBP1表达或转录调控研究不足以确定单个肿瘤位点的功能，当前不得据此形成结直肠癌驱动或治疗结论。
    supersedes: base_templated_lbp1b_generic_fallback_and_unresolved_symbol_identity
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-7342, url: https://www.ncbi.nlm.nih.gov/gene/7342}

  - gene: MAP2K2
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      MAP2K2编码双特异性激酶MEK2，可被上游RAF/MAP3K磷酸化并进一步激活ERK通路，参与生长因子信号传递。
    mutation_analysis: >-
