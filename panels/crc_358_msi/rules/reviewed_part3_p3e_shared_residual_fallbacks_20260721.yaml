      Panel中的ZNF278是PATZ1（NCBI Gene 23598）的历史符号；PATZ1编码含BTB/POZ、AT-hook和C2H2锌指区域的转录调控蛋白。
    mutation_analysis: >-
      PATZ1相关融合事件与ZNF278/PATZ1普通编码区序列变异不是同一事件，其他肿瘤中的融合语境不能迁移到结直肠癌位点。解释前需确认符号和转录本，未知位点不得据此判定转录功能异常或治疗意义。
    supersedes: base_templated_znf278_generic_fallback_and_legacy_symbol_identity
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-23598, url: https://www.ncbi.nlm.nih.gov/gene/23598}

  - gene: ZNF521
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      ZNF521编码含多个C2H2锌指区域的转录调控蛋白，可与其他转录因子相互作用并参与细胞命运和分化调节。
    mutation_analysis: >-
      ZNF521表达、重排或特定造血谱系观察与结直肠癌普通序列位点不能互相替代。单个未验证变异需直接的转录调控和肿瘤证据，不能仅凭基因功能推定驱动性或形成治疗结论。
    supersedes: base_templated_znf521_generic_fallback
    source_refs:
