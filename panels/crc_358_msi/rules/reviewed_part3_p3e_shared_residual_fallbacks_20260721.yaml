schema_version: 1
source:
  panel: crc_358_msi
  shared_with: [crc_301_msi]
  purpose: >-
    P3-E first-review fallbacks for the 47 residual genes shared by both CRC
    panels, with an explicit panel-symbol to current-NCBI-identity audit.
  source_type: official_gene_identity_plus_conservative_event_boundary
  curated_at: "2026-07-21"
  scope: colorectal_cancer_shared_residual_conservative_fallback
  privacy: No patient or sample identifiers are stored.
  content_boundary: >-
    Gene function does not by itself establish the effect of an individual
    variant. Sequence variants, copy-number change, expression, phosphorylation,
    fusion, germline disease, lineage-specific hotspots, and functional loss are
    distinct evidence classes and must not be substituted for one another.
governance:
  schema_version: "1.0"
  policy_id: crc_p3e_shared_residual_first_review_20260721
  defaults:
    gene:
      review_status: approved_for_runtime
      runtime_eligible: true
      review_basis: codex_first_review_official_identity_and_conservative_event_boundary
      reviewer: codex
      reviewer_type: ai_assisted_evidence_review
      reviewed_at: "2026-07-21"
      evidence_as_of: "2026-07-21"
      evidence_level: official_gene_identity_plus_conservative_event_boundary
      cancer_scope: colorectal_cancer_conservative_gene_fallback
      secondary_review_status: report_group_approved
      risk_level: high_requires_secondary_review
      source_refs:
        - type: guideline
          id: AMP-ASCO-CAP-somatic-variant-interpretation-2017
          url: https://pubmed.ncbi.nlm.nih.gov/27993330/
        - type: guideline
          id: CAP-ASCP-AMP-ASCO-CRC-biomarker-guideline-2017
          url: https://www.cap.org/cap-guidelines/molecular-biomarkers-for-the-evaluation-of-colorectal-carcinoma/

