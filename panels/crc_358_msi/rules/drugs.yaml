    approved_drug:
      review_status: legacy_runtime
      runtime_eligible: true
      review_basis: historical_guideline_table_migration
      evidence_level: guideline_and_regulatory_summary
      evidence_as_of: "2022-12-31"
      cancer_scope: colorectal_cancer
      secondary_review_status: report_group_approved
      source_refs:
        - type: guideline_summary
          id: legacy_crc_approved_drug_table

drug_rules:
  show_all_in_part2: true
  approved_drug_rows_source: "drugs.yaml:approved_drug_rows"
  # 报告组 2026-07-20 书面口径：2.2 从下方 7 种审核药物全集中，
  # 剔除已经出现在最终 2.1 获益/慎用药物列（含全量字段）的药物。
  approved_drug_rows_display_mode: exclude_if_listed_in_part2
  approved_drug_rows_display_basis: report_group_feedback_20260720
  approved_drug_rows_contract_transition:
    proposed_contract_id: crc358_dynamic_7_drug_differencing_20260720
    prior_contract_id: crc358_reviewed_historical_table_contract
    transition_status: report_group_approved_supersession
    approved_at: "2026-07-22"
    approval_receipt_id: report_group_crc358_regression_restore_20260723
    source_ref:
      type: report_group_feedback
      id: feedback_20260720_crc_approved_drug_dynamic_display
  brand_lookup_source: "config/drug_brands.yaml"
  immunotherapy_brand_list_source: "config/drug_brands.yaml"
  evidence_levels:
    allowed:
      - "A"
      - "B"
      - "C"
      - "D"

# Request-scoped rules used by the Part 2 targeted-drug lookup. These rules are
# resolved from the active panel package and never applied to another panel
# unless that panel explicitly declares source_panel_id.
targeted_drug_rules:
  enabled: true
  base_db_enabled: true
  allowed_source_dbs: ["internal", "CGI", "CIVIC"]
  allow_internal_rows: true
  require_cancer_profile_match: false
  approved_drug_rows_enabled: true
  # 报告组历史验收口径：“靶向药物相关体细胞变异用药提示”
  # 只展示真正命中用药规则的Ⅰ/Ⅱ类变异。“显示全”指每个命中行的
  # 药物列表不再压缩为“另 X 项”，不是把无用药结论的检出变异填入该表。
  summary_display_scope: drug_matched_variants
  summary_display_variant_levels: ["Ⅰ类", "Ⅱ类"]
  # Gene-level drug overrides are forbidden by the release gate.  Every
  # production rule must be bounded by an exact variant or a reviewed event
  # class under reviewed_variant_overrides.
  overrides: {}
  applicability_rules:
    - sources:
        - internal
      reject_when_db_position_missing: true
      note: "P0全局药物规则护栏：任何内部库中只有基因、无位点/事件的泛化行都不进入2.1靶向用药提示；精确位点、明确事件及已审核reviewed override仍优先生效。"
