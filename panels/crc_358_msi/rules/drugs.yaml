# Request-scoped rules used by the Part 2 targeted-drug lookup. These rules are
# resolved from the active panel package and never applied to another panel
# unless that panel explicitly declares source_panel_id.
targeted_drug_rules:
  enabled: true
  base_db_enabled: true
  allowed_source_dbs: ["internal", "CGI", "CIVIC"]
  allow_internal_rows: true
  require_cancer_profile_match: false
  approved_drug_rows_enabled: true
  overrides:
    SETD2:
      benefit_drugs: "AZD1775（C）"
      caution_drugs: "--"
    ATM:
      benefit_drugs: |-
        奥拉帕利（C）
        芦卡帕利（C）
        尼拉帕利（C）
        他拉唑帕利（C）
        AZD6738+奥拉帕利（C）
        阿维鲁单抗+他拉唑帕利（C）
        LY2606368（C）
        盐酸可泮利塞+奥拉帕利+度伐利尤单抗（C）
        奥拉帕利+帕博利珠单抗（C）
        帕米帕利+替雷利珠单抗（C）
        芦卡帕利+阿替利珠单抗（C）
        他拉唑帕利+阿替利珠单抗（C）
