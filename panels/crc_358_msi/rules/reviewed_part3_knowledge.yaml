gene_sections:
- gene: TP53
  c_hgvs: c.844C>T
  p_hgvs: p.R282W
  intro: TP53基因是重要的抑癌基因之一，其编码蛋白为p53，大约有一半人类肿瘤呈现出TP53的失活突变，其余的恶性肿瘤中通过活化p53抑制因子、降低p53活化因子，使p53信号通路失活。p53通过其在细胞核中转录依赖和胞浆中转录不依赖两种途径发挥抑癌作用。p53作为转录因子可靶向结合特定的DNA序列，使与细胞周期停滞、凋亡、细胞代谢改变等功能相关的基因转录活化。除了细胞核内的活性，p53在胞浆中表现出转录非依赖的生物活性，研究表明细胞质中p53的活化有促进细胞凋亡的作用[19407794]。其作用机制为：DNA受损时，p53蛋白活化DNA修复蛋白并阻滞细胞生长周期的进行[22872685]。当细胞DNA受损严重不能修复时，p53蛋白与特定DNA结合，激活WAF1/CIP1等多种基因，启动细胞凋亡程序，抑制细胞分裂，从而避免携带异常遗传信息的细胞继续生长、分裂[21728981]。
  mutation_analysis: 'TP53基因编码的蛋白p53全长393个氨基酸，包含3个结构域：反式激活结构域（5-29位氨基酸）、DNA结合结构域（95-289位氨基酸）和四聚化结构域（318-359位氨基酸）。根据报道TP53突变主要发生在175、245、248、273和282这五个热点突变密码子区[19810096，10612830，12619105]，而TP53基因的K132、C135、P151、V157、R158、Y163、V173、C176、H179、H193、Y205、Y220、Y234、M237、C238、S241、C242、M246、R249、G266、P278、R280、D281和E285也是较为常见的突变密码子区[19336573]。这些位点均处于p53蛋白的DNA结合结构域，均可能会对蛋白功能产生影响。该样本检出的p.R282W
    突变位于DNA结合结构域，研究表明，该突变抑制 AMPK 信号传导，导致细胞侵袭性生长，促进小鼠模型中的肿瘤发展[24857548]。

    一项研究在389名Ⅲ期结肠癌患者中检测TP53的突变状态，结果表明TP53的突变频率为33%[26425688]。在一项包含276个结直肠癌样本的分子突变分析研究中，发现165个非高频突变的结直肠癌样本中有59%检测到TP53突变，导致TP53信号通路失活[22810696]，说明TP53在结直肠癌的发生发展中具有重要作用。因此，该样本检出的突变可能与疾病的发生发展相关。'
- gene: KRAS
  c_hgvs: c.34G>A
  p_hgvs: p.G12S
  intro: KRAS基因是致癌基因，属于RAS基因家族成员，编码P21蛋白。该蛋白在MAPK信号通路中起作用，能够与GDP/GTP结合并促进GTP酶活性。当KRAS基因发生突变时不能被水解酶水解失活，而处于持续激活状态，引起RAF/MAPK的上调，传递多种生存通路信号，从而使细胞过度生长、增殖，抵抗EGFR-TKIs的作用。KRAS突变可以导致肺癌、黏蛋白腺瘤、胰腺导管癌和结肠癌等多种恶性肿瘤。KRAS基因被激活最常见的方式是点突变，多发生在N端的第12、13、61和146密码子，其中以第12密码子突变最常见。不同突变位点对P21蛋白的活化机制不同，第12密码子突变可以减弱P21内在的GTP酶活性，并使细胞凋亡减少，细胞间接触抑制减弱。RAS家族基因在癌症中没有可用的药物直接拮抗靶点，主要影响信号通路上下游靶点药物的使用效果，突变主要导致EGFR靶药和BRAF靶药的耐药性。
  mutation_analysis: 'KRAS基因编码的蛋白全长为189个氨基酸，主要包含RAS结构域（1-166位氨基酸）。该样本检出的p.G12S突变位于上述结构域之内，为已知激活突变，对蛋白功能有重要影响。

    KRAS突变在人体肿瘤发生过程中起着重要的作用，并在胰腺癌、甲状腺癌、结直肠癌和肺癌中普遍存在[23066310]。研究显示，大约有35%-45%的结直肠癌患者携带原癌基因KRAS的突变。常见的KRAS突变多发生在N端第12、13、61和第146号密码子。这些突变会导致KRAS蛋白处于激活状态，并激活下游的信号通路，且已被证实是anti-EGFR抗体药物（如西妥昔单抗、帕尼单抗）耐药的标志[20100961]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。'
- gene: APC
  c_hgvs: c.4348C>T
  p_hgvs: p.R1450*
  intro: APC基因能够编码肿瘤抑制蛋白，并在经典WNT信号通路中起拮抗作用，APC作为β-链蛋白（β-catenin）信号传导的负调节因子，与β-链蛋白的稳定性密切相关。β-链蛋白参与E-钙粘蛋白细胞粘附系统和WNT信号传导途径[10959075]。APC基因突变导致其不能有效地与β-catenin、GSK-3β和Axin结合而形成复合物，失去了调节表达水平的能力，信号通路下游相关基因转录激活，从而导致细胞增殖异常和肿瘤的发生。研究显示，APC突变在胰腺癌、胃癌中也频繁发生，可能与其疾病的发生发展相关[1338691，12378616，1423316]。对APC的功能研究还发现APC通过其基本结构域与微管细胞骨架结合，参与细胞迁移过程。有助于微管网络的组装和重组，这与细胞分裂密切相关。APC可以间接调节肌动蛋白丝网络的组织，并因此影响细胞形态、极性和迁移[8033082，8698812]。APC-hDLG复合物形成在APC细胞周期阻断信号转导中起重要作用[10656683]。
  mutation_analysis: 'APC基因编码的蛋白全长为2843个氨基酸，主要包含2个卷曲螺旋结构域（2-59位、1869-1893位氨基酸）、1个Suppressor_APC结构域（126-208位氨基酸）、6个ARM结构域（340-392位、459-510位、512-553位、556-597位、599-644位和649-689位氨基酸）、1个Armadillo/beta-catenin-like repeat结构域（691-731位氨基酸）、4个APC_15aa结构域、7个APC_crr结构域、3个SAMP结构域、1个APC基础结构域（2223-2579位氨基酸）以及1个EB-1结合结构域（2670-2843位氨基酸）。该样本检出的p.R1450*突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    APC作为看家基因，参与DNA修复，它的突变会导致DNA修复减缓，增加周边其它细胞突变的风险，从而促进癌症的进展[24200292]。有研究表明，结直肠癌患者存在APC基因缺失，从而导致WNT信号通路失调和C-Myc的反式激活，是潜在的治疗靶点[18593890]。因此，该样本检出的突变可能与疾病的发生发展相关。'
- gene: APC
  c_hgvs: c.2387_2388del
  p_hgvs: p.Y796Wfs*2
  intro: APC基因能够编码肿瘤抑制蛋白，并在经典WNT信号通路中起拮抗作用，APC作为β-链蛋白（β-catenin）信号传导的负调节因子，与β-链蛋白的稳定性密切相关。β-链蛋白参与E-钙粘蛋白细胞粘附系统和WNT信号传导途径[10959075]。APC基因突变导致其不能有效地与β-catenin、GSK-3β和Axin结合而形成复合物，失去了调节表达水平的能力，信号通路下游相关基因转录激活，从而导致细胞增殖异常和肿瘤的发生。研究显示，APC突变在胰腺癌、胃癌中也频繁发生，可能与其疾病的发生发展相关[1338691，12378616，1423316]。对APC的功能研究还发现APC通过其基本结构域与微管细胞骨架结合，参与细胞迁移过程。有助于微管网络的组装和重组，这与细胞分裂密切相关。APC可以间接调节肌动蛋白丝网络的组织，并因此影响细胞形态、极性和迁移[8033082，8698812]。APC-hDLG复合物形成在APC细胞周期阻断信号转导中起重要作用[10656683]。
  mutation_analysis: 'APC基因编码的蛋白全长为2843个氨基酸，主要包含2个卷曲螺旋结构域（2-59位、1869-1893位氨基酸）、1个Suppressor_APC结构域（126-208位氨基酸）、6个ARM结构域（340-392位、459-510位、512-553位、556-597位、599-644位和649-689位氨基酸）、1个Armadillo/beta-catenin-like repeat结构域（691-731位氨基酸）、4个APC_15aa结构域、7个APC_crr结构域、3个SAMP结构域、1个APC基础结构域（2223-2579位氨基酸）以及1个EB-1结合结构域（2670-2843位氨基酸）。该样本检出的p.Y796Wfs*2突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    APC作为看家基因，参与DNA修复，它的突变会导致DNA修复减缓，增加周边其它细胞突变的风险，从而促进癌症的进展[24200292]。有研究表明，结直肠癌患者存在APC基因缺失，从而导致WNT信号通路失调和C-Myc的反式激活，是潜在的治疗靶点[18593890]。因此，该样本检出的突变可能与疾病的发生发展相关。'
- gene: SETD2
  c_hgvs: c.4930G>T
  p_hgvs: p.G1644*
  intro: SETD2基因又名KMT3A或HYPB，该基因编码的蛋白是一个含有SET结构域的组蛋白H3K36特异性三甲基转移酶，最早是由人造血干细胞分离的，也是与亨廷顿病的发病机制相关的蛋白[9700202]。在人体中，SETD2是H3K36唯一的三甲基转移酶，参与调节H3K36三甲基化过程（H3K36me3）[12730288，18157086]。SETD2蛋白主要包含WW结构域和AWS-SET-postSET三联结构域，负责与H3K36的特异性结合发挥甲基转移酶活性；保守的低电荷区域(
    low charge region) ，被认为是富有谷氨酰胺和脯氨酸的转录激活结构域；SETD2通过羧基端与高度磷酸化的RNA聚合酶Ⅱ相结合[16118227]。因此SETD2可能是组蛋白甲基化修饰与基因转录调控之间的桥梁。SETD2通过抑制转录起始、激活转录因子p53、参与DNA修复过程和对细胞凋亡基因的调节等防止肿瘤的发生。目前，已在肾透明细胞癌、结直肠癌、乳腺癌、急性淋巴细胞性白血病和晚期脑胶质细胞瘤等多种肿瘤中发现SETD2基因发生突变，而绝大多数突变导致H3K36me3水平降低，表明SETD2的突变导致其编码蛋白失活[20501857，20944102，24509477]。
  mutation_analysis: 'SETD2基因编码的蛋白全长为2564个氨基酸，主要包含AWS结构域（第1494-1549位氨基酸）、SET结构域（第1550-1673位氨基酸）和SRI结构域（第2465-2559位氨基酸）。该样本检出的p.G1644*突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    有研究表明，SETD2缺失与WEE1抑制剂具有“合成致死”作用[29955114]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。'
- gene: EPHA2
  c_hgvs: c.153+2T>C
  p_hgvs: ''
  intro: EPHA2是EPH亚家族的成员之一，编码蛋白含有一个976个氨基酸多肽，相对分子质量为130000，为膜结合Ⅰ型糖蛋白。研究表明，EPHA2广泛高表达于许多肿瘤组织中，包括乳腺癌、脑癌、前列腺癌、非小细胞肺癌和结肠癌等[28165374]。对大肠癌的研究发现，EPHA2在癌组织中高表达，并与肿瘤组织血管形成呈正相关。EPHA2能促进肿瘤血管内皮细胞的迁移，并通过影响细胞骨架、基质粘附和细胞粘附而促进毛细血管结构的形成。EPHA2在内皮和卵巢癌细胞中的过表达与涉及血管发生和侵袭的关键因素密切相关。这些结果表明EPHA2过表达的患者的临床结局通常较差[17154180]。
  mutation_analysis: 'EPHA2基因编码的蛋白全长为976个氨基酸，主要包含1个信号肽区域（1-24位氨基酸）、1个胞外配体结合结构域（28-201位氨基酸）、1个跨膜结构域（536-558位氨基酸）、2个FN3结构域（329-419位氨基酸和436-516位氨基酸）、1个酪氨酸激酶结构域（613-871位氨基酸）以及1个SAM结构域（901-968位氨基酸）。该样本检出的c.153+2T>C突变位于内含子与外显子交界处，可能导致mRNA剪接异常，进而导致蛋白功能缺失。

    人类EPHA2在前列腺癌、肺癌、食管癌、结直肠癌、宫颈癌、卵巢癌、乳腺癌和皮肤癌中大量表达[28966234]。有研究表明，EphA2的表达与临床分期及淋巴结转移密切相关。EphA2可与VEGF结合作为判断NSCLC恶性程度及预后的指标，及早期诊断指标和治疗的新靶点[19531623]。但是，目前该样本检出的突变在结直肠癌中的具体临床意义有待明确。'
- gene: FANCI
  c_hgvs: c.2879G>A
  p_hgvs: p.R960Q
  intro: FANCI基因是范可尼贫血互补组（FANC）的成员之一，其他成员还包括FANCA、FANCB、FANCC、FANCD1（也称为BRCA2）、FANCD2、FANCE、FANCF、FANCG、FANCJ（也称为BRIP1）、FANCL、FANCM和FANCN（也称为PALB2）[GeneCards]。FANCI基因编码的蛋白在DNA修复中起作用。目前，已在甲状腺癌、结肠癌和皮肤癌等癌症中观察到FANCI基因的错义突变、同义突变、无义突变、移码插入和移码缺失。
  mutation_analysis: 'FANCI基因编码的蛋白全长为1328个氨基酸，主要包含多个低复杂度区域。该样本检出的p.R960Q突变位于上述结构域之外，对蛋白功能的影响未知。

    有研究表明，FANCI是FA途径的第二个单泛素化成员，FANCI功能缺失可导致AKT的自发磷酸化和活化[27097374]。另有研究表明，FANCI基因编码的蛋白在DNA修复中起重要作用，FANCI功能缺失可增强肿瘤对PARP抑制剂的敏感性[27022037，Abstract
    IA25]。研究显示，DNA修复基因包含FANCI，DNA修复基因突变与免疫治疗临床获益相关[30262796，31658756]。但是，目前该样本检出的突变在结直肠癌中的具体临床意义未明。'
- gene: ATM
  c_hgvs: c.6874C>T
  p_hgvs: p.Q2292*
  intro: ATM 基因编码的蛋白属于PI3/PI4 激酶家族。ATM蛋白是重要的细胞循环检查点激酶，可调控一系列下游蛋白，包括抑癌基因蛋白P53、BRCA1，检测点激酶CHK2、RAD17
    和 RAD9，以及DNA修复蛋白NBS1。ATM以及相关的蛋白激酶ATR是细胞循环调控点检测信号的主要蛋白，对于保持基因组的稳定性以及DNA 损伤修复起重要作用。ATM基因在人类恶性肿瘤发展过程中起重要作用。ATM基因是已知的肿瘤抑制基因，ATM基因的突变与共济失调毛细血管扩张（一种常染色体隐性遗传疾病）相关[7792600]。在不吸烟的肺癌患者中，ATM基因的多态性与肺癌的发生和发展密切相关[20004998]。ATM基因突变在肺癌和结直肠癌中频繁发生[25079552，22810696]。
  mutation_analysis: 'ATM基因编码的蛋白全长为3056个氨基酸，主要包含TAN结构域（5-166位氨基酸）以及FAT结构域（2096-2489位氨基酸）。该样本检出的p.Q2292*突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    ATM缺陷细胞会导致DNA损伤的积累及基因组的不稳定进而引起肿瘤发生。因此，该样本检出的突变可能与疾病的发生发展相关。'
- gene: DNMT3A
