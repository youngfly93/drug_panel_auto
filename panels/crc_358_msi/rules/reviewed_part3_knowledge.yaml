  relation: 该样本检出KRAS基因c.34G>A，p.G12S错义突变，为已知激活突变，对蛋白功能有重要影响。携带该突变的肿瘤患者可能从RAS/RAF/MEK/ERK信号通路的下游MEK1/2激酶抑制剂获益。司美替尼是一种小分子抑制剂，可抑制KRAS/NRAS/BRAF信号通路下游MEK1/2的激酶活性，对携带KRAS/NRAS/BRAF信号通路异常激活的肿瘤特别有效。FDA和NMPA批准司美替尼用于治疗1型神经纤维瘤。哌柏西利是一种CDK4/6抑制剂，已获FDA和NMPA批准用于治疗乳腺癌。PD0325901是MEK1/2的抑制剂，正在开展临床试验。
  clinical: '有实验研究表明，司美替尼对于KRAS突变阳性的直肠癌细胞系生长有明显的抑制作用，而对于KARS野生型的直肠癌细胞系生长无明显的抑制作用[24170544]。在KRAS突变的结直肠癌剂量扩增队列的I期临床试验中，司美替尼最大耐受剂量为75mg
    p.o.BID联合每周西妥昔单抗250mg/m2，后期400mg/m2 剂量。14 例患者响应，5例患者SD，9例疾病进展[26666244]。一项临床I/II期试验，32位携带KRAS突变的结直肠癌患者接受奥沙利铂和贝伐珠单抗的治疗后接受司美替尼和伊立替康的联合治疗。在临床I期试验中，确定了最佳剂量。有3位患者（9.7%）具有部分应答，16位患者（51.6%）疾病稳定时间≥4周，其中3位超过一年。该临床试验提前终止，即便如此，试验结果中的中位无进展生存期和响应率良好，表明MEK抑制剂与其它靶向药物或细胞毒性药物的联合应用能提高对转移性结直肠癌患者治疗的临床意义[25322874]。

    体外研究显示，具有KRAS突变的细胞系对PD0325901敏感[19401449，21451123]。另有结直肠癌小鼠模型研究显示，NVP-BKM120联合PD-0325901可诱导PIK3CA野生型KRAS突变的肿瘤退缩[24576621]。PD0325901用于实体瘤患者临床Ⅰ期研究显示，在58名可评估的患者中，3名黑色素瘤患者局部缓解，23名患者疾病稳定，包括21名黑色素瘤、2名肺癌[20215549]。一项I/II期临床试验，旨在评估PD0325901联合哌柏西利用于治疗携带KRAS突变的实体瘤的安全性和有效性，该试验正在进行中，不招募患者[NCT02022982]。'
