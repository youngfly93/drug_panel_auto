  intro: NPM1基因编码的核磷蛋白是在增殖细胞核中发现的丰富的核仁蛋白，参与核糖体生物合成、mRNA转运、染色质重塑、细胞凋亡和基因组稳定性等多种途径。NPM1基因不仅可作为原癌基因，也可作为肿瘤抑制基因，在DNA修复途径以及调控肿瘤细胞凋亡方面发挥重要作用。NPM1基因失调或突变将抑制细胞响应凋亡刺激的能力，增加基因组不稳定性的耐受性，而基因组不稳定是细胞转化和癌症发展的根本原因之一[27553022]。NPM1基因的突变与白血病有关，其中大约30%的急性髓性白血病患者携带NPM1基因突变或融合[28707414，28152414，27553022]。
