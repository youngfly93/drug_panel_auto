  intro: ZRSR2基因编码的蛋白与U2AF异二聚体相关，是识别前体mRNA剪接体功能性剪接位点所必需的，并且在剪接体装配互相作用时发挥作用。研究发现，在MDS骨髓细胞中，敲除ZRSR2基因可引起剪接错误，导致U12型内含子保留但大多数U2型内含子不受影响[25586593]。ZRSR2基因常见突变包括移码突变、无义突变和错义突变等，其在血液系统恶性肿瘤中突变率较低，MDS和CMML患者中不超过8%，AML和MPN患者中少于2%[21909114]。
