- gene: TP53
  c_hgvs: c.844C>T
  p_hgvs: p.R282W
  type: benefit
  header: TP53：c.844C>T，p.R282W突变相应靶向药物
  drug_name: AZD1775、AZD1775+奥拉帕利（Olaparib）
  relation: 该样本检出TP53基因c.844C>T，p.R282W错义突变，研究表明，该突变抑制 AMPK 信号传导，导致细胞侵袭性生长，促进小鼠模型中的肿瘤发展[24857548]。AZD1775是一种WEE1激酶抑制剂，可以控制细胞分裂周期的G2检验点，TP53缺失的肿瘤细胞对其敏感[28978051]。目前该药正处于临床期。FDA批准奥拉帕利用于上皮性卵巢癌、输卵管癌、原发性腹膜癌患者、胰腺癌、乳腺癌，以及前列腺癌；NMPA批准奥拉帕利用于卵巢癌以及前列腺癌。
  clinical: 一项临床I期研究评估了AZD1775单药治疗或联合化药治疗难治性实体瘤的安全性、耐受性、药代动力学、药效动力学。该研究分成两部分，第一部分：患者接受单次剂量AZD1775的治疗，随后观察14天；第二部分：患者接受AZD1775联合吉西他滨或顺铂或卡铂的治疗，观察患者的疾病稳定和缓解情况。该研究共招募了202名患者，第一部分包含9名患者，患者接受单次剂量AZD1775的治疗后，耐受良好，未达到最大耐受剂量。接受AZD1775联合化药治疗的患者，常见的不良反应事件包括：疲劳、恶心呕吐、腹泻和血液毒性。最终有176名患者接受了评估，94名（53%）患者疾病稳定，17名（10%）患者得到部分缓解。携带TP53突变的患者组反应率高于TP53野生型的患者组（21%
    vs. 12%）。该研究表明，AZD1775单药或联合化药在治疗实体瘤中的耐受良好，有潜在的抗肿瘤活性[27601554]。一项由New York University
    School of Medicine举办的AZD1775联合伊立替康治疗RAS突变或BRAF突变一线治疗失败的转移性结直肠癌的临床I期研究已完成，但数据尚未公布[NCT02906059]。AZD1775联合奥拉帕利用于治疗携带KRAS突变或TP53突变的实体瘤患者或者同时携带KRAS突变和TP53突变的实体瘤患者的临床试验正在开展，不招募患者[NCT02576444]。
- gene: TP53
  c_hgvs: c.844C>T
  p_hgvs: p.R282W
  type: benefit
  header: ''
  drug_name: Alisertib、Alisertib+AZD1775
  relation: 该样本检出TP53基因c.844C>T，p.R282W错义突变，研究表明，该突变抑制 AMPK 信号传导，导致细胞侵袭性生长，促进小鼠模型中的肿瘤发展[24857548]。Alisertib是一种ATP竞争性的极光激酶A（AURKA）抑制剂，通过与AURKA激酶的T288结合而抑制AURKA的磷酸化及活化。临床前研究表明，Alisertib可以诱导细胞停滞在G2/M期，引起胃肠道上部肿瘤细胞的凋亡。同时，Alisertib可以下调肿瘤细胞内的多个致癌信号通路，例如NF-κB、AKT、STAT3。多项研究表明，Alisertib可以使p53和p73活化[25987188]。目前该药正处于临床期。AZD1775是一种WEE1激酶抑制剂，可以控制细胞分裂周期的G2检验点，TP53缺失的肿瘤细胞对其敏感[28978051]。目前该药正处于临床期。
  clinical: 一项Alisertib单药治疗实体瘤患者的临床 I 期研究中，Alisertib显示出初步的抗肿瘤活性，37%的患者疾病稳定，而且在某些实体瘤患者中（结直肠癌、软骨肉瘤、平滑肌肉瘤、脂肪肉瘤）疾病稳定超过6个月，同时治疗相关的不良反应控制的很好[22753585]。体内和体外研究显示，Alisertib单药能够抑制TP53突变的头颈部鳞状细胞癌（HNSCC）细胞系的有丝分裂，导致细胞生长停滞，并且Alisertib联合AZD1775能够产生协同抗肿瘤作用，延长总生存期，是TP53突变的癌症的潜在的治疗方法[30755439]。
