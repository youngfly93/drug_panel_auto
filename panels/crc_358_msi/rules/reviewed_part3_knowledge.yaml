  intro: TSC1基因编码Hamartin蛋白，是PI3K/AKT/mTOR信号通路中的重要抑癌基因。TSC1与TSC2形成蛋白复合物后可抑制mTOR通路活化，从而参与细胞生长、增殖和代谢调控。TSC1功能缺失可导致mTOR信号通路异常激活，并在多种肿瘤中被报道。
  mutation_analysis: 'TSC1基因编码的蛋白全长为1164个氨基酸，主要包含Hamartin结构域。该样本检出的p.Q655*无义突变位于Hamartin结构域内，可导致蛋白翻译提前终止，产生截短蛋白，可能导致蛋白功能缺失。

    TSC1/TSC2复合物功能异常可引起PI3K/PTEN/AKT/mTOR信号通路异常激活，该通路与细胞生长、增殖和代谢调控密切相关。有研究报道，TSC1/TSC2通路异常可见于多种肿瘤，TSC1相关变异也与结直肠癌预后和治疗评估有关。因此，该样本检出的突变可能与疾病的发生发展及用药相关。'
