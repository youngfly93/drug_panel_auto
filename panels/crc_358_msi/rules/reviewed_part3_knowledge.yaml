- gene: ATR
  intro: ATR基因编码的蛋白是为PI3/PI4激酶家族成员，是与DNA损伤修复和细胞周期阻滞相关的主要信号因子。该蛋白在检查点激酶CHK1、RAD17、RAD9和肿瘤抑制蛋白BRCA1蛋白的磷酸化中起作用，这些蛋白参与细胞周期和DNA损伤信号通路。在肠癌、皮肤癌和胃癌等癌症中已发现该基因的错义突变、无义突变、沉默突变、移码缺失、插入以及整码缺失。
  mutation_analysis: 'ATR基因编码的蛋白全长为2644个氨基酸，主要包含UME结构域（1119-1225位氨基酸）、FAT结构域（1771-2092位氨基酸）以及PI3Kc结构域（2323-2633位氨基酸）。

    有研究表明，在人类恶性肿瘤中，ATR或CHEK1发生缺失或突变的频率较低，但有研究报道，在微卫星不稳定性的结直肠癌、子宫内膜癌和散发性胃癌以及乳腺癌中较为常见[27308506]。临床前研究表明，ATR或ATM缺失的细胞系对PARP抑制剂敏感。另研究显示，在转移性尿路上皮癌中，DNA损伤修复（DDR）通路基因突变（包括ATR）与肿瘤突变负荷增加及免疫治疗临床获益相关[29489427]。'
- gene: BLM
  intro: BLM基因编码DNA解旋酶，是RecQ家族DNA解旋酶中的一个重要成员，在维持染色体的稳定性中具有重要的作用。BLM促进范可尼贫血（Fanconi
    Anemia）信号通路的激活[27083049]。BLM基因的突变导致布鲁姆综合征（一种罕见的常染色体隐形遗传病），其特征在于基因组不稳定和癌症风险增加[27083049]。目前，已检测到BLM基因的移码突变和无义突变[24932421]。
- gene: BRAF
  intro: BRAF基因编码的蛋白属于丝氨酸/苏氨酸蛋白激酶的RAF/MIL家族[NCBI]。BRAF是RAS-RAF-MEK-ERK信号通路中最为关键的激活因子[11296228]。它位于MAPK/ERK通路的入口，将细胞表面受体和RAS蛋白通过MEK和ERK与核内的转录因子相连接，参与调节细胞分化、分裂。磷酸化后的MEK会使凋亡诱导因子（BRD）失活或激活环磷酸腺苷反应序列结合蛋白（CREB），从而影响细胞凋亡，同时促进血管表皮生长因子(VEGF)、表皮生长因子受体（ERBBs）表达，加速血管生成；还能增加整合素表达，促进组织侵袭和转移[14500346，15542810]。BRAF绝大部分突变发生在BRAF蛋白激酶激活区或其附近，如BRAF
    V600E和BRAF V600K突变[20630094]。BRAF V600E突变的肿瘤细胞中，MEK-ERK 通路持续性激活，促进了细胞增殖和肿瘤侵袭转移，抵抗细胞凋亡[23397951，12594806]。
  mutation_analysis: 'BRAF基因编码的蛋白全长为766个氨基酸，主要包含RBD结构域（155-227位氨基酸）、C1结构域（235-280位氨基酸）和STYKc结构域（457-717位氨基酸）。

    目前主要跟据突变信号转导机制和激酶活性将BRAF突变分为3类，分别是V600突变激酶激活单体、Ⅱ 类激酶激活性二聚体( 包括K601、L597、G464 和
    G469等）和Ⅲ 类激酶失活性异源二聚体（G466、N581、D594 和 D596等），目前BRAF基因靶向用药及预后风险主要围绕上述3类突变研究的，其中，在BRAF
    V600E突变的肿瘤细胞中，MEK-ERK 通路持续性激活，促进细胞增殖和肿瘤侵袭转移[12068308，23397951，12594806]，BRAF基因V600E突变是肠癌预后不良较为明确的指标物[25139339]。'
- gene: EP300
  intro: EP300（E1A结合蛋白p300）基因编码腺病毒E1A相关细胞内p300转录协同激活蛋白。该蛋白能通过组蛋白乙酰化在转录调节中发挥作用，对细胞的增殖和分化有重要作用[NCBI]。它通过特异性结合磷酸化的CREB蛋白，介导cAMP基因调控。该基因也被认为是HIF1A（缺氧诱导因子1α）的共激活剂，因此在缺氧诱导的基因如VEGF的刺激中发挥作用。该基因缺陷是引起Rubinstein-Taybi综合征的原因，也可能在上皮癌中发挥作用[GeneCards]。与EP300相关的疾病包括Rubinstein-Taybi综合征2和结直肠癌。目前，在子宫内膜癌、肠癌和胃癌等多种癌症中发现EP300基因的融合、错义突变、无义突变、沉默突变、移码插入和缺失以及整码插入和缺失等变异。
- gene: FANCA
  intro: 范可尼贫血互补基团（FANC）目前包括FANCA，FANCB，FANCC，FANCD1（BRCA2），FANCD2，FANCE，FANCF，FANCG，FANCI，FANCJ（BRIP1），FANCL，FANCM和FANCN（PALB2）。范可尼贫血症是一种遗传抑制性隐性遗传病，其特点是细胞遗传不稳定、DNA交联剂过敏、染色体断裂增加、DNA修复缺陷。FANCA基因突变是引起范可尼贫血的最常见原因[NCBI]。FANCA可能募集
    SWI/SNF 复合体靶基因，从而使共轭核的转录和DNA修复功能成为可能[11726552]。
  mutation_analysis: FANCA属于Fanconi贫血/BRCA DNA链间交联修复通路核心成员，参与FA核心复合体形成、FANCD2/FANCI单泛素化及同源重组修复过程。FANCA功能缺失型变异可提示DNA损伤修复缺陷；普通错义变异需依据变异分级、功能资料和肿瘤背景解释，不能直接等同于明确PARP抑制剂获益标志。
  refinement_note: 2026-06-30 low-information wording refinement; conservative pathway/domain
    wording only.
- gene: FANCM
  intro: FANCM编码一种多功能蛋白，FANCM与范可尼贫血（FA）相关蛋白FAAP24能形成稳定的异二聚体复合物，在DNA损伤应答过程中参与FA通路的激活，与其他蛋白共同作用保护细胞免受DNA链间交联损伤。有研究报道FANCM基因中鉴定了一种新的乳腺癌等位基因，其在Fanconi贫血中起（FA）DNA修复途径的作用。3933例乳腺癌患者中检测到4例乳腺癌患者的FANCM
    c.5101C>T突变与肿瘤特征，患者生存期和治疗结果相关[27542569]。有研究表明，FANCM为乳腺癌可能的新型易感基因，该基因突变（包括功能缺失）与乳腺癌的患病风险密切相关[25288723，28033443，29351780]。
  mutation_analysis: FANCM功能异常可能导致DNA损伤修复缺陷和基因组不稳定，并可能影响PARP抑制剂等DNA损伤修复相关治疗策略评估。该基因变异的具体临床意义需结合变异类型和癌种背景判断。
- gene: FAT4
  intro: FAT4基因编码的蛋白是钙粘蛋白家族的成员之一，能够通过调节 Wnt/β-catenin信号传导而发挥肿瘤抑制作用[26633557]。FAT4启动子甲基化可导致FAT4的表达降低，而FAT4的低表达与胃癌患者的预后不良相关[29435168]。除启动子甲基化外，突变也可能导致FAT4基因失活。目前，已在结肠癌、前列腺癌和肝癌等肿瘤中发现了FAT4基因的突变与杂合性缺失[11964050，15860352，10216132]。
- gene: FBXW7
  intro: FBXW7是重要的肿瘤抑制基因，其翻译的蛋白为F-box蛋白，是SCF型泛素连接酶的重要组份，F-box蛋白发挥着识别底物的作用。底物大多是促进细胞生长的蛋白，例如NOTCH、c-MYC、mTOR等。FBXW7基因突变与多种人类肿瘤相关，最常见的突变形式是碱基置换引起的错义突变，突变经常发生在F-box蛋白的WD40结构域，该结构域发挥着底物识别的作用，错义突变使底物识别过程发生障碍，促进细胞生长的蛋白无法被泛素化，进而导致促生长蛋白的积累以及促进肿瘤的发生[25555218]。
  mutation_analysis: 'FBXW7基因编码的蛋白全长为707个氨基酸，主要包含2个卷曲螺旋结构域（27-56位、95-129位氨基酸）、FBOX结构域（284-324位氨基酸）以及8个WD40结构域。

    FBXW7基因是一种肿瘤抑制因子，在人类癌症中发生失活突变，总的突变频率约为6%，其中大约43%的突变发生在两个突变“热点”，即R465和R479，这对底物识别至关重要[17909001，18541364]。多项体外研究显示，携带FBXW7缺失变异的结直肠癌、乳腺癌细胞系对mTOR抑制剂敏感[23558291，18787170]。'
- gene: FLCN
  intro: FLCN基因编码的蛋白为卵巢滤泡激素（Folliculin），该蛋白在脑部、心脏、胎盘、睾丸、皮肤、肺、肾等组织中表达。Folliculin可能在细胞吸收外来颗粒（内吞作用或吞噬作用）、保持细胞形状、大小、运动互作等过程中起到重要作用。Folliculin可与FNIP1、FNIP2和AMPK形成复合物，参与AMPK-mTOR信号通路。FLCN生殖细胞突变可导致Birt-Hogg-Dubé（BHD）综合征中肺囊肿和肾肿瘤的发展[GeneCards]。研究发现，TFE3是MiTF/TFE转录因子家族成员，FLCN失活可引起TFE3活性升高，TFE3活性升高与肾肿瘤发展相关，因此FLCN失活可能与肾肿瘤的发生和发展密切相关[21209915，20573232]。FLCN基因的变异与胃癌易感性相关[29025585]。目前，已在子宫内膜癌、肠癌和胃癌等癌症中观察到FLCN基因错义突变、无义突变、沉默突变、移码缺失和插入以及整码缺失和插入[GeneCards]。
- gene: FLCN
  c_hgvs: c.1285del
  p_hgvs: p.H429Tfs*39
  mutation_analysis: 该突变在COSMIC数据库中记载34次，与大肠癌相关的记录21次。FLCN基因编码的蛋白全长为579个氨基酸，主要包含卵泡蛋白结构域（104-266位氨基酸）。该样本检出的p.H429Tfs*39突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。
    在体外实验和体内FLCN敲除小鼠模型中，均显示FLCN功能缺失导致PI3K/mTORC1通路上调。有案例报道，FLCN的胚系突变，采用依维莫司治疗有一定的疗效[23995526]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。
- gene: KMT2C
  intro: KMT2C基因也称为MLL3，该基因是人类混合细胞系白血病家族成员之一。KMT2C与组蛋白H3K4单甲基化/去甲基化密切相关，KMT2C可能通过调节增强子的激活与失活，而导致癌症的发生发展。目前，已在多种肿瘤中发现KMT2C突变，例如结直肠癌、胃癌、肝细胞癌、乳腺癌等[23259788，23991983，24379610，21116761]。
  mutation_analysis: 'KMT2C基因编码的蛋白全长为4911个氨基酸，主要包含2个AT hook DNA结合结构域、4个PHD型锌指结构域、2个C1结构域、4个RING结构域、5个卷曲螺旋结构域、1个HMG结构域、2个internal_repeat_3结构域、1个FYRC结构域、1个FYRN结构域、1个PostSET结构域和1个SET结构域等。

    KMT2C 活性低的细胞缺乏同源重组‐介导的双链断裂 DNA 修复。因此，这些细胞遭 受了更高的内源性 DNA 损伤和基因组不稳定性。提示低 KMT2C 表达的癌细胞是使用
    PARP1/2 抑制剂治疗的有吸引力的靶点[30665945]。'
- gene: KRAS
  intro: KRAS基因是致癌基因，属于RAS基因家族成员，编码P21蛋白。该蛋白在MAPK信号通路中起作用，能够与GDP/GTP结合并促进GTP酶活性。当KRAS基因发生突变时不能被水解酶水解失活，而处于持续激活状态，引起RAF/MAPK的上调，传递多种生存通路信号，从而使细胞过度生长、增殖，抵抗EGFR-TKIs的作用。KRAS突变可以导致肺癌、黏蛋白腺瘤、胰腺导管癌和结肠癌等多种恶性肿瘤。KRAS基因被激活最常见的方式是点突变，多发生在N端的第12、13、61和146密码子，其中以第12密码子突变最常见。不同突变位点对P21蛋白的活化机制不同，第12密码子突变可以减弱P21内在的GTP酶活性，并使细胞凋亡减少，细胞间接触抑制减弱。RAS家族基因在癌症中没有可用的药物直接拮抗靶点，主要影响信号通路上下游靶点药物的使用效果，突变主要导致EGFR靶药和BRAF靶药的耐药性。
  mutation_analysis: 'KRAS基因编码的蛋白全长为189个氨基酸，主要包含RAS结构域（1-166位氨基酸）。

    KRAS突变在人体肿瘤发生过程中起着重要的作用，并在胰腺癌、甲状腺癌、结直肠癌和肺癌中普遍存在[23066310]。研究显示，大约有35%-45%的结直肠癌患者携带原癌基因KRAS的突变。常见的KRAS突变多发生在N端第12、13、61和第146号密码子。这些突变会导致KRAS蛋白处于激活状态，并激活下游的信号通路，且已被证实是anti-EGFR抗体药物（如西妥昔单抗、帕尼单抗）耐药的标志[20100961]。'
- gene: KRAS
  c_hgvs: c.35G>T
  p_hgvs: p.G12V
  mutation_analysis: 该突变在COSMIC数据库中记载11324次，与大肠癌相关的记录5890次。KRAS基因编码的蛋白全长为189个氨基酸，主要包含RAS结构域（1-166位氨基酸）。该样本检出的KRAS基因p.G12V突变位于上述结构域内，为已知激活突变，对蛋白功能有重要影响。
    KRAS突变在人体肿瘤发生过程中起着重要的作用，并在胰腺癌、甲状腺癌、结直肠癌和肺癌中普遍存在[23066310]。研究显示，大约有35%-45%的结直肠癌患者携带原癌基因KRAS的突变。常见的KRAS突变多发生在N端第12、13、61和第146号密码子。这些突变会导致KRAS蛋白处于激活状态，并激活下游的信号通路，且已被证实是anti-EGFR抗体药物（如西妥昔单抗、帕尼单抗）耐药的标志[20100961]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。
- gene: LRP1B
  intro: LRP1B 基因是一个候选的抑癌基因，编码低密度脂蛋白受体蛋白，在肿瘤浸润以及转移中发挥着重要作用[27626682]。LRP1B是一种多功能的大受体，可以与多种的配体相结合，行使配体内吞、信号转导等不同的功能[17157791]。LRP1B的失活可引发多种肿瘤，其失活方式包括纯合性缺失、错义突变以及杂合性缺失[15289333]。目前，已在肺癌、皮肤癌和胃癌等多种癌症中发现LRP1B基因的错义突变、无义突变、沉默突变、移码缺失、插入以及整码缺失。
- gene: MLH1
  intro: MLH1是人类错配修复基因（MMR）家族中一个重要基因，MMR对保持遗传信息的完整性和稳定性，避免遗传突变的产生具有重要作用，MLH1的功能缺陷是肿瘤发病的重要机制。MLH1在遗传性非息肉病结直肠癌（HNPCC）中频繁发生突变。HNPCC，又称林奇综合症（Lynch
    Syndrome），是遗传性结直肠癌常见的易感综合征。HNPCC主要是由错配修复基因（MMR：MLH1、MSH2、MSH6和PMS2）的生殖细胞突变导致。HNPCC家族中MLH1和MSH2基因突变占90%，MSH6基因突变占7%-10%，PMS2基因突变占不到5%。研究显示MLH1基因启动子区CpG岛的过度甲基化可导致基因失活，与肿瘤发生密切相关。
  mutation_analysis: 'MLH1基因编码的蛋白全长为756个氨基酸，主要包含HATPasec结构域（23-158位氨基酸）和DNA错配修复结构域（216-335位氨基酸）。

    通过MLH1基因的启动子甲基化可沉默MLH1蛋白的表达，阻止了DNA修复基因的正常激活，而这是导致基因组不稳定以及细胞增殖进而形成结直肠癌的重要原因[17465465]。'
- gene: MSH3
  intro: MSH3（MutS同系物3）是一种错配修复（MMR）基因，编码错配修复蛋白1（MRP1），在DNA错配修复中起作用。MSH3基因编码的蛋白与MSH2形成异源二聚体以形成MutSβ，MutSβ是复制后DNA错配修复系统的一部分。MutSβ与MutLα异源二聚体形成复合物，从而启动错配修复。MSH3基因的缺陷与子宫内膜癌易感性相关[GeneCards]。研究表明，肾癌和膀胱癌细胞中MSH3蛋白的表达水平显著低于正常肾组织细胞和正常膀胱上皮细胞[12771799，15541380]。在肠癌、皮肤癌和胃癌等多种癌症中观察到该基因的错义突变、无义突变、沉默突变、移码缺失和插入以及整码缺失。
- gene: MSH6
  intro: MSH6基因编码DNA错配修复MutS家族的成员。在大肠杆菌中，MutS蛋白有助于在修复之前识别错配的核苷酸。MSH6蛋白与MSH2形成错配识别复合物，其作为双向分子开关发挥作用。该基因的突变可能与遗传性非息肉性结肠癌，结肠直肠癌和子宫内膜癌有关[Genecard]。该蛋白在识别错配的核苷酸并准备进行修复的过程中发挥作用。在多种癌症如子宫内膜癌、肠癌和胃癌中观察到该基因的错义突变、无义突变、沉默突变、移码插入和缺失以及整码缺失。
  mutation_analysis: 'MSH6基因编码的蛋白全长为1360个氨基酸，主要包含PWWP结构域（90-152位氨基酸）、MutS_Ⅰ结构域（407-526位氨基酸）、MutS_Ⅱ结构域（537-703位氨基酸）、MUTSd结构域（753-1102位氨基酸）以及MUTSac结构域（1127-1321位氨基酸）。

    MSH6基因是DNA错配修复基因系统MMR（MLH1、MSH2、MSH6、PMS2）基因之一。一项研究显示，在转移性尿路上皮癌中，DNA损伤修复（DDR）通路基因突变（包括MSH6）与肿瘤突变负荷增加及免疫治疗临床获益相关[29489427]。'
- gene: NBN
  intro: NBN基因编码的蛋白是MRE11/RAD50双链断裂修复复合物的成员，参与DNA双链断裂修复和DNA损伤诱导的检查点激活。NBN基因的突变与Nijmegen断裂综合征相关，Nijmegen断裂综合征是一种常染色体隐性染色体不稳定综合征，其特征为小头畸形、生长迟缓、免疫缺陷和癌症易感性[NCBI]。有研究发现，NBN
    I171V、657del5和R215W显示出癌症易感性[24113799]，在乳腺癌中可检出NBN杂合种系突变[25712764]。
- gene: NOTCH1
  intro: NOTCH1基因编码的蛋白是Notch家族成员之一。NOTCH信号通路是一条在进化上高度保守的胞间信号通路，物理上相邻的细胞通过NOTCH受体与配体的结合传递NOTCH信号，从而调控细胞命运。在果蝇中，NOTCH蛋白与细胞结合配体（delta、serrate）相互作用，建立细胞间信号传导途径，这在果蝇生长发育过程中起着关键性的作用[NCBI]。与之类似，人体中NOTCH信号通路在决定细胞分化方向，细胞增殖和凋亡过程中起重要作用[16612405，12676578]。此外，NOTCH1还可作为膜结合配体的受体，在发育过程中具有多种作用[NCBI]。研究证实NOTCH信号通路的异常活化是多种肿瘤形成的机制之一，例如黑色素瘤、神经胶质瘤、乳腺癌、胰腺癌、结肠癌、宫颈癌等[17168741，16239105]。
  mutation_analysis: NOTCH1变异可能影响Notch信号通路活性，从而参与肿瘤细胞增殖、分化和微环境调控。该样本检出的NOTCH1变异可能与疾病发生发展相关，但具体临床意义需结合变异类型、功能证据和癌种背景综合判断。
- gene: NTRK1
  intro: NTRK1基因编码的蛋白是神经营养性酪氨酸受体激酶（NTRK）家族的成员之一。该激酶是膜结合受体，其与神经营养蛋白结合，使自身和MAPK途径的成员发生磷酸化，其信号传输导致细胞分化，并且可能在指定感觉神经元亚型中发挥作用。NTRK1基因突变与先天性对疼痛不敏感、无汗、自残行为、精神发育迟缓和癌症有关，存在多个交替剪接转录突变体，但是只有三个突变体的功能被鉴定。通过对肺腺癌细胞的研究发现，MRRIP-NTRK1及CD74-NTRK1融合基因能导致TRKA激酶活性改变，从而发挥癌基因的作用[24162815]。
  mutation_analysis: 'NTRK1基因编码的蛋白全长为796个氨基酸，主要包含LRRCT结构域（148-192位氨基酸）、IG结构域（200-283位氨基酸）、TyrKc结构域（510-781位氨基酸）。

    有研究表明，NTRK1基因重排已在结肠癌、乳头状甲状腺癌、非小细胞肺癌中检出[26001971]。'
- gene: PBRM1
  intro: PBRM1基因（SWI/SNF染色质重构复合物基因）编码的蛋白主要包含BAH1和BAH2两个结构域、一个DNA的结合区域、以及BD1-BD6的六个乙酰化组蛋白的结合区域。这些区域之间相互作用，并在细胞的有丝分裂、细胞增殖、细胞黏附和基因的转录中，发挥重要的作用[19084573，21248752]。在肿瘤细胞中，PBRM1通过调节bcl-2
    家族及caspase家族基因表达水平调控凋亡。沉默PBRM1后细胞凋亡较少，提示PBRM1基因在肿瘤的发生中扮演抑癌基因的角色[18339845，15243570]。有研究报道，PBRM1基因的失活与原发性肾透明细胞癌相关[28329682]。
  mutation_analysis: PBRM1功能异常可能影响染色质重塑、DNA损伤应答和肿瘤免疫微环境。该基因变异在部分肿瘤中与免疫治疗反应和预后评估相关，但在结直肠癌中的具体临床意义需结合证据等级和癌种背景判断。
- gene: PIK3CA
  intro: PIK3CA基因编码Ⅰ型磷酸肌醇3激酶（PI3K）的催化亚基p110α，它与p85调节亚基构成异二聚体[NCBI]。PI3K由生长因子受体和胰岛素受体激活，其主要作用是调控磷脂代谢途径和磷脂源信使分子的产生，从而调节细胞生长、分裂、生存和迁移[17916723]。p110α催化细胞膜上的PIP2，使之转变为PIP3，而PIP3可作为第二信使结合并激活多种细胞内靶蛋白，参与调节细胞的增殖、运动、粘附、侵袭转移等信号通路。例如，PIK3CA点突变和扩增导致PI3K/AKT途径的激活，导致细胞不依赖生长因子增殖，增加细胞侵袭和转移能力[17877460，19697359]。PIK3CA的突变在结肠癌、脑癌、乳腺癌、肺癌等多种肿瘤的发生发展中具有重要作用[15467468]。
  mutation_analysis: 'PIK3CA基因编码的蛋白全长1068个氨基酸，主要为PI3K激酶的P110α催化亚基（1-1068位氨基酸），主要包含：P85结合结构域（31-108位氨基酸）、Ras结合结构域（173-292位氨基酸）、C2结构域（322-425位氨基酸）、PI3Ka结构域（518-704位氨基酸）、卷曲螺旋结构域（707-729位氨基酸）、PI3Kc结构域（798-1065位氨基酸）。

    PIK3CA点突变和扩增导致PI3K/AKT途径的激活，进而导致细胞不依赖生长因子增殖，增加细胞侵袭和转移能力[17877460，19697359]。'
- gene: PIK3R1
  intro: PIK3R1编码PI3K中85KD的调节亚基（p85α）[NCBI]。PI3K（磷脂酰肌醇3-激酶）能够特异性地将ATP的磷酸基团转移到磷脂酰肌（Phosphatidylinositol，PI）3位羟基上，从而将磷脂酰肌醇磷酸化成肌醇脂类物质，肌醇脂类物质则是具有第二信使特征的脂类衍生物[17916723]。PI3K由110KD大小的催化亚基和一个85KD、55KD
    或50KD大小的调节亚基构成。当信号分子（如ER-α）与p85α调节亚基结合后，PI3K被激活， 进而通过多种信号传导通路影响细胞生长、分化、黏附及细胞周期进程，促进肿瘤细胞增殖、侵袭、转移，并抑制肿瘤细胞凋亡[11029009]。PI3K信号转导系统的基因突变、缺失，蛋白表达异常，与人类多种恶性肿瘤的发生发展、生物学行为和预后有密切关系。PIK3R1表达异常与多种血液系统恶性肿瘤密切相关[25003534]。
- gene: POLD1
  intro: POLD1基因编码DNA聚合酶δ催化亚基（DNA polymerase delta, Pold），又名p125，具有聚合酶活性和外切酶活性。Pold是真核生物DNA复制过程中主要的复制酶之一，在DNA复制、损伤修复方面起着重要的作用。研究发现在下颌发育不良、耳聋、早衰、脂肪代谢障碍和非典型Werner综合征的发育障碍中检测出POLD1基因突变，POLD1表达水平的变化及活性与细胞的衰老和个体的衰老有关[27320729]。
- gene: POLE
  intro: POLE基因编码DNA聚合酶ε的催化亚基。该酶参与DNA修复和染色体DNA的复制。POLE基因突变与结直肠癌、面部畸形、免疫缺陷、青斑以及身材矮小有关[GeneCards]。POLE基因突变与子宫内膜癌亚型中DNA错配修复基因的体细胞突变有关[25224212]。在晚期结直肠癌中，POLE体细胞突变存在但比较少见[29072370]。目前，已在子宫内膜癌、肠癌和胃癌等多种癌症中检测到POLE基因的错义突变、无义突变、沉默突变、移码缺失、插入以及整码缺失。
  mutation_analysis: POLE编码DNA聚合酶ε催化亚基，参与DNA复制和校对。POLE外切酶结构域致病变异可与超突变表型、免疫治疗敏感性评估和预后分层相关；非外切酶区或证据不足位点需按变异类型、结构域位置、TMB/MSI状态及临床资料解释。
  refinement_note: 2026-06-30 low-information wording refinement; conservative pathway/domain
    wording only.
- gene: RAD50
  intro: RAD50基因编码的蛋白与MRE11以及NBN基因编码的蛋白组成MRN复合体，行使修复双链DNA的功能，对维持基因组及其端粒的稳定有重要意义。有研究表明，RAD50基因SNP位点与克罗恩病的易感性相关[16724073]，且有研究发现该基因突变导致患乳腺癌的风险增加[24894818]。有研究报道，RAD50高表达与结直肠癌患者的生存率差相关[29322791]。目前，已经在子宫内膜癌、肠癌和胃癌等多种癌症中观察到RAD50基因发生错义突变、无义突变、沉默突变、移码缺失和插入。
  mutation_analysis: RAD50与MRE11、NBN组成MRN复合体，参与DNA双链断裂识别、末端处理、ATM检查点激活和同源重组修复。RAD50截短、移码或关键剪接改变可提示DNA损伤修复通路异常；其在结直肠癌中的用药解释需依据HRD背景、致病性分级和其他HRR基因状态。
  refinement_note: 2026-06-30 low-information wording refinement; conservative pathway/domain
    wording only.
- gene: SETD2
  intro: SETD2基因又名KMT3A或HYPB，该基因编码的蛋白是一个含有SET结构域的组蛋白H3K36特异性三甲基转移酶，最早是由人造血干细胞分离的，也是与亨廷顿病的发病机制相关的蛋白[9700202]。在人体中，SETD2是H3K36唯一的三甲基转移酶，参与调节H3K36三甲基化过程（H3K36me3）[12730288，18157086]。SETD2蛋白主要包含WW结构域和AWS-SET-postSET三联结构域，负责与H3K36的特异性结合发挥甲基转移酶活性；保守的低电荷区域(
    low charge region) ，被认为是富有谷氨酰胺和脯氨酸的转录激活结构域；SETD2通过羧基端与高度磷酸化的RNA聚合酶Ⅱ相结合[16118227]。因此SETD2可能是组蛋白甲基化修饰与基因转录调控之间的桥梁。SETD2通过抑制转录起始、激活转录因子p53、参与DNA修复过程和对细胞凋亡基因的调节等防止肿瘤的发生。目前，已在肾透明细胞癌、结直肠癌、乳腺癌、急性淋巴细胞性白血病和晚期脑胶质细胞瘤等多种肿瘤中发现SETD2基因发生突变，而绝大多数突变导致H3K36me3水平降低，表明SETD2的突变导致其编码蛋白失活[20501857，20944102，24509477]。
- gene: TCF7L2
  intro: TCF7L2（转录因子7类似物2），又名TCF-4（T细胞转录因子-4），是T细胞因子/淋巴增强因子（TCF/LEF）家族成员之一。TCF7L2基因的选择性剪接、单核苷酸多态性以及错配修复，最终可导致蛋白产物结构的改变[21301999]。TCF7L2是WNT信号通路下游重要的调控因子，在无WNT信号时，TCF7L2通过与多种转录阻遏因子如羧基端结合蛋白（CtBP）等特异性结合，抑制下游基因的转录和表达；而当WNT通路异常激活时，未被降解的β-catenin进入核内，与TCF7L2的相关结构域结合，形成转录复合物，使其无法发挥抑制作用，在促转录因子的参与下，使下游靶基因过度表达，促进了肿瘤的发生发展[12781368]。
  mutation_analysis: 'TCF7L2基因编码的蛋白全长为619个氨基酸，主要包含N端CTNNB1结合结构域（1-259位氨基酸）和HMG结构域（349-419位氨基酸）。

    研究表明，TCF7L2基因多态性与结直肠癌风险增加相关[18268068]。在结直肠癌、肝癌、食管癌、胃癌、乳腺癌、肾癌等癌种中，已发现TCF7L2基因的剪接异构体、移码突变和单核苷酸多态性等，与肿瘤的发生发展或患病风险相关[21256126，12796377，15802015，18755497]。'
- gene: TP53
  intro: TP53基因是重要的抑癌基因之一，其编码蛋白为p53，大约有一半人类肿瘤呈现出TP53的失活突变，其余的恶性肿瘤中通过活化p53抑制因子、降低p53活化因子，使p53信号通路失活。p53通过其在细胞核中转录依赖和胞浆中转录不依赖两种途径发挥抑癌作用。p53作为转录因子可靶向结合特定的DNA序列，使与细胞周期停滞、凋亡、细胞代谢改变等功能相关的基因转录活化。除了细胞核内的活性，p53在胞浆中表现出转录非依赖的生物活性，研究表明细胞质中p53的活化有促进细胞凋亡的作用[19407794]。其作用机制为：DNA受损时，p53蛋白活化DNA修复蛋白并阻滞细胞生长周期的进行[22872685]。当细胞DNA受损严重不能修复时，p53蛋白与特定DNA结合，激活WAF1/CIP1等多种基因，启动细胞凋亡程序，抑制细胞分裂，从而避免携带异常遗传信息的细胞继续生长、分裂[21728981]。
  mutation_analysis: 'TP53基因编码的蛋白p53全长393个氨基酸，包含3个结构域：反式激活结构域（5-29位氨基酸）、DNA结合结构域（95-289位氨基酸）和四聚化结构域（318-359位氨基酸）。根据报道TP53突变主要发生在175、245、248、273和282这五个热点突变密码子区[19810096，10612830，12619105]，而TP53基因的K132、C135、P151、V157、R158、Y163、V173、C176、H179、H193、Y205、Y220、Y234、M237、C238、S241、C242、M246、R249、G266、P278、R280、D281和E285也是较为常见的突变密码子区[19336573]。这些位点均处于p53蛋白的DNA结合结构域，均可能会对蛋白功能产生影响。

    一项研究在389名Ⅲ期结肠癌患者中检测TP53的突变状态，结果表明TP53的突变频率为33%[26425688]。在一项包含276个结直肠癌样本的分子突变分析研究中，发现165个非高频突变的结直肠癌样本中有59%检测到TP53突变，导致TP53信号通路失活[22810696]，说明TP53在结直肠癌的发生发展中具有重要作用。'
- gene: B2M
  intro: B2M基因编码β2微球蛋白，β2微球蛋白（B2-M）是由活化的T和B淋巴细胞释放的低分子量蛋白质。血清β2-微球蛋白作为炎症性肠病的生物标志物[25152594]。β（2）微球蛋白mRNA表达水平对结直肠癌患者淋巴结转移具有预后意义。结肠直肠癌（CRC）是美国第四大常见的非皮肤恶性肿瘤，也是癌症相关死亡的第二大常见原因。
    CRC存活的最重要决定因素之一是淋巴结转移。该研究证明B2M在mRNA水平的预后作用，并表明低的B2M表达水平可能有助于识别淋巴结转移和/或生存率差的患者[18506145]。
- gene: BRCA2
  intro: BRCA2基因是一种肿瘤抑制基因，编码的蛋白在DNA修复中起至关重要的作用。BRCA2基因突变导致蛋白质活性降低，影响DNA双链断裂后的修复。BRCA2遗传性突变会增加患乳腺癌或卵巢癌的风险。BRCA1和BRCA2参与维持基因组稳定性，主要是参与双链DNA修复同源重组通路[NCBI]。BRCA2蛋白含有70个氨基酸模体（称为BRC模体），BRC模体结合到RAD51重组酶上，作用于DNA修复。BRCA2通过促进RAD51组装到单链DNA（ssDNA）上来结合RAD51并促进DNA修复[NCBI，20729859]。另外，BRCA2介导R-loop参与维持基因组的稳定性[24896180]。
  mutation_analysis: 'BRCA2基因编码的蛋白全长为3418个氨基酸，主要包含8个BRCA2重复区、1个BRCA-2_helical结构域（2479-2667位氨基酸）、1个BRCA-2_OB1结构域（2670-2800位氨基酸）、1个Tower结构域（2831-2872位氨基酸）以及1个BRCA-2_OB3结构域（3052-3190位氨基酸）。

    有研究报道，BRCA2基因编码的蛋白在DNA修复中具有至关重要的作用，BRCA2基因突变导致蛋白质活性降低，影响DNA双链断裂后的修复。另有研究报道，BRCA1、BRCA2的体细胞突变和胚系突变均对PARP抑制剂有预测作用[24579064]。'
- gene: CDH1
  intro: CDH1 基因编码的蛋白是钙黏蛋白超家族中的一类经典钙黏蛋白，位于细胞膜上，通过β-catenin 介导与α-catenin 相互作用，将细胞外黏附分子与胞质内细胞骨架相互连接，参与细胞的粘附、迁移等过程。CDH1
    基因突变与胃癌、乳腺癌、结直肠癌、甲状腺癌以及卵巢癌密切相关。CDH1 功能缺失有利于癌症的进展，增强肿瘤细胞的增殖、迁移或转移能力等[25931811]。
- gene: CTNNB1
  intro: CTNNB1基因编码β-catenin蛋白，β-catenin蛋白同时是WNT信号通路和上皮钙粘蛋白-连环素复合体（E-cadherin/catenin）的关键分子。目前，在许多肿瘤研究中已发现β-catenin的异常蓄积，并且其异常蓄积的程度与肿瘤发生、发展、浸润、转移相关。已有研究表明，CTNNB1基因突变是导致结肠直肠癌（CRC）、皮质瘤（PTR）、髓母细胞瘤（MDB）、卵巢癌的原因[NCBI]。CTNNB1对APC的肿瘤抑制作用至关重要，但是这种调节在APC或者CTNNB1突变时被弱化[9065402]。CTNNB1/TCF4复合体是控制健康和恶性肠上皮细胞增殖与分化的总控开关[12408868]。
  mutation_analysis: 'CTNNB1基因编码的蛋白全长为781个氨基酸，主要包含12个ARM结构域。

    研究表明，CTNNB1/TCF4复合体构成是控制健康和恶性肠上皮细胞增殖与分化的总控开关[12408868]。β-catenin在胞浆的积聚，游离的β-catenin进入核内与相应的靶基因结合，可促使肿瘤的发生[10213486，9635572，27543871]。'
- gene: ERBB4
  intro: ERBB4基因是NRG1的一个极为重要的功能受体。NRG1诱导ERBB二聚化，激活其酪氨酸激酶活性，酪氨酸瞬时自磷酸化，磷酸化后的酪氨酸残基作为其它激酶的对接位点，激活其下游信号分子和通路，包括
    Raf-MEK-ERK 通路、PI3K-Akt-S6K 通路和含 c-Abl、JNK、CDK5、Fyn、Pyk2等的通路。另外，JMa 型 ERBB4 被
    TACE 切割，释放胞外段，留在细胞膜上的部分被 γ 分泌酶进一步切割，而释放的胞内段（ERBB4-ICD）转位到核内调节基因转录[18478032，12648463]。这一过程对细胞增殖、分化、迁移和存活等多个细胞功能起到关键性的作用，该基因突变与癌症相关[NCBI]。
- gene: FLT3
  intro: FLT3（Fms样酪氨酸激酶-3）基因编码的蛋白是调节造血功能的第III类酪氨酸激酶受体，能够激活造血干细胞的增殖和分化途径[27906677]。受体激酶的活化能磷酸化和激活多种细胞过程（细胞凋亡、增殖和骨髓中造血干细胞的分化）的细胞质效应分子。FLT3基因突变导致受体组成性激活，从而导致急性髓性白血病和急性淋巴细胞白血病[NCBI]。在具有FLT3激活突变的癌细胞中，FLT3抑制剂或酪氨酸激酶抑制剂已被证明是有效的[19318574，12124170]。
- gene: KDM6A
  intro: KDM6A（赖氨酸（K）特异性脱甲基酶6A）基因位于X染色体上，是编码四肽重复（TPR）蛋白的Y连锁基因的相应位点。KDM6A基因的编码蛋白含有JmjC结构域并催化三/二甲基化组蛋白H3的脱甲基化[NCBI]。KDM6A参与肿瘤发生，在多种癌症类型中发现KDM6A失活突变[28228601]。在KDM6A截短突变存在的情况下，尿路上皮性癌显示出较高的复发率[22949634]。
- gene: MTOR
  intro: MTOR基因编码的蛋白是一种丝氨酸/苏氨酸蛋白激酶，是PI3K信号通路的一个关键节点。MTOR存在两种复合物形式：MTOR-Raptor复合物和MTOR-Rictor复合物。MTOR蛋白属于磷脂酰肌醇激酶相关激酶家族，这些激酶调解细胞反应的压力，如DNA损伤和营养缺乏。MTOR蛋白是细胞周期停滞和FKBP12雷帕霉素复合物免疫抑制效应的靶分子[NCBI]。MTOR基因涉及到的PI3K/AKT信号通路与癌症的发生相关。MTOR是免疫抑制和抗癌药物雷帕霉素的靶点，雷帕霉素可抑制复合体FKBP1A/FKBP12的激酶活性[UniProtKB]。
- gene: NF1
  intro: NF1基因是一种肿瘤抑制因子，编码神经纤维瘤蛋白[30562755]。NF1基因的一个重要功能域是GTP酶活化蛋白（GAP）相关的功能域，GAP通过将激活RAS活化的GTP转变成无活性的GDP形式而抑制RAS介导的信号通路。NF1通过GAP负调控RAS信号通路，与细胞生长、分化和肿瘤发生相关[19380279]。研究表明，目前已在多种人类癌症中鉴定出了NF1突变，特别是在I型神经纤维瘤病中较为常见[30562755，28637487]。
  mutation_analysis: 'NF1基因编码的蛋白全长为2839个氨基酸，主要包含RasGAP结构域（第1187-1557位氨基酸）和SEC14结构域（第1583-1735位氨基酸）。GAP通过激活RAS活化的GTP转变成为无活性的GDP形式而抑制RAS介导的信号通路。

    NF1基因主要是通过下调原癌基因RAS而实现肿瘤抑制功能[18297205]。NF1基因缺陷可能导致RAS活化，在缺乏生长因子的条件下，NF1基因缺陷的原代细胞和人类肿瘤细胞中mTOR被组成性激活[15937108]。'
- gene: PALB2
  intro: PALB2编码一种BRCA2连接蛋白，它可以结合BRCA2蛋白的N末端10~40个氨基酸（通过PALB2蛋白C末端的部分氨基酸残基），被证实在保证BRCA2蛋白在DNA损伤修复位置的正确定位，以及稳定BRCA2蛋白和DNA的结合方面发挥重要作用[17290507]。从而可协助BRCA2蛋白发挥DNA双链断裂的同源重组修复功能，以维持核内基因组结构稳定。PALB2是一种新型的乳腺癌易感基因，其多态性与乳腺癌患病风险相关，如rs447529、rs249954和rs120963等位点的多态性[24460267]。另外，有研究表明，其突变也与胰腺癌和卵巢癌易感性相关[24870022]。
  mutation_analysis: PALB2功能缺失可能导致同源重组修复缺陷，并与PARP抑制剂等DNA损伤修复相关治疗策略的评估有关。该基因变异可能与疾病的发生发展及用药评估相关，仍需结合变异类型、证据等级和癌种背景进行判断。
- gene: PIK3CG
  intro: PIK3CG基因编码的蛋白是PI3K的I类催化亚基。磷脂酰肌醇3-激酶（PI3Ks）蛋白家族参与细胞增殖、分化、凋亡和葡萄糖转运等多种细胞功能的调节。PI3K活性的增加常与多种癌症相关。已有研究表明，PIK3CG可促进乳腺癌细胞的迁移和侵袭，同时抑制失巢凋亡[23500535]。PIK3CG在结肠直肠癌细胞中的过度表达抑制了细胞增殖，其功能的丧失有助于结直肠癌的发生[12473596]。
- gene: PMS2
  intro: PMS2基因编码的蛋白在DNA错配修复中起作用[29755653]。PMS2是DNA错配修复系统（MMR）的组成部分，与MLH1异源化形成MutLα。DNA修复由与dsDNA不匹配结合的MutSα（MSH2-MSH6）或MutSβ（MSH2-MSH6）引发，然后将MutLα引入异源双链体。当存在RFC和PCNA时，MutL-MutS-杂合eroduplex三元复合物的组装足以激活PMS2的核酸内切酶活性。它在错配附近引入单链断裂，从而为外切核酸酶EXO1产生新的入口点，以降解不匹配的链。DNA甲基化会阻止裂解，因此确保只有新突变的DNA链将被修正。PMS2还参与DNA损伤信号传导，这是一种引起细胞周期阻滞并在导致主要DNA损伤的情况下可导致细胞凋亡的过程[GeneCards]。研究表明，PMS2的杂合胚系突是林奇综合征的诱因之一[26320870]。目前，已在子宫内膜癌、肠癌和胃癌中检测到PMS2基因的错义突变、无义突变、沉默突变、移码缺失和插入突变。
  mutation_analysis: 'PMS2基因编码的蛋白全长为862个氨基酸，主要包含HATPase_c结构域（30-131位氨基酸）、DNA错配修复蛋白C端结构域（249-363位氨基酸）和MutLC端二聚化结构域（678-822位氨基酸）。

    PMS2基因编码DNA错配修复蛋白[26666765]。多项研究表明，PARP抑制剂用于治疗DNA错配修复缺陷的肿瘤可显示出疗效[28003236]。'
- gene: PTCH1
  intro: PTCH1基因编码的蛋白是Hh信号通路的关键蛋白，是一种膜结合型受体，其配体为SHH、IHH和DHH，当PTCH1与其配体结合后，可通过活化SMO（一种膜结合型蛋白）将信号转导至细胞内。该信号通路在胚胎发育中发挥着重要作用，在成人胃部上皮细胞的分化、增殖、胃部疾病中发挥着重要作用[27750091]。Hh信号通路的异常活化可驱动肿瘤的发生以及肿瘤的维持[27554855]。PTCH1是一个肿瘤抑制基因，该基因的失活与肿瘤的形成密切相关。PTCH1突变是痣样基底细胞癌（NBCCS）发生的根本原因，其突变也零星地分布在其它癌症中[16419085]。有研究报道，Hedgehog信号通路失调在胰腺癌的发生中起重要作用，PTCH1基因是Hedgehog信号通路的成分之一，PTCH1失活突变导致Hedgehog信号通路失控而不断激活[14520413，21775419，24368541]。
  mutation_analysis: PTCH1变异可能影响Hedgehog信号通路调控，从而参与肿瘤细胞增殖和分化过程。该基因变异可能与疾病发生发展及Hedgehog通路相关用药评估有关，具体临床价值需结合变异证据和癌种背景判断。
- gene: RNF43
  intro: RNF43（Ring finger protein 43，环指蛋白 43）基因编码的蛋白是 Wnt 信号通路中重要的负向调控因子之一。RNF43
    具有 E3 泛素化连接酶活性[18313049]，在 Wnt 信号通路中发挥负向调控效应[22575959]。RNF43 可通过影响 TCF4 的胞内定位，抑制其与β-catenin
    的结合，从而影响整个 wnt 信号通路的活性[26350900]。RNF43 在微卫星高度不稳定的情况下突变频率较高，并且多为截短突变，提示 RNF43 功能缺失对
    Wnt 通路激活程度的影响可能是 MSI 类型结直肠癌的发生机制之一[25344691]。
  mutation_analysis: RNF43失活变异可能造成WNT信号通路增强，并在结直肠癌等消化道肿瘤中具有潜在分子分型和治疗评估意义。该基因变异的具体临床意义需结合变异类型、微卫星状态和其他通路改变综合判断。
- gene: SMAD4
  intro: SMAD4基因编码信号转导蛋白Smad家族的成员之一[NCBI]。Smads蛋白参与、介导转化生长因子（TGF-β）信号转导通路。该通路在调节细胞生长、分化等方面发挥重要作用[17875924]。SMAD4的表达改变或功能异常会显著影响该通路的正常进行。研究表明，TGF-β/Smads
    信号通路参与恶性肿瘤的发生发展机制，并可能与胃癌等恶性肿瘤的生物学行为有关[17875924]。SMAD4基因在胰腺癌中发挥肿瘤抑制基因的作用。研究发现50%的胰腺癌发生SMAD4基因的失活，而其他肿瘤中该基因的失活率小于10%[15855639]。
  mutation_analysis: 'SMAD4基因编码的蛋白全长为552个氨基酸，主要包含DWA结构域（31-140位氨基酸）和DWB结构域（321-530位氨基酸）。DWA结构域主要与特定序列的DNA结合；DWB结构域主要参与同聚体及异聚体的形成，同时也干预DWA区域与DNA的结合，并参与转录的激活以及蛋白在核内的定位。

    导致SMAD4基因失活的突变包括无义突变、剪接位点突变、错义突变、移码突变，其中77%的错义突变发生在DWB区域[15014009]。研究表明，SMAD4基因的功能缺失在结直肠癌中较为常见[29720405]。SMAD4基因的突变与结直肠癌的远端转移相关[10340381]。'
- gene: SMARCA4
  intro: SMARCA4基因编码的蛋白是SWI/SNF家族的一员，此家族的成员具有解旋酶和ATP酶活性，而且认为其可以通过改变周围基因的染色质结构来调节某些基因的转录。其编码蛋白是形成SNF/SWI复合物的ATP依赖的染色质组成部分。另外，该蛋白还可以结合BRCA1，以及调节致瘤蛋白的CD44的表达。该基因的突变会导致横纹肌样瘤2型综合征。SMARCA4基因在许多种实体瘤中均有突变，但突变率较低，以错义突变为主，其中在膀胱癌、胃腺癌、肺腺癌和低级别神经胶质瘤中，SMARCA4突变率为5-8%。研究表明SMARCA4基因失活突变引起SMARCA4表达缺失，在SWI/SNF染色质重塑复合物中起关键作用[24658004]。
  mutation_analysis: 'SMARCA4基因编码的蛋白全长为1647个氨基酸，主要包含HSA结构域（460-532位氨基酸）、DEXDc结构域（750-942位氨基酸）、HELICc结构域（1110-1194位氨基酸）和BROMO结构域（1455-1566位氨基酸）。

    研究表明，SMARCA4基因失活突变引起SMARCA4表达缺失，在SWI/SNF染色质重塑复合物中起关键作用[24658004]。'
- gene: SMARCB1
  intro: SMARCB1基因编码具有肿瘤抑制作用的INI1蛋白，通过诱导G1停滞、有丝分裂停滞、抑制非整倍性诱导二倍体化、诱导衰老等机制发挥肿瘤抑制作用。同时INI1蛋白是哺乳动物ATP依赖性核染色质调节复合物SWI/SNF的核心亚基，参与基因的表观修饰、转录调控等。SMARCB1基因突变在神经鞘瘤病患者中频繁发生。目前，已在多种癌症中发现SMARCB1基因的错义突变、无义突变、沉默突变、移码插入、缺失以及整码插入和缺失，如骨癌、中枢神经系统癌症、肠癌等。
  mutation_analysis: 'SMARCB1基因编码的蛋白全长为385位氨基酸，主要包含2个SNF5结构域（178-255位、250-373位氨基酸）。

    有研究表明，22号染色体长臂上的SMARCB1/INI1失调和遗传热点可能在结直肠癌转移行为中起重要作用[24286138]。'
- gene: SMO
  intro: SMO基因编码一种膜结合型蛋白受体，属于G蛋白偶联受体家族，是Shh信号通路的关键信号转导因子，它能够把细胞外的Shh信号转换成细胞内的Gli1信号，从而启动细胞核内基因的转录，对Hh信号通路具有激活作用。Hh信号通路在胚胎发育中发挥着重要的作用。除了组织修复过程，Hh信号通路在成年人中处于失活状态。目前，已经在多种癌症中发现Hh信号通路的异常活化。
- gene: TSC2
  intro: TSC2基因是一种肿瘤抑制基因，属于PI3K-AKT-mTOR信号通路，其编码的TSC蛋白能够刺激特异性的GTP酶，形成的TSC1/TSC2复合物可以抑制mTOR的刺激蛋白，在调节细胞生长和增殖的信号通路中起核心作用。TSC2基因突变与人类许多肿瘤密切相关。TSC2蛋白功能缺失会导致mTOR信号通路激活，可能对mTOR抑制剂具有敏感性。TSC2基因在人类乳腺癌、结直肠癌、散发性星形细胞瘤和室管膜细胞瘤等癌症中表达降低，与肿瘤细胞的发生发展以及临床预后相关[15951164，21490404]。
  mutation_analysis: TSC2功能缺失可能导致mTOR通路异常激活，从而参与细胞生长、增殖和代谢调控异常。该基因变异可能与疾病发生发展及mTOR通路相关用药评估有关，具体临床意义需结合变异证据判断。
- gene: WRN
  intro: WRN基因编码RNA/DNA解螺旋酶，是人类RecQ解螺旋酶家族的主要成员之一。WRN基因的产物广泛参与了DNA复制、转录、重组、修复等多种核酸代谢过程。WRN基因突变会导致Werner综合征的发生。WRN基因的多态性和表观遗传学变化被认为与肿瘤等多种疾病相关[NCBI]。WRN
    Leu1074Phe增加了食管癌、乳腺癌的发病风险，可作为乳腺癌易感性的生物标记[19205873，22173703]。WRN Cys1367Arg被认为是骨肉瘤和非霍奇金淋巴瘤的保护位点，WRN
    Cys1367Arg还与细胞对化疗药物的敏感性相关[18271933，24756092]。
  mutation_analysis: WRN异常可能影响DNA修复和复制压力应答。WRN在结直肠癌细胞系和原发性结直肠癌中的表达及功能改变已有研究关注，该基因变异的具体临床意义需结合变异类型、功能证据和癌种背景综合判断。
- gene: ABL1
  intro: ABL1基因编码一种非受体型酪氨酸蛋白激酶，该蛋白在有关细胞生长和存活的多个关键过程中发挥作用，例如细胞骨架重塑、细胞的能动性和粘附、受体的内吞作用、自噬、DNA损伤响应和凋亡。ABL1是一个原癌基因，ABL1蛋白的活性可被自身的SH3结构域下调，因此SH3结构域的缺失会导致该蛋白过度激活，具有致癌作用。染色体易位导致BCR和ABL1基因头尾相连，形成融合基因，BCR-ABL1融合蛋白使细胞在不依赖细胞因子的情况下进行增殖，具有致癌作用，常见于慢性髓细胞性白血病（CML）和急性淋巴细胞性白血病（ALL）。
- gene: AKT1
  intro: AKT1基因编码的蛋白属于丝氨酸-苏氨酸蛋白激酶AKT家族成员（AKT1、AKT2、AKT3）之一，是PI3K/Akt信号通路的关键组成部分，可调控细胞迁移、增殖、生长和凋亡过程。在神经系统的发育中，AKT1是生长因子诱导神经元生长的重要调节因子[9005851]。接受生长因子刺激后，PI3-激酶产物即第二信使PIP3与AKT1和PDK1结合，促使PDK1磷酸化AKT1蛋白的Ser308导致AKT1的活化。AKT1还能通过PDK2对其Thr473的磷酸化而被激活。活化的AKT1通过磷酸化作用激活或抑制其下游靶蛋白，进而调节细胞的增殖、分化、凋亡以及迁移等。
- gene: ALK
  intro: ALK基因编码的蛋白由一个胞外配体结合区、跨膜区及胞内酪氨酸激酶区组成，属于胰岛素受体家族。下游信号通路包括：AK3/STAT3、PI3K/Akt、Ras/ERK等，这些信号通路与细胞增殖、凋亡、迁移相关。ALK基因异常与肿瘤的发生、恶性转化和致癌能力相关[9053841]。ALK基因的异常涉及染色体易位、突变或扩增，其中以染色体易位最为常见。染色体易位导致ALK基因和与其配对的基因融合，如非小细胞肺癌中最常见的EML4-ALK基因融合[18083107]；在炎性肌纤维母细胞性瘤中的TMP3/4-ALK基因融合[18923523]；在间变性大细胞淋巴瘤中的NPM-ALK基因融合[7824924]。EML4-ALK由第2号染色体短臂插入引起，迄今已发现多种变异类型。经检测，所有这些融合基因均有生物学功能，其表达产物为一种嵌合酪氨酸激酶。重排导致ALK胞外结构域和跨膜结构域被EML4部分取代后导致ALK的激酶结构域组成型二聚化进而使其催化活性增加[17625570]。研究表明，EML4-ALK基因重排后ALK激酶活性增加是癌细胞生长所必需的[18593892]。
- gene: AR
  intro: AR基因基因编码的蛋白是雄激素受体，属于核受体超家族中的类固醇受体。与之相关的信号通路有GPCR信号通路和其它癌症相关的信号通路。AR抑制p53蛋白在细胞核中的积累，通过雄激素控制前列腺细胞生长和存活发挥转录后调节作用[14576152]。lncRNAs在侵略性前列腺癌PRNCR1和PCGEM1中大量过表达，与AR成功结合后可促进配体依赖和非配体依赖的AR调节基因活化，导致前列腺癌细胞增殖[23945587]。
- gene: ARAF
  intro: ARAF基因编码的蛋白属于丝氨酸-苏氨酸蛋白激酶家族Raf（A-RAF、B-Raf、Raf-1）之一[3529082]。Raf家族蛋白主要参与细胞增殖、分化以及细胞周期的调控。与其他Raf家族成员一样，ARAF蛋白通过磷酸化激活MEK从而导致ERK激活来促进细胞增殖[15856007]。ARAF激酶结构域的多位点组合突变与朗氏细胞增生症病患体内ERK通路的激活存在关联[24652991]。ARAF蛋白还可以通过不依赖于ERK通路的途径参与细胞增殖的调控。如ARAF可以通过抑制前凋亡激酶MST2来阻止细胞凋亡[20145135]；ARAF可以通过结合并上调丙酮酸激酶M2(PKM2)来调控细胞的能量代谢和分化过程，从而对肿瘤的生成产生影响[18225557]。此外，还有研究发现ARAF可以与4，5-双磷酸磷脂酰肌醇结合调节细胞的内吞作用[19247477]。有研究表明，ARAF基因S214C突变是肺腺癌的致瘤驱动因素并且是索拉非尼的反应指标[24569458]。
- gene: ASXL1
  intro: ASXL1基因编码的蛋白是Polycomb组蛋白的成员，是维持同源异型和其它基因座稳定抑制所必需的。该蛋白可损坏局部区域的染色质，增强某些基因的转录，同时抑制其他基因的转录。ASXL1蛋白与核受体辅激活因子1共同作用作为视黄酸受体的配体依赖性共激活剂。ASXL1基因突变与骨髓增生异常综合征和慢性骨髓单核细胞白血病相关。在骨髓增生性肿瘤（MPN）、骨髓增生异常综合征（MDS）、慢性骨髓单核细胞性白血病（CMML）和急性髓性白血病（AML）中均发现ASXL1基因突变。ASXL1基因突变通常与恶性骨髓疾病的侵袭性以及临床不良预后相关[22436456]。
- gene: AXIN1
  intro: AXIN1是一种抑癌基因，表达于脑、胸腺、心脏、肺、肝和肾等不同组织。AXIN1在许多重要的信号传导途径中发挥重要作用。AXIN1可与Wnt和JNK信号传导途径中的多个重要成员相互结合形成复合物，与其它一些因子共同调节这两种信号传导系统的平衡。AXIN1还参与p53、TGF-β等重要信号传导途径的调控，参与细胞的生长、增殖、癌变等过程。目前已在结直肠癌、小脑髓母细胞瘤等癌症中发现了AXIN1基因的多个突变[12555076，14566817]。
- gene: BAP1
  intro: BAP1 基因属于去泛素化酶的亚家族：泛素C端水解酶，参与蛋白泛素的去除。基因所编码的酶会与BRCA1蛋白相结合，通过BRCA1上的RING锌指结构域，起到肿瘤抑制因子的作用。此外，所编码的酶能够参与转录的调控、细胞周期及生长的调控、应对
    DNA损伤以及染色体动力学。BAP1基因发生的胚系突变与肿瘤易感性综合征（TPDS）相关，能够导致患肿瘤的风险增加，包括恶性间皮细胞瘤、葡萄膜黑色素瘤以及皮肤黑色素瘤等[23550303]。
  mutation_analysis: BAP1编码去泛素化酶，参与染色质调控、DNA损伤应答、细胞周期和细胞死亡过程。BAP1失活在部分肿瘤中具有抑癌基因意义，胚系异常还与BAP1肿瘤易感综合征相关；在结直肠癌报告中按DDR/染色质调控相关基因解释，并依据变异类型、结构域位置和临床资料分层解读。
  refinement_note: 2026-06-30 low-information wording refinement; conservative pathway/domain
    wording only.
- gene: BARD1
  intro: BARD1基因编码的蛋白与BRCA1环指区结合形成稳定的二聚体。BARD1与BRCA1相互结合，增强BRCA1的E3连接酶活性，而这种活性在DNA损伤应答和修复相关的多种生物通路中是BRCA1所必须的。有研究报道，在复发性乳腺癌患者中，检测到BARD1有害变体c.1921C>T，该突变为无义突变，通过截短或无义介导的mRNA衰变引起正常蛋白质功能的丧失。大型疾病组的基因组筛查报告在三阴性乳腺癌、神经母细胞瘤和胰腺癌中的检测到这种突变[28174632]。
  mutation_analysis: BARD1功能异常可能导致同源重组修复缺陷和基因组不稳定，并与DNA损伤修复相关治疗策略评估有关。该基因变异可能与疾病发生发展及用药评估相关，需结合变异类型和证据等级判断。
- gene: BMPR1A
  intro: BMPR1A基因编码蛋白属于跨膜丝氨酸/苏氨酸激酶家族成员，其包括I型受体BMPR1A、BMPR1B以及II型受体BMPR2。这些受体与激活素受体ACVR1和ACVR2密切相关。I型受体BMPR1A、BMPR1B以及II型受体BMPR2的配体是TGF-β超家族成员。TGF-β和激活素通过与2种不同类型的丝氨酸（苏氨酸）激酶受体形成异聚体复合物来进行信号转导：I型受体约50-55kD，II型受体约70-80kD。II型受体在没有I型受体的情况下结合配体，但是它们需要I型受体用于信号传导，而I型受体需要II型受体用于配体结合[GeneCards]。已经在大多数癌症中，如结肠癌、尿路癌和胃癌中观察到该基因的错义突变、沉默突变、无义突变和移码缺失。
- gene: BRCA1
  intro: BRCA1基因编码的蛋白是一个定位于细胞核的磷酸蛋白，属于肿瘤抑制因子。BRCA1主要含有锌指结构域、丝氨酸集群结构域和BRCT结构域，其中BRCT结构域对于BRCA1发挥其DNA修复功能至关重要[NCBI]。该蛋白一方面与其他肿瘤抑制因子、DNA损伤感应元件和信号转导因子相结合形成一个多亚基蛋白复合物BASC，参与双链DNA修复和重组、维持基因组稳定的过程，另一方面还通过RAD50-MRE11-p95复合体起到DNA损伤应答的作用[10426999]。此外，BRCA1还可以与RNA聚合酶II结合，并通过其C末端结构域与组蛋白脱乙酰酶复合物相互作用，发挥其调控基因转录的功能[NCBI]。BRCA1是乳腺上皮细胞生长的负调控因子，该基因突变导致约40％的遗传性乳腺癌和80％以上的遗传性乳腺癌和卵巢癌[7795653]。
  mutation_analysis: 'BRCA1基因编码的蛋白全长为1863个氨基酸，主要包含RING结构域（24-64位氨基酸）、EIN3结构域（648-978位氨基酸）、卷曲螺旋结构域（1392-1424位氨基酸）以及2个BRCT结构域（1644-1726位、1758-1845位氨基酸）。

    BRCA1蛋白属于肿瘤抑制因子，发挥DNA修复功能，在多种肿瘤中检测到该基因发生突变。BRCA1、BRCA2的体细胞突变和胚系突变均对PARP抑制剂有预测作用[24579064]。'
- gene: BRD4
  intro: BRD4基因编码的蛋白属于溴结构域和额外碳末端结构域蛋白（BET）家族，该家族成员能够与乙酰化组蛋白形成紧密连接的复合物，并参与多种DNA损伤修复过程。BRD4是一种细胞染色质结合因子和转录调节因子，其募集序列特异性转录因子和染色质调节因子以控制靶基因的转录[27965149]。目前，在子宫内膜癌、肠癌和胃癌等癌症中已检测到该基因的错义突变、无义突变、沉默突变和移码缺失。
- gene: BRIP1
  intro: BRIP1基因，又名FANCJ，是一种Fanconi贫血基因，与BRCA1和BRCT结构域相互作用，参与DNA双链断裂修复的同源重组途径，是DNA损伤修复过程的重要成员[19935797]。有研究发现BRIP1基因与乳腺癌发病相关，并能增加乳腺癌发病风险[18628483]。另有研究发现，在前列腺癌中可检测到BRIP1基因的错义突变和截短突变，其中截短突变R798X与前列腺癌的易感性相关[19935797，19127258]。
  mutation_analysis: BRIP1功能异常可能导致同源重组修复缺陷和DNA损伤修复能力下降，并可能影响DNA损伤修复相关治疗策略评估。该基因变异可能与疾病发生发展及用药评估相关，具体意义需结合变异证据判断。
- gene: CARD11
  intro: CARD11基因编码一种含caspase募集结构域的膜相关鸟苷酸激酶，在T、B淋巴细胞的增殖和细胞因子分泌中发挥重要作用。在CARD11基因缺失突变的小鼠中，T、B淋巴细胞免疫系统作用受到阻滞[12818158]。CARD11失活引起的NF-κB信号通路缺陷是引起重症综合性免疫缺陷（SCID）的一个原因[23561803]。CARD11激活在弥漫型大B细胞淋巴瘤中比较常见，发生频率约为10%[21266526]。
- gene: CCNE1
  intro: CCNE1基因编码细胞周期蛋白E1（cyclinE1），属于细胞周期蛋白家族，细胞周期蛋白与CDK（细胞周期蛋白依赖性激酶）结合并使CDK发挥作用。在有丝分裂的不同时期，不同的细胞周期蛋白呈现出不同的表达和降解模式。cyclinE1与CDK2形成复合物在调控细胞周期G1/S期转换中发挥作用。该蛋白在G1-S期分界点积累，在细胞周期进入S期后降解。目前已经在多种肿瘤中发现了cyclinE1过表达，cyclinE1过表达会导致染色体不稳定，进而促进肿瘤的发生。
- gene: CDK12
  intro: CDK12基因编码周期蛋白依赖性激酶-12，是一种丝氨酸/苏氨酸蛋白激酶，在转录延伸过程中发挥重要的调控作用。CDK12与周期蛋白K形成的复合物CyclinK/CDK12可调控与DNA修复相关的基因的表达，从而在基因组稳定性的维持中发挥作用[22012619]。CDK12参与MAPK活性的调控，从而影响对雌激素抑制剂的响应。CDK12功能紊乱或突变与人类肿瘤的发生和耐药相关。在乳腺癌和胃癌中，CDK12基因可与ERBB2基因同时扩增或者发生融合。在卵巢癌中，CDK12为候选肿瘤抑制基因[26658019]。
- gene: CDKN2A
  intro: CDKN2A（细胞周期依赖性激酶抑制基因）是抑癌基因，编码两种周期抑制蛋白p16INK4a和p14ARF，进而通过p16INK4a-CDK4（和CDK6）-pRb途径和p14ARF-mdm2-p53途径发挥细胞周期调控作用。具体而言，CDKN2A的缺失、突变和甲基化导致基因表达产物p16INK4a不能与CDK4和CDK6结合，使pRb磷酸化和转录调节因子E2F释放，引起细胞周期的延长，有助于癌症的发生；p14AFP不能与mdm2结合，使得mdm2降解p53蛋白，诱发癌症。研究发现在黑色素瘤、胰腺癌、肝癌和结直肠癌等多种肿瘤中均存在CDKN2A的基因变异[27428416，22925370]。
- gene: CHEK1
  intro: CHEK1基因编码一种丝氨酸/苏氨酸蛋白激酶，是一种细胞周期检查点激酶，在细胞周期调控和DNA损伤响应中发挥作用。在DNA发生损伤时，CHEK1被ATR信号通路激活，并在S317和S345氨基酸残基位置发生磷酸化以及在S296氨基酸残基位置发生自磷酸化，引发细胞周期停滞和DNA修复。在几乎所有的高级别浆液性卵巢癌中，CHEK1基因过表达。研究人员认为，p53蛋白功能缺失增加了卵巢癌细胞对CHEK1的依赖。因此，抑制CHEK1的活性成为一种理想的治疗策略，p53功能失活的癌细胞可能对此类药物更敏感。CHEK1抑制剂还可以增加卵巢癌细胞对拓扑替康的响应[25884494]。在结直肠癌细胞系中的研究显示，p53蛋白功能缺失的细胞系中CHEK1表达上调，利用小干扰RNA降低CHEK1的转录和表达可诱导细胞凋亡。体内研究显示，在人类结直肠癌中，p53蛋白功能缺失的肿瘤具有高水平表达的CHEK1，同时伴随着更高级别的肿瘤分期、近端肿瘤定位以及更差的预后[18632613]。
- gene: CHEK2
  intro: CHEK2基因编码一种丝氨酸/苏氨酸蛋白激酶，是一种细胞周期检查点激酶，在细胞周期调控和DNA损伤响应中发挥作用。CHEK2在多种细胞类型中参与DNA损伤响应，是多种器官癌症发生中的易感基因。CHEK2
    1100delC突变体会增加患乳腺癌和前列腺癌的风险。在荷兰家庭中的研究显示，该突变体会增加患乳腺癌和结肠癌的风险。在波兰人群中开展的研究发现了3种CHEK2突变体，分别为1100delC、IVS2+1G>A、I157T突变体，这三种突变体都会使波兰人患前列腺癌的风险增加，此外还会增加乳腺癌、甲状腺癌、肾癌和结肠癌的患病风险[15492928]。
- gene: CREBBP
  intro: CREBBP基因编码的蛋白是环AMP应答元件结合蛋白（CBP），广泛表达并参与许多不同转录因子的转录共激活。CREBBP基因在胚胎发育、生长控制和通过染色质重塑与转录因子识别偶联来维持细胞稳态中发挥关键作用[10887150]。CBP蛋白具有组蛋白乙酰转移酶活性，并且能作为稳定一些蛋白与转录复合物的相互作用的支架。CREBBP基因突变损害其组蛋白乙酰化功能和靶基因转录调控功能，与急性淋巴细胞白血病相关[21390130]。CREBBP基因的胚系突变与导致儿童恶性肿瘤的易感性增加Rubinstein-Taybi综合征有关[15156177]。
- gene: ERBB2
  intro: ERBB2又名HER2，是表皮生长因子（EGF）受体家族成员之一。ERBB2蛋白本身没有配体结合域，不能结合生长因子。ERBB2与其它配体结合的EGF受体家族成员紧密结合形成异二聚体，稳定配体结合，增强下游信号通路激酶活性，如有丝分裂原活化蛋白激酶（MAPKs）、磷脂酰肌醇-3-激酶（PI3K）及丝氨酸/苏氨酸蛋白激酶（AKT），最终导致肿瘤细胞增殖和存活。在许多癌症中（如乳腺癌和卵巢癌）存在ERBB2基因扩增或过表达[NCBI]。HER2过表达可激活AKT及核因子κB（NF-κB），持续活化的AKT和NF-κB能导致抗凋亡级联反应，降低宿主对肿瘤的防御能力[20716114]。此外，HER2还通过多种信号途径促进肿瘤的增殖、转移、耐药性的产生，是肿瘤治疗的重要靶位点。
- gene: ERBB3
  intro: ERBB3基因编码表皮生长因子（EGFR）受体家族成员之一。ERBB3膜结合蛋白有神经调节蛋白结合结构域，但没有激活酶域。因此，它可以结合配体，但不能通过蛋白磷酸化来传导信号。然而，它可以和有激酶活性的EGF受体家族形成异二聚体，促进细胞增殖和分化。在前列腺癌、膀胱癌和乳腺癌等多种癌细胞中，ERBB3基因过表达。ERBB3基因有多个转录本，其中一个转录本缺少膜间隙并分泌到细胞外，可调节膜结合形式[NCBI]。ERBB3结合神经调节蛋白和NTAK，并被激活，也可被CSPG5激活[20351256]。ERBB3是调节蛋白（NRG1）的受体，能够调控自身HGL引起的酪氨酸磷酸化[8188716]。
- gene: ERCC2
  intro: ERCC2 又称着色性干皮病基因D，是核苷酸切除修复途径的重要组成部分，在修复紫外线所致 DNA 损伤过程中发挥重要作用，同时 ERCC2 是基础转录因子
    BTF2/TFIIH 复合体的一个不可或缺的部分，进而参与基础转录。ERCC2 基因产物具有 ATP 依赖性的 DNA 解旋酶的活性，属于解旋酶 RAD3/XPD
    亚家族。研究表明，ERCC2 基因缺陷可能导致三种不同疾病，分别为癌症倾向综合征着色性干皮互补D组、毛发低硫营养不良和科凯恩综合征[NCBI]。同时，ERCC2
    基因多态性与多种癌症的易感性相关，如肺癌、乳腺癌、前列腺癌、胃癌等。
- gene: ESR1
  intro: ESR1基因编码一种雌激素受体，属于被雌激素激活的转录因子，同DNA结合、转录活性调节等分子生物学过程有关。ESR1的主要功能是促进性别和生殖功能发育，同时它也参与人体多种生理过程，包括乳腺癌、子宫内膜癌和骨质疏松症[NCBI]。有研究报道，在乳腺癌中，ESR1基因K303R突变可能通过激活IGF-1R/IRS-1/Akt通路，从而对内分泌治疗耐药[26183887]。
- gene: FANCD2
  intro: FANCD2基因编码的蛋白是范可尼贫血症补体组D2，是范可尼贫血互补组成员之一。该蛋白复合物在范可尼贫血中起作用，在染色体断裂和缺陷DNA修复中发挥作用[GeneCards]。目前，在子宫内膜癌、肠癌和胃癌等癌症中观察到了该基因的错义突变、无义突变、沉默突变、移码缺失和插入。
  mutation_analysis: FANCD2是Fanconi贫血通路的关键效应蛋白，单泛素化后的FANCD2参与DNA链间交联损伤修复、复制叉稳定和同源重组修复调控。FANCD2截短、移码或关键剪接改变可作为DDR通路异常线索；普通错义变异需依据位点、功能资料和变异分级解释，避免外推为明确用药依据。
  refinement_note: 2026-06-30 low-information wording refinement; conservative pathway/domain
    wording only.
- gene: FANCI
  intro: FANCI基因是范可尼贫血互补组（FANC）的成员之一，其他成员还包括FANCA、FANCB、FANCC、FANCD1（也称为BRCA2）、FANCD2、FANCE、FANCF、FANCG、FANCJ（也称为BRIP1）、FANCL、FANCM和FANCN（也称为PALB2）[GeneCards]。FANCI基因编码的蛋白在DNA修复中起作用。目前，已在甲状腺癌、结肠癌和皮肤癌等癌症中观察到FANCI基因的错义突变、同义突变、无义突变、移码插入和移码缺失。
- gene: FANCL
  intro: FANCL是一种含有PHD结构域的泛素E3连接酶，是Fanconi贫血复合物中的组分之一。由FANC基因编码的蛋白质通过形成促进FANCL的E3泛素连接酶活性的多亚单位核复合体参与DNA损伤反应[22653977]。
- gene: FGFR2
  intro: FGFR2 基因编码的蛋白属于成纤维细胞生长因子受体（FGFR）家族成员之一，目前 已确定了四种 FGFRs，即 FGFR1、FGFR2、FGFR3
    和 FGFR4。FGFR 作为 FGF 的受体，它的主要功能是将 FGF 信号转导到 RAS-ERK 和 PI3K-AKT 信号级联放大[NCBI]。FGFR2在癌症中的功能改变可能促进细胞增殖和抑制细胞凋亡[22508544]。FGFR2
    的基因扩增或错义突变在胃癌、肺癌、乳腺癌、卵巢癌和子宫内膜癌中均有发生[18636142]。
  mutation_analysis: FGFR2异常激活、融合、扩增或特定位点突变可见于多种肿瘤，并可能影响FGFR抑制剂相关治疗策略评估。该样本检出的FGFR2变异需结合具体位点功能证据和癌种背景判断其临床意义。
- gene: FGFR3
  intro: FGFR3基因编码的蛋白是成纤维细胞生长因子受体（FGFR）家族的成员之一。FGFR3蛋白的细胞外部分与成纤维细胞生长因子相互作用，激活下游相关信号通路，如PI3K-Akt信号通路，从而影响细胞增殖、分化和细胞凋亡。FGFR3基因突变导致颅缝早闭和多种类型的骨骼发育不良，相关的疾病有骨髓瘤和软骨发育不全[NCBI]。目前，已在胶质母细胞瘤、膀胱癌、胆管癌、甲状腺癌、乳腺癌、头颈癌和肺鳞状细胞癌等肿瘤中检测到FGFR基因重排，包括FGFR1、FGFR2、FGFR3[24850843]。
- gene: GATA3
  intro: GATA3基因，即GATA结合蛋白3，编码含有两个锌指的转录因子，通过调节T细胞发育而起免疫调节作用。在胆管癌、乳腺癌和肠癌等癌症中发现GATA3存在错义突变、无义突变、沉默突变、移码缺失、框内缺失和插入。GATA3是调节参与乳腺腔细胞分化和肿瘤抑制基因的关键转录因子，在乳腺上皮细胞中靶向信号素3B（SEMA3B，非神经元细胞中的肿瘤抑制因子）以抑制乳腺癌的进展和转移[28581515]。GATA3可作为膀胱癌最常见类型尿路上皮癌的尿路上皮细胞标志物，GATA3表达缺失是尿路上皮癌患者不良预后的独立预测因子[28428106]。
- gene: GNAS
  intro: GNAS基因编码的蛋白是G蛋白α亚基，是G蛋白的一个重要功能亚基，GNAS蛋白在细胞中可以结合并激活腺苷酸环化酶，催化ATP转化为cAMP，而cAMP对调节细胞的生长与分裂有重要作用。GNAS蛋白在多种G蛋白偶联受体介导的信号通路中发挥传感器的作用。Gα亚基，通过结合GTP或GDP调控G蛋白的活化或失活，进而调控下游信号通路的活化与失活。目前，在卵巢囊肿、甲状腺癌、肾癌、结直肠癌等疾病中均发现了GNAS的活化突变[20531296]。
- gene: HLA-B
  intro: HLA-B基因编码人类白细胞抗原-B，是HLA I类分子的成员之一。HLA I类分子广泛分布于所有有核细胞表面，是细胞免疫中重要的分子，与肿瘤的发生发展密切相关。HLA
    I类分子能够提呈肿瘤抗原给细胞毒性T细胞（CTL），是CTL识别肿瘤细胞的关键，因此肿瘤细胞表面HLA I类分子下调或缺失被认为是肿瘤细胞免疫逃逸的机制。有研究表明，在恶性黑色素瘤、结直肠癌、胃癌、前列腺癌等癌种中均观察到HLA
    I类分子下调。
- gene: HLA-C
  intro: HLA-C基因属于HLA I类重链旁系同源物。该I类分子是由重链和轻链（β-2微球蛋白）组成的异二聚体，其通过呈递来自内质网腔的肽在免疫系统中发挥核心作用。I类分子几乎在所有细胞中表达，其中，重链锚定在膜中。重链大约45kDa，其基因含有8个外显子。外显子1编码前导肽，外显子2和3编码α1和α2结构域，它们都结合肽，外显子4编码α3结构域，外显子5编码跨膜区，外显子6和7编码细胞质尾。外显子2和外显子3内的多态性负责肽结合特异性。
    对于这些多态性的分型通常用于骨髓和肾移植[NCBI]。研究表明，在结直肠癌中，HLA-C表达缺失，与分化程度呈负相关[2417962]。
- gene: HNF1A
  intro: HNF1A基因编码肝细胞核因子1α，该蛋白是一个转录因子，可调控多个基因组织特异性地表达，尤其是在胰岛细胞和肝细胞中发挥作用。该蛋白在葡萄糖代谢中发挥作用，可调控胰岛β细胞中葡萄糖转运蛋白GLUT1、GLUT2的表达，以及胰岛细胞中血管紧张素转化酶2的表达。此外，该蛋白在其他器官的代谢途径中也发挥作用，如调控肠道和肾脏中胆汁酸转运蛋白的表达。HNF1A基因突变会引起糖尿病和肝细胞腺瘤[NCBI]。
- gene: HRAS
  intro: HRAS基因属于Ras癌基因家族，其成员都是哺乳动物肉瘤逆转录病毒的转化基因。这些基因编码的蛋白在信号转导通路中起作用，它们均可以结合GTP和GDP，具有内在的GTP酶活性。RAS蛋白是生长因子受体信号传导下游的中枢介质，因此对细胞增殖、存活和分化至关重要。RAS蛋白可以激活几个下游效应物，包括参与细胞存活的PI3K-AKT-mTOR通路和参与细胞增殖的RAS-RAF-MEK-ERK通路。特异性RAS基因在不同恶性肿瘤中发生突变。HRAS突变在唾液腺、尿道、上呼吸消化道、子宫颈和甲状腺中尤为常见。
  mutation_analysis: HRAS激活性变异可能导致下游MAPK和PI3K通路持续活化。该基因变异可在多种肿瘤中检出，并可能影响靶向治疗策略评估；具体临床意义需结合变异位点是否为已知激活热点及癌种背景综合判断。
- gene: IDH1
  intro: IDH1基因编码的蛋白是一种存在于细胞质和过氧化物酶体中的NADP（+）依赖性异柠檬酸脱氢酶，它包含PTS-1过氧化物酶体靶向信号序列。IDH1在细胞质NADPH产生的过程中具有重要作用[NCBI]。研究发现，IDH1有助于机体抵御γ-射线、单态氧、UVB射线，还参与强化由葡萄糖诱导的胰岛素分泌的过程。目前，已在脑胶质瘤、前列腺癌、急性髓细胞性白血病患者中检出IDH1基因突变[20107228]。
  mutation_analysis: IDH1突变在胶质瘤、胆管癌、急性髓系白血病等肿瘤中具有明确分子诊断和治疗意义，在结直肠癌中相对少见。该样本检出的IDH1变异可能与肿瘤代谢重编程相关，具体临床意义需结合位点证据和癌种背景综合判断。
- gene: IDH2
  intro: IDH2基因属于异柠檬酸脱氢酶（IDH）家族，IDH家族包括借助NAD+或NADP+作为辅助因子，催化异柠檬酸的氧化脱酸反应生成α-酮戊二酸的酶类，同时分别生成NADH或NADPH。到目前为止，人类恶性肿瘤中所有已描述的IDH突变主要集中在IDH1的R132密码子和IDH2的R140和R172密码子[22763442，22215888]。
- gene: IFNGR1
  intro: IFNGR1基因编码干扰素γ（IFN-γ）受体1，与IFNGR2共同组成IFN-γ受体。IFN-γ属于II型干扰素，具有免疫调节、抗病毒、抗微生物感染、抗肿瘤等生物学效应，在天然免疫及获得性免疫中发挥重要的作用。在肿瘤发展过程中，IFN-γ信号通路可能发生功能缺陷（包括受体抑制），提示某些肿瘤可能激活IFN-γ信号通路的负调控机制[17063185]。研究表明，IFNGR1表达缺失与食管癌和卵巢癌密切相关，IFNGR1表达水平降低预示卵巢癌预后不良[17634541]。
- gene: IRS1
  intro: IRS1基因编码胰岛素受体底物1，接受来自生长因子和激素等多种跨膜信号分子的刺激，调控细胞的生长、存活、分化及代谢。近年研究发现，IRS1与肿瘤的发生、发展和转移密切相关。有研究报道，IRS1在肾母细胞瘤、横纹肌肉瘤、脂肪肉瘤、平滑肌肉瘤和肾上腺皮质癌等多种肿瘤中表达增加或者活性增强[20966354]。体外研究表明，IRS1过表达抑制上皮-间质转化，能够阻断肺癌细胞迁移[19738073]。
- gene: JAK1
  intro: JAK1基因编码的蛋白是Janus激酶1，是一种非受体型蛋白酪氨酸激酶（PTK），是JAK家族成员之一，参与IFNα/β和γ信号转导通路。JAK1和JAK2在α-干扰素通路中相互依存。这些激酶的一些细胞因子配体与各种已知信号蛋白相结合，也可与STATs转录因子家族相结合[NCBI]。JAK1参与体内多种细胞因子信号的转导，且其本身的过表达及基因突变均与肿瘤发生发展相关[11114747]。JAK1的突变与急性髓系白血病、乳腺癌、头颈部肿瘤、黑色素瘤等肿瘤的发生相关，也影响前列腺癌、肾脏等恶性肿瘤的治疗[18559588]。
  mutation_analysis: JAK1功能异常可能影响干扰素信号、抗原呈递和肿瘤免疫微环境。部分JAK1失活变异与免疫检查点抑制剂耐药机制相关，因此该基因变异在免疫治疗疗效评估中具有潜在意义，具体判断需结合变异类型和功能证据。
- gene: JAK2
  intro: JAK2基因编码的蛋白是一种非受体型蛋白酪氨酸激酶，是JAK家族成员之一，参与细胞因子受体信号转导通路的一个特定子集。其结构上与催乳素受体相似，能对γ干扰素做出回应。该基因缺陷型小鼠表现出胚胎致死性，并且不具有红细胞生成的能力[NCBI]。JAK2可以磷酸化STAT5，STAT5在较普遍的人类恶性血液肿瘤中具有活性[9618263]。克隆性骨髓增生性疾病包括真性红细胞增多症，血小板增多症，和特发性骨髓纤维化，JAK2
    V617F可以使JAK2信号通路组成性激活，在以上这些疾病患者中，该突变的频率比较高[15781101，15858187]。
  mutation_analysis: JAK2变异可能影响JAK/STAT通路活性，并与细胞增殖、炎症反应和免疫调控相关。该基因变异的临床意义需结合变异位点、是否造成功能获得或缺失以及癌种背景综合判断。
- gene: JAK3
  intro: JAK3基因编码的蛋白是一种非受体型蛋白酪氨酸激酶，是JAK家族成员之一。JAK家族包括JAK1、JAK2、JAK3和TYK2。JAK家族在细胞增殖、分化以及细胞的凋亡过程中具有重要的作用[11114747]。JAK家族能够接收来自细胞因子和生长因子受体的信号，随后激活下游蛋白，包括信号传导与转录活化因子[11426647]。以前的研究认为JAK3的表达主要局限于免疫系统和造血系统。然而，最近有研究表明JAK3能在许多器官组织中表达，包括肺部。JAK3在细胞骨架重建以及伤口修复的过程中具有重要的作用。有研究报道JAK3基因突变在人类癌症中经常发生。在急性成巨核细胞白血病中检测到JAK3的激活突变，能够促进细胞生长[16843266]。
- gene: KDR
  intro: KDR 基因又名VEGFR2，编码的蛋白属于酪氨酸激酶跨膜蛋白，分为胞外区、跨膜区和胞内激酶活性区。胞外段与配体结合后，发生受体二聚化，酪氨酸激酶激活，受体自磷酸化，调节子在磷酸化位点的结合以及激活后活化一系列反应，并最终传递至细胞核内，通过特定基因发挥其生物学效应。KDR是血管内皮生长因子VEGF的主要功能受体，是VEGF诱导的内皮细胞增殖、存活、迁移、管状形态发生和萌芽的主要介质[7512791，16260429]。KDR的信号传导途径受多种因素调节，包括：Rab
    GTP 酶、P2Y 嘌呤核苷酸受体、整合素αVβ3、T 细胞蛋白酪氨酸磷酸酶等[NCBI]。KDR与肿瘤的发生发展密切相关。在肺癌、肝癌、结肠癌、乳腺癌、卵巢癌、宫颈癌、神经胶质瘤、肾癌、膀胱癌等许多肿瘤中都有表达[Song
    et al., 1998]。
- gene: KIT
  intro: 人类KIT原癌基因起源于猫肉瘤病毒，KIT是MGF/SCF（肥大细胞生长因子/干细胞因子）的III型受体酪氨酸激酶[NCBI]。在正常情况下，KIT受体与其配体SCF结合形成二聚体，引发了特定酪氨酸残基自身磷酸化，从而激活了细胞信号传导通路中下游蛋白分子的级联放大反应，最终调节细胞的分化、凋亡及增殖。红细胞发育、正常皮肤色素沉着以及胃肠道孺动功能的维持等均与此有关[3360448]。KIT基因的突变可以刺激肿瘤细胞的持续增殖。据报道，在许多恶性肿瘤中KIT呈现高水平表达，包括肥大细胞白血病、尤文氏肉瘤、神经母细胞瘤、恶性黑色素瘤、甲状腺癌、子宫内膜癌、卵巢癌和小细胞肺癌[21279973，18622894，22392489，21344772]。
- gene: KMT2A
  intro: KMT2A基因又称为混合系白血病（MLL）基因，是一种转录调控因子，参与组成复杂的转录调控蛋白复合物。KMT2A编码的蛋白在早期发育和造血过程中参与调节基因的表达。已经发现KMT2A基因在急性白血病中发生重排[NCBI]。目前，已经肠癌、皮肤癌和胃癌等多种癌症中发现该基因发生融合、错义突变、无义突变、沉默突变、移码插入、缺失以及整码缺失等。
- gene: KMT2D
  intro: KMT2D基因编码的蛋白是组蛋白甲基转移酶SET结构域成员之一，参与赖氨酸组蛋白H3K4的三甲基化过程[24081332]。在胚胎发育中，KMT2D是组织细胞分化的关键调节基因[26007649，16261189]。研究表明，KMT2D基因对小鼠脂肪细胞的生成、肌肉的发育、巨噬细胞的活化和淋巴的生成十分必要[16261189]。目前，已在肠癌、皮肤癌和胃癌等多种癌症中观察到KMT2D基因的错义突变、无义突变、沉默突变、移码缺失和插入以及整码缺失。
  mutation_analysis: 'KMT2D基因编码的蛋白全长为5537个氨基酸，主要包含5个RING结构域、7个PHD结构域、1个HMG结构域、3个卷曲螺旋结构域、1个FYRN结构域、1个FYRC结构域、1个SET结构域以及1个PostSET结构域等。

    KMT2D基因已经成为多种癌症中最常发生突变的基因之一，包括淋巴瘤、成神经管细胞瘤、胃癌等[24240169]。KMT2D突变被证实与包括结直肠癌在内的多种肿瘤的基因组不稳定性和不良预后相关[33300554]。另有研究表明，CRC的KMT2C/2D突变通常伴有DNA损伤修复基因突变和微卫星不稳定性高（MSI-H），而二者均报告与免疫疗法密切相关[Miao
    C,et al.]。'
- gene: MAP2K1
  intro: MAP2K1（MEK1）基因编码的蛋白是人丝裂原激活蛋白激酶激酶1，具有有丝分裂原活化蛋白（MAP）激酶激酶活性。作为丝裂原活化蛋白激酶（mitogen-activated
    protein kinase，MAPK）信号转导通路中的重要激酶分子，该激酶参与多种细胞过程，如：增殖、分化、转录调控和发育[NCBI]。MAPK信号转导通路为三级激酶体系：包括丝裂原活化蛋白激酶（MAPK）、丝裂原活化蛋白激酶激酶（MAP
    Kinase Kinase，MKK或MEK）、丝裂原活化蛋白激酶激酶激酶（MAP Kinase Kinase Kinase，MAPKKK）。MEK1和MEK2是MEK家族的两个主要成员。MEK位于通路的第二级，具有磷酸化底物的丝氨酸/苏氨酸和酪氨酸残基的功能，通过磷酸化靶蛋白ERK1/2的T202/185和Y204/187（T：苏氨酸，Y：酪氨酸）使得ERK1/2活化，ERK1/2再通过调节多种转录因子的磷酸化水平或其他相关蛋白作用，进而影响多种生理功能。Ras/Raf/MEK/ERK通路的异常与肿瘤的发生密切相关，由于其异常可导致细胞失控和凋亡受阻，因此已成为肿瘤治疗非常有潜力的药物靶标[26399658]。
  mutation_analysis: MAP2K1激活性变异可能导致MAPK信号通路异常活化，并影响MEK抑制剂或上游EGFR/RAS/RAF通路相关治疗策略评估。该基因变异的临床意义需结合具体位点、功能证据和癌种背景判断。
- gene: MAP2K2
  intro: MAP2K2编码的丝氨酸/苏氨酸蛋白激酶，即MEK2。MEK2作为丝裂原活化蛋白激酶（mitogen-activated protein linase，MAPK）信号转导通路中的重要激酶分子，参与调控多种细胞生理学功能，包括细胞增殖、分化，细胞分裂，应激和凋亡。MAPK信号转导通路为三级激酶体系：包括丝裂原活化蛋白激酶（MAPK）、丝裂原活化蛋白激酶激酶（MAP
    Kinase Kinase，MKK或MEK）、丝裂原活化蛋白激酶激酶激酶（MAP Kinase Kinase Kinase，MAPKKK）。MEK1和MEK2是MEK家族的两个主要成员。MEK位于通路的第二级，具有磷酸化底物的丝氨酸/苏氨酸和酪氨酸残基的功能，通过磷酸化靶蛋白ERK1/2的T202/185和Y204/187（T：苏氨酸，Y：酪氨酸）使得ERK1/2活化，ERK1/2再通过调节多种转录因子的磷酸化水平或其他相关蛋白作用，进而影响多种生理功能。著名的RAS/RAF/MEK/ERK通路的异常与肿瘤的发生密切相关，由于其异常可导致细胞失控和凋亡受阻，因此已成为肿瘤治疗非常有潜力的药物靶标[26399658]。
- gene: MET
  intro: MET基因又称c-MET，为原癌基因。MET编码肝细胞生长因子受体（HGFR），具有受体酪氨酸激酶活性。在成人中，MET表达仅限于干细胞和祖细胞，是创伤愈合和肝细胞再生所必需的。在胚胎发育期，MET受体在上皮源性细胞中表达，对侵袭性生长和介导上皮间质转化（EMT）十分重要。MET与其配体肝生长因子（HGF）结合，可引起RAS-MAPK、PI3K-AKT、STAT3、NOTCH等多条信号通路的激活，从而促进肿瘤细胞的生长、增殖、浸润和转移[12884908，22128285]。MET基因异常激活突变会触发肿瘤生长、血管新生和转移，导致乳头状肾细胞癌、子宫内膜癌等癌症的发生[29149761]。另外，MET突变还和肿瘤的不良预后相关。
- gene: MLH3
  intro: MLH3基因编码蛋白属于错配修复蛋白，主要参与减数分裂细胞重组以保证细胞在分裂过程中的高效率和准确性。该蛋白质作为与其他家族成员的异源二聚体发挥作用。该基因中的体细胞突变经常发生在显示微卫星不稳定性的肿瘤中，胚系突变与遗传性非息肉性结肠直肠癌7型（HNPCC7）相关[GeneCards]。在多种癌症中如子宫内膜癌、肠癌和胃癌中观察到该基因的错义突变、无义突变、沉默突变、移码缺失、插入以及整码缺失。有研究表明，在遗传性非息肉性结直肠癌中可检出MLH3基因的错义突变和移码突变[11586295]。有研究表明，MLH3突变可能有助于子宫内膜癌的发生[16885347]。
  mutation_analysis: MLH3功能异常可能影响DNA错配修复能力，进而造成微卫星不稳定或突变负荷改变。错配修复相关基因异常在结直肠癌发生发展、遗传风险评估和免疫治疗疗效判断中具有重要意义。因此，该样本检出的MLH3变异可能与疾病的发生发展及治疗评估相关。
- gene: MSH2
  intro: MSH2基因编码一种具有DNA错配修复功能的蛋白，是复制后错配修复系统的重要组成部分，可以与MSH6/MSH3形成两个异二聚体，结合于DNA错配区域，启动错配修复，在错配修复中具有重要作用。目前，已在子宫内膜癌、肠癌和皮肤癌等癌症中观察到MSH2基因的错义突变、无义突变、沉默突变、全基因缺失、移码缺失和插入以及整码缺失。
  mutation_analysis: 'MSH2基因编码的蛋白全长为934个氨基酸，主要包含MutS_Ⅰ结构域（17-132位氨基酸）、MutS_Ⅱ结构域（145-290位氨基酸）、MUTSd结构域（321-645位氨基酸）以及MUTSac结构域（662-849位氨基酸）。

    MSH2蛋白缺失会导致DNA错配修复功能的缺失，无法保证遗传信息的保守性和完整性，可能是致癌的主要机制[7604264]。'
- gene: MUTYH
  intro: MUTYH基因编码的蛋白是一种糖基化酶，是碱基切除修复通路的关键蛋白，定位于细胞核和线粒体内。在DNA复制后能迅速扫描子链DNA，切除子链DNA中与母链8-oxodG错配的A，若MUTYH蛋白失活，则易导致低效的DNA修复，造成DNA损伤，从而促进肿瘤的发生。MUTYH蛋白在许多癌症的发病机制中扮演着重要的角色[24377542]。目前，已在子宫内膜癌、肠癌和胃癌等多种癌症中发现MUTYH基因的错义突变、无义突变、沉默突变和移码插入。
- gene: MYC
  intro: MYC基因编码的蛋白为一种细胞核磷蛋白，其与核内DNA特异结合，可在细胞核内转化为功能蛋白。MYC蛋白在细胞周期进程、凋亡以及细胞内转化过程中发挥作用。MYC蛋白具有促进DNA复制的特性，可促进细胞增殖、永生化、去分化和转化等，在多种肿瘤形成过程中处于重要地位[6285209]。MYC蛋白作为转录因子能够控制基因的表达。目前，已在子宫内膜癌、造血系统和淋巴癌以及胃癌等许多癌症中检出MYC基因的错义突变、沉默突变、移码缺失和整码缺失。
- gene: NF2
  intro: NF2是一种肿瘤抑制基因，其编码肿瘤抑制蛋白Merlin，Merlin与ERM家族蛋白具有相似的功能，用于连接细胞骨架和细胞膜蛋白。Merlin与细胞表面蛋白、参与细胞骨架动力学的蛋白、参与调节离子转运的蛋白有相互作用[NCBI]。NF2的功能缺失突变或缺失会引起II型多发性神经纤维瘤。此外，NF2基因突变和Merlin的失活也发生在神经鞘瘤、脑膜瘤、间皮瘤、多形性胶质母细胞瘤、乳腺癌、结直肠癌、前列腺癌、肾透明细胞癌和黑色素瘤中。Merlin的肿瘤抑制作用最初表现在与细胞增殖中的接触抑制相关，高密度培养的细胞中Merlin蛋白的浓度水平是低密度培养细胞的2-3倍。此外，Merlin通过结合Pike-L（一种结合并活化PI3K的GTP酶），扰乱Pike-L结合并活化PI3K，从而阻断PI3K/AKT信号通路，抑制细胞增殖。Merlin在活化Hippo信号通路中也发挥着重要作用，而Hippo信号通路可以抑制细胞增殖、促进细胞凋亡[25893302]。
- gene: NOTCH2
  intro: NOTCH2基因编码的蛋白是NOTCH家族成员之一。NOTCH信号通路是一条在进化上高度保守的胞间信号通路，物理上相邻的细胞通过NOTCH受体与配体的结合传递NOTCH信号，从而调控细胞命运。在果蝇中，NOTCH蛋白与细胞结合配体（delta、serrate）相互作用，建立细胞间信号传导途径，这在果蝇生长发育过程中起着关键性的作用[NCBI]。与之类似，人体中NOTCH信号通路在决定细胞分化方向、细胞增殖和凋亡过程中起重要作用[12676578]。
- gene: NRAS
  intro: NRAS基因是一种N-ras原癌基因，是RAS家族之一，在ras三个异形体中，NRAS功能获得性突变在血液肿瘤中发生的频率最高。其编码的一种膜蛋白可以在高尔基体和质膜之间进行穿梭，该穿梭受高尔基复合体ZDHHC9棕榈酰化的调节。该蛋白具有内在的GTP酶活性，可被一个鸟嘌呤核苷酸交换因子激活，也可被GTP酶激活蛋白灭活。该基因的突变可导致直肠癌、甲状腺滤泡状癌、自身免疫性淋巴增生综合症、努南综合症和幼年粒-单核细胞白血病等[17517660]。
  mutation_analysis: 'NRAS基因编码蛋白全长为189个氨基酸，主要包含RAS结构域（1-166位氨基酸）。

    NRAS突变比KRAS罕见，仅在1-6％的结肠直肠癌中发现NRAS基因突变。NRAS基因最常见的突变主要位于第12、13和61位密码子，这些位点的突变会造成NRAS信号通路的组成型激活，导致细胞的生长增殖失控，从而导致癌症的发生[3510078，26544513，23515407]。'
- gene: NTRK2
  intro: NTRK2基因编码原肌球蛋白相关激酶B（TRKB），是神经营养性酪氨酸受体激酶家族的成员之一。TRKB是膜结合受体，与神经营养蛋白结合，使自身和MAPK信号通路的成员发生磷酸化，其信号传输导致细胞分化[NCBI]。研究表明，在宫颈癌中，NTRK2呈现高表达，可促进上皮-间质转化（EMT），参与肿瘤细胞的增殖、侵袭和转移[29345295]。
  mutation_analysis: 'NTRK2基因编码的蛋白全长为838个氨基酸，主要包含LRRNT结构域（31-65位氨基酸）、LRRCT结构域（148-195位氨基酸）、IGc2结构域（209-273位氨基酸）、l-set结构域（298-377位氨基酸）和
    TyrKc结构域（554-823位氨基酸）。

    研究报道，NTRK2过表达可逆转miR-22对癌症增殖和侵袭的抑制作用从而调节参与多种癌症（包括宫颈癌、肺癌、胃癌等）的发生发展[29345295，21466358，27662840]。'
- gene: NTRK3
  intro: NTRK3基因编码神经营养性酪氨酸激酶3型受体，是酪氨酸激酶的跨膜受体，NTRK家族有3个成员：NTRK1、NTRK2、NTRK3。它可能是一种依赖性受体，具有作为致癌基因或肿瘤抑制基因的潜力。NTRK3可通过结合神经营养因子，启动酪氨酸激酶信号级联反应，导致细胞生长和分化。然而，当NTRK3配体缺乏时，NTRK3可以起到肿瘤抑制作用[23396845]。NTRK
    1/2/3基因融合现象在临床上非常普遍，这些融合导致相应基因编码蛋白质的活动增强，从而提高肿瘤细胞的增殖状态和生存状态[12450792]。
  mutation_analysis: 'NTRK3基因编码的蛋白全长为839个氨基酸，包含LRRNT结构域（31-63位氨基酸）、LRRCT结构域（160-208位氨基酸）、IG结构域（216-302位氨基酸）、I-set结构域（317-392位氨基酸）、跨膜结构域（430-452位氨基酸）和酪氨酸激酶催化结构域（538-824位氨基酸）。

    有研究报道，NTRK3被描述为一种依赖性受体，在没有配体时诱导细胞凋亡，因此根据具体情况，可能是一种肿瘤抑制因子，也可能是致癌基因[23396845]。'
- gene: PDGFRA
  intro: PDGFRA编码血小板生长因子受体α亚基。属于细胞表面酪氨酸激酶受体，其配体为血小板生长因子（platelet-derived growth factor，PDGF）。血小板衍生生长因子受体（PDGFRA）是一种单链跨膜糖蛋白，包含5个免疫球蛋白样胞外区、跨膜区及含酪氨酸激酶的胞内区[11786393，11073817]。PDGFRA基因在器官发育、伤口愈合和肿瘤的发生进程中起重要作用[9596271]。正常情况下，平滑肌细胞、内皮细胞、成纤维细胞及神经细胞等多种类型的细胞均有PDGFRA的表达，其与配体PDGF结合后，可以通过不同的途径促使有丝分裂信号向胞内传递，如激活MAPK、PI3K通路等，从而引起DNA合成，促进细胞裂解、生长和增殖。在病理状态下，它们的结合则与多种疾病和某些肿瘤细胞的恶性增殖相关[11208730，9596271]。
- gene: PDGFRB
  intro: PDGFRB基因编码的蛋白为PDGFRβ，PDGFRβ是一种受体酪氨酸激酶，位于细胞表面，由胞外结构域、跨膜结构域和胞内结构域组成，胞外结构域可识别并结合血小板衍生生长因子（PDGF），胞内结构域为酪氨酸激酶结构域。PDGF识别并结合PDGFRβ使其二聚化，胞内酪氨酸被磷酸化使激酶活性被激活，并通过磷酸化下游信号蛋白将信号传递到细胞核内，从而影响细胞的活动，PDGFRβ下游信号通路主要为PI3K/AKT/mTOR和RAS/RAF/MEK/ERK，这些信号通路在细胞增殖、存活、血管新生以及转移过程中都发挥着关键性作用。研究表明，肿瘤血管新生在卵巢癌的发生发展中发挥着重要的作用，PDGF、VEGF、FGF所诱导发生的信号通路都有促血管新生的作用[22575381]。
- gene: PMS1
  intro: PMS1基因编码的蛋白是DNA错配修复mutL/hexB家族的成员，与MLH1蛋白形成异二聚体，参与DNA的错配修复。PMS1基因的功能缺失与小鼠的肿瘤易感性和自发性突变相关[9500552]。PMS1基因突变与遗传性非息肉病结肠癌的发病相关[8072530]。在口腔鳞状细胞癌中，PMS1基因表达下调[23608172]。
- gene: PTCH2
  intro: PTCH2基因编码蛋白起跨膜受体作用，该蛋白也是HH信号通路中的肿瘤抑制因子。PTCH2基因在皮肤、睾丸组织及基底细胞癌、神经管母细胞瘤、精母细胞瘤中高表达。PTCH2基因可能参与胚胎发育及在环境因子诱发肿瘤的过程中发挥抑癌基因的作用。PTCH2能识别各种HH蛋白配体并与之结合。目前，已经在子宫内膜癌、肠癌和皮肤癌等多种癌症中观察到该基因的错义突变、无义突变、沉默突变、移码缺失和插入。
- gene: PTEN
  intro: PTEN基因是具有磷酸酶活性的抑癌基因，编码磷脂酰肌醇-3，4，5-三磷酸酯3-磷酸酶。PTEN能够负调节细胞内磷脂酰肌醇-3，4，5-三磷酸（PIP3）的水平，即从PIP3上转移特异的磷酸基团，使PIP2向PIP3的转化发生逆转，从而抑制PI3K的磷酸化作用[14557489，15843377]。PTEN也参与负调节PI3K/AKT信号途径，抑制FAK/PI30C和MAPK信号通路等。PTEN还与P53通路相互作用，当细胞损伤或存在突变时，p53能诱导PTEN表达，进而增进p53蛋白稳定性，促进细胞凋亡[15843377，19221500]。PTEN在多种肿瘤中发生高频率的突变或缺失[NCBI]。研究证明，PTEN功能异常会造成PI3K/AKT通路活化，而活化的AKT可通过催化一系列蛋白质磷酸化来促进肿瘤细胞的生长、增殖、侵袭和转移，抑制肿瘤细胞凋亡，调控血管生成等[17604717，18288938]。
  mutation_analysis: 'PTEN基因编码具有蛋白磷酸酶活性和脂质磷酸酶活性的双重特异性磷酸酶。该蛋白含有403个氨基酸残基，包括氨基端磷酸酶张力蛋白型结构域（47-175位氨基酸）、C2结构域（188-349位氨基酸残基）以及羧基端区域。

    PTEN基因的突变与许多癌症的发生发展相关[19437103]。在结直肠癌中的研究显示，PTEN表达缺失的患者存活率低于PTEN正常表达的患者，表明PTEN表达缺失可能有助于结直肠癌的生长、侵袭和转移，可作为预后不良的生物标志物[26787105]。'
- gene: PTPN11
  intro: PTPN11基因编码一个非受体蛋白酪氨酸磷酸酯酶（SHP-2），是蛋白酪氨酸磷酸酶（PTP）家族成员之一。PTPN11含有两个串联Src同源性-2结构域，作为磷酸-酪氨酸结合结构域起作用并介导PTPN11与其底物的互相作用。PTPN11广泛表达于多种组织，并且在多种细胞信号传导中起调节作用，如有丝分裂激活、代谢控制、转录调节和细胞迁移等[NCBI]。PTPN11是一个易于突变的基因[18286234，17227708]。目前，已在白血病、肺腺癌、结直肠癌、肝癌、胃癌以及乳腺癌中发现PTPN11基因突变或过表达，被认为是一种原癌基因[15604238，12717436]。
- gene: RAF1
  intro: RAF1基因编码的蛋白是一种MAP3K，其通过与膜相关GTP酶的Ras 家族的下游直接结合来发挥作用。一旦被激活，细胞RAF1蛋白可以通过磷酸化来激活双重特异性蛋白激酶MEK1和MEK2，进而磷酸化激活丝氨酸/苏氨酸特异性蛋白激酶ERK1和ERK2。活化的ERK是细胞生理学的多效效应器，并且在控制细胞分裂周期、细胞凋亡、细胞分化和细胞迁移的基因表达中起重要作用[NCBI]。RAF1蛋白可促进NF-kB的激活，并抑制参与运动、凋亡、增殖和血管生成的信号转换器，还可调节用于正常创伤愈合的Rho信号传导。RAF1通过抑制TJ蛋白和闭合蛋白（OCLN）的表达来促使上皮细胞的致癌转化[UniProtKB]。
- gene: RARA
  intro: RARA基因编码的蛋白是一种细胞核内视黄酸受体，能够通过依赖于配体的方式调控基因转录。RARA已被发现可以参与调控发育、分化、凋亡、分泌颗粒形成以及时钟基因的转录。RARA基因座与其他基因座之间的转座与急性早幼粒细胞白血病相关[NCBI]。该基因坐落在17q12-21扩增子处，该扩增子处的基因与同在17q12-21处的ERBB2共同扩增，协同在乳腺癌生成阶段中发挥表皮细胞极性消失、失巢凋亡逃逸和促进增殖的功能。RARA过表达会破坏正常乳腺腺泡结构，诱导肿瘤从表皮到间质的转移（EMT），从而促进恶性肿瘤转化[25300573]。RARA突变与其融合蛋白PML的突变可能协同发挥作用，在引发急性早幼粒细胞白血病对砷化疗的抗性方面发挥作用，从而增加了急性早幼粒细胞白血病的复发率[24806185]。RARA可以通过激活STAT3和MEK-ERK通路来促进肿瘤细胞的增殖，从而缩短RARA阳性的骨髓瘤患者整体生存率，而全反式视黄酸治疗法对治疗RARA阳性的骨髓瘤比较有效[19458357]。此外有报道称RARA可以促进T细胞的激活和促进辅助T细胞中细胞因子和趋化因子的分泌[18416830]。
- gene: RET
  intro: RET是一种原癌基因，其编码的蛋白属于受体酪氨酸激酶（Receptor tyrosine kinase，RTK）蛋白家族[NCBI]。RET具有RTK的经典结构：一个富含半胱氨酸的钙粘连素样细胞外区、一个跨膜区和一个催化酪氨酸激酶的细胞内区。RET与其配体（主要为神经胶质细胞源性神经营养因子家族，GDNF）结合后，胞内区催化酪氨酸激酶磷酸化，继而诱导RET二聚化、自体磷酸化、底物磷酸化，从而激活细胞内下游信号传导通路，包括RAS/RAF/ERK、PI3K/AKT和JNK途径[20083156，20930041]。RET基因的突变与IIA型多发性内分泌肿瘤症、IIB型多发性内分泌肿瘤症、先天性巨结肠病和甲状腺髓样癌等疾病有关[NCBI]。
- gene: SF3B1
  intro: SF3B1基因编码的蛋白是剪接因子3B第1亚单位，和剪接体U2snRNP形成复合物A。这个多蛋白复合体的主要作用是阻止其他剪接体组分的亲核袭击，使之后的转酯反应可以顺利进行，进而完成RNA剪切[19239890]。SF3B1蛋白的N-端涉及到蛋白质-RNA和蛋白质-蛋白质之间的相互反应，C端由22个重复串联的HEAT结构域组成。SF3B1的突变集中在第12-16外显子中，即翻译后的4、5、6结构域内，主要突变类型为K700E（700位上的赖氨酸被谷氨酸所代替），约占55%[21909114，21995386]。研究发现，SF3B1在骨髓异常增生综合征伴环形铁粒幼细胞的患者（MDS-RS）中的突变率很高，为66.7%-75.3%，SF3B1突变阳性的患者预后较好[21909114，21998214]。
- gene: SOX9
  intro: SOX9（性别决定区Y盒9）基因编码一种重要的转录因子，含有高迁移率族框DNA结合结构域，在正常胚胎发育、软骨形成、神经嵴发育和分化，以及中枢神经系统、胰腺、前列腺、肠、皮肤中的特定细胞类型和谱系的发展中发挥重要作用[21237710]。SOX9基因在多种恶性肿瘤中过表达，与癌症的发展或进展有关。例如：在复发性激素难治性前列腺癌中，SOX9呈现过度表达，促进前列腺癌细胞的生长、血管生成和侵袭[18339840]。在胰腺导管腺癌（PDAC）中，SOX9表达上调，与肿瘤增殖、远处转移和不良预后相关，可能是PDAC的预后生物标志物[25428381]。SOX9基因缺陷与骨骼畸形综合征相关[GeneCards]。
- gene: SRC
  intro: SRC为原癌基因，编码酪氨酸蛋白激酶，其活性能够被c-SRC激酶的磷酸化抑制。SRC是PI3K和MAPK信号通路上游关键的调节因子，能够调节胚胎发育和细胞生长。突变或者表达量上升都会导致SRC激活。SRC的激活会促进细胞的生存、血管形成、细胞增殖以及侵袭能力增强[NCBI]。有研究表明，EGFR和HER2在乳腺癌患者的乳腺组织中过度表达，能促进SRC基因通过其SRC同源区域2（SH2）调节自身活性[17173075]。
- gene: STK11
  intro: STK11基因，又称LKB1，编码丝氨酸/苏氨酸蛋白激酶11[NCBI]。STK11可以通过对AMPK的变构调节，调控细胞的能量代谢[21450399]；STK11还可以通过转录因子SPI对VEGF产生负向调控，抑制细胞的增殖；还能够通过调控细胞周期，使细胞周期停滞、促进细胞凋亡，抑制细胞增殖[19204826，21192934，17676035]。STK11在细胞极性的形成中起着重要的调节作用[15705853]。STK11基因的胚系突变可导致Peutz-Jeghers综合征[26877140]。STK11基因被认为是一种抑癌基因，STK11基因的突变、杂合型缺失可导致黑色素瘤、肺癌、胰腺癌等多种肿瘤的发生[26877140]。研究表明，STK11基因调控非小细胞肺癌细胞的分化和转移[17676035]。
  mutation_analysis: STK11功能缺失可能影响能量代谢、细胞极性和mTOR通路调控，并可与肿瘤免疫微环境改变相关。STK11变异在结直肠癌中相对少见，其具体临床意义需结合变异类型、是否功能缺失及共突变背景综合判断。
- gene: TERT
  intro: TERT基因编码蛋白是端粒酶中起催化作用的亚单位。TERT基因的表达决定着端粒酶的激活。因此，TERT基因虽然不是致癌基因，但是其突变参与包括胶质瘤在内的多种肿瘤的发生发展过程。TERT在正常细胞中不表达或者低水平表达，而在85%-90%的肿瘤细胞和干细胞中表达水平明显增高[22652771]。TERT基因对端粒酶延长的催化作用是非常重要的。TERT基因是维持端粒稳定所必需的，在TERT基因的参与下，端粒的延长需要成熟、加工、TERC积聚、核转运、TERT转录后的修饰等过程。TERT基因的表达与端粒酶的活性及肿瘤的发生和进展关系密切。研究发现，TERT基因的多态性与肺癌、结肠癌、胃癌易感性明显相关[22495810，20445798]。
- gene: TP53BP1
  intro: TP53BP1基因编码的蛋白为抑癌基因TP53结合蛋白1，TP53BP1生理功能广泛，不仅参与DNA损伤修复反应，而且调控细胞周期。TP53BP1使DNA发生损伤的细胞产生周期性阻滞并增加细胞凋亡率，从而避免基因组遗传信息的不稳定并阻断肿瘤的发生。作为周期检查点蛋白，和其他成员一样（如：BRCA1/MDC1），TP53BP1也包含高度保守的BRCT串联结构，其可与细胞膜上的ERM互相作用以发挥基因的抑癌作用。目前研究显示，TP53BP1与肺癌、甲状腺癌、乳腺癌、皮肤癌等多种恶性肿瘤均有关[17522062，17985346，20453858]。
- gene: VEGFA
  intro: VEGFA 基因编码一种二硫键相连的同型二聚体的蛋白，是 PDGF/ VEGF 的生长因子 家族的成员，能引起糖基化促细胞分裂，能特异性的作用于血管内皮细胞并产生多种作用
    效果，包括介导细胞的通透性增加，诱导血管生成和内皮细胞生长，促进细胞迁移和抑制 细胞凋亡。该基因在多种已知的肿瘤中表达上调，其表达与肿瘤阶段和进展相关。该基因
    突变也与细胞增殖和非增殖性糖尿病性视网膜病变有关[NCBI]。
- gene: YAP1
  intro: YAP1（Yes1 相关转录调节器）是一种蛋白质编码基因。该基因编码 Hippo 信号通路的下游核效应子，该信号通路参与发育、生长、修复和平衡。作为该信号通路的转录调节因子，既可作为辅激活因子，也可作为核心抑制因子，通过限制增殖和促进凋亡，在器官大小控制和肿瘤抑制中发挥关键作用。与
    YAP1 相关的疾病包括色素瘤，眼，伴或不伴听力障碍，唇/腭裂，和/或智力发育受损和葡萄膜色素瘤-唇腭裂-智力障碍[Gene Crad]。
- gene: ZFHX3
  intro: ZFHX3基因编码具有多个同源结构域和锌指结构域的大型转录因子，通常定位于细胞核中，但在胃癌、头颈部鳞状细胞癌和皮肤癌等癌症的细胞质中可检测到[27756245]。ZFHX3在有丝分裂过程中与染色体共定位，发挥一定的功能[28624455]。ZFHX3蛋白通过结合富含AT的增强子基序来抑制α-胎蛋白基因的表达。ZFHX3蛋白可负调节c-Myb，并反式激活细胞周期蛋白依赖性激酶抑制剂1A（也称为p21CIP1）[NCBI]。ZFHX3基因的杂合性缺失与产生甲胎蛋白（AFP）的胃癌的恶性特征相关[11314020，17671116]。ZFHX3基因的核定位缺失与头颈部鳞状细胞癌的组织病理学进展相关[22791392]。
- gene: CCND1
  intro: CCND1基因编码细胞周期蛋白D1（cyclinD1），cyclinD1是cyclinD1-CDK4复合物中的调控成分，cyclinD1-CDK4复合物可磷酸化RB1蛋白，使E2F-RB1复合物分离，释放转录因子E2F，E2F靶向基因的转录使细胞周期实现G1/S期的转换，因此该蛋白在细胞周期G1/S期转换中发挥着重要作用[12432268]。CCND1基因突变、扩增和过表达会影响细胞周期进程，频繁发生于多种癌症中，并且其中很多突变会促进癌症的发生。对cyclinD1进行免疫组化染色被用于诊断套细胞淋巴瘤。根据已有研究可知，cyclinD1在乳腺癌中过表达，具有生物标志物的潜在价值。cyclinD1过表达与癌症患者更短的生存和转移能力的增强相关[17891190，16309541]。
- gene: CCND3
  intro: CCND3基因编码细胞周期蛋白D3（cyclinD3），属于D型细胞周期蛋白家族，该家族包含cyclinD1、cyclinD2、cyclinD3。cyclinD3是cyclinD3-CDK4复合物中的调控成分，cyclinD3-CDK4复合物可磷酸化RB1蛋白，使E2F-RB1复合物分离，释放转录因子E2F，E2F靶向基因的转录使细胞周期实现G1/S期的转换，因此该蛋白在细胞周期G1/S期转换中发挥着重要作用。cyclinD1在多种类型的癌症中发挥作用，但是cyclinD2、cyclinD3与恶性肿瘤发生的相关性较低[18635970]。
- gene: CSF1R
  intro: CSF1R基因编码的蛋白是CSF1/PDGF受体酪氨酸激酶家族的成员，是巨噬细胞集落刺激因子1的受体。其在配体结合后激活PI3K-AKT-mTOR、RAS-RAF-MEK-ERK和STAT信号传导途径[22186992]。CSF1R在调节造血干细胞，尤其是巨噬细胞和单核细胞等单核吞噬细胞的生存、增殖以及分化中发挥重要作用，因而在先天免疫反应和炎症进程中发挥关键作用[GeneCards]。有研究显示，CSF1R基因突变与骨髓恶性肿瘤易感相关[NCBI]。CSF1R能够被伊马替尼、达沙替尼、舒尼替尼、来他替尼、Ki20227、linifanib、阿西替尼、索拉菲尼和GW2580所抑制[UniProtKB]。
- gene: EPAS1
  intro: EPAS1基因又称HIF-2α，编码体细胞缺氧诱导因子2α，介导细胞中的大多数缺氧反应。研究表明，EPAS1通常在多种人类肿瘤中过表达，尤其是实体瘤和肿瘤来源的细胞系[18259193]。EPAS1基因的突变与多发性副神经节瘤（PGL）和红细胞增多症（Pacak-Zhuang综合征）相关[24819565，23509317，22931260]。
- gene: EPHA3
  intro: EPHA3基因编码的蛋白属于蛋白质酪氨酸激酶家族的受体蛋白亚家族。EPHA3编码的蛋白能够结合ephrin-A配体[NCBI]。EPHA3被认为是一种肿瘤抑制因子，与多种肿瘤的发生、发展以及预后相关。野生型EPHA3的过表达可抑制下游AKT信号转导通路，诱导细胞凋亡，抑制肿瘤细胞生成；EPHA3基因突变后影响对AKT途径的抑制，从而促进细胞生长；在肺癌组织中发现，EPHA3基因的拷贝数和（或）表达水平降低[22829656]。过表达EPHA3可以通过抑制PI3K/BMX/STAT3通路来促进细胞凋亡，从而降低小细胞肺癌（SCLC）细胞对化疗药物的抗性[27101199]。前列腺相关基因PC-1诱导的EPHA3表达可以通过激活AKT信号通路来促进前列腺癌的肿瘤发展[25231727]。研究已发现EPHA3突变存在于恶性胶质瘤[25256166]、转移性黑色素瘤[25393105]和前列腺癌肿瘤细胞中[26552734]。EPHA3作为肿瘤治疗药物设计的分子靶点备受关注[25391995]。
- gene: ESR2
  intro: ESR2基因编码蛋白为雌激素受体和核受体转录因子超家族的成员。ESR2蛋白由N-末端DNA结合域和C末端配体结合结构域组成，并位于细胞核、细胞质和线粒体中。当结合17-β-雌二醇或相关配位体后，该蛋白质形成同源或异源二聚体，与特定的DNA序列相互作用以激活转录。一些异构体显著抑制其他雌激素受体家族成员的活性。有研究报道，ESR2基因多态性与乳腺癌、结直肠癌以及前列腺癌的发生相关[15604249]。
- gene: FANCE
  intro: FANCE，即范可尼贫血补体组E，是范可尼贫血互补组成员之一。FANCE基因编码的蛋白在一种隐性疾病范可尼贫血中起作用，导致细胞遗传学不稳定，对DNA交联剂过敏，增加染色体断裂和缺陷DNA修复。与FANCE基因相关的信号途径有DNA损伤修复途径。在癌症如子宫内膜癌、肠癌和皮肤癌中观察到FANCE基因的错义突变、无义突变、沉默突变、移码插入和整码缺失。
- gene: FAT1
  intro: FAT1基因编码一个大的跨膜蛋白，属于钙黏蛋白超家族，该超家族包括经典钙黏蛋白家族、Flamingo/Celsr的家族、FAT/Dachsous家族等。FAT1是人类癌症中的致癌基因或肿瘤抑制因子，能调节细胞粘附、细胞生长、细胞迁移和肌动蛋白。FAT1是食管鳞状细胞癌（ESCC）中的重要突变基因之一。研究发现，FAT1表达在ESCC肿瘤组织中显著降低[28366557]。FAT1的表达与成神经管细胞瘤儿童患者的总体存活有关。FAT1低表达与成神经管细胞瘤儿童患者预后不良相关[27834469]。
- gene: FOXL2
  intro: FOXL2基因编码的蛋白为一跨膜蛋白，其中1-218位氨基酸残基位于膜外，219-236位氨基酸残基位于跨膜区，包含一个由14个丙氨酸形成的α螺旋结构，237-376位氨基酸残基位于膜内。FOXL2基因在眼睑、卵巢滤泡细胞、垂体促甲状腺细胞中特异性高表达。FOXL2在卵泡细胞中高表达有助于维持卵泡细胞的发育与功能。卵巢大多数成年颗粒细胞肿瘤存在FOXL2基因突变。在12例颗粒细胞瘤中，有6例（50%）检测到FOXL2突变。具有较高分化颗粒细胞的肿瘤更可能携带FOXL2突变[28319575]。
- gene: HLA-A
  intro: HLA-A基因编码人类白细胞抗原-A，是HLA I类分子的成员之一。HLA I类分子广泛分布于所有有核细胞表面，是细胞免疫中重要的分子，与肿瘤的发生发展密切相关。HLA
    I类分子能够提呈肿瘤抗原给细胞毒性T细胞（CTL），是CTL识别肿瘤细胞的关键，因此肿瘤细胞表面HLA I类分子下调或缺失被认为是肿瘤细胞免疫逃逸的机制。有研究表明，在恶性黑色素瘤、结直肠癌、胃癌、前列腺癌等癌种中均观察到HLA
    I类分子下调。
- gene: HLA-DRB1
  intro: HLA-DRB1属于HLA（人类白细胞抗原） II类β链旁系同源物。II类分子是由α（DRA）和β链（DRB）组成的异源二聚体，两者均锚定在膜中。DRB1通过呈递细胞外的蛋白质在免疫系统中起重要作用[NCBI]。很多实验表明，HLA-DRB1多态性与宫颈癌（CC）息息相关。如HLA-DRB1*15增加宫颈癌发生的危险性，是宫颈癌发生的易感基因[8945607，10363725]、DRB1*1501-DQB1*0602也能增加CC发生的危险性，而DRB1*13是宫颈癌的保护基因[8162070]；DRB1*13-DQB1*06能降低CC发生的风险[11679920]等。此外，DRB1多态性与前列腺癌也存在一定关系[10672954]。
- gene: KEAP1
  intro: KEAP1（Kelch样环氧氯丙烷相关蛋白-1）是Kelch家族的一种多区域阻遏蛋白，主要存在于细胞质中，是Nrf2的胞浆抑制蛋白，正常情况下锚定于胞浆的肌动蛋白细胞骨架上[24520207]。KEAP1高表达于心和骨骼肌等组织器官中，而低表达于脑、肺、肝、小肠、结肠、卵巢、睾丸及胎盘等组织器官中。生理状态下，胞浆内的KEAP1起着结合器的作用，通过含有E3的Cul3泛素连接酶与Nrf2结合在一起，Nrf2作为目标被蛋白体酶降解。当氧化应激反应出现，KEAP1作为氧化还原反应的传感器，它末端敏感的半胱氨酸残基通过氧化还原反应产生高效分子（如亲电子试剂）而被修饰，导致其构象发生变化，从而使Nrf2解离，转入细胞核内，与Maf蛋白结合成异质二聚体后与ARE结合，激活靶基因表达，调控Ⅱ相代谢酶、抗氧化酶或药物转运体的转录活性，从而发挥抗氧化损伤的作用，恢复细胞的内稳态[21251164，17636022]。随后，KEAP1进入细胞核内，与Nrf2一起出核并使Nrf2在胞浆内持续被蛋白体酶降解，Nrf2水平下降，激活终止[20103708]。KEAP1基因体细胞突变与胆囊癌、卵巢癌、肺癌和肝癌等肿瘤相关，直接影响Nrf2信号通路[21251164，23820265，22966037，22348534]。
- gene: MAP3K7
  intro: MAP3K7基因编码转化生长因子β激活激酶，是丝裂原活化蛋白3激酶（MAPKKK）家族成员之一。MAP3K7最初被发现在转化生长因子β（TGFβ）信号通路中发挥作用[8533096]，目前许多报道已证实MAP3K7在多条炎症，肿瘤信号通路中起到不可或缺的重要作用[18267068，18586026]。
- gene: MAPK1
  intro: MAPK1基因编码的蛋白属于MAP激酶家族，参与细胞的增殖、分化、转录调节、细胞发展等细胞信号的处理过程。这个激酶的激活需通过上游激酶促其磷酸化。激活后该激酶转进受刺激细胞的细胞核，在此磷酸化核靶标。该蛋白也是不依赖其自身激酶活性的转录抑制因子。MAPK1是ERK信号通路中关键的信号调控蛋白之一，该通路中关键酶表达异常可增加正常细胞恶化的概率[22154278]。一项研究还表明，该蛋白质可独立于其激酶活性作为转录抑制因子[GeneCards]。有研究表明MAPK3/1通过mTORC1-KITL信号传导参与原始卵泡激活[28218391]。在宫颈癌、子宫内膜癌和皮肤癌等癌症中观察到该基因的错义突变、无义突变和沉默突变。
- gene: MED12
  intro: MED12（RNA聚合酶Ⅱ转录调节物12）是中介体复合物的一个亚基，在调控相关基因的转录与表达中发挥重要作用，调节细胞的生长、分化等功能。MED12可与WNT信号通路中的中心分子β-链蛋白相互作用，从而调控靶基因的转录。MED12参与介导上皮生长因子（EGF）受体依赖的细胞生长过程，在受体酪氨酸激酶（RTK）通路中发挥重要作用。MED12可抑制核受体（NR）配体激活基因的转录。研究表明，MED12基因在子宫肌瘤中发生高频突变。另外，在前列腺癌中也存在MED12突变[22610119]。目前，已在乳腺癌、子宫内膜癌和肺癌等癌症中观察到MED12基因的错义突变、无义突变、沉默突变、移码插入和缺失以及整码缺失和插入。
- gene: MPL
  intro: MPL基因编码促血小板生成素受体，是位于造血干细胞、巨核细胞、血小板表面的跨膜蛋白，其表达专一而保守，属于造血因子受体超家族，保守的造血功能区决定结合促血小板生成素（TPO）的能力，可激活JAK/STAT信号通路。MPL突变与造血系统疾病相关，此外MPL的异常表达存在于结直肠癌、肝癌和肺癌等多种实体瘤中。
- gene: PIK3C2G
  intro: PIK3C2G基因编码的蛋白属于磷酸肌醇3-激酶（PI3K）家族。PI3K在细胞增殖、致癌转化、细胞存活、细胞迁移和细胞内蛋白运输的信号通路中起作用。该蛋白含有脂质激酶催化结构域以及C端C2结构域，这是II型PI3K的特征。C2结构域作为钙依赖性磷脂结合基序，其介导蛋白向膜的移位，并且还可介导蛋白之间的相互作用[NCBI]。有研究表明，PIK3C2G低拷贝数是III期结直肠癌预后的重要且独立的预测因子[25785104]。
- gene: RAD51C
  intro: RAD51C基因编码的蛋白质属于是高度保守的RAD51重组酶的五个旁系同源物（RAD51B、RAD51C、RAD51D、XRCC2、XRCC3）之一。其在哺乳动物细胞中DNA双链断裂（DSB）的同源修复（HR）中起重要作用，介导同源DNA配对和链交换[8929543]。RAD51C被认为是遗传性乳腺癌和卵巢恶性肿瘤的人类癌症易感基因[20400964]。
  mutation_analysis: RAD51C属于RAD51旁系同源重组修复基因，参与DNA双链断裂修复和复制叉保护。RAD51C功能缺失型变异可提示HRR缺陷；在CRC报告中应区分胚系/体细胞来源、致病性分级、HRD背景和药物适应证，避免把任意错义变异直接解释为明确获益证据。
  refinement_note: 2026-06-30 low-information wording refinement; conservative pathway/domain
    wording only.
- gene: RAD51D
  intro: RAD51D基因编码蛋白是RAD51蛋白质家族的成员。RAD51家族成员是通过同源重组进行DNA修复所必需的蛋白质。RAD51D蛋白与RAD51家族的其他几个成员形成复合物，包括RAD51L1、RAD51L2和XRCC2。已经证明与该蛋白质形成的蛋白质复合物催化单链和双链DNA之间的同源配对，并被认为在DNA重组修复的早期阶段发挥作用[GeneCards]。目前，已经在结肠癌、皮肤癌和尿道癌等多种癌症中观察到该基因的错义突变、沉默突变和无义突变。
  mutation_analysis: RAD51D参与同源重组修复和RAD51复合体功能维持。RAD51D功能缺失型变异可提示HRR缺陷；在CRC报告中应区分胚系/体细胞来源、致病性分级、HRD背景和药物适应证，避免把任意错义变异直接解释为明确获益证据。
  refinement_note: 2026-06-30 low-information wording refinement; conservative pathway/domain
    wording only.
- gene: RAD54B
  intro: RAD54B基因编码的蛋白属于DEAD样解旋酶超家族，与已知参与DNA同源重组和修复的蛋白质酿酒酵母Rad54具有相似性[NCBI]。RAD54B蛋白质在DNA双链断裂的同源重组相关修复中发挥作用。RAD54B在许多癌症类型中发生体细胞突变或缺失，包括结直肠癌、乳腺癌、肺癌等[27902462]。
- gene: RAD54L
  intro: RAD54L基因编码的蛋白属于DEAD样解旋酶超家族，与已知参与DNA同源重组和修复的蛋白质酿酒酵母Rad54具有相似性。RAD54L蛋白质在DNA双链断裂的同源重组相关修复中发挥作用。RAD54L基因突变与癌症相关，例如RAD54L
    C157T多态性与脑膜瘤风险增加有关，并且与总体存活率显著降低相关[16520463]。有研究表明，RAD54L基因的单核苷酸多态性与胰腺癌的存活率降低相关[16520463]。
- gene: RECQL4
  intro: RECQL4基因编码的蛋白是RecQ螺旋酶家族的一个成员，该家族在维持基因的稳定性中发挥重要作用。RECQL4蛋白主要在胸腺和睾丸中表达。RECQL4蛋白在DNA复制和DNA断裂修复过程中有重要作用，同时在细胞的增殖过程中扮演重要的角色[16782873]。目前，已经在多种癌症如胃癌、结肠癌和子宫内膜癌中观察到该基因的错义突变、同义突变、无义突变和移码缺失。
- gene: STAG2
  intro: STAG2基因编码的骨髓基质细胞抗原2蛋白是黏连蛋白复合物的亚基。黏连蛋白是一种围绕DNA的环状蛋白复合体，控制着细胞的分裂，它能够阻止姐妹染色单体过早分离，有助于细胞将遗传物质平分给子细胞和DNA的修复[NCBI]。在胶质母细胞瘤，尤因氏肉瘤，膀胱癌和黑色素瘤中已报道了STAG2体细胞突变，并且已经在多种肿瘤中证实了STAG2表达缺失[22668012，28627627，27207471，29954776]。另外有研究报道，在尿路上皮膀胱癌中，STAG2是最常见的突变之一，它可能是一种潜在的尿路上皮膀胱癌的肿瘤抑制因子[24121791]。
- gene: SYNE1
  intro: SYNE1 基因编码的蛋白是核膜蛋白 Nesprin-1，参与调控胚胎干细胞分化过程中细胞核膜的装配，还在 DNA 损伤响应和 DNA 修复途径中发挥重要作用，影响肿瘤的遗传稳定性[24781983]。在人类疾病中
    SYNE1 基因与常染色体阴性遗传 1 型小脑性共济失调相关[21932307]。近年来，已在结直肠癌、脑胶质瘤、食管胃交界处腺癌和卵巢癌等恶性肿瘤 中 发
    现 SYNE1 表 达 水 平 、 体 细 胞 突 变 及 单 核 苷 酸 多 态 性 的 改 变[16959974，24308032，20056644]。另外，SYNE1
    基因在肺癌细胞系、肺腺癌和结直肠癌中经常发生甲基化[18339850，17892325]。
- gene: TNFAIP3
  intro: TNFAIP3编码的蛋白为肿瘤坏死因子α诱导蛋白3，又称锌指蛋白A20。A20通过干扰RIP（受体反应蛋白）或TRAF2（TNF受体相关因子2）介导的转移活化刺激信号途径抑制TNF介导NF-κB依赖的基因表达，并抑制TNF介导的细胞程序性死亡过程[10385526]。研究发现，TNFAIP3在肿瘤组织表达异常，如在未分化的鼻咽癌、低分化的头颈部鳞状细胞癌、皮肤鳞状细胞癌、乳腺癌、肝癌、胆管癌中的表达水平均明显升高[25230785，17297453，26485275]，且与肿瘤的分化、淋巴结转移、临床分期、预后等密切相关。同时，TNFAIP3的表达也有组织特异性，如在胰腺癌组织中发现其表达下降[22461193]。
- gene: VHL
  intro: VHL基因编码的蛋白是一种蛋白复合物的组成部分，该复合物具有elongin B、elongin C、cullin-2的作用，并且具有泛素连接酶E3的活性。VHL蛋白参与低氧诱导因子（HIF）的泛素化和降解。HIF是一种转录因子，在氧调节的基因表达中起关键作用。RNA聚合酶II亚基POL
    R2G/ RPB7也是该蛋白的一个作用靶标。VHL蛋白通过抑制MDM2介导的泛素化和p53的核输出来稳定p53。此外，在基因毒性应激中，VHL蛋白引起p53和p300之间的相互作用以及p53的乙酰化，从而增强p53的转录活性，并促进p53介导的细胞周期停滞和凋细胞亡[16678111]。
  mutation_analysis: VHL变异可能影响缺氧诱导因子降解和血管生成相关信号通路，从而参与肿瘤发生发展。该基因在结直肠癌中的直接临床意义需结合变异类型、功能证据和癌种背景进一步评估。
- gene: GNAQ
  intro: GNAQ基因编码一种鸟嘌呤核苷酸结合蛋白，该编码蛋白是Gq蛋白的一个α亚基，与7聚体跨膜结构域结合来激活磷脂酶C-β。该基因突变与血小板聚集和激活有关，与其相关的假基因位于2号染色体上[NCBI]。可以调节B细胞的活性和选择功能，可用于防止B细胞依赖性的自身免疫性疾病。调节骨髓来源的中性粒细胞和树突状细胞（在体外）的趋化性。GNAQ的突变与在蓝痣和葡萄膜的眼黑色素瘤的发生紧密相关[19078957]。
- gene: MAP2K7
  intro: MAP2K7基因编码的蛋白是一种双特异性蛋白激酶，属于MAP激酶激酶家族。MAP2K7特异性激活MAPK8/JNK1和MAPK9/JNK2，并且MAP2K7本身亦可被MAP激酶激酶激酶磷酸化和激活，包括MAP3K1/MEKK1、MAP3K2/MEKK2、MAP3K3/MEKK5和MAP4K2/GCK。MAP2K7参与信号转导，介导细胞对促炎细胞因子和环境应激的反应[NCBI]。研究表明，MAP2K7在三阴性乳腺癌中过表达，与预后不良相关[27226726]。
- gene: RB1
  intro: RB1基因是第一个被发现的抑癌基因，编码位于细胞核的磷蛋白（pRB），pRB是细胞周期的负调控因子[NCBI]，通过磷酸化和去磷酸化的形式决定着细胞
    G1 期转录因子E2F的活性，起始或抑制S期的其它蛋白。低磷酸化的 pRB 与 E2F 转录因子结合，使得 E2F 不能激活细胞周期必需的基因表达，从而使细胞停滞于G0/G1期，无法进入S期启动染色体复制以及增殖[15950900]。因此，RB1基因的功能与细胞周期、细胞衰老、细胞凋亡、细胞分化和生长抑制等有关[10783254，10199402]。
- gene: ROS1
  intro: ROS1基因是受体酪氨酸激酶（RTK）超家族成员之一，RTK家族由58个跨膜蛋白组成，在细胞的增殖、迁移和细胞周期进程中起作用。ROS1属于II类RTK，是一种原癌基因，其激活导致PI3K/ATK/mTOR、RAS/MAPK/ERK等信号途径的激活[16885344]。据报道，这些途径与肿瘤细胞增殖与存活、细胞形态转化、肿瘤细胞转移和迁移相关[22500682，18778756]。ROS1基因还可以通过染色体重排促进癌细胞的生长。目前已发现ROS1多种融合基因亚型，如FIG-ROS1、CD74-ROS1、SLC34A2-ROS1、TMP3-ROS1、SDC4-ROS1、EZR-ROS1、LRIG3-ROS1等，这些融合基因在肺癌、胆管细胞癌、浆液性卵巢癌、胃癌等癌症中促进肿瘤的恶性转化[22661537，23052255，22327623，22659450]。
- gene: RUNX1
  intro: RUNX1基因编码的蛋白是一种被称为核心结合因子的蛋白质络合物，属于RUNX转录因子家族成员之一，该蛋白可直接或间接调控多种信号转导通路，如TGFβ、Wnt、BMP等。RUNX1在正常造血细胞的形成和干细胞增殖中均发挥重要作用。众多研究显示，RUNX1参与髓系细胞、B细胞和T细胞的分化，因此当RUNX1功能缺失时，血液细胞分化受损，进而发生白血病[19813271]。不仅如此，RUNX1在多种实体瘤中也发挥激活或抑制调控肿瘤细胞生长、存活和分化的作用。目前，RUNX1表达上调或下降、基因突变已在多种癌种中发现，如肝癌、胃癌、子宫内膜癌、乳腺癌、肺癌等[26096009，26716895，15604243，25415051，26628987]。
- gene: CD274
  intro: CD274 基因编码的蛋白是一种免疫抑制性受体配基（PD-L1）。PD-L1 是一个具有类V 型和类 C 型免疫球蛋白结构域的 I 型跨膜蛋白[NCBI]。在干扰素γ诱导条件下，PD-L1在
    T 细胞、自然杀伤（NK）细胞、巨噬细胞、髓性树突状细胞（myeloid DCs）、B 细胞、表皮细胞和血管内皮细胞中广泛表达[17414316]。该蛋白与其受体
    PD-1 结合一方面会抑制 T 细胞受体组成蛋白 ZAP70 的磷酸化，阻止 PD-1 与 CD3ζ的结合，从而抑制 NF- κB 和 AP-1 等转录因子激活[15358536]。另一方面
    PD-L1 会通过诱导 E3 泛素连接酶CBL-b 的表达上调，在抗原呈递过程中下调 T 细胞受体，从而起到抑制 T 细胞激活和细胞因子产生的作用[21739608]。在孕期、组织的同种异体移植、自身免疫疾病以及肝炎等情况下，PD-L1
    在维持免疫反应稳态以抑制自身免疫的过程中发挥重要作用[12847137，18650228]。目前，CD274抑制剂是肿瘤免疫治疗药物的研究热点，并且在临床案例中取得了较好的效果[24217091]。
- gene: CIC
  intro: CIC编码的蛋白是一个转录抑制因子，在中枢神经系统的发育中发挥作用。CIC基因突变可促进少突神经胶质瘤的发生[21817013]。此外，CIC蛋白表达缺失在少突神经胶质瘤中也频繁发生，CIC蛋白表达缺失与CIC基因突变有明显的关联。CIC蛋白表达缺失与更短的PFS相关[24030748]。
- gene: EPHA2
  intro: EPHA2是EPH亚家族的成员之一，编码蛋白含有一个976个氨基酸多肽，相对分子质量为130000，为膜结合Ⅰ型糖蛋白。研究表明，EPHA2广泛高表达于许多肿瘤组织中，包括乳腺癌、脑癌、前列腺癌、非小细胞肺癌和结肠癌等[28165374]。对大肠癌的研究发现，EPHA2在癌组织中高表达，并与肿瘤组织血管形成呈正相关。EPHA2能促进肿瘤血管内皮细胞的迁移，并通过影响细胞骨架、基质粘附和细胞粘附而促进毛细血管结构的形成。EPHA2在内皮和卵巢癌细胞中的过表达与涉及血管发生和侵袭的关键因素密切相关。这些结果表明EPHA2过表达的患者的临床结局通常较差[17154180]。
- gene: FGF3
  intro: FGF3基因编码的蛋白是成纤维细胞生长因子（FGF）家族成员之一。FGF参与多种生物过程，包括胚胎发育、细胞生长、形态发生、组织修复、肿瘤生长和侵袭。FGF3是FGF受体1（FGFR1）和FGF受体2（FGFR2）的配体[25950492]。在人类肿瘤中的研究发现，FGF3基因频繁发生扩增，可能在肿瘤转化和进展中发挥重要作用[NCBI]。在乳腺癌中的研究表明，FGF3基因的表达与乳腺癌的分期相关，是潜在的治疗靶标[26323695]。
- gene: FH
  intro: FH 基因编码富马酸水合酶，是三羧酸（TCA）循环或Krebs循环的酶组分，能够催化富马酸盐形成L-苹果酸盐，在能量产生中发挥重要作用。FH基因以胞质形式和线粒体形式存在，其中胞质形式能够利用不同来源的富马酸盐，线粒体形式则是TCA循环的一部分。FH基因是一种肿瘤抑制因子，其功能缺失与肿瘤发生相关。FH基因的缺乏引起能量产生受损，可导致富马酸水合酶缺乏症和进行性脑病。FH基因最常见的突变类型包括错义突变、移码和无义突变等[16892081，21445611]。遗传性平滑肌瘤病和肾细胞癌（HLRCC）中存在FH基因的胚系突变，包括FH基因的全部缺失和部分缺失[28196407]。
- gene: FLT1
  intro: FLT1基因编码的蛋白是血管内皮生长因子受体（VEGFR）家族的成员之一。VEGFR家族成员是酪氨酸激酶（RTK）受体。FLT1蛋白能够与VEGFR-A、VEGFR-B和胎盘生长因子结合，并且在血管生成和维管形成中起重要作用[NCBI]。与FLI1相关的信号通路有PI3K-Akt
    和GPCR信号通路[GeneCards]。FLT1突变可引起血小板减少症[28432223]。目前，已在肠癌、甲状旁腺癌和皮肤癌等癌症中观察到FLT1基因的融合、错义突变、无义突变、沉默突变和移码缺失。
- gene: KAT6A
  intro: KAT6A也称为单核细胞白血病锌指蛋白（MOZ）或MYST3，属于组蛋白乙酰转移酶的高度保守的MYST家族成员，在组蛋白和染色质结构的翻译后修饰中起重要作用。KAT6A可以与其他表观遗传修饰癌基因配合以异常驱动许多重要癌基因的表达。乳腺癌中的研究显示ER阳性乳腺癌中KAT6A扩增和过表达患者的总生存期显著降低[25220592]。
- gene: PDCD1LG2
  intro: PDCD1LG2基因编码的蛋白为程序性细胞死亡配体2（PD-L2）。T细胞的完全活化有赖于双信号和细胞因子的作用。T细胞活化的第一信号来自其TCR与pMHC的特异性结合，即T细胞对抗原识别；T细胞活化的第二信号来自协同刺激分子，即APC表达的协同刺激分子与T细胞表面的相应受体或配体相互作用介导的信号。这两个信号的转导均涉及到一系列免疫分子。程序性死亡蛋白1（PD-1）是一种在活化的T细胞中表达的免疫抑制分子，是免疫治疗中非常有前途的靶点。PD-L1和PD-L2是PD-1的两个配体，在抗原呈递细胞（APC）中表达，参与T细胞和APC之间的相互作用[11224527]。PD-L2与受体PD-1结合能够下调细胞因子的产生和细胞增殖，抑制T细胞活化增生[21752471]。有研究表明，PD-L2在肺癌、肝癌、食管癌、胰腺癌、子宫颈癌和卵巢癌等多种恶性肿瘤中异常表达。
- gene: PTPRD
  intro: PTPRD（蛋白酪氨酸磷酸酶受体D）基因是一种抑癌基因，编码的蛋白为蛋白酪氨酸磷酸酶家族成员之一，此种酶包括细胞外区域、跨膜片段和胞质内的催化片段，由此组成受体结构，在调节细胞生长、增殖分化和基因转录等方面起着重要作用。在胶质母细胞瘤、头颈部鳞癌、肺癌和胃癌中都存在PTPRD基因的缺失或改变，其在肿瘤组织中表达水平明显降低[16585193，21213369，19478061，20073072]。
- gene: PTPRS
  intro: PTPRS基因编码蛋白是蛋白酪氨酸磷酸酶（PTP）家族的成员之一。已知PTP是调节多种细胞过程（包括细胞生长、分化、有丝分裂周期和致癌转化）的信号分子。小鼠中类似基因的研究表明，PTPRS蛋白可能参与胚胎发生期间的细胞间的相互作用、轴突形成以及轴突导向。PTPRS蛋白还与成人神经修复的分子控制相关[GeneCards]。
- gene: PTPRT
  intro: PTPRT基因编码蛋白为蛋白酪氨酸磷酸酶（PTP）家族的成员之一。已知PTP是调节多种细胞过程（包括细胞生长、分化、有丝分裂周期和致癌转化）的信号分子。PTPRT蛋白在中枢神经系统中的信号转导和细胞粘附中发挥作用[GeneCards]。PTPRT是一种重要的肿瘤抑制因子，在调节肿瘤发生机制中发挥重要作用。已报道PTPRT中的多态性与人类长寿有关。有研究表明PTPRT基因的
    rs2866943位点多态性与中国人群食管鳞状细胞癌的发生有关[25967969]。
- gene: TET1
  intro: TET1基因编码的蛋白是TET蛋白家族的成员之一，该家族蛋白是一种α-酮戊二酸（α-KG）和Fe依赖的双加氧酶，可催化5-甲基胞嘧啶（5-mC）转化为5-羟甲基胞嘧啶（5-hmC），在DNA去甲基化过程中发挥重要作用，DNA甲基化造成肿瘤抑制基因沉默并导致癌症的发生。TET1是第一个被鉴定为白血病患者中与MLL基因融合的基因[12646957]。
    研究发现，参与胞嘧啶去甲基化的双加氧酶在前列腺和乳腺癌组织中表达下调。TET1表达促进前列腺癌异种移植模型中细胞的侵袭、肿瘤生长和癌转移，并与乳腺癌患者的较差存活率相关[22999938]。
- gene: TP63
  intro: TP63基因是TP53基因家族成员之一。与野生型TP53功能相似，TP63也能激活多种TP53下游靶基因，引发细胞周期停滞及细胞凋亡[10227293]。但与TP53不同的是TP63基因在肿瘤细胞中很少发生突变和失去活性[22326462，22956039]。研究发现，TP63在肺鳞状细胞癌早期发展中频繁的扩增，并且TP63过表达的NSCLC患者生存期延长[14612504]。
- gene: ACVR2A
  intro: ACVR2A基因编码介导激素功能的受体，该蛋白属于转化生长因子-β（TGF-β）超家族成员，参与多种生物过程。ACVR2A蛋白是一种跨膜丝氨酸-苏氨酸激酶受体，它能通过一种细胞特异性的方式，与不同的I型和II型受体和配体结合，形成异二聚体复合物来介导信号传导。这些信号通路的缺陷与癌症的发生发展相关，例如前列腺癌中ACVR2A基因的截短突变导致活化素介导的细胞信号传导显著减少，在癌症的发展中发挥重要作用[16337854]。在小肠腺癌中的外显子组体细胞突变特征分析发现，ACVR2A基因是新的候选驱动基因，也是潜在的治疗靶点[29522538]。
- gene: ACVR2A
  c_hgvs: c.1310dup
  p_hgvs: p.R438Efs*19
  mutation_analysis: 该突变在COSMIC数据库中记载12次，与大肠癌相关的记录4次。ACVR2A基因编码的蛋白全长513个氨基酸，主要包含Activin_recp结构域（28-118位氨基酸）和STYKc（丝氨酸/苏氨酸激酶）结构域（192-485位氨基酸）。该样本检出的p.R438Efs*19突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。
    ACVR2A 被认为是抑制细胞生长和分化的肿瘤抑制因子，它的失活可能导致结直肠癌的发生[25225355]。因此，该样本检出突变可能与疾病的发生发展相关。
- gene: AMER1
  intro: AMER1（也称为FAM123B或WTX）是位于X染色体上的抑癌基因，其编码作为β-连环蛋白降解支架的高度保守的膜蛋白。AMER1作为骨架蛋白在细胞内与多种蛋白（APC、β-catenin、Axin
    等）直接结合，在WNT信号通路中发挥负调控的功能。该基因变异会使该蛋白失去与APC结合的能力进而导致WNT信号通路的紊乱。
- gene: AMER1
  c_hgvs: c.1489C>T
  p_hgvs: p.R497*
  mutation_analysis: 该突变在COSMIC数据库中记载29次，与大肠癌相关的记录25次。AMER1基因编码的蛋白全长1135个氨基酸，主要包含AMMECR1结构域（130-304位氨基酸）。该样本检出的p.R497*突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。
    有研究报道，AMER1可能是胰腺和结直肠腺癌中的肿瘤抑制因子[29625053]。在约 7-10% 的结直肠癌中发现了 AMER1 基因的错义和截短突变，与
    WNT 信号的减少有关[26071483]。因此，该样本检出的突变可能与疾病的发生发展相关。
- gene: ARID1B
  intro: ARID1B基因编码的蛋白是SWI/SNF染色质重塑复合物的组分，含有富含AT的DNA相互作用结构域。ARID1B在胚胎干细胞分化过程中的表达水平升高[18809673]。ARID1B蛋白与ARID1A蛋白类似，可作为SWI/SNF复合物的替代性互相排斥的ARID亚基起作用[NCBI]。在成骨细胞系中的研究揭示含有ARID1A和ARID1B的SWI/SNF复合物的作用相反，前者引起细胞周期停滞，而后者可能参与细胞周期进程[17255939]。另外，ARID1A和ARID1B在不同肿瘤类型中的作用可能反映了其组织特异性表达的差异[23660946]。
- gene: ARID1B
  c_hgvs: c.618_641del
  p_hgvs: p.Q207_Q214del
  mutation_analysis: 该突变在COSMIC数据库中暂无记载。ARID1B基因编码的蛋白全长2289个氨基酸，主要包含BRIGHT结构域（1107-1198位氨基酸）和DUF3518结构域（1979-2235位氨基酸）。该样本检出的p.Q207_Q214del突变位于上述结构域之外，对蛋白功能的影响未知。
    外显子组测序研究揭示，在微卫星不稳定性结直肠癌中ARID1A、ARID1B、ARID2和ARID4A基因频繁发生失活突变[24382590]。但是，目前尚未见该样本检出的突变在结直肠癌中的相关研究报道，其具体临床意义未明。
- gene: ATRX
  intro: ATRX基因编码的蛋白含有ATP酶/解旋酶结构域，因此其属于染色质重塑蛋白的SWI/SNF家族。ATRX蛋白参与转录调节和染色质重塑，并且参与有丝分裂期间的基因调节和染色体分离。ATRX基因突变与X连锁智力迟钝（XLMR）综合征相关，该综合征最常伴有α-地中海贫血（ATRX）综合征。研究发现，ATRX基因突变能够引起DNA甲基化的多样性，这种多样性可以在发育过程中提供染色质重塑、DNA甲基化以及基因表达之间的联系[GeneCards]。ATRX缺失与胰腺神经内分泌肿瘤中的染色体不稳定性相关[25033211]。目前，已在胰腺神经内分泌肿瘤和原发性中枢神经系统肿瘤中可检测到ATRX基因的体细胞突变[23640129]。
- gene: ATRX
  c_hgvs: c.3277del
  p_hgvs: p.R1093Gfs*25
  mutation_analysis: 该突变在COSMIC数据库中暂无记载。ATRX基因编码的蛋白全长为2492个氨基酸，主要包含Ring指结构域（220-268位氨基酸）、内在重复1结构域（437-562位和829-937位氨基酸）、螺旋结构域（1424-1526位氨基酸）、DEXDc结构域（1556-1776位氨基酸）以及HELICc结构域（2069-2155位氨基酸）。该样本检出的p.R1093Gfs*25突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。
    有研究报道，ATRX的缺失可导致胰腺神经内分泌肿瘤中的染色体不稳定性[25033211]。ATRX突变可增加小儿高级别胶质瘤细胞的遗传不稳定性和对PARP抑制剂的敏感性[Janat
    Fazal-Salom, et al]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。
- gene: BCL2
  intro: BCL2（B细胞淋巴瘤-2）基因是BCL基因家族成员。BCL2基因是抑制细胞凋亡的基因，在正常B细胞的发育和分化过程中发挥重要作用。BCL2基因编码的BCL2蛋白含有293个氨基酸残基，是一种跨膜蛋白，主要存在于细胞中的线粒体内膜、内质网膜和核膜上，主要功能是通过抑制线粒体中细胞色素M的释放，明显的抑制细胞凋亡。有研究证实，在未分化的鼻咽癌、非小细胞肺癌、胃癌、直肠癌、B细胞淋巴癌、急性白血病等多种肿瘤组织中，BCL2蛋白均呈高水平表达[10702644，24036132，22238053，25216797]。
- gene: BCL2
  c_hgvs: c.234del
  p_hgvs: p.G79Afs*17
  mutation_analysis: 该突变在COSMIC数据库中记载2次，与大肠癌相关的记录0次。BCL2基因编码的蛋白全长为239个氨基酸，主要包含BH4结构域（7-33位氨基酸）、BCL结构域（97-195位氨基酸）和跨膜结构域（214-236位氨基酸）。该样本检出的p.G79Afs*17突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。
    研究表明，在未分化的鼻咽癌、非小细胞肺癌、胃癌、直肠癌、B细胞淋巴癌、急性白血病等多种肿瘤中，观察到BCL2蛋白高表达[10702644，24036132，22238053，25216797]。另有研究表明，BCL2基因的多态性可能和患者的预后相关[23364242，21107291]。但是，目前尚未见该样本检出的突变在结直肠癌中的相关研究报道，其具体临床意义有待明确。
- gene: CCND2
  intro: CCND2基因编码细胞周期蛋白D2（cyclinD2）， cyclinD2是cyclinD2-CDK4复合物中的调控成分，cyclinD2-CDK4复合物可磷酸化RB1蛋白，使E2F-RB1复合物分离，释放转录因子E2F，E2F靶向基因的转录使细胞周期实现G1/S期的转换，因此该蛋白在细胞周期G1/S期转换中发挥着重要作用。该蛋白属于D型细胞周期蛋白家族，该家族包含cyclinD1、cyclinD2、cyclinD3，在调控细胞周期G1/S期转化中发挥作用。这些蛋白高度同源且在进化上高度保守，但是它们的结构基序有区别以及在不同细胞类型中发挥调控作用。cyclinD1在多种类型的癌症中发挥作用，但是cyclinD2、cyclinD3与恶性肿瘤的发生联系比较少[18635970]。
- gene: CCND2
  c_hgvs: c.480T>G
