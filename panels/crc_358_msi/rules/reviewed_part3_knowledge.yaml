  drug_name: 奥拉帕利（Olaparib）、芦卡帕利（Rucaparib）、尼拉帕利（Niraparib）、盐酸可泮利塞+奥拉帕利+度伐利尤单抗（Copanlisib+Olaparib+Durvalumab）、帕米帕利+替雷利珠单抗（Pamiparib+Tislelizumab）、芦卡帕利+阿替利珠单抗（Rucaparib+Atezolizumab）、他拉唑帕利+阿替利珠单抗（Talazoparib+Atezolizumab）、他拉唑帕利（Talazoparib）、AZD6738+奥拉帕利（Olaparib）、阿维鲁单抗+他拉唑帕利（Avelumab+Talazoparib）、LY2606368、奥拉帕利+帕博利珠单抗（Olaparib+Pembrolizumab）
  relation: '该样本检出ATM基因c.6874C>T，p.Q2292*无义突变，该突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。ATM是一个抑癌基因，编码PI3K/PI4K家族的一个蛋白激酶。ATM缺陷细胞会导致DNA损伤的积累及基因组的不稳定，进而引起肿瘤发生。临床研究发现，ATM缺陷型的前列腺癌或胃癌等肿瘤对PARP抑制剂敏感[26282658，26510020]。因此，该患者可能从PARP抑制剂及相关抑制剂的治疗中获益。



    目前，FDA和/或NMPA批准的PARP抑制剂有奥拉帕利、芦卡帕利、尼拉帕利、他拉唑帕利、帕米帕利。FDA批准奥拉帕利用于卵巢癌、输卵管癌或原发性腹膜癌、胰腺癌、乳腺癌以及前列腺癌患者的治疗；NMPA批准奥拉帕利用于卵巢癌和前列腺癌的治疗。FDA批准芦卡帕利用于治疗卵巢癌、输卵管癌或原发性腹膜癌以及前列腺癌患者。FDA批准尼拉帕利用于上皮性卵巢癌、输卵管癌或原发性腹膜癌患者的维持治疗；中国（香港）批准尼拉帕利用于治疗高级别浆液性上皮性卵巢癌患者；中国大陆批准尼拉帕利用于复发性卵巢癌的维持治疗。FDA批准他拉唑帕利用于治疗前列腺癌和乳腺癌成年患者。NMPA批准他拉唑帕利用于治疗前列腺癌患者。NMPA批准帕米帕利用于治疗存在已知致病或疑似致病的胚系BRCA突变的既往接受过两线或两线以上化疗的晚期卵巢癌、输卵管癌或原发性腹膜癌患者。



    相关抑制剂包括阿维鲁单抗、LY2606368、盐酸可泮利塞、度伐利尤单抗、帕博利珠单抗、替雷利珠单抗、阿替利珠单抗、AZD6738。阿维鲁单抗是PD-L1抑制剂，已获FDA批准用于治疗默克细胞癌、尿路上皮癌患者。LY2606368是一种ATP竞争性CHK1抑制剂，目前正处于临床期。盐酸可泮利塞是一种PI3K抑制剂，已获FDA和NMPA批准用于治疗滤泡性淋巴瘤。度伐利尤单抗是一种PD-L1抑制剂，已获FDA和NMPA批准用于治疗非小细胞肺癌和小细胞肺癌患者。帕博利珠单抗已获FDA批准用于治疗黑色素瘤、转移性非小细胞肺癌、头颈部鳞状细胞癌、对卡介苗无反应的非肌层浸润性膀胱癌、微卫星不稳定性高（MSI-H）或错配修复缺陷的实体瘤（包括结直肠癌）等多种癌症，NMPA批准帕博利珠单抗用于治疗黑色素瘤、非小细胞肺癌患者等。替雷利珠单抗已获NMPA批准用于治疗经典型霍奇金淋巴瘤、尿路上皮癌、非小细胞肺癌、肝细胞癌患者。阿替利珠单抗已获FDA批准用于治疗尿路上皮癌、非小细胞癌、小细胞肺癌、肝细胞癌、黑色素瘤患者，已获NMPA批准用于治疗小细胞肺癌、肝细胞癌、非小细胞肺癌患者。AZD6738是一种新型的口服ATR抑制剂，目前正处于临床期。'
  clinical: '有研究显示，奥拉帕利用于治疗携带DDR致病性突变（包括BRCA1、BRCA2、PALB2、ATM、CDK12、ATRX、CHEK1、CHEK2、FANCA、FANCF、FANCG、FANCI、FANCM、RAD50、WRN基因突变）的转移性去势抵抗性前列腺癌具有一定的抗肿瘤活性，目前该试验状态未知[2019
    JCO Abstract 5005，NCT01682772]。一项II期临床试验，旨在评估奥拉帕利单药或奥拉帕利联合AZD6738用于治疗具有同源DNA修复基因突变（包括ATM、CHK2、MRN（MRE11/NBS1/RAD50）、CDKN2A/B
    和 APOBEC）的肿瘤患者的有效性和安全性，目前该试验正在进行，不招募患者[NCT02576444]。



    一项由美国国家癌症研究所举办的临床I期试验，旨在评估盐酸可泮利塞、奥拉帕利联合度伐利尤单抗用于治疗具有ARID1A、ATM、ATRX、BARD1、BRCA1、BRCA2、BRIP1、CDK12、CHEK1、CHEK2、MSH2等基因突变的转移性或无法手术切术的实体瘤患者的毒副作用和最佳剂量，目前该试验正在招募中[NCT03842228]。一项II期临床试验，旨在评估奥拉帕利联合帕博利珠单抗治疗携带HR突变相关基因（ARID1A/B、ARID2、ATM、ATR、BARD1、BRCA1/2、BAP1、BRIP1、CHEK2、FANCA、FANCD2、MRN11A、PALB2、RAD50、RAD51、RAD54B）的黑色素瘤患者疗效，目前正在招募中[NCT04633902]。



    芦卡帕利用于治疗携带一个或多个同源重组DNA修复基因突变（包括BRCA1、BRCA2、ATM、CHEK2、NBN、RAD50、RAD51C、RAD51D、PALB2、MRE11、FANCA、FANCB、FANCC、FANCD2、FANCE、FANCF、FANCG、FANCI、FANCM）的前列腺癌患者的II期临床试验，正在招募中[NCT03413995]。芦卡帕利联合阿替利珠单抗用于治疗具有ATM、BARD1、BRCA1、BRCA2、BRIP1、CDK12、CHEK2、PALB2、RAD51C、RAD51D、FANCA、NBN、RAD51、RAD54L突变和/或缺失的实体瘤患者的II期临床试验正在招募患者[NCT04276376]。



    尼拉帕利用于治疗具有BAP1突变或其他DNA损伤修复缺陷（ARID1A、ATM、ATR、BACH1（BRIP1）、BAP1、BARD1、BLM、CHEK1、CHEK2、CDK2、CDK4、ERCC、FAM175A、FEN1、IDH1、IDH2、MRE11A（MRE11）、NBN（NBS1）、PALB2、POLD1、PRKDC（DNA-PK）、PTEN、RAD50、RAD51、RAD52、RAD54、RPA1、SLX4、WRN、XRCC）肿瘤患者的II期临床试验正在开展，暂不招募患者[NCT03207347]。



    阿维鲁单抗联合他拉唑帕利 用于治疗具有BRCA或ATM 突变的实体瘤患者的II期临床试验正在进行，暂不招募患者[NCT03565991]。他拉唑帕利用于治疗具有ATM、BRCA1、BRCA2、PALB2、ATR基因突变的晚期恶性肿瘤患者的II期临床试验正在进行，暂不招募患者[NCT02286687]。他拉唑帕利联合阿替利珠单抗用于治疗具有BRCA1/2、PALB2、ATM、ATR、CHEK2、FANCA、RAD51C、NBN、MLH1、MRE11A、CDK12体细胞或胚系突变的实体瘤患者的II期临床试验正在招募患者[NCT02693535]。



    帕米帕利联合替雷利珠单抗用于治疗具有BRCA1/2突变或其他HR相关基因（ATM、CDK12、PALB2、ARID1A、ATRX、BLM、BARD1、BRIP1、CHEK1、CHEK2、FANCA、FANCF、FANCG、FANCI、FANCL、FANCM、MSH2、NBN、RAD50、RAD51C、RAD51D、WRN）肿瘤患者的II期临床试验正在招募患者[NCT04985721]。



    LY2606368用于治疗具有同源重组修复缺陷（包括BRCA1、BRCA2、PALB2、RAD51C、RAD51D、ATR、ATM、CHK2或Fanconi贫血途径基因突变）的肿瘤患者的II期临床试验，4个月无进展生存率为25%[NCT02873975]。'
- gene: KRAS
  c_hgvs: c.34G>A
  p_hgvs: p.G12S
  type: caution
  header: KRAS：c.34G>A，p.G12S突变相应负相关靶向药物
  drug_name: 西妥昔单抗（Cetuximab）、帕尼单抗（Panitumumab）
  relation: '该样本检出KRAS基因c.34G>A，p.G12S错义突变，为已知激活突变，对蛋白功能有重要影响。已被证实KRAS基因激活突变是anti-EGFR抗体药物（如西妥昔单抗、帕尼单抗）耐药的标志[20100961]。因此预测患者可能无法从anti-EGFR抗体药物治疗中获益。

    2022年结肠癌和直肠癌NCCN指南中指出，转移性结直肠癌如需使用西妥昔单抗或帕尼单抗治疗，需检测肿瘤KRAS/NRAS/BRAF基因的状态，仅限KRAS/NRAS/BRAF基因野生型患者使用，突变型患者基本无效。本次样本检测到KRAS重要突变，可能会对西妥昔单抗或帕尼单抗用药疗效呈负相关性。FDA和NMPA批准西妥昔单抗用于治疗结直肠癌和头颈部鳞状细胞癌。FDA批准帕尼单抗用于治疗转移性结直肠癌。'
  clinical: '西妥昔单抗：在包含30名结直肠癌患者的一项临床试验中，19名患者对西妥昔单抗不敏感，其中13名患者携带KRAS基因突变，而在11名对西妥昔单抗敏感的患者中没有检测到KRAS突变。KRAS基因突变与患者缺乏对西妥昔单抗的响应密切相关。即使将3名接受过西妥昔单抗联合FOLFIRI作为一线治疗的患者排除在外，差异依然显著。在余下的27名患者中，KRAS基因野生型患者的总生存期显著高于携带KRAS基因突变的患者。在这项试验中，KRAS基因野生型患者的中位总生存期高于携带KRAS突变的患者（16.3个月vs.6.9个月）。该试验表明KRAS基因野生型的结直肠癌患者更容易对西妥昔单抗敏感并获得更长的生存期。KRAS基因突变是患者对西妥昔单抗耐药的标志，并且与较差的预后相关[16618717]。在另一项试验中，100名患有转移性结直肠癌的患者参与西妥昔单抗单药治疗。试验结果显示，KRAS基因野生型患者的疾病控制率显著高于携带
    KRAS基因突变的患者，该试验同样表明KRAS基因野生型的患者更能从西妥昔单抗的治疗中获益[17664471]。一项纳入了59例难治性转移性结直肠癌患者的研究，旨在评估西妥昔单抗加化疗的治疗效果。研究证实具有KRAS突变的患者对治疗无反应[17375050]。

    帕尼单抗：一项试验旨在评估含KRAS、BRAF或PIK3CA基因突变的患者对帕尼单抗单药治疗的耐受性。从3个评估帕尼单抗治疗转移性结直肠癌疗效的临床Ⅱ期试验中挑选出62名患者进行评估，通过测序确定患者DNA中基因突变情况。结果显示，62名患者中，有24名（38.7%）携带KRAS基因突变。在KRAS野生型患者中，11%的患者对帕尼单抗具有部分响应（PR），53%的患者在治疗后病情稳定（SD），37%的患者疾病进展（PD）。在KRAS基因突变患者中，有21%的患者病情稳定，79%的患者疾病进展，没有患者对帕尼单抗产生响应。由此看出，KRAS基因突变与患者对帕尼单抗治疗后响应的缺失密切相关（PR
    vs. SD vs. PD; P=0.0028）。野生型KRAS患者与携带KRAS 基因突变患者的无进展生存期风险比为0.4（95% CI, 0.2-0.7），总体生存期的风险比为0.5（95%
    CI, 0.3-0.9）。这些数据表明，携带KRAS激活突变的转移性结直肠癌患者不太可能对帕尼单抗单药治疗产生响应[18621636]。在另一项结直肠癌患者的Ⅲ期临床试验中，KRAS基因野生型的患者和携带KRAS基因突变的患者对帕尼单抗的响应率分别为17%和0%[23066310]。三项随机Ⅲ期试验研究的回顾性分析，评估了KRAS密码子12和13突变型对转移性结直肠癌患者使用帕尼单抗的影响，结果显示具有KRAS密码子12和13突变型的患者不能受益于帕尼单抗治疗[23182985]。'
