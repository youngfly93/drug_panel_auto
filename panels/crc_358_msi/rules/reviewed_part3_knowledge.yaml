schema_version: 1
source:
  panel: crc_358_msi
  purpose: |-
    Reviewed Part 3 knowledge overlays for CRC358+MSI reports. Match by gene + c_hgvs + p_hgvs; no patient identity, sample ID, date, or report-specific branching is used.
  scope: variant_level_reviewed_knowledge
  source_type: lab_reviewed_final_report_text
gene_sections:
- gene: TP53
  c_hgvs: c.844C>T
  p_hgvs: p.R282W
  intro: |-
    TP53基因是重要的抑癌基因之一，其编码蛋白为p53，大约有一半人类肿瘤呈现出TP53的失活突变，其余的恶性肿瘤中通过活化p53抑制因子、降低p53活化因子，使p53信号通路失活。p53通过其在细胞核中转录依赖和胞浆中转录不依赖两种途径发挥抑癌作用。p53作为转录因子可靶向结合特定的DNA序列，使与细胞周期停滞、凋亡、细胞代谢改变等功能相关的基因转录活化。除了细胞核内的活性，p53在胞浆中表现出转录非依赖的生物活性，研究表明细胞质中p53的活化有促进细胞凋亡的作用[19407794]。其作用机制为：DNA受损时，p53蛋白活化DNA修复蛋白并阻滞细胞生长周期的进行[22872685]。当细胞DNA受损严重不能修复时，p53蛋白与特定DNA结合，激活WAF1/CIP1等多种基因，启动细胞凋亡程序，抑制细胞分裂，从而避免携带异常遗传信息的细胞继续生长、分裂[21728981]。
  mutation_analysis: |-
    TP53基因编码的蛋白p53全长393个氨基酸，包含3个结构域：反式激活结构域（5-29位氨基酸）、DNA结合结构域（95-289位氨基酸）和四聚化结构域（318-359位氨基酸）。根据报道TP53突变主要发生在175、245、248、273和282这五个热点突变密码子区[19810096，10612830，12619105]，而TP53基因的K132、C135、P151、V157、R158、Y163、V173、C176、H179、H193、Y205、Y220、Y234、M237、C238、S241、C242、M246、R249、G266、P278、R280、D281和E285也是较为常见的突变密码子区[19336573]。这些位点均处于p53蛋白的DNA结合结构域，均可能会对蛋白功能产生影响。该样本检出的p.R282W 突变位于DNA结合结构域，研究表明，该突变抑制 AMPK 信号传导，导致细胞侵袭性生长，促进小鼠模型中的肿瘤发展[24857548]。
    一项研究在389名Ⅲ期结肠癌患者中检测TP53的突变状态，结果表明TP53的突变频率为33%[26425688]。在一项包含276个结直肠癌样本的分子突变分析研究中，发现165个非高频突变的结直肠癌样本中有59%检测到TP53突变，导致TP53信号通路失活[22810696]，说明TP53在结直肠癌的发生发展中具有重要作用。因此，该样本检出的突变可能与疾病的发生发展相关。
- gene: KRAS
  c_hgvs: c.34G>A
  p_hgvs: p.G12S
  intro: |-
    KRAS基因是致癌基因，属于RAS基因家族成员，编码P21蛋白。该蛋白在MAPK信号通路中起作用，能够与GDP/GTP结合并促进GTP酶活性。当KRAS基因发生突变时不能被水解酶水解失活，而处于持续激活状态，引起RAF/MAPK的上调，传递多种生存通路信号，从而使细胞过度生长、增殖，抵抗EGFR-TKIs的作用。KRAS突变可以导致肺癌、黏蛋白腺瘤、胰腺导管癌和结肠癌等多种恶性肿瘤。KRAS基因被激活最常见的方式是点突变，多发生在N端的第12、13、61和146密码子，其中以第12密码子突变最常见。不同突变位点对P21蛋白的活化机制不同，第12密码子突变可以减弱P21内在的GTP酶活性，并使细胞凋亡减少，细胞间接触抑制减弱。RAS家族基因在癌症中没有可用的药物直接拮抗靶点，主要影响信号通路上下游靶点药物的使用效果，突变主要导致EGFR靶药和BRAF靶药的耐药性。
  mutation_analysis: |-
    KRAS基因编码的蛋白全长为189个氨基酸，主要包含RAS结构域（1-166位氨基酸）。该样本检出的p.G12S突变位于上述结构域之内，为已知激活突变，对蛋白功能有重要影响。
    KRAS突变在人体肿瘤发生过程中起着重要的作用，并在胰腺癌、甲状腺癌、结直肠癌和肺癌中普遍存在[23066310]。研究显示，大约有35%-45%的结直肠癌患者携带原癌基因KRAS的突变。常见的KRAS突变多发生在N端第12、13、61和第146号密码子。这些突变会导致KRAS蛋白处于激活状态，并激活下游的信号通路，且已被证实是anti-EGFR抗体药物（如西妥昔单抗、帕尼单抗）耐药的标志[20100961]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。
- gene: APC
  c_hgvs: c.4348C>T
  p_hgvs: p.R1450*
  intro: |-
    APC基因能够编码肿瘤抑制蛋白，并在经典WNT信号通路中起拮抗作用，APC作为β-链蛋白（β-catenin）信号传导的负调节因子，与β-链蛋白的稳定性密切相关。β-链蛋白参与E-钙粘蛋白细胞粘附系统和Wnt信号传导途径[10959075]。APC基因突变导致其不能有效地与β-catenin、GSK-3β和Axin结合而形成复合物，失去了调节表达水平的能力，信号通路下游相关基因转录激活，从而导致细胞增殖异常和肿瘤的发生。研究显示，APC突变在胰腺癌、胃癌中也频繁发生，可能与其疾病的发生发展相关[1338691，12378616，1423316]。对APC的功能研究还发现APC通过其基本结构域与微管细胞骨架结合，参与细胞迁移过程。有助于微管网络的组装和重组，这与细胞分裂密切相关。APC可以间接调节肌动蛋白丝网络的组织，并因此影响细胞形态、极性和迁移[8033082，8698812]。APC-hDLG复合物形成在APC细胞周期阻断信号转导中起重要作用[10656683]。
  mutation_analysis: |-
    APC基因编码的蛋白全长为2843个氨基酸，主要包含2个卷曲螺旋结构域（2-59位、1869-1893位氨基酸）、1个Suppressor_APC结构域（126-208位氨基酸）、6个ARM结构域（340-392位、459-510位、512-553位、556-597位、599-644位和649-689位氨基酸）、1个Armadillo/beta-catenin-like repeat结构域（691-731位氨基酸）、4个APC_15aa结构域、7个APC_crr结构域、3个SAMP结构域、1个APC基础结构域（2223-2579位氨基酸）以及1个EB-1结合结构域（2670-2843位氨基酸）。该样本检出的p.R1450*突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。
    APC作为看家基因，参与DNA修复，它的突变会导致DNA修复减缓，增加周边其它细胞突变的风险，从而促进癌症的进展[24200292]。有研究表明，结直肠癌患者存在APC基因缺失，从而导致Wnt信号通路失调和C-Myc的反式激活，是潜在的治疗靶点[18593890]。因此，该样本检出的突变可能与疾病的发生发展相关。
- gene: APC
  c_hgvs: c.2387_2388del
  p_hgvs: p.Y796Wfs*2
  intro: |-
    APC基因能够编码肿瘤抑制蛋白，并在经典WNT信号通路中起拮抗作用，APC作为β-链蛋白（β-catenin）信号传导的负调节因子，与β-链蛋白的稳定性密切相关。β-链蛋白参与E-钙粘蛋白细胞粘附系统和Wnt信号传导途径[10959075]。APC基因突变导致其不能有效地与β-catenin、GSK-3β和Axin结合而形成复合物，失去了调节表达水平的能力，信号通路下游相关基因转录激活，从而导致细胞增殖异常和肿瘤的发生。研究显示，APC突变在胰腺癌、胃癌中也频繁发生，可能与其疾病的发生发展相关[1338691，12378616，1423316]。对APC的功能研究还发现APC通过其基本结构域与微管细胞骨架结合，参与细胞迁移过程。有助于微管网络的组装和重组，这与细胞分裂密切相关。APC可以间接调节肌动蛋白丝网络的组织，并因此影响细胞形态、极性和迁移[8033082，8698812]。APC-hDLG复合物形成在APC细胞周期阻断信号转导中起重要作用[10656683]。
  mutation_analysis: |-
    APC基因编码的蛋白全长为2843个氨基酸，主要包含2个卷曲螺旋结构域（2-59位、1869-1893位氨基酸）、1个Suppressor_APC结构域（126-208位氨基酸）、6个ARM结构域（340-392位、459-510位、512-553位、556-597位、599-644位和649-689位氨基酸）、1个Armadillo/beta-catenin-like repeat结构域（691-731位氨基酸）、4个APC_15aa结构域、7个APC_crr结构域、3个SAMP结构域、1个APC基础结构域（2223-2579位氨基酸）以及1个EB-1结合结构域（2670-2843位氨基酸）。该样本检出的p.Y796Wfs*2突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。
    APC作为看家基因，参与DNA修复，它的突变会导致DNA修复减缓，增加周边其它细胞突变的风险，从而促进癌症的进展[24200292]。有研究表明，结直肠癌患者存在APC基因缺失，从而导致Wnt信号通路失调和C-Myc的反式激活，是潜在的治疗靶点[18593890]。因此，该样本检出的突变可能与疾病的发生发展相关。
- gene: SETD2
  c_hgvs: c.4930G>T
  p_hgvs: p.G1644*
  intro: |-
    SETD2基因又名KMT3A或HYPB，该基因编码的蛋白是一个含有SET结构域的组蛋白H3K36特异性三甲基转移酶，最早是由人造血干细胞分离的，也是与亨廷顿病的发病机制相关的蛋白[9700202]。在人体中，SETD2是H3K36唯一的三甲基转移酶，参与调节H3K36三甲基化过程（H3K36me3）[12730288，18157086]。SETD2蛋白主要包含WW结构域和AWS-SET-postSET三联结构域，负责与H3K36的特异性结合发挥甲基转移酶活性；保守的低电荷区域( low charge region) ，被认为是富有谷氨酰胺和脯氨酸的转录激活结构域；SETD2通过羧基端与高度磷酸化的RNA聚合酶Ⅱ相结合[16118227]。因此SETD2可能是组蛋白甲基化修饰与基因转录调控之间的桥梁。SETD2通过抑制转录起始、激活转录因子p53、参与DNA修复过程和对细胞凋亡基因的调节等防止肿瘤的发生。目前，已在肾透明细胞癌、结直肠癌、乳腺癌、急性淋巴细胞性白血病和晚期脑胶质细胞瘤等多种肿瘤中发现SETD2基因发生突变，而绝大多数突变导致H3K36me3水平降低，表明SETD2的突变导致其编码蛋白失活[20501857，20944102，24509477]。
  mutation_analysis: |-
    SETD2基因编码的蛋白全长为2564个氨基酸，主要包含AWS结构域（第1494-1549位氨基酸）、SET结构域（第1550-1673位氨基酸）和SRI结构域（第2465-2559位氨基酸）。该样本检出的p.G1644*突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。
    有研究表明，SETD2缺失与WEE1抑制剂具有“合成致死”作用[29955114]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。
- gene: EPHA2
  c_hgvs: c.153+2T>C
  p_hgvs: ''
  intro: |-
    EPHA2是EPH亚家族的成员之一，编码蛋白含有一个976个氨基酸多肽，相对分子质量为130000，为膜结合Ⅰ型糖蛋白。研究表明，EPHA2广泛高表达于许多肿瘤组织中，包括乳腺癌、脑癌、前列腺癌、非小细胞肺癌和结肠癌等[28165374]。对大肠癌的研究发现，EPHA2在癌组织中高表达，并与肿瘤组织血管形成呈正相关。EPHA2能促进肿瘤血管内皮细胞的迁移，并通过影响细胞骨架、基质粘附和细胞粘附而促进毛细血管结构的形成。EPHA2在内皮和卵巢癌细胞中的过表达与涉及血管发生和侵袭的关键因素密切相关。这些结果表明EPHA2过表达的患者的临床结局通常较差[17154180]。
  mutation_analysis: |-
    EPHA2基因编码的蛋白全长为976个氨基酸，主要包含1个信号肽区域（1-24位氨基酸）、1个胞外配体结合结构域（28-201位氨基酸）、1个跨膜结构域（536-558位氨基酸）、2个FN3结构域（329-419位氨基酸和436-516位氨基酸）、1个酪氨酸激酶结构域（613-871位氨基酸）以及1个SAM结构域（901-968位氨基酸）。该样本检出的c.153+2T>C突变位于内含子与外显子交界处，可能导致mRNA剪接异常，进而导致蛋白功能缺失。
    人类EPHA2在前列腺癌、肺癌、食管癌、结直肠癌、宫颈癌、卵巢癌、乳腺癌和皮肤癌中大量表达[28966234]。有研究表明，EphA2的表达与临床分期及淋巴结转移密切相关。EphA2可与VEGF结合作为判断NSCLC恶性程度及预后的指标，及早期诊断指标和治疗的新靶点[19531623]。但是，目前该样本检出的突变在结直肠癌中的具体临床意义有待明确。
- gene: FANCI
  c_hgvs: c.2879G>A
  p_hgvs: p.R960Q
  intro: |-
    FANCI基因是范可尼贫血互补组（FANC）的成员之一，其他成员还包括FANCA、FANCB、FANCC、FANCD1（也称为BRCA2）、FANCD2、FANCE、FANCF、FANCG、FANCJ（也称为BRIP1）、FANCL、FANCM和FANCN（也称为PALB2）[GeneCards]。FANCI基因编码的蛋白在DNA修复中起作用。目前，已在甲状腺癌、结肠癌和皮肤癌等癌症中观察到FANCI基因的错义突变、同义突变、无义突变、移码插入和移码缺失。
  mutation_analysis: |-
    FANCI基因编码的蛋白全长为1328个氨基酸，主要包含多个低复杂度区域。该样本检出的p.R960Q突变位于上述结构域之外，对蛋白功能的影响未知。
    有研究表明，FANCI是FA途径的第二个单泛素化成员，FANCI功能缺失可导致AKT的自发磷酸化和活化[27097374]。另有研究表明，FANCI基因编码的蛋白在DNA修复中起重要作用，FANCI功能缺失可增强肿瘤对PARP抑制剂的敏感性[27022037，Abstract IA25]。研究显示，DNA修复基因包含FANCI，DNA修复基因突变与免疫治疗临床获益相关[30262796，31658756]。但是，目前该样本检出的突变在结直肠癌中的具体临床意义未明。
- gene: ATM
  c_hgvs: c.6874C>T
  p_hgvs: p.Q2292*
  intro: |-
    ATM 基因编码的蛋白属于PI3/PI4 激酶家族。ATM蛋白是重要的细胞循环检查点激酶，可调控一系列下游蛋白，包括抑癌基因蛋白P53、BRCA1，检测点激酶CHK2、RAD17 和 RAD9，以及DNA修复蛋白NBS1。ATM以及相关的蛋白激酶ATR是细胞循环调控点检测信号的主要蛋白，对于保持基因组的稳定性以及DNA 损伤修复起重要作用。ATM基因在人类恶性肿瘤发展过程中起重要作用。ATM基因是已知的肿瘤抑制基因，ATM基因的突变与共济失调毛细血管扩张（一种常染色体隐性遗传疾病）相关[7792600]。在不吸烟的肺癌患者中，ATM基因的多态性与肺癌的发生和发展密切相关[20004998]。ATM基因突变在肺癌和结直肠癌中频繁发生[25079552，22810696]。
  mutation_analysis: |-
    ATM基因编码的蛋白全长为3056个氨基酸，主要包含TAN结构域（5-166位氨基酸）以及FAT结构域（2096-2489位氨基酸）。该样本检出的p.Q2292*突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。
    ATM缺陷细胞会导致DNA损伤的积累及基因组的不稳定进而引起肿瘤发生。因此，该样本检出的突变可能与疾病的发生发展相关。
- gene: DNMT3A
  c_hgvs: c.1367delA
  p_hgvs: p.K456Sfs*195
  intro: |-
    DNMT3A（DNA胞嘧啶-5-甲基转移酶3α）基因编码参与表观遗传学基因调控的蛋白质。DNMT3A在成人组织中普遍表达，并且在某些肿瘤中高表达。有研究发现在正常核型的急性髓系白血病中DNMT3A基因存在一定比例的突变，并可能成为一种独立的预后不良因素。DNMT3A基因在血液恶性肿瘤（例如：急性骨髓性白血病、骨髓增生异常综合征）中发生突变的频率最高，但在其它癌症（包括肺癌）中也发现该基因的突变。
  mutation_analysis: |-
    DNMT3A基因编码的蛋白全长为912位氨基酸，主要包含PWWP结构域（290-348位氨基酸）和DNA methylase结构域（634-776位氨基酸）。该样本检出的p.K456Sfs*195突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    有一项研究表明，DNM3TA 突变患者在免疫治疗过程中，有4名DNM3TA突变的患者经过伊匹木单抗，帕博利珠单抗，纳武利尤单抗免疫治疗后发生进展，治疗失败的时间少于2个月（OR，9.33，P=0.03）[28351930，28976787]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。
- gene: FLT3
  c_hgvs: c.2537G>A
  p_hgvs: p.G846D
  intro: |-
    FLT3（Fms样酪氨酸激酶-3）基因编码的蛋白是调节造血功能的第III类酪氨酸激酶受体，能够激活造血干细胞的增殖和分化途径[27906677]。受体激酶的活化能磷酸化和激活多种细胞过程（细胞凋亡、增殖和骨髓中造血干细胞的分化）的细胞质效应分子。FLT3基因突变导致受体组成性激活，从而导致急性髓性白血病和急性淋巴细胞白血病[NCBI]。在具有FLT3激活突变的癌细胞中，FLT3抑制剂或酪氨酸激酶抑制剂已被证明是有效的[19318574，12124170]。与FLT3相关的信号通路有GPCR和癌症中的信号通路[GeneCards]。
  mutation_analysis: |-
    FLT3基因编码的蛋白全长为993个氨基酸，主要包含免疫球蛋白功能区（265-331位氨基酸）和蛋白酪氨酸激酶结构域（610-943位氨基酸）。该样本检出的p.G846D突变位于蛋白酪氨酸激酶结构域，研究报道，该突变导致FLT3蛋白功能增加，表现在培养细胞中IL3非依赖性生长和Stat5磷酸化增加[38049555]。

    在实体瘤中，FLT3变异综合分析显示，大多数是基因突变，其次是基因扩增[23550210]。有研究证明，FLT3的激活突变和内部串联重复突变在血液肿瘤、急性髓系白血病中比较常见[19467916，30181385，32241850]。因此，该样本检出的突变可能与疾病的发生发展相关。
drug_sections:
- gene: TP53
  c_hgvs: c.844C>T
  p_hgvs: p.R282W
  type: benefit
  header: TP53：c.844C>T，p.R282W突变相应靶向药物
  drug_name: AZD1775、AZD1775+奥拉帕利（Olaparib）
  relation: |-
    该样本检出TP53基因c.844C>T，p.R282W错义突变，研究表明，该突变抑制 AMPK 信号传导，导致细胞侵袭性生长，促进小鼠模型中的肿瘤发展[24857548]。AZD1775是一种WEE1激酶抑制剂，可以控制细胞分裂周期的G2检验点，TP53缺失的肿瘤细胞对其敏感[28978051]。目前该药正处于临床期。FDA批准奥拉帕利用于上皮性卵巢癌、输卵管癌、原发性腹膜癌患者、胰腺癌、乳腺癌，以及前列腺癌；NMPA批准奥拉帕利用于卵巢癌以及前列腺癌。
  clinical: |-
    一项临床I期研究评估了AZD1775单药治疗或联合化药治疗难治性实体瘤的安全性、耐受性、药代动力学、药效动力学。该研究分成两部分，第一部分：患者接受单次剂量AZD1775的治疗，随后观察14天；第二部分：患者接受AZD1775联合吉西他滨或顺铂或卡铂的治疗，观察患者的疾病稳定和缓解情况。该研究共招募了202名患者，第一部分包含9名患者，患者接受单次剂量AZD1775的治疗后，耐受良好，未达到最大耐受剂量。接受AZD1775联合化药治疗的患者，常见的不良反应事件包括：疲劳、恶心呕吐、腹泻和血液毒性。最终有176名患者接受了评估，94名（53%）患者疾病稳定，17名（10%）患者得到部分缓解。携带TP53突变的患者组反应率高于TP53野生型的患者组（21% vs. 12%）。该研究表明，AZD1775单药或联合化药在治疗实体瘤中的耐受良好，有潜在的抗肿瘤活性[27601554]。一项由New York University School of Medicine举办的AZD1775联合伊立替康治疗RAS突变或BRAF突变一线治疗失败的转移性结直肠癌的临床I期研究已完成，但数据尚未公布[NCT02906059]。AZD1775联合奥拉帕利用于治疗携带KRAS突变或TP53突变的实体瘤患者或者同时携带KRAS突变和TP53突变的实体瘤患者的临床试验正在开展，不招募患者[NCT02576444]。
- gene: TP53
  c_hgvs: c.844C>T
  p_hgvs: p.R282W
  type: benefit
  header: ''
  drug_name: Alisertib、Alisertib+AZD1775
  relation: |-
    该样本检出TP53基因c.844C>T，p.R282W错义突变，研究表明，该突变抑制 AMPK 信号传导，导致细胞侵袭性生长，促进小鼠模型中的肿瘤发展[24857548]。Alisertib是一种ATP竞争性的极光激酶A（AURKA）抑制剂，通过与AURKA激酶的T288结合而抑制AURKA的磷酸化及活化。临床前研究表明，Alisertib可以诱导细胞停滞在G2/M期，引起胃肠道上部肿瘤细胞的凋亡。同时，Alisertib可以下调肿瘤细胞内的多个致癌信号通路，例如NF-κB、AKT、STAT3。多项研究表明，Alisertib可以使p53和p73活化[25987188]。目前该药正处于临床期。AZD1775是一种WEE1激酶抑制剂，可以控制细胞分裂周期的G2检验点，TP53缺失的肿瘤细胞对其敏感[28978051]。目前该药正处于临床期。
  clinical: |-
    一项Alisertib单药治疗实体瘤患者的临床 I 期研究中，Alisertib显示出初步的抗肿瘤活性，37%的患者疾病稳定，而且在某些实体瘤患者中（结直肠癌、软骨肉瘤、平滑肌肉瘤、脂肪肉瘤）疾病稳定超过6个月，同时治疗相关的不良反应控制的很好[22753585]。体内和体外研究显示，Alisertib单药能够抑制TP53突变的头颈部鳞状细胞癌（HNSCC）细胞系的有丝分裂，导致细胞生长停滞，并且Alisertib联合AZD1775能够产生协同抗肿瘤作用，延长总生存期，是TP53突变的癌症的潜在的治疗方法[30755439]。
- gene: TP53
  c_hgvs: c.844C>T
  p_hgvs: p.R282W
  type: benefit
  header: ''
  drug_name: Eprenetapopt
  relation: |-
    该样本检出TP53基因c.844C>T，p.R282W错义突变，研究表明，该突变抑制 AMPK 信号传导，导致细胞侵袭性生长，促进小鼠模型中的肿瘤发展[24857548]。Eprenetapopt（APR-246）又名PRIMA-1MET，是第一个处于临床阶段的p53突变体激活剂，并能诱导细胞凋亡[26086967]。Eprenetapopt是一种前体药物，被转变为Michael acceptor methylene quinuclidinone （MQ）后与p53 蛋白的丝氨酸结合，重折叠后恢复野生p53蛋白的活性，另外MQ通过抑制 TrxR1 酶的活性和消耗谷胱甘肽来维持胞内的氧化还原平衡，具有双重作用机制。从而 Eprenetapopt 能有效的诱导肿瘤细胞死亡，还能克服对其他抗肿瘤药物的耐药性，对p53失活或突变的患者有效[26870698]。目前该药正处于临床期。
  clinical: |-
    体外研究显示，Eprenetapopt能抑制肿瘤细胞生长。在体内不同的肿瘤类型和模型中，Eprenetapopt能以p53依赖的方式诱导细胞凋亡。Eprenetapopt用于治疗恶性血液肿瘤和前列腺癌患者的研究显示，Eprenetapopt可有效的增强肿瘤细胞的凋亡，细胞周期停滞及上调TP53基因[NCT02098343，22965953]。研究显示，在p53突变的胰腺癌细胞系中，Eprenetapopt可通过重激活p53诱导细胞凋亡，在联合治疗中，Eprenetapopt可增加多种化疗药物对胰腺癌细胞系的抗肿瘤活性[24838627]。有研究表明，Eprenetapopt能够在具有突变型p53的结直肠癌细胞中强烈诱导细胞凋亡。在人类异种移植肿瘤模型中，Eprenetapopt能有效抑制结直肠癌肿瘤的生长[26452133]。一项Ib/II期试验显示，Eprenetapopt联合阿扎胞苷（azacitidine）治疗TP53突变型骨髓增生异常综合征（MDS）和少突细胞急性髓细胞白血病（AML）患者时，耐受性良好，并产生了高临床缓解率和分子缓解率[NCT03072043]。
- gene: KRAS
  c_hgvs: c.34G>A
  p_hgvs: p.G12S
  type: benefit
  header: KRAS：c.34G>A，p.G12S突变相应靶向药物
  drug_name: |-
    曲美替尼（Trametinib）+Navitoclax、帕尼单抗+曲美替尼（Panitumumab+Trametinib）、贝美替尼+哌柏西利（Binimetinib+Palbociclib）、BI 1701963、BI 1701963+曲美替尼（Trametinib）、奈拉替尼+曲美替尼（Neratinib+Trametinib）、福巴替尼+贝美替尼（Futibatinib+Binimetinib）
  relation: |-
    该样本检出KRAS基因c.34G>A，p.G12S错义突变，为已知激活突变，对蛋白功能有重要影响。携带该突变的肿瘤患者可能从RAS/RAF/MEK/ERK信号通路的下游MEK1/2激酶抑制剂获益。曲美替尼是MEK1/2激酶抑制剂，能够靶向抑制RAS/RAF/MEK/ERK信号通路。FDA批准曲美替尼单药用于治疗黑色素瘤，还批准曲美替尼与达拉非尼联合用于治疗黑色素瘤、非小细胞肺癌和间变性甲状腺癌；NMPA批准曲美替尼与达拉非尼联合用于治疗黑色素瘤。贝美替尼（MEK162）是MEK1/2的抑制剂，FDA批准贝美替尼与康奈非尼联合用于治疗BRAF V600E或V600K突变的不可切除或转移性黑色素瘤患者。哌柏西利是一种CDK4/6抑制剂，已获FDA和NMPA批准用于治疗乳腺癌。帕尼单抗是一种靶向结合EGFR胞外结构域的单抗药物，已获FDA批准用于治疗结直肠癌。奈拉替尼是一种细胞内激酶抑制剂，已获FDA和NMPA批准用于治疗乳腺癌。Navitoclax是一种BCL-XL/BCL-2抑制剂，目前正在开展临床试验。BI 1701963是一种泛KRAS抑制剂，目前正在开展临床试验。福巴替尼是一种口服的FGFR抑制剂，已获FDA批准用于治疗携带FGFR2基因融合或其他重排的肝内胆管癌成年患者。
  clinical: |-
    一项由美国国家癌症研究所主办的临床Ⅰb/Ⅱ期试验，旨在研究曲美替尼和Navitoclax用于治疗具有KRAS或NRAS突变的晚期或转移性实体瘤患者，产生的副作用以及最佳剂量。目前该试验正在招募患者[NCT02079740]。帕尼单抗联合曲美替尼用于治疗具有KRAS/NRAS/BRAF突变的IV期结直肠癌患者的II期临床试验，目前该临床试验状态未知[NCT03087071]。体内和体外研究显示，与贝美替尼或哌柏西利单一疗法相比，贝美替尼联合哌柏西利对具有KRAS突变的结直肠癌细胞系和异种移植模型具有显著的疗效[27167191]。一项临床Ⅰ期试验，旨在评估贝美替尼联合mFOLFIRI用于治疗KRAS突变阳性的结直肠癌的最大耐受剂量、反应率、临床获益率以及安全性，目前该试验正在招募患者[NCT02613650]。一项II期临床试验，旨在评估贝美替尼联合哌柏西利用于治疗携带KRAS/NRAS突变的结直肠癌患者有效性，该试验正在开展，不招募患者[NCT03981614]。BI 1701963单药以及BI 1701963与曲美替尼联合用于治疗具有KRAS突变的不同类型的晚期实体瘤的临床Ⅰ期试验正在开展，不招募患者[NCT04111458]。奈拉替尼联合曲美替尼用于治疗携带KRAS突变的晚期或转移性实体瘤患者的疗效、安全性和耐受性的Ⅰ期试验正在招募中[NCT03065387]。福巴替尼联合贝美替尼用于治疗携带KRAS突变的晚期肿瘤患者疗效的Ⅰb/Ⅱ期试验正在招募中[NCT04965818]。
- gene: KRAS
  c_hgvs: c.34G>A
  p_hgvs: p.G12S
  type: benefit
  header: ''
  drug_name: 司美替尼（Selumetinib）、PD0325901、PD0325901+哌柏西利（Palbociclib）
  relation: |-
    该样本检出KRAS基因c.34G>A，p.G12S错义突变，为已知激活突变，对蛋白功能有重要影响。携带该突变的肿瘤患者可能从RAS/RAF/MEK/ERK信号通路的下游MEK1/2激酶抑制剂获益。司美替尼是一种小分子抑制剂，可抑制KRAS/NRAS/BRAF信号通路下游MEK1/2的激酶活性，对携带KRAS/NRAS/BRAF信号通路异常激活的肿瘤特别有效。FDA和NMPA批准司美替尼用于治疗1型神经纤维瘤。哌柏西利是一种CDK4/6抑制剂，已获FDA和NMPA批准用于治疗乳腺癌。PD0325901是MEK1/2的抑制剂，正在开展临床试验。
  clinical: |-
    有实验研究表明，司美替尼对于KRAS突变阳性的直肠癌细胞系生长有明显的抑制作用，而对于KARS野生型的直肠癌细胞系生长无明显的抑制作用[24170544]。在KRAS突变的结直肠癌剂量扩增队列的I期临床试验中，司美替尼最大耐受剂量为75mg p.o.BID联合每周西妥昔单抗250mg/m2，后期400mg/m2 剂量。14 例患者响应，5例患者SD，9例疾病进展[26666244]。一项临床I/II期试验，32位携带KRAS突变的结直肠癌患者接受奥沙利铂和贝伐珠单抗的治疗后接受司美替尼和伊立替康的联合治疗。在临床I期试验中，确定了最佳剂量。有3位患者（9.7%）具有部分应答，16位患者（51.6%）疾病稳定时间≥4周，其中3位超过一年。该临床试验提前终止，即便如此，试验结果中的中位无进展生存期和响应率良好，表明MEK抑制剂与其它靶向药物或细胞毒性药物的联合应用能提高对转移性结直肠癌患者治疗的临床意义[25322874]。
    体外研究显示，具有KRAS突变的细胞系对PD0325901敏感[19401449，21451123]。另有结直肠癌小鼠模型研究显示，NVP-BKM120联合PD-0325901可诱导PIK3CA野生型KRAS突变的肿瘤退缩[24576621]。PD0325901用于实体瘤患者临床Ⅰ期研究显示，在58名可评估的患者中，3名黑色素瘤患者局部缓解，23名患者疾病稳定，包括21名黑色素瘤、2名肺癌[20215549]。一项I/II期临床试验，旨在评估PD0325901联合哌柏西利用于治疗携带KRAS突变的实体瘤的安全性和有效性，该试验正在进行中，不招募患者[NCT02022982]。
