  mutation_analysis: 该突变在COSMIC数据库中记载1次，与大肠癌相关的记录1次。ZRSR2基因编码的蛋白全长为482个氨基酸，主要包含2个ZnF
    C3H1结构域（167-193位、306-332位氨基酸）和1个RRM结构域（199-300位氨基酸）。该样本检出的p.R446Q突变位于上述结构域之外，对蛋白功能的影响未知。
    ZRSR2基因突变见于骨髓增生异常综合征、继发性急性髓性白血病和其他髓性疾病[22389253，25550361，25212276]。个案报告，曾在再生型障碍性贫血和结直肠癌患者中检出该基因的胚系变异[35371815]。但是，目前该样本检出的突变在结直肠癌中的相关研究报道较少，其具体临床意义有待明确。
- gene: AXIN2
  intro: AXIN2是Wnt/β-catenin信号通路的重要调控因子，尤其是在细胞增殖、细胞变异、细胞迁移和细胞凋亡和其他细胞功能方面。已有研究表明，AXIN2基因与结直肠癌、肺癌、乳腺癌等的发展有密切关系。AXIN2在肿瘤发生中的作用主要有三方面：一是AXIN2甲基化和miRNA的调节可造成AXIN2的异常表达（沉默），导致肿瘤发生；二是在WNT通路、泛素依赖蛋白酶体通路和siRNA的调节下，AXIN2通过控制β-catenin降解而参与肿瘤的发生；三是AXIN2的变异可导致蛋白质异常表达和WNT通路的失调，导致肿瘤的发生[25504512]。
- gene: FOXO1
  intro: FOXO1基因是Forkhead转录因子家族FOXO亚族的成员之一，该亚族包括FOXO1、FOXO3、FOXO4和FOXO6四个成员。FOXO1通过调节不同的下游基因表达，在细胞增殖、分化、凋亡及抗氧化等多个方面发挥重要作用。研究表明，上皮细胞通过FOXO1依赖性机制在刺激结缔组织愈合中起关键作用。因此，FOXO1和角质形成细胞可能是重要的治疗目标[28220813]。FOXO1上调可拮抗PI3K/AKT的活性，在多种肿瘤如间皮瘤、胃癌、口腔癌、乳腺癌、前列腺癌等中扮演抑癌基因的角色。miRNA可通过靶向调节FOXO1，进而在肿瘤的发生发展中起作用。
- gene: GLI1
  intro: GLI1（核转录因子）编码的蛋白是锌指蛋白家族成员之一。最初是在人胶质细胞瘤中发现并因此而得名[2105456]。GLI1在胚胎发生发育和组织稳定更新等过程中保持较高活性以发挥至关重要的调控作用。GLI1主要起转录激活作用，是Hedgehog（Hh）信号通路的效应分子，能被该通路所激活。GLI1异常活化时，与肿瘤的增殖分化、细胞凋亡、血管新生、侵袭转移以及预后不良密切相关。已有研究表明，GLI1表达升高促进前列腺癌、胰腺癌、胃癌、口腔鳞状细胞癌等细胞系的增殖[21632555]。
- gene: PIK3C2B
  intro: PIK3C2B基因编码的蛋白属于磷酸肌醇3-激酶（PI3Ks）家族。PI3Ks在细胞增殖、致癌转化、细胞存活、细胞迁移和细胞内蛋白质运输的信号传导途径中发挥作用。PIK3C2B蛋白含有II类PI3K的特征结构域：脂质激酶催化结构域以及C端C2结构域。C2结构域充当介导蛋白质向膜转运的钙依赖性磷脂结合基序，并且还可以介导蛋白质-蛋白质相互作用[NCBI]。PIK3C2B过表达能够恢复ITSN1缺失的神经细胞瘤细胞的生长，与肿瘤发生相关[25622909]。
- gene: PIK3CB
  intro: PIK3CB基因编码PI3Kp110β催化亚基。作为ⅠA型PI3K的一个催化亚单位，PI3Kp110β也通过其磷脂激酶活性广泛参与细胞的生长、增殖、糖代谢和胚胎发育等活动。有研究表明该蛋白在癌症的发生、发展中发挥着主导的角色。敲除该基因可以有效的抑制PTEN缺失所导致的细胞恶性增生，进而抑制前列腺癌的发生和乳腺癌的发展[18594509，18814837]。在皮肤癌、子宫内膜癌和结肠癌等多种癌症中检测到该基因的错义突变、沉默突变、无义突变、移码缺失和移码插入。
- gene: SLCO1B1
  intro: SLCO1B1基因编码的蛋白是有机阴离子转运蛋白家族中肝特异性组件之一，是一种跨膜受体，介导许多钠离子依赖性的内源性化合物（包括胆红素，17-β-葡萄糖醛酸雌二醇和白三烯C4）的摄取，也参与除去药物化合物（如他汀类药物，四溴酚酞磺酸钠和利福平）从血液进入肝细胞。该基因编码蛋白过程中的多态性与转运体功能受损有关[NCBI]。SLCO1B1基因多态性对黄酮类抗肿瘤药的临床用药疗效相关联[21072184]。SLCO1B1*15/15*基因型肺癌患者伊立替康的化疗后表现出严重毒性癌[17898662]。SLCO1B1
    rs4149081，rs11045879 突变型的急性淋巴细胞白血病儿童可以不进行甲氨蝶呤（MTX）治疗来避免其带来的毒副作用[21387541]。
- gene: TGFBR2
  intro: TGFBR2基因编码具有蛋白激酶结构域的跨膜蛋白质，由富含半胱氨酸的胞外区、跨膜区和丝氨酸/苏氨酸结构域的胞内区组成。TGFBR2的胞内区高度保守，有许多自身磷酸化位点，具有自身磷酸化的功能，可以直接与TGF-β结合。该受体/配体复合物调节与细胞增殖、细胞周期停滞、伤口愈合、免疫抑制和肿瘤发生有关的基因的转录。TGFBR2可与TGFBR1结合，形成异二聚复合物TGFBR2基因的突变与Marfan综合征、Loeys-Dietz主动脉瘤综合征以及各种类型肿瘤的发展有关[NCBI]。TGFBR2是TGF-β信号的直接受体,
    TGF-β首先与细胞膜上的TGFBR2结合，以启动下游通路，该受体在调控TGF-β诱导的细胞捕获和凋亡中发挥重要作用。
- gene: XPC
  intro: XPC基因编码的蛋白是核苷酸切除修复途径（NER）中的一种作用蛋白。XPC在全基因组早期核苷酸切除修复，特别是损伤识别、开放复合物的形成、修复蛋白复合物的形成过程中起重要作用。XPC基因或其他NER组件突变导致着色性干皮病的发生，这是一种罕见的常染色体隐性遗传病，多见于幼年时期，表现为对阳光的敏感度增加，并伴随有癌变的发生[NCBI]。
- gene: FGFR1
  c_hgvs: c.1648G>T
  p_hgvs: p.A550S
  intro: FGFR1基因编码的蛋白是成纤维细胞生长因子受体1，该蛋白是一个跨膜的酪氨酸激酶受体，其中细胞外段是与其配体成纤维细胞生长因子FGF结合的区域。当FGF与FGFR1胞外段结合后，FGFR1构象发生改变，其胞内段发生自身磷酸化，导致PI3K/AKT、RAS/RAF/MAPK、STAT等多条信号通路的活化。正常情况下，FGFR1的生物学作用主要表现在胚胎发育、骨骼形成、血管生成、神经再生等生长发育方面；当发生功能紊乱时，其与多种恶性肿瘤的发生发展密切相关。
  mutation_analysis: 'FGFR1基因编码的蛋白全长为853个氨基酸，主要包含3个IGc2结构域（46-108位、169-237位和268-348位氨基酸）以及酪氨酸激酶催化结构域（478-754位氨基酸）。该样本检出的p.A550S错义突变位于酪氨酸激酶催化结构域，可能会对蛋白激酶功能及下游信号通路产生影响。

    有研究发现，FGFR1高表达的结直肠癌患者无进展生存率低于FGFR1低表达患者，ddPCR检测的FGFR1扩增可作为结直肠癌患者临床预后不良的预后指标。但是，目前尚未见该样本检出的FGFR1
    p.A550S突变在结直肠癌中的明确临床证据，其具体临床意义有待进一步明确。'
- gene: PCLO
  c_hgvs: c.11722C>A
