- gene: MDM2
  intro: MDM2基因编码的蛋白是一种核定位E3泛素连接酶。该基因是一个癌基因，在人的各种组织中有广泛的表达，提示其参与细胞的基本生理过程[1614537]。在膀胱癌、宫颈癌、软组织肉瘤等多种肿瘤中都发现有该基因的表达和（或）扩增，因此该基因的扩增与肿瘤生长、转移有密切关系。MDM2是p53调控网络中的下游靶基因，其作为p53的重要调节因子，参与细胞的生长抑制、细胞周期的调控和细胞的凋亡过程。另外它具有降解p53及泛素化的功能，不仅与胚胎发育及组织分化有关，而且参与肿瘤的发生、发展和转移[11940214]。另外，MDM2作为G蛋白偶联受体介导的细胞外信号分子，也有调节细胞循环周期和细胞凋亡的功能。在癌症例如子宫内膜癌，肠癌和胃癌中观察到错义突变，沉默突变，移码缺失和整码缺失。
