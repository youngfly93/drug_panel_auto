  type: benefit
  header: ''
  drug_name: Defactinib+Avutometinib、依维莫司（Everolimus）+Avutometinib、RMC-6236
  relation: |-
    该样本检出KRAS基因c.34G>A，p.G12S错义突变，为已知激活突变，对蛋白功能有重要影响。携带该突变的肿瘤患者可能从RAS/RAF/MEK/ERK信号通路的下游MEK1/2激酶抑制剂获益。Defactinib是一种FAK抑制剂，Avutometinib又称RO5126766，是一种新型MEK-pan-RAF抑制剂，FDA加速批准了Avutometinib联合Defactinib用于治疗既往接受过系统治疗的KRAS突变的复发性低级别浆液性卵巢癌（LGSOC）成人患者。FDA已批准依维莫司用于治疗肾细胞癌、乳腺癌等，同时NMPA批准用于治疗肾细胞癌、室管膜下巨细胞型星形细胞瘤。RMC-6236是一种泛KRAS抑制剂，目前处于临床期。
  clinical: |-
    一项Defactinib联合Avutometinib用于治疗携带KRAS基因突变在晚期实体瘤患者中疗效的I期临床试验正在招募中[NCT03875820]。一项Avutometinib（VS-6766）联合Defactinib用于治疗KRAS突变复发性低级别浆液性卵巢癌（LGSOC）成人患者的II期临床试验正在进行中[NCT04625270]。一项依维莫司联合Avutometinib用于治疗携带KRAS基因突变的在实体瘤或多发性骨髓瘤患者的I期临床试验正在招募患者[NCT02407509]。一项RMC-6236用于治疗携带RAS突变（KRAS、NRAS或HRAS在G12、G13或Q61处的任何非同义突变）的晚期实体瘤的多中心、开放标签、I/Ib期临床试验正在招募患者[NCT05379985]。
