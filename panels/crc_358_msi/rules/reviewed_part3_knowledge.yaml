  intro: HIF1A基因编码的蛋白是转录因子缺氧诱导因子1（HIF-1）的α亚基，HIF-1是由1个α亚基和1个β亚基组成的异源二聚体。HIF-1通过激活许多基因的转录起到细胞和系统稳态效应主要调节因子的作用，这些基因包括参与到能量代谢、血管再生、细胞凋亡等过程的基因，也包括增强氧运输或协助缺氧代谢适应的基因。HIF-1因此在胚胎血管生成、肿瘤血管生成和缺血性疾病的病理生理学中发挥必要的作用[NCBI]。HIF-1过表达通过其在起始血管增生和调控细胞克服缺氧状态的功能提高肿瘤生长和代谢[12627523]。在大多数已研究过的实体肿瘤中均可检测到HIF-1的大量表达，包括结肠、乳腺、胰腺、肾脏、前列腺、卵巢、大脑和膀胱的肿瘤[10934146，10582706]。
