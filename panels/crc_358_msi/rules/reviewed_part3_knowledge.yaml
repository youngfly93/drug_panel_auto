  intro: FLT3（Fms样酪氨酸激酶-3）基因编码的蛋白是调节造血功能的第III类酪氨酸激酶受体，能够激活造血干细胞的增殖和分化途径[27906677]。受体激酶的活化能磷酸化和激活多种细胞过程（细胞凋亡、增殖和骨髓中造血干细胞的分化）的细胞质效应分子。FLT3基因突变导致受体组成性激活，从而导致急性髓性白血病和急性淋巴细胞白血病[NCBI]。在具有FLT3激活突变的癌细胞中，FLT3抑制剂或酪氨酸激酶抑制剂已被证明是有效的[19318574，12124170]。与FLT3相关的信号通路有GPCR和癌症中的信号通路[GeneCards]。
  mutation_analysis: 'FLT3基因编码的蛋白全长为993个氨基酸，主要包含免疫球蛋白功能区（265-331位氨基酸）和蛋白酪氨酸激酶结构域（610-943位氨基酸）。该样本检出的p.G846D突变位于蛋白酪氨酸激酶结构域，研究报道，该突变导致FLT3蛋白功能增加，表现在培养细胞中IL3非依赖性生长和Stat5磷酸化增加[38049555]。


    在实体瘤中，FLT3变异综合分析显示，大多数是基因突变，其次是基因扩增[23550210]。有研究证明，FLT3的激活突变和内部串联重复突变在血液肿瘤、急性髓系白血病中比较常见[19467916，30181385，32241850]。因此，该样本检出的突变可能与疾病的发生发展相关。'
- gene: DNMT3A
  intro: DNMT3A （DNA胞嘧啶-5-甲基转移酶3α）基因编码参与表观遗传学基因调控的蛋白质。DNMT3A在成人组织中普遍表达，并且在某些肿瘤中高表达。有研究发现在正常核型的急性髓系白血病中DNMT3A基因存在一定比例的突变，并可能成为一种独立的预后不良因素。DNMT3A基因在血液恶性肿瘤（例如：急性骨髓性白血病、骨髓增生异常综合征）中发生突变的频率最高，但在其它癌症（包括肺癌）中也发现该基因的突变。
  mutation_analysis: DNMT3A变异可能影响DNA甲基化状态和表观遗传调控，从而参与肿瘤发生发展。既往研究提示部分DNMT3A突变与免疫治疗超进展风险相关，因此该样本检出的DNMT3A变异可能与疾病发生发展及用药评估相关，具体意义需结合变异类型和临床背景判断。
- gene: TSC1
  intro: TSC1基因是一种肿瘤抑制基因，位于PI3K-AKT-mTOR信号通路，其编码的TSC蛋白能够刺激特异性的GTP酶，形成的TSC1/TSC2复合物可以抑制mTOR的刺激蛋白，因而起到肿瘤抑制的作用，在调节细胞生长和增殖的信号通路中被认为起核心作用。在结节性硬化症患者中的研究表明，抑癌基因TSC1或TSC2的突变将导致PI3K/PTEN-AKT-mTOR信号通路的异常，进而影响机体细胞的正常生命活动，导致疾病的发生。TSC1基因突变也在膀胱癌、乳腺癌等多种癌症中发现[19789314，20658316]。
  mutation_analysis: TSC1功能缺失可能导致mTOR信号通路异常激活，并在多种肿瘤中被报道。该基因变异可能与疾病发生发展及mTOR通路相关用药评估有关，具体临床意义需结合变异类型、证据等级和癌种背景综合判断。
- gene: EGFR
  intro: EGFR是人表皮生长因子受体，属于受体酪氨酸激酶家族成员。EGFR主要位于细胞膜表面，通过与配体的结合激活自身酪氨酸磷酸化，自磷酸化引发下游信号传导，包括MAPK、PI3K和JNK通路等从而诱导细胞增殖、分化等。在许多实体肿瘤中存在EGFR的突变或异常表达。临床研究表明，EGFR突变阳性（18号外显子突变、19号外显子缺失、21号外显子突变）的患者对EGFR-TKIs敏感[24743704]，而野生型患者基本无效[23883922]；20号外显子的突变（T790M为主、插入突变）则与EGFR-TKIs继发性耐药相关[22263058]。
- gene: FGFR1
  intro: FGFR1基因编码的蛋白是成纤维细胞生长因子受体1，该蛋白是一个跨膜的酪氨酸激酶受体，其中细胞外段是与其配体成纤维细胞生长因子FGF结合的区域。当FGF与FGFR1胞外段结合后，FGFR1构象发生改变，其胞内段发生自身磷酸化，导致PI3K/AKt、RAS/RAF/MAPK、STAT等多条信号通路的活化[20094046]。正常情况下，FGFR1的生物学作用主要表现在胚胎发育、骨骼形成、血管生成、神经再生等生长发育方面，而在发生功能紊乱的情况下，其与多种恶性肿瘤的发生发展有着密切关系。导致FGFR1信号通路失调的常见原因是点突变和基因扩增[2864648，22684217，21666749，22179561]。
- gene: APC
  intro: APC基因能够编码肿瘤抑制蛋白，并在经典WNT信号通路中起拮抗作用，APC作为β-链蛋白（β-catenin）信号传导的负调节因子，与β-链蛋白的稳定性密切相关。β-链蛋白参与E-钙粘蛋白细胞粘附系统和WNT信号传导途径[10959075]。APC基因突变导致其不能有效地与β-catenin、GSK-3β和Axin结合而形成复合物，失去了调节表达水平的能力，信号通路下游相关基因转录激活，从而导致细胞增殖异常和肿瘤的发生。研究显示，APC突变在胰腺癌、胃癌中也频繁发生，可能与其疾病的发生发展相关[1338691，12378616，1423316]。对APC的功能研究还发现APC通过其基本结构域与微管细胞骨架结合，参与细胞迁移过程。有助于微管网络的组装和重组，这与细胞分裂密切相关。APC可以间接调节肌动蛋白丝网络的组织，并因此影响细胞形态、极性和迁移[8033082，8698812]。APC-hDLG复合物形成在APC细胞周期阻断信号转导中起重要作用[10656683]。
  mutation_analysis: 'APC基因编码的蛋白全长为2843个氨基酸，主要包含2个卷曲螺旋结构域（2-59位、1869-1893位氨基酸）、1个Suppressor_APC结构域（126-208位氨基酸）、6个ARM结构域（340-392位、459-510位、512-553位、556-597位、599-644位和649-689位氨基酸）、1个Armadillo/beta-catenin-like
    repeat结构域（691-731位氨基酸）、4个APC_15aa结构域、7个APC_crr结构域、3个SAMP结构域、1个APC基础结构域（2223-2579位氨基酸）以及1个EB-1结合结构域（2670-2843位氨基酸）。

    APC作为看家基因，参与DNA修复，它的突变会导致DNA修复减缓，增加周边其它细胞突变的风险，从而促进癌症的进展[24200292]。有研究表明，结直肠癌患者存在APC基因缺失，从而导致WNT信号通路失调和C-Myc的反式激活，是潜在的治疗靶点[18593890]。'
- gene: ARID1A
  intro: ARID1A基因编码的蛋白质是ATP-依赖性染色质重塑复合物SNF/SWI的一部分，属于SWI/SNF家族的成员。该家族成员具有解旋酶和ATP酶活性，通常是受染色质抑制的基因的转录激活所必需的。ARID1A基因编码的蛋白质对SNF/SWI复合物具有特异性，并且可以通过蛋白质-DNA或蛋白质-蛋白质相互作用将复合物募集到其靶标。对成骨细胞细胞系的研究显示，含有ARID1A和ARID1B的SWI/SNF复合物具有相反的作用，前者引起细胞周期停滞，而后者似乎参与细胞周期进程。ARID1A的缺失可能会影响其他SWI/SNF亚基的表达或稳定性[GeneCards]。
  mutation_analysis: 'ARID1A基因编码的蛋白全长为2285个氨基酸，主要包含内部重复序列1结构域（713-786位氨基酸）、内部重复2结构域（876-977和1165-1275位氨基酸）、内部重复3结构域（1272-1354和1448-1523位氨基酸）、BRIGHT结构域（1018-1109位氨基酸）和DUF3518结构域（1975-2231位氨基酸）。

    有研究表明，ARID1A基因表达缺失发生于胃癌、肝细胞癌、乳腺癌、胰腺癌、肺癌、结直肠癌等多种癌症中，其与错配修复缺陷以及与体细胞超甲基化相关的临床病理学特征显著相关[24925223]。另有研究报道，ARID1A基因无义突变会导致DNA双链断裂的检查点激活和修复受损[26069190]。'
