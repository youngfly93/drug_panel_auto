  intro: EGFR是人表皮生长因子受体，属于受体酪氨酸激酶家族成员。EGFR主要位于细胞膜表面，通过与配体的结合激活自身酪氨酸磷酸化，自磷酸化引发下游信号传导，包括MAPK、PI3K和JNK通路等从而诱导细胞增殖、分化等。在许多实体肿瘤中存在EGFR的突变或异常表达。临床研究表明，EGFR突变阳性（18号外显子突变、19号外显子缺失、21号外显子突变）的患者对EGFR-TKIs敏感，而野生型患者基本无效；20号外显子的突变（T790M为主、插入突变）则与EGFR-TKIs继发性耐药相关。
  mutation_analysis: '该突变在COSMIC数据库中记载4次，与大肠癌相关的记录0次。EGFR基因编码的蛋白全长为1210个氨基酸，主要包含2个受体L结构域（57-168位和361-481位氨基酸）、3个FU结构域（228-270位、496-547位和552-601位氨基酸）以及1个酪氨酸激酶结构域（712-968位氨基酸）。该样本检出的p.G796D错义突变位于酪氨酸激酶结构域，研究发现，该突变可能具有激活和致癌作用，表现为中度非依赖因子性生长。

    有研究表明，EGFR在许多类型的恶性肿瘤（包括头颈癌、结直肠癌、非小细胞肺癌等）的肿瘤进展和治疗过程中起重要作用，并且在众多恶性肿瘤中频繁存在EGFR的过度表达或上调。在非小细胞肺癌患者中曾检出该突变，该患者对奥希替尼治疗有反应，但随后病情恶化。因此，该样本检出的突变可能与疾病的发生发展及用药相关。'
- gene: TSC1
  c_hgvs: c.1963C>T
