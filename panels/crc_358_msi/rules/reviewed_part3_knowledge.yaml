schema_version: 1
source:
  panel: crc_358_msi
  purpose: Reviewed Part 3 knowledge overlays for CRC358+MSI reports. Match by gene
    + c_hgvs + p_hgvs; no patient identity, sample ID, date, or report-specific branching
    is used.
  scope: variant_level_reviewed_knowledge
  source_type: lab_reviewed_final_report_text
gene_sections:
- gene: BAP1
  intro: BAP1基因编码泛素羧基端水解酶，参与蛋白去泛素化调控。BAP1可与BRCA1相关复合物相互作用，参与DNA损伤应答、染色质调控、细胞周期和细胞生长调节等过程，具有肿瘤抑制基因特征。BAP1胚系或体细胞异常在多种肿瘤中被报道。
  mutation_analysis: BAP1蛋白参与同源重组相关DNA修复和染色质稳态维持。BAP1功能受损可能导致DNA修复能力下降和基因组不稳定，从而参与肿瘤发生发展。该基因变异的具体临床意义需结合变异类型、结构域位置、证据等级及癌种背景综合判断。
- gene: MLH3
  intro: MLH3基因编码DNA错配修复相关蛋白，属于MutL家族成员，参与DNA错配修复和减数分裂重组过程。MLH3可与其他错配修复蛋白形成复合物，共同维持基因组稳定性；其胚系异常与遗传性结直肠癌风险相关，体细胞异常也可见于多种肿瘤。
  mutation_analysis: MLH3功能异常可能影响DNA错配修复能力，进而造成微卫星不稳定或突变负荷改变。错配修复相关基因异常在结直肠癌发生发展、遗传风险评估和免疫治疗疗效判断中具有重要意义。因此，该样本检出的MLH3变异可能与疾病的发生发展及治疗评估相关。
- gene: FANCA
  intro: FANCA基因是范可尼贫血互补组成员之一，参与DNA链间交联损伤修复和同源重组修复通路。FANCA功能缺失可造成染色体不稳定和DNA修复缺陷，是范可尼贫血相关基因中较常见的致病基因之一，也可在多种实体瘤中检出体细胞变异。
  mutation_analysis: FANCA异常可能导致DNA损伤修复缺陷与基因组不稳定，并可能影响DNA损伤修复相关治疗策略的评估。该基因变异在肿瘤发生发展及DDR通路相关用药判断中具有潜在意义，具体临床价值需结合变异证据等级和肿瘤类型综合判断。
- gene: PALB2
  intro: PALB2基因编码BRCA2结合蛋白，参与BRCA2在DNA损伤修复位点的定位与稳定，并协助完成DNA双链断裂的同源重组修复。PALB2也是肿瘤易感相关基因，其功能异常可影响同源重组修复能力。
  mutation_analysis: PALB2功能缺失可能导致同源重组修复缺陷，并与PARP抑制剂等DNA损伤修复相关治疗策略的评估有关。该基因变异可能与疾病的发生发展及用药评估相关，仍需结合变异类型、证据等级和癌种背景进行判断。
- gene: FANCD2
  intro: FANCD2基因编码范可尼贫血互补组D2蛋白，是范可尼贫血DNA修复通路中的关键成员。FANCD2参与DNA链间交联损伤修复、复制叉稳定和染色质结构维护，与基因组稳定性密切相关。
  mutation_analysis: FANCD2异常可能造成DNA损伤修复能力下降和基因组不稳定。该通路异常在肿瘤发生发展及DNA损伤修复相关治疗评估中具有潜在意义，具体临床意义需结合变异类型和证据等级综合判断。
- gene: RAD50
  intro: RAD50基因编码MRN复合物的重要组成蛋白，MRN复合物由MRE11、RAD50和NBN组成，参与DNA双链断裂识别、损伤信号传导和同源重组修复。RAD50功能异常可影响DNA损伤修复效率和基因组稳定性。
  mutation_analysis: RAD50变异可能影响MRN复合物功能，导致DNA双链断裂修复缺陷。该基因异常在肿瘤发生发展、DNA损伤修复通路评估及相关治疗策略判断中具有潜在意义，具体临床价值需结合变异证据综合判断。
- gene: NOTCH1
  intro: NOTCH1基因编码Notch受体家族成员，参与细胞分化、增殖、凋亡和组织发育调控。NOTCH信号通路异常可见于多种肿瘤，不同癌种中NOTCH1可能表现为促癌或抑癌作用。
  mutation_analysis: NOTCH1变异可能影响Notch信号通路活性，从而参与肿瘤细胞增殖、分化和微环境调控。该样本检出的NOTCH1变异可能与疾病发生发展相关，但具体临床意义需结合变异类型、功能证据和癌种背景综合判断。
- gene: SDHB
  intro: SDHB基因编码琥珀酸脱氢酶复合体B亚基，是线粒体复合体II的重要组成部分，参与三羧酸循环和氧化磷酸化过程。SDH复合体功能异常可导致代谢重编程、假性缺氧信号激活和肿瘤易感性增加。
  mutation_analysis: SDHB功能缺失可能影响细胞能量代谢和缺氧相关信号通路，进而参与肿瘤发生发展。该基因变异的临床意义与变异类型、是否导致功能缺失以及肿瘤类型密切相关，需结合遗传背景和临床资料进一步评估。
- gene: POLE
  intro: POLE基因编码DNA聚合酶ε的催化亚基，参与DNA复制和复制过程中碱基错误校正。POLE外切酶结构域异常可造成超突变表型，并在子宫内膜癌、结直肠癌等肿瘤中具有分子分型和预后评估意义。
  mutation_analysis: POLE变异可能影响DNA复制保真性和肿瘤突变负荷。若变异涉及外切酶结构域并具有功能证据，可能与高突变负荷、免疫治疗获益和预后评估相关；其他区域变异的临床意义需结合位点、结构域和证据等级综合判断。
- gene: DNMT3A
  intro: DNMT3A（DNA胞嘧啶-5-甲基转移酶3α）基因编码参与表观遗传学基因调控的蛋白质。DNMT3A在成人组织中普遍表达，并且在某些肿瘤中高表达。DNMT3A在血液恶性肿瘤中突变频率较高，在实体瘤中也可见该基因异常。
  mutation_analysis: DNMT3A变异可能影响DNA甲基化状态和表观遗传调控，从而参与肿瘤发生发展。既往研究提示部分DNMT3A突变与免疫治疗超进展风险相关，因此该样本检出的DNMT3A变异可能与疾病发生发展及用药评估相关，具体意义需结合变异类型和临床背景判断。
- gene: HRAS
  intro: HRAS基因属于RAS原癌基因家族，编码小GTP酶蛋白，参与RAS/RAF/MEK/ERK和PI3K/AKT等下游信号通路调控。RAS家族基因异常可导致信号持续激活，促进细胞增殖和肿瘤发生发展。
  mutation_analysis: HRAS激活性变异可能导致下游MAPK和PI3K通路持续活化。该基因变异可在多种肿瘤中检出，并可能影响靶向治疗策略评估；具体临床意义需结合变异位点是否为已知激活热点及癌种背景综合判断。
- gene: IDH1
  intro: IDH1基因编码异柠檬酸脱氢酶1，主要位于细胞质和过氧化物酶体，参与三羧酸循环相关代谢过程。IDH1热点突变可导致2-羟基戊二酸积累，影响表观遗传调控和细胞分化。
  mutation_analysis: IDH1突变在胶质瘤、胆管癌、急性髓系白血病等肿瘤中具有明确分子诊断和治疗意义，在结直肠癌中相对少见。该样本检出的IDH1变异可能与肿瘤代谢重编程相关，具体临床意义需结合位点证据和癌种背景综合判断。
- gene: MAP2K1
  intro: MAP2K1基因编码MEK1蛋白，是RAS/RAF/MEK/ERK信号通路中的关键激酶。MAP2K1可被RAF激活并进一步磷酸化ERK，调控细胞增殖、分化和存活。
  mutation_analysis: MAP2K1激活性变异可能导致MAPK信号通路异常活化，并影响MEK抑制剂或上游EGFR/RAS/RAF通路相关治疗策略评估。该基因变异的临床意义需结合具体位点、功能证据和癌种背景判断。
- gene: JAK1
  intro: JAK1基因编码Janus激酶家族成员，参与细胞因子受体介导的JAK/STAT信号转导。该通路与免疫调控、细胞增殖和炎症反应密切相关。
  mutation_analysis: JAK1功能异常可能影响干扰素信号、抗原呈递和肿瘤免疫微环境。部分JAK1失活变异与免疫检查点抑制剂耐药机制相关，因此该基因变异在免疫治疗疗效评估中具有潜在意义，具体判断需结合变异类型和功能证据。
- gene: JAK2
  intro: JAK2基因编码Janus激酶2，是JAK/STAT信号通路的重要成员，参与造血、生长因子和细胞因子信号传递。JAK2异常激活在髓系肿瘤中较常见，也可在实体瘤中作为免疫和增殖信号相关变异被关注。
  mutation_analysis: JAK2变异可能影响JAK/STAT通路活性，并与细胞增殖、炎症反应和免疫调控相关。该基因变异的临床意义需结合变异位点、是否造成功能获得或缺失以及癌种背景综合判断。
- gene: VHL
  intro: VHL基因编码von Hippel-Lindau肿瘤抑制蛋白，参与HIF转录因子的降解调控和缺氧信号通路稳态维持。VHL功能缺失可导致HIF通路异常激活，并与肾透明细胞癌等肿瘤发生密切相关。
  mutation_analysis: VHL变异可能影响缺氧诱导因子降解和血管生成相关信号通路，从而参与肿瘤发生发展。该基因在结直肠癌中的直接临床意义需结合变异类型、功能证据和癌种背景进一步评估。
- gene: STK11
  intro: STK11又名LKB1，编码丝氨酸/苏氨酸激酶，是AMPK/mTOR等信号通路中的重要肿瘤抑制基因。STK11胚系突变与Peutz-Jeghers综合征相关，该综合征可增加胃肠道肿瘤风险。
  mutation_analysis: STK11功能缺失可能影响能量代谢、细胞极性和mTOR通路调控，并可与肿瘤免疫微环境改变相关。STK11变异在结直肠癌中相对少见，其具体临床意义需结合变异类型、是否功能缺失及共突变背景综合判断。
- gene: PTCH1
  intro: PTCH1基因编码Hedgehog信号通路中的关键跨膜受体，是该通路的重要负调控因子。PTCH1功能缺失可导致SMO及下游Hedgehog信号异常活化，并与多种肿瘤发生相关。
  mutation_analysis: PTCH1变异可能影响Hedgehog信号通路调控，从而参与肿瘤细胞增殖和分化过程。该基因变异可能与疾病发生发展及Hedgehog通路相关用药评估有关，具体临床价值需结合变异证据和癌种背景判断。
- gene: RNF43
  intro: RNF43基因编码E3泛素连接酶，是Wnt信号通路的负调控因子。RNF43可促进Wnt受体相关蛋白降解，从而抑制Wnt信号活化；其功能缺失可导致Wnt通路异常激活。
  mutation_analysis: RNF43失活变异可能造成Wnt信号通路增强，并在结直肠癌等消化道肿瘤中具有潜在分子分型和治疗评估意义。该基因变异的具体临床意义需结合变异类型、微卫星状态和其他通路改变综合判断。
- gene: BARD1
  intro: BARD1基因编码BRCA1相关RING结构域蛋白，可与BRCA1形成复合物，参与DNA双链断裂修复、同源重组和细胞周期调控。BARD1异常可能影响BRCA1相关DNA修复功能。
  mutation_analysis: BARD1功能异常可能导致同源重组修复缺陷和基因组不稳定，并与DNA损伤修复相关治疗策略评估有关。该基因变异可能与疾病发生发展及用药评估相关，需结合变异类型和证据等级判断。
- gene: RAD51C
  intro: RAD51C基因编码RAD51家族成员，参与同源重组修复过程。RAD51C可与RAD51家族其他蛋白形成复合物，促进DNA双链断裂修复并维持基因组稳定性。
  mutation_analysis: RAD51C功能缺失可能导致同源重组修复缺陷，并可能影响PARP抑制剂等DNA损伤修复相关治疗策略评估。该基因变异的临床意义需结合变异类型、功能证据和癌种背景综合判断。
- gene: TSC2
  intro: TSC2基因编码Tuberin蛋白，可与TSC1编码的Hamartin形成复合物，共同抑制mTOR信号通路活化。TSC1/TSC2复合物是PI3K/AKT/mTOR通路中的重要抑癌调控节点。
  mutation_analysis: TSC2功能缺失可能导致mTOR通路异常激活，从而参与细胞生长、增殖和代谢调控异常。该基因变异可能与疾病发生发展及mTOR通路相关用药评估有关，具体临床意义需结合变异证据判断。
- gene: FANCM
  intro: FANCM基因编码范可尼贫血通路相关多功能蛋白，参与DNA损伤识别、复制叉稳定和DNA链间交联损伤修复。FANCM与FAAP24等蛋白共同作用，维持DNA修复通路正常运行。
  mutation_analysis: FANCM功能异常可能导致DNA损伤修复缺陷和基因组不稳定，并可能影响PARP抑制剂等DNA损伤修复相关治疗策略评估。该基因变异的具体临床意义需结合变异类型和癌种背景判断。
- gene: TSC1
  intro: TSC1基因编码Hamartin蛋白，是PI3K/AKT/mTOR信号通路中的重要抑癌基因。TSC1与TSC2形成蛋白复合物后可抑制mTOR通路活化，从而参与细胞生长、增殖和代谢调控。
  mutation_analysis: TSC1功能缺失可能导致mTOR信号通路异常激活，并在多种肿瘤中被报道。该基因变异可能与疾病发生发展及mTOR通路相关用药评估有关，具体临床意义需结合变异类型、证据等级和癌种背景综合判断。
- gene: FGFR2
  intro: FGFR2基因编码成纤维细胞生长因子受体2，属于受体酪氨酸激酶家族。FGFR2通过结合FGF配体激活下游RAS/MAPK、PI3K/AKT等信号通路，参与细胞增殖、分化、迁移和血管生成。
  mutation_analysis: FGFR2异常激活、融合、扩增或特定位点突变可见于多种肿瘤，并可能影响FGFR抑制剂相关治疗策略评估。该样本检出的FGFR2变异需结合具体位点功能证据和癌种背景判断其临床意义。
- gene: PBRM1
  intro: PBRM1基因编码SWI/SNF染色质重塑复合物的PBAF亚基，参与染色质结构调控和基因转录调节。PBRM1属于肿瘤抑制相关基因，在肾透明细胞癌等肿瘤中较常发生异常。
  mutation_analysis: PBRM1功能异常可能影响染色质重塑、DNA损伤应答和肿瘤免疫微环境。该基因变异在部分肿瘤中与免疫治疗反应和预后评估相关，但在结直肠癌中的具体临床意义需结合证据等级和癌种背景判断。
- gene: WRN
  intro: WRN基因编码RecQ家族DNA解旋酶，参与DNA复制、转录、重组和修复等多种核酸代谢过程。WRN功能缺失可导致Werner综合征，并与基因组不稳定和肿瘤易感性相关。
  mutation_analysis: WRN异常可能影响DNA修复和复制压力应答。WRN在结直肠癌细胞系和原发性结直肠癌中的表达及功能改变已有研究关注，该基因变异的具体临床意义需结合变异类型、功能证据和癌种背景综合判断。
- gene: BRIP1
  intro: BRIP1又名FANCJ，编码与BRCA1相互作用的DNA解旋酶，参与DNA双链断裂修复和范可尼贫血通路。BRIP1是DNA损伤修复过程的重要成员，也与部分肿瘤易感性相关。
  mutation_analysis: BRIP1功能异常可能导致同源重组修复缺陷和DNA损伤修复能力下降，并可能影响DNA损伤修复相关治疗策略评估。该基因变异可能与疾病发生发展及用药评估相关，具体意义需结合变异证据判断。
- gene: RAD51D
  intro: RAD51D基因编码RAD51蛋白家族成员，参与同源重组修复过程。RAD51D可与RAD51家族其他成员形成复合物，促进DNA双链断裂修复并维持基因组稳定性。
  mutation_analysis: RAD51D功能缺失可能导致同源重组修复缺陷，并可能影响PARP抑制剂等DNA损伤修复相关治疗策略评估。该基因变异的临床意义需结合变异类型、功能证据和癌种背景综合判断。
- gene: TP53
  c_hgvs: c.844C>T
  p_hgvs: p.R282W
  intro: TP53基因是重要的抑癌基因之一，其编码蛋白为p53，大约有一半人类肿瘤呈现出TP53的失活突变，其余的恶性肿瘤中通过活化p53抑制因子、降低p53活化因子，使p53信号通路失活。p53通过其在细胞核中转录依赖和胞浆中转录不依赖两种途径发挥抑癌作用。p53作为转录因子可靶向结合特定的DNA序列，使与细胞周期停滞、凋亡、细胞代谢改变等功能相关的基因转录活化。除了细胞核内的活性，p53在胞浆中表现出转录非依赖的生物活性，研究表明细胞质中p53的活化有促进细胞凋亡的作用[19407794]。其作用机制为：DNA受损时，p53蛋白活化DNA修复蛋白并阻滞细胞生长周期的进行[22872685]。当细胞DNA受损严重不能修复时，p53蛋白与特定DNA结合，激活WAF1/CIP1等多种基因，启动细胞凋亡程序，抑制细胞分裂，从而避免携带异常遗传信息的细胞继续生长、分裂[21728981]。
  mutation_analysis: 'TP53基因编码的蛋白p53全长393个氨基酸，包含3个结构域：反式激活结构域（5-29位氨基酸）、DNA结合结构域（95-289位氨基酸）和四聚化结构域（318-359位氨基酸）。根据报道TP53突变主要发生在175、245、248、273和282这五个热点突变密码子区[19810096，10612830，12619105]，而TP53基因的K132、C135、P151、V157、R158、Y163、V173、C176、H179、H193、Y205、Y220、Y234、M237、C238、S241、C242、M246、R249、G266、P278、R280、D281和E285也是较为常见的突变密码子区[19336573]。这些位点均处于p53蛋白的DNA结合结构域，均可能会对蛋白功能产生影响。该样本检出的p.R282W
    突变位于DNA结合结构域，研究表明，该突变抑制 AMPK 信号传导，导致细胞侵袭性生长，促进小鼠模型中的肿瘤发展[24857548]。

    一项研究在389名Ⅲ期结肠癌患者中检测TP53的突变状态，结果表明TP53的突变频率为33%[26425688]。在一项包含276个结直肠癌样本的分子突变分析研究中，发现165个非高频突变的结直肠癌样本中有59%检测到TP53突变，导致TP53信号通路失活[22810696]，说明TP53在结直肠癌的发生发展中具有重要作用。因此，该样本检出的突变可能与疾病的发生发展相关。'
- gene: KRAS
  c_hgvs: c.34G>A
  p_hgvs: p.G12S
  intro: KRAS基因是致癌基因，属于RAS基因家族成员，编码P21蛋白。该蛋白在MAPK信号通路中起作用，能够与GDP/GTP结合并促进GTP酶活性。当KRAS基因发生突变时不能被水解酶水解失活，而处于持续激活状态，引起RAF/MAPK的上调，传递多种生存通路信号，从而使细胞过度生长、增殖，抵抗EGFR-TKIs的作用。KRAS突变可以导致肺癌、黏蛋白腺瘤、胰腺导管癌和结肠癌等多种恶性肿瘤。KRAS基因被激活最常见的方式是点突变，多发生在N端的第12、13、61和146密码子，其中以第12密码子突变最常见。不同突变位点对P21蛋白的活化机制不同，第12密码子突变可以减弱P21内在的GTP酶活性，并使细胞凋亡减少，细胞间接触抑制减弱。RAS家族基因在癌症中没有可用的药物直接拮抗靶点，主要影响信号通路上下游靶点药物的使用效果，突变主要导致EGFR靶药和BRAF靶药的耐药性。
  mutation_analysis: 'KRAS基因编码的蛋白全长为189个氨基酸，主要包含RAS结构域（1-166位氨基酸）。该样本检出的p.G12S突变位于上述结构域之内，为已知激活突变，对蛋白功能有重要影响。

    KRAS突变在人体肿瘤发生过程中起着重要的作用，并在胰腺癌、甲状腺癌、结直肠癌和肺癌中普遍存在[23066310]。研究显示，大约有35%-45%的结直肠癌患者携带原癌基因KRAS的突变。常见的KRAS突变多发生在N端第12、13、61和第146号密码子。这些突变会导致KRAS蛋白处于激活状态，并激活下游的信号通路，且已被证实是anti-EGFR抗体药物（如西妥昔单抗、帕尼单抗）耐药的标志[20100961]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。'
- gene: APC
  c_hgvs: c.4348C>T
  p_hgvs: p.R1450*
  intro: APC基因能够编码肿瘤抑制蛋白，并在经典WNT信号通路中起拮抗作用，APC作为β-链蛋白（β-catenin）信号传导的负调节因子，与β-链蛋白的稳定性密切相关。β-链蛋白参与E-钙粘蛋白细胞粘附系统和Wnt信号传导途径[10959075]。APC基因突变导致其不能有效地与β-catenin、GSK-3β和Axin结合而形成复合物，失去了调节表达水平的能力，信号通路下游相关基因转录激活，从而导致细胞增殖异常和肿瘤的发生。研究显示，APC突变在胰腺癌、胃癌中也频繁发生，可能与其疾病的发生发展相关[1338691，12378616，1423316]。对APC的功能研究还发现APC通过其基本结构域与微管细胞骨架结合，参与细胞迁移过程。有助于微管网络的组装和重组，这与细胞分裂密切相关。APC可以间接调节肌动蛋白丝网络的组织，并因此影响细胞形态、极性和迁移[8033082，8698812]。APC-hDLG复合物形成在APC细胞周期阻断信号转导中起重要作用[10656683]。
  mutation_analysis: 'APC基因编码的蛋白全长为2843个氨基酸，主要包含2个卷曲螺旋结构域（2-59位、1869-1893位氨基酸）、1个Suppressor_APC结构域（126-208位氨基酸）、6个ARM结构域（340-392位、459-510位、512-553位、556-597位、599-644位和649-689位氨基酸）、1个Armadillo/beta-catenin-like repeat结构域（691-731位氨基酸）、4个APC_15aa结构域、7个APC_crr结构域、3个SAMP结构域、1个APC基础结构域（2223-2579位氨基酸）以及1个EB-1结合结构域（2670-2843位氨基酸）。该样本检出的p.R1450*突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    APC作为看家基因，参与DNA修复，它的突变会导致DNA修复减缓，增加周边其它细胞突变的风险，从而促进癌症的进展[24200292]。有研究表明，结直肠癌患者存在APC基因缺失，从而导致Wnt信号通路失调和C-Myc的反式激活，是潜在的治疗靶点[18593890]。因此，该样本检出的突变可能与疾病的发生发展相关。'
