- gene: CDK4
  intro: CDK4基因编码的蛋白质是丝氨酸/苏氨酸蛋白激酶家族成员，是对细胞周期G1期的发展非常重要的蛋白激酶复合物的催化亚基。这种激酶的活性仅限于在G1-S期，这是由调节亚基D型细胞周期蛋白和CDK抑制基因p16（INK4a）控制的。这种激酶负责视网膜细胞瘤基因产物（Rb）的磷酸化。该基因及其相关蛋白质（D型细胞周期蛋白，p16基因（INK4a）和Rb）的突变与多种癌症的发生相关[NCBI]。与之相关的疾病有cdk4相关的皮肤恶性黑色素瘤和3型皮肤恶性黑色素瘤。与其相关的信号通路有PI3K-Akt信号通路和发育生物学信号通路[GeneCards]。
