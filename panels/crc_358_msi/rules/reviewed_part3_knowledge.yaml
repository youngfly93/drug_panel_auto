    该样本检出SETD2基因c.4930G>T，p.G1644*无义突变，该突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。有研究表明，SETD2缺失与WEE1抑制剂具有“合成致死”作用[29955114]。因此，可能从WEE1抑制剂的治疗中获益。AZD1775是一种WEE1激酶抑制剂，可以控制细胞分裂周期的G2检验点，目前该药正处于临床期。
