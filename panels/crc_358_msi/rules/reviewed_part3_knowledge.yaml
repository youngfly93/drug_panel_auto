  header: FANCA功能缺失型变异相应潜在获益药物
  drug_name: 奥拉帕利（Olaparib）
  relation: FANCA是Fanconi贫血DNA交联修复通路核心成员。无义、移码或关键剪接等功能缺失型变异可提示DNA损伤修复缺陷，并为PARP抑制剂相关研究提供生物学依据；该关联不能外推至普通错义变异，也不代表奥拉帕利已获批用于FANCA变异结直肠癌。
  clinical: 一项转移性去势抵抗性前列腺癌Ⅱ期研究纳入50例患者；可评估的49例中，16例检出DNA修复基因纯合缺失或有害变异，包括BRCA1/2、ATM、Fanconi贫血相关基因及CHEK2，其中14例对奥拉帕利产生研究定义的应答。该证据来自前列腺癌DDR联合分组，并非FANCA变异结直肠癌的独立疗效结论，报告中按D级跨癌种研究证据提示[26510020]。
