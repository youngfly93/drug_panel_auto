  relation: 该样本检出KRAS基因c.34G>A，p.G12S错义突变，为已知激活突变，对蛋白功能有重要影响。携带该突变的肿瘤患者可能从RAS/RAF/MEK/ERK信号通路的下游MEK1/2激酶抑制剂获益。曲美替尼是MEK1/2激酶抑制剂，能够靶向抑制RAS/RAF/MEK/ERK信号通路。FDA批准曲美替尼单药用于治疗黑色素瘤，还批准曲美替尼与达拉非尼联合用于治疗黑色素瘤、非小细胞肺癌和间变性甲状腺癌；NMPA批准曲美替尼与达拉非尼联合用于治疗黑色素瘤。贝美替尼（MEK162）是MEK1/2的抑制剂，FDA批准贝美替尼与康奈非尼联合用于治疗BRAF
    V600E或V600K突变的不可切除或转移性黑色素瘤患者。哌柏西利是一种CDK4/6抑制剂，已获FDA和NMPA批准用于治疗乳腺癌。帕尼单抗是一种靶向结合EGFR胞外结构域的单抗药物，已获FDA批准用于治疗结直肠癌。奈拉替尼是一种细胞内激酶抑制剂，已获FDA和NMPA批准用于治疗乳腺癌。Navitoclax是一种BCL-XL/BCL-2抑制剂，目前正在开展临床试验。BI
    1701963是一种泛KRAS抑制剂，目前正在开展临床试验。福巴替尼是一种口服的FGFR抑制剂，已获FDA批准用于治疗携带FGFR2基因融合或其他重排的肝内胆管癌成年患者。
  clinical: 一项由美国国家癌症研究所主办的临床Ⅰb/Ⅱ期试验，旨在研究曲美替尼和Navitoclax用于治疗具有KRAS或NRAS突变的晚期或转移性实体瘤患者，产生的副作用以及最佳剂量。目前该试验正在招募患者[NCT02079740]。帕尼单抗联合曲美替尼用于治疗具有KRAS/NRAS/BRAF突变的IV期结直肠癌患者的II期临床试验，目前该临床试验状态未知[NCT03087071]。体内和体外研究显示，与贝美替尼或哌柏西利单一疗法相比，贝美替尼联合哌柏西利对具有KRAS突变的结直肠癌细胞系和异种移植模型具有显著的疗效[27167191]。一项临床Ⅰ期试验，旨在评估贝美替尼联合mFOLFIRI用于治疗KRAS突变阳性的结直肠癌的最大耐受剂量、反应率、临床获益率以及安全性，目前该试验正在招募患者[NCT02613650]。一项II期临床试验，旨在评估贝美替尼联合哌柏西利用于治疗携带KRAS/NRAS突变的结直肠癌患者有效性，该试验正在开展，不招募患者[NCT03981614]。BI
    1701963单药以及BI 1701963与曲美替尼联合用于治疗具有KRAS突变的不同类型的晚期实体瘤的临床Ⅰ期试验正在开展，不招募患者[NCT04111458]。奈拉替尼联合曲美替尼用于治疗携带KRAS突变的晚期或转移性实体瘤患者的疗效、安全性和耐受性的Ⅰ期试验正在招募中[NCT03065387]。福巴替尼联合贝美替尼用于治疗携带KRAS突变的晚期肿瘤患者疗效的Ⅰb/Ⅱ期试验正在招募中[NCT04965818]。
