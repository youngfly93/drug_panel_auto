  drug_name: 西妥昔单抗（Cetuximab）、帕尼单抗（Panitumumab）
  clinical: 研究显示，PIK3CA激活突变会导致对EGFR单抗耐药[18516290]。一项回顾性研究对864例携带PIK3CA激活突变且KRAS野生型的结直肠癌患者，分析其接受西妥昔单抗或帕尼单抗治疗后的缓解率、PFS和OS。结果显示，PIK3CA激活突变的患者对药物的响应率低且具有更差的PFS和OS[24701207]。另有研究对31例转移性结直肠癌患者进行PIK3CA突变分析及PTEN表达量检测，其中4例患者检测到PIK3CA突变，这4例患者均表现对西妥昔单抗治疗不响应[18669866]。
  relation: 该样本检出PIK3CA基因c.3140A>G，p.H1047R错义突变，研究表明，该突变会引起下游信号通路的激活，从而使细胞过度生长、增殖及侵袭[17376864，26627007，16432179，16322248，31996845]。研究显示，PIK3CA激活突变且KRAS野生型的结直肠癌患者对西妥昔单抗或帕尼单抗治疗无响应[24701207]。FDA和NMPA批准西妥昔单抗用于治疗结直肠癌和头颈部鳞状细胞癌。FDA批准帕尼单抗用于治疗转移性结直肠癌。
- gene: PIK3CA
  c_hgvs: c.3140A>G
  p_hgvs: p.H1047R
  type: benefit
  header: PIK3CA：c.3140A>G，p.H1047R突变相应靶向药物
  drug_name: 依维莫司（Everolimus）、西罗莫司（Sirolimus）、替西罗莫司（Temsirolimus）、培唑帕尼+依维莫司（Pazopanib
    + Everolimus）、阿培利司（Alpelisib）、Capivasertib
  relation: 该样本检出PIK3CA基因c.3140A>G，p.H1047R错义突变，研究表明，该突变会引起下游信号通路的激活，从而使细胞过度生长、增殖及侵袭[17376864，26627007，16432179，16322248，31996845]。具有PI3K通路激活突变的人类肿瘤细胞，无论在体内还是体外试验中，均表现出对于依维莫司用药的敏感性，因此PIK3CA基因可以作为选择使用mTOR抑制剂治疗的患者的一个靶标基因[20664172]。
  clinical: FDA已批准依维莫司用于治疗肾细胞癌、乳腺癌等，同时NMPA批准用于治疗肾细胞癌、室管膜下巨细胞型星形细胞瘤；FDA已批准西罗莫司用于治疗淋巴管肌瘤病等，同时NMPA批准用于治疗器官排异；FDA批准替西罗莫司用于治疗肾细胞癌；阿培利司是PI3K的抑制剂，FDA批准阿培利司联合氟维司群用于治疗HR阳性、HER2阴性、PIK3CA突变的晚期或转移性乳腺癌的绝经后女性患者和男性患者。培唑帕尼是一种多靶点的酪氨酸激酶抑制剂，FDA批准培唑帕尼用于治疗肾细胞癌、软组织肉瘤，NMPA批准培唑帕尼用于治疗肾细胞癌。Capivasertib是一种口服的AKT通路高效抑制剂，可抑制所有三种AKT异构体（AKT1/2/3）。FDA批准Capivasertib联合氟维司群用于治疗激素受体(HR)阳性、人表皮生长因子受体2（HER2）阴性、伴有一种或多种生物标志物改变（PIK3CA、AKT1或PTEN）的局部晚期或转移性乳腺癌患者曾接受至少一种内分泌治疗后出现病情进展，或在完成辅助治疗后12个月内复发。
