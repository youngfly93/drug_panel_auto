  clinical: 有案例报道，一位56岁的乳头状肾细胞癌男性患者，连续接受白介素-2治疗（3个月、疾病进展（PD））、干扰素-α（3个月，PD）和口服S-1作为临床试验（28个月，PD）。随后的基因检测发现了FLCN胚系突变（c.1285dup），开始索拉非尼（1个月，PD）、舒尼替尼（4个月，PD）和依维莫司（7个月，PD）分子靶向治疗。尽管依维莫司被用作第六线的治疗，但与之前的用药相比，表现出相对长期的疗效[23995526]。
    一项Ⅱ期临床试验，旨在评估替西罗莫司用于治疗携带mTOR信号通路上基因（AKT1、AKT2、AKT3、FBXW7、FLCN、mTOR、NF1、NF2、NTRK3、PIK3CA、PIK3R1、PTEN、RHEB、STK11、TSC1、TSC2等）突变的实体瘤的疗效，正在招募患者[NCT03297606]。
  relation: 该样本检出FLCN基因c.1285del，p.H429Tfs*39碱基缺失引起的移码突变，该突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。在体外实验和体内FLCN敲除小鼠模型中，均显示FLCN功能缺失导致PI3K/mTORC1通路上调。依维莫司是一种mTOR抑制剂，FDA批准依维莫司用于治疗肾细胞癌、乳腺癌等疾病，NMPA批准其用于治疗肾细胞癌、室管膜下巨细胞型星形细胞瘤。替西罗莫司是一种mTOR抑制剂，FDA批准替西罗莫司用于治疗肾细胞癌。
