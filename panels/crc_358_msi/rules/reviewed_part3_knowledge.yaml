  intro: PCLO基因编码Piccolo蛋白，该蛋白主要参与突触活性区的结构维持和囊泡运输调控。既往研究在多种肿瘤测序数据中可观察到PCLO基因变异，但其在实体瘤中的驱动作用和可操作性治疗意义仍需要结合具体癌种和变异证据判断。
  mutation_analysis: 'PCLO基因编码的蛋白全长约5142个氨基酸，包含多个卷曲螺旋区域、PDZ结构域和C2结构域等。该样本检出的p.H3908N错义突变目前缺乏明确的功能研究证据，对蛋白功能的影响尚不明确。

    目前尚未见该样本检出的PCLO p.H3908N突变在结直肠癌中的明确临床证据，其具体临床意义有待进一步明确。'
- gene: DNMT3A
  c_hgvs: c.2322+1G>A
  p_hgvs: ''
  intro: DNMT3A（DNA胞嘧啶-5-甲基转移酶3α）基因编码参与表观遗传学基因调控的蛋白质。DNMT3A在成人组织中普遍表达，并且在某些肿瘤中高表达。有研究发现在正常核型的急性髓系白血病中DNMT3A基因存在一定比例的突变，并可能成为一种独立的预后不良因素。DNMT3A基因在血液恶性肿瘤（例如：急性骨髓性白血病、骨髓增生异常综合征）中发生突变的频率最高，但在其它癌症中也可见该基因突变。
  mutation_analysis: 'DNMT3A基因编码的蛋白全长为912位氨基酸，主要包含PWWP结构域（290-348位氨基酸）和DNA methylase结构域（634-776位氨基酸）。该样本检出的c.2322+1G>A突变位于内含子与外显子交界处，可能导致mRNA剪接异常，进而影响蛋白功能。


    DNMT3A变异可能影响DNA甲基化状态和表观遗传调控，从而参与肿瘤发生发展。有一项研究表明，DNMT3A突变患者在免疫治疗过程中，有4名DNMT3A突变的患者经过伊匹木单抗、帕博利珠单抗、纳武利尤单抗免疫治疗后发生进展，治疗失败的时间少于2个月（OR，9.33，P=0.03）[28351930，28976787]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。'
- gene: EGFR
  c_hgvs: c.2387G>A
