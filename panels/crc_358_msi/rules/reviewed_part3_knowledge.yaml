  drug_name: Eprenetapopt
  relation: 该样本检出TP53基因c.844C>T，p.R282W错义突变，研究表明，该突变抑制 AMPK 信号传导，导致细胞侵袭性生长，促进小鼠模型中的肿瘤发展[24857548]。Eprenetapopt（APR-246）又名PRIMA-1MET，是第一个处于临床阶段的p53突变体激活剂，并能诱导细胞凋亡[26086967]。Eprenetapopt是一种前体药物，被转变为Michael
    acceptor methylene quinuclidinone （MQ）后与p53 蛋白的丝氨酸结合，重折叠后恢复野生p53蛋白的活性，另外MQ通过抑制
    TrxR1 酶的活性和消耗谷胱甘肽来维持胞内的氧化还原平衡，具有双重作用机制。从而 Eprenetapopt 能有效的诱导肿瘤细胞死亡，还能克服对其他抗肿瘤药物的耐药性，对p53失活或突变的患者有效[26870698]。目前该药正处于临床期。
  clinical: 体外研究显示，Eprenetapopt能抑制肿瘤细胞生长。在体内不同的肿瘤类型和模型中，Eprenetapopt能以p53依赖的方式诱导细胞凋亡。Eprenetapopt用于治疗恶性血液肿瘤和前列腺癌患者的研究显示，Eprenetapopt可有效的增强肿瘤细胞的凋亡，细胞周期停滞及上调TP53基因[NCT02098343，22965953]。研究显示，在p53突变的胰腺癌细胞系中，Eprenetapopt可通过重激活p53诱导细胞凋亡，在联合治疗中，Eprenetapopt可增加多种化疗药物对胰腺癌细胞系的抗肿瘤活性[24838627]。有研究表明，Eprenetapopt能够在具有突变型p53的结直肠癌细胞中强烈诱导细胞凋亡。在人类异种移植肿瘤模型中，Eprenetapopt能有效抑制结直肠癌肿瘤的生长[26452133]。一项Ib/II期试验显示，Eprenetapopt联合阿扎胞苷（azacitidine）治疗TP53突变型骨髓增生异常综合征（MDS）和少突细胞急性髓细胞白血病（AML）患者时，耐受性良好，并产生了高临床缓解率和分子缓解率[NCT03072043]。
