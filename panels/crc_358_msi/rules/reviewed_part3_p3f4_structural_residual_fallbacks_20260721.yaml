schema_version: 1
source:
  panel: crc_358_msi
  purpose: >-
    P3-F4 first-review fallbacks for the final 11 CRC358-only structural,
    adhesion, trafficking, digestive, mucin, contractile, and large-scaffold
    genes remaining after P3-F3.
  source_type: official_gene_identity_plus_conservative_structural_event_boundary
  curated_at: "2026-07-21"
  scope: colorectal_cancer_crc358_only_structural_residual_conservative_fallback
  privacy: No patient or sample identifiers are stored.
  content_boundary: >-
    An ordinary colorectal-cancer sequence variant does not establish a repeat
    expansion, fusion or rearrangement, copy-number or expression state,
    glycosylation or antigen state, germline syndrome, lineage-specific
    disease, protein loss, or treatment response. Evidence is not transferred
    between paralogs, family members, interaction partners, homologous
    digestive enzymes, or highly similar loci.
