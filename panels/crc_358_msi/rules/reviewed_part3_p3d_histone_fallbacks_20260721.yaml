schema_version: 1
source:
  panel: crc_358_msi
  shared_with: [crc_301_msi]
  purpose: >-
    P3-D first-review fallbacks and an explicit legacy-to-current symbol map for
    linker and core histone genes shared by both CRC panels.
  source_type: official_gene_identity_plus_histone_event_boundary
  curated_at: "2026-07-21"
  scope: colorectal_cancer_histone_conservative_fallback
  privacy: No patient or sample identifiers are stored.
  content_boundary: >-
    Histone evidence is gene-copy, protein-isoform, residue, alteration-class,
    and tumor-context specific. An ordinary tumor sequence variant does not
    establish a post-translational modification, expression state, oncohistone
    hotspot, hematologic/CNS diagnosis, or drug sensitivity, and evidence must
    not be transferred between near-identical histone paralogs.
