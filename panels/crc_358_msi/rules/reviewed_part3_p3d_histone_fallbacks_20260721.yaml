    intro: >-
      HIST1H1E现行官方符号为H1-4，编码复制依赖的连接组蛋白H1.4；该蛋白参与连接DNA结合、染色质压缩和转录环境调节。
    mutation_analysis: >-
      HIST1H1B/C/D/E在滤泡性淋巴瘤中的复发突变证据具有血液肿瘤和位点语境，不能直接迁移到结直肠癌；H1-4胚系疾病证据也不能替代肿瘤体细胞位点解释。表达、翻译后修饰、胚系和体细胞事件必须分开，单个位点不足以形成治疗结论。
    supersedes: base_templated_hist1h1e_generic_fallback
    source_refs:
      - type: ncbi_gene
        id: NCBI-Gene-3008
        url: https://www.ncbi.nlm.nih.gov/gene/3008
