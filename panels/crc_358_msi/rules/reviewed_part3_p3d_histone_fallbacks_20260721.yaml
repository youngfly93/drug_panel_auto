gene_sections:
  - gene: HIST1H1B
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      HIST1H1B现行官方符号为H1-5，编码复制依赖的连接组蛋白H1.5；连接组蛋白结合核小体之间的DNA并参与染色质高级结构压缩和基因调控。
    mutation_analysis: >-
      HIST1H1B/C/D/E在滤泡性淋巴瘤中的复发突变证据具有血液肿瘤和位点语境，不能直接迁移到结直肠癌。H1.5表达或翻译后修饰与HIST1H1B序列变异不是同一事件；单个位点不足以证明染色质功能缺失、肿瘤驱动或治疗意义。
    supersedes: base_templated_hist1h1b_generic_fallback
    source_refs:
      - type: ncbi_gene
        id: NCBI-Gene-3009
        url: https://www.ncbi.nlm.nih.gov/gene/3009
      - type: pubmed
        id: PMID-24435047
        url: https://pubmed.ncbi.nlm.nih.gov/24435047/

