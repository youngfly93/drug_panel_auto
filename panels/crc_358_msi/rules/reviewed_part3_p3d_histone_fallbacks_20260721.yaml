  - gene: HIST1H2AL
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      HIST1H2AL现行官方符号为H2AC16，编码复制依赖的H2A核心组蛋白；H2A与H2B、H3和H4共同组成核小体八聚体并支持DNA包装。
    mutation_analysis: >-
      H2A翻译后修饰、表达或核小体状态与肿瘤序列变异不是同一证据；不同H2A基因可编码高度相似蛋白，位点证据不得跨基因拷贝转移。单个HIST1H2AL位点不足以证明致癌组蛋白效应、染色质异常或治疗意义。
    supersedes: base_templated_hist1h2al_generic_fallback
