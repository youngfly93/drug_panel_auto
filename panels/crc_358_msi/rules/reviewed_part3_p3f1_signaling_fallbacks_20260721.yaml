    An ordinary sequence variant does not establish a fusion, amplification,
    expression or phosphorylation state, receptor activation, biallelic loss,
    germline syndrome, immune-lineage event, pathway activation, or drug
    response. Evidence is not transferred between paralogs or pathway members.
