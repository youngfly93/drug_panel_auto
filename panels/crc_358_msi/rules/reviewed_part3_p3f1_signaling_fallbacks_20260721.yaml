    P3-F1 first-review fallbacks for 31 CRC358-only kinase, PI3K-mTOR,
    phosphatase, and signaling-adaptor genes remaining after P3-E.
  source_type: official_gene_identity_plus_conservative_signaling_event_boundary
  curated_at: "2026-07-21"
