      - "吡咯替尼（C）"
      - "德曲妥珠单抗（C）"
      - "曲妥珠单抗+图卡替尼（C）"
      - "奈拉替尼+依维莫司（C）"
      - "奈拉替尼+哌柏西利（C）"
      - "奈拉替尼+曲美替尼（C）"
      - "波齐替尼（C）"
