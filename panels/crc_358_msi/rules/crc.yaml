# Targeted-drug DB guardrails.
# These rows do not create drug conclusions. They only reject over-broad
# internal KB rows for P0 genes where drug interpretation must be driven by a
# reviewed override or a row with explicit c_point/p_point.
targeted_drug_applicability_rules:
  - genes:
      - EGFR
      - ERBB2
      - KRAS
      - NRAS
      - BRAF
      - NTRK1
      - NTRK2
      - NTRK3
      - TP53
      - TSC1
    sources:
      - internal
    reject_when_db_position_missing: true
    note: "P0药物规则护栏：内部库只有基因、无位点/事件的泛化行不进入2.1靶向用药提示；已审核reviewed override仍优先生效。"

# Reviewed variant-level overrides.
# Use this only for lab-reviewed rules that should override the public/internal KB.
reviewed_variant_overrides:
  # FLT3 c.2537G>A (p.G846D) Ⅱ类：公共库仅有"基因级"FLT3 条目（被
  # require_position_match 排除），且库内为 AML 专用药；终版按临床判断给出
  # CRC 相关多激酶 TKI（C级）。此处按终版口径固定，使 2.1 表与脚注计数一致。
  - gene: FLT3
    c_hgvs: "c.2537G>A"
    p_hgvs: "p.G846D"
    variant_site: "c.2537G>A,\np.G846D"
    benefit_drugs:
      - "瑞戈非尼（C）"
      - "索拉非尼（C）"
      - "舒尼替尼（C）"
  # 历史报告组终版迁移：PIK3CA E542K 精确位点及报告用药顺序。
  - gene: PIK3CA
    panels: [crc_358_msi]
    c_hgvs: "c.1624G>A"
    p_hgvs: "p.E542K"
    variant_site: "c.1624G>A,\np.E542K"
    benefit_drugs:
      - "依维莫司（C）"
      - "西罗莫司（C）"
      - "替西罗莫司（C）"
      - "阿培利司（C）"
      - "盐酸可泮利塞（C）"
      - "培唑帕尼+依维莫司（C）"
      - "卡匹色替（C）"
      - "Buparlisib（C）"
      - "Taselisib（C）"
      - "Serabelisib（C）"
      - "伊那利塞（C）"
      - "伊那利塞+哌柏西利（C）"
      - "RLY-2608（C）"
      - "WX390（C）"
      - "Dactolisib（D）"
    caution_drugs:
      - "西妥昔单抗（C）"
      - "帕尼单抗（C）"
    review_status: legacy_runtime
    runtime_eligible: true
    review_basis: historical_final_report_migration
    evidence_as_of: "2026-07-14"
    secondary_review_status: pending_report_group_reconfirmation
    source_ref: crc358_reviewed_case_a
  # 历史报告组终版迁移：仅匹配 TP53 c.499C>T (p.Q167*)，不外推到
  # TP53 其它错义/截短变异。来源标识脱敏，待报告组逐条二次确认。
  - gene: TP53
    panels: [crc_358_msi]
    c_hgvs: "c.499C>T"
    p_hgvs: "p.Q167*"
    variant_site: "c.499C>T,\np.Q167*"
    benefit_drugs:
      - "AZD1775（C）"
      - "AZD1775+奥拉帕利（C）"
      - "Alisertib（C）"
      - "Alisertib+AZD1775（C）"
      - "Eprenetapopt（C）"
    review_status: legacy_runtime
    runtime_eligible: true
    review_basis: historical_final_report_migration
    evidence_as_of: "2026-07-14"
    secondary_review_status: pending_report_group_reconfirmation
    source_ref: crc358_reviewed_case_a
  # 历史报告组终版迁移：ATR 移码位点的用药列表。匹配保留输入 HGVS
  # c.1291delA；报告展示层再统一为规范化简写 c.1291del。
  - gene: ATR
    panels: [crc_358_msi]
    c_hgvs: "c.1291delA"
    p_hgvs: "p.R431Gfs*8"
    variant_site: "c.1291del,\np.R431Gfs*8"
    benefit_drugs:
