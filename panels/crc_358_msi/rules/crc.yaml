      - "尼拉帕利（C）"
      - "他拉唑帕利（C）"
      - "LY2606368（C）"
      - "SRA737（C）"
      - "奥拉帕利+帕博利珠单抗（C）"
      - "他拉唑帕利+阿替利珠单抗（C）"
      - "芦卡帕利（D）"
    review_status: legacy_runtime
    runtime_eligible: true
    review_basis: historical_final_report_migration
    evidence_as_of: "2026-07-14"
    secondary_review_status: pending_report_group_reconfirmation
    source_ref: crc358_reviewed_case_a
  # TP53 c.821T>A (p.V274D)：报告组金标准小结表按该位点固定给出
  # WEE1/PARP/Alisertib/Eprenetapopt 相关 C 级药物；避免公共库或 CtDrug
  # 兜底把 MAPK/化疗等其它药物串入 TP53 行。
  - gene: TP53
    c_hgvs: "c.821T>A"
    p_hgvs: "p.V274D"
    variant_site: "c.821T>A,\np.V274D"
    benefit_drugs:
      - "AZD1775（C）"
      - "AZD1775+奥拉帕利（C）"
      - "Alisertib（C）"
      - "Alisertib+AZD1775（C）"
      - "Eprenetapopt（C）"
  # TSC1 Ⅱ类：历史结直肠癌终版报告采用基因级 mTOR 抑制剂口径。
  # 公共 CGI 库内 TSC1 条目为基因级、非 COREAD 癌种，生产过滤会正确排除；
  # 此处用 CRC panel reviewed rule 补回已审核终版口径，不放宽公共库过滤。
  - gene: TSC1
    applicability: "loss_of_function"
    variant_level:
      - "Ⅱ类"
      - "II类"
      - "2类"
    benefit_drugs:
      - "依维莫司（C）"
