schema_version: 1
source:
  panel: crc_358_msi
  purpose: >-
    Governed corrections for four legacy exact-variant narratives among the
    P3-F1 CRC358-only signaling genes. Static database counts, domain position,
    cross-tumor observations, and pathway membership are not treated as proof
    of the detected variant's function or clinical significance.
  source_type: reviewed_knowledge_correction_overlay
  source_id: crc358_p3f1_legacy_exact_corrections_20260721
  created_at: "2026-07-21"
  privacy: No patient or sample identifiers are stored.
governance:
  schema_version: "1.0"
  policy_id: crc358_p3f1_legacy_exact_correction_first_review_20260721
  defaults:
    gene:
      review_status: approved_for_runtime
      runtime_eligible: true
      review_basis: codex_first_review_correction_of_legacy_database_count_domain_or_cross_context_prose
      reviewer: codex
      reviewer_type: ai_assisted_evidence_review
      reviewed_at: "2026-07-21"
      evidence_as_of: "2026-07-21"
