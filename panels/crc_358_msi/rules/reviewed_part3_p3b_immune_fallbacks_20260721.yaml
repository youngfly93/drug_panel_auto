schema_version: 1
source:
  panel: crc_358_msi
  shared_with: [crc_301_msi]
  purpose: >-
    P3-B first-review gene-level fallbacks for antigen-presentation,
    interferon-gamma-receptor, and PD-1-ligand genes shared by both CRC panels.
  source_type: official_gene_function_plus_immunotherapy_reporting_boundary
  curated_at: "2026-07-21"
  scope: colorectal_cancer_immune_gene_conservative_fallback
  privacy: No patient or sample identifiers are stored.
  content_boundary: >-
    A single tumor sequence variant does not establish antigen-presentation loss,
    interferon-gamma-pathway loss, immune-checkpoint expression, or immunotherapy
    benefit or resistance. MSI/MMR and other validated biomarkers remain separate.
