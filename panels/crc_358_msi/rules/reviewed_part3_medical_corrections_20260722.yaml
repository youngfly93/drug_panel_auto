        url: https://pubmed.ncbi.nlm.nih.gov/28572531/
  - gene: EGFR
    panels: [crc_301_msi, crc_358_msi]
    c_hgvs: c.2387G>A
    p_hgvs: p.G796D
    type: caution
    header: EGFR：c.2387G>A，p.G796D突变相应负相关靶向药物
    drug_name: 奥希替尼（Osimertinib）
    relation: >-
      G796D位于奥希替尼共价结合位点C797附近。病例演化、结构建模和Ba/F3功能实验均支持该变异降低奥希替尼结合并造成耐药[28572531]；证据来自非小细胞肺癌，报告中按D级跨癌种负相关提示。
    clinical: >-
      原始病例在奥希替尼进展时G796D克隆增加，体外模型中奥希替尼GI50约上升50倍[28572531]。该结果支持耐药方向，但不是结直肠癌疗效试验。
    evidence_level: single_case_plus_in_vitro_resistance_level_d
    cancer_scope: nsclc_resistance_evidence_not_crc_outcome
    source_refs:
      - type: pubmed
        id: PMID:28572531
        url: https://pubmed.ncbi.nlm.nih.gov/28572531/
  - gene: EGFR
    panels: [crc_301_msi, crc_358_msi]
    c_hgvs: c.2387G>A
    p_hgvs: p.G796D
    type: research
    header: EGFR：c.2387G>A，p.G796D突变相应临床试验/研究性方案
    drug_name: 阿法替尼（Afatinib）、MCLA-129
    relation: >-
      阿法替尼和MCLA-129研究针对更广泛的EGFR异常或EGFR/MET通路，并无p.G796D结直肠癌位点专属疗效证据。
    clinical: >-
      NCT02465060评估EGFR激活变异肿瘤中的阿法替尼，NCT04868877评估MCLA-129在肺癌及其他实体瘤中的方案；两项登记只作为非G796D特异研究线索。
    evidence_level: non_variant_specific_early_trial_research_only
    cancer_scope: cross_cancer_trial_not_crc_g796d_efficacy
    source_refs:
      - type: clinical_trial
        id: NCT02465060
        url: https://clinicaltrials.gov/study/NCT02465060
      - type: clinical_trial
        id: NCT04868877
        url: https://clinicaltrials.gov/study/NCT04868877

  # ERBB2 G660D: keep only the directly supported inhibitor subset in Part 2;
  # separate anti-EGFR caution and trial-only combinations.
  - &erbb2_g660d_benefit
    gene: ERBB2
    panels: [crc_301_msi, crc_358_msi]
    c_hgvs: c.1979G>A
    p_hgvs: p.G660D
    type: benefit
    header: ERBB2：c.1979G>A，p.G660D突变相应靶向药物
    drug_name: 阿法替尼、曲妥珠单抗、帕妥珠单抗、奈拉替尼
    relation: >-
      G660D是HER2跨膜结构域激活变异。Ba/F3和小鼠模型显示曲妥珠单抗、帕妥珠单抗、奈拉替尼及阿法替尼可抑制G660D突变体[30449325]；阿法替尼另有跨癌种病例/模型资料[26545934，29146616]。除阿法替尼外，其余按D级前临床线索，不代表CRC获批适应证。
    clinical: >-
      直接证据支持HER2可靶向的生物学基础，但不同药物的临床证据强度有限。第二部分仅保留上述直接研究子集，其他历史候选方案不再并入潜在获益栏。
    evidence_level: direct_g660d_preclinical_with_afatinib_cross_cancer_case
    cancer_scope: g660d_direct_models_and_cross_cancer_case_not_crc_approval
    source_refs:
      - type: pubmed
        id: PMID:30449325
        url: https://pubmed.ncbi.nlm.nih.gov/30449325/
      - type: pubmed
        id: PMID:26545934
        url: https://pubmed.ncbi.nlm.nih.gov/26545934/
      - type: pubmed
        id: PMID:29146616
        url: https://pubmed.ncbi.nlm.nih.gov/29146616/
