    drug_name: 西妥昔单抗、帕尼单抗
    relation: >-
      HER2激活可旁路EGFR信号并降低西妥昔单抗、帕尼单抗等抗EGFR单抗作用，按D级结直肠癌类别负相关提示[26243863]。该证据属于HER2激活类别，并非G660D逐药临床耐药试验。
    clinical: >-
      抗EGFR单抗方向与HER2靶向方案分开解释；奈拉替尼因存在G660D直接抑制证据，不再同时出现在无条件慎用栏。
    evidence_level: colorectal_preclinical_her2_bypass_anti_egfr_resistance
