gene_sections:
  - gene: SLCO1B1
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      SLCO1B1编码肝细胞有机阴离子转运多肽OATP1B1，介导多种内源性化合物和药物从血液进入肝细胞；该转运过程为钠离子非依赖性[NCBI]。SLCO1B1胚系单倍型可影响部分药物的全身暴露、清除和毒性。儿童急性淋巴细胞白血病研究提示相关胚系变异与高剂量甲氨蝶呤清除和胃肠道毒性有关，可用于风险分层、治疗药物监测及按正式方案调整支持治疗，但不能据此自动停用或省略甲氨蝶呤[21387541]。肿瘤组织检出的单个体细胞变异不能替代胚系药物基因组学检测。
    replace_fields: [intro]
    supersedes: reviewed_part3_knowledge.yaml:SLCO1B1_gene_intro
    evidence_level: ncbi_function_plus_germline_pharmacokinetic_association
    cancer_scope: germline_pharmacogenomics_not_somatic_crc_treatment_rule
    source_refs:
      - type: ncbi_gene
        id: NCBI-Gene:10599
        url: https://www.ncbi.nlm.nih.gov/gene/10599
      - type: pubmed
        id: PMID:21387541
        url: https://pubmed.ncbi.nlm.nih.gov/21387541/

  - gene: ESR2
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      ESR2编码雌激素受体β，是核受体转录因子家族成员，包含DNA结合结构域和配体结合结构域；与雌激素结合后可形成同源或异源二聚体并调控靶基因转录[NCBI]。一项病例对照研究报道特定ESR2多态性与乳腺癌风险相关[15604249]；该来源不支持把同一结论直接外推为结直肠癌或前列腺癌风险，也不能把肿瘤组织中的任意ESR2体细胞变异解释为治疗标志物。
    replace_fields: [intro]
    supersedes: reviewed_part3_knowledge.yaml:ESR2_gene_intro
    evidence_level: ncbi_function_plus_breast_cancer_association_only
    cancer_scope: breast_association_source_not_crc_or_prostate_claim
    source_refs:
      - type: ncbi_gene
        id: NCBI-Gene:2100
        url: https://www.ncbi.nlm.nih.gov/gene/2100
      - type: pubmed
        id: PMID:15604249
        url: https://pubmed.ncbi.nlm.nih.gov/15604249/

  - gene: HLA-C
    panels: [crc_301_msi, crc_358_msi]
    intro: >-
      HLA-C编码HLA I类重链，与β2微球蛋白形成复合物并向细胞毒性T细胞呈递内源性肽；其多态性影响肽结合特异性[NCBI]。早期结直肠癌研究观察的是HLA-A、HLA-B和HLA-C所代表的HLA I类分子总体表达缺失，并报道其与肿瘤分化程度相关[2417962]；该研究不能单独证明HLA-C基因特异性表达缺失或预后效应。单个HLA-C体细胞变异仍需结合等位基因、表达和抗原呈递功能判断。
    replace_fields: [intro]
    supersedes: reviewed_part3_knowledge.yaml:HLA-C_gene_intro
    evidence_level: ncbi_function_plus_hla_class_i_crc_observation
    cancer_scope: hla_class_i_observation_not_hla_c_specific_biomarker
    source_refs:
      - type: ncbi_gene
        id: NCBI-Gene:3107
        url: https://www.ncbi.nlm.nih.gov/gene/3107
      - type: pubmed
        id: PMID:2417962
        url: https://pubmed.ncbi.nlm.nih.gov/2417962/

  - gene: EGFR
    panels: [crc_301_msi, crc_358_msi]
    c_hgvs: c.2387G>A
    p_hgvs: p.G796D
    mutation_analysis: >-
      p.G796D位于EGFR酪氨酸激酶结构域并邻近奥希替尼共价结合位点C797。原始研究在一例EGFR突变非小细胞肺癌患者接受奥希替尼后进展的样本中检出该变异；结构建模和Ba/F3实验显示其降低奥希替尼结合，奥希替尼GI50约升高50倍，支持获得性耐药方向[28572531]。该证据不等同于p.G796D在结直肠癌中的驱动性、药物敏感性或获益证据，需结合癌种、共存驱动变异及治疗背景解释。
    replace_fields: [mutation_analysis]
    supersedes: reviewed_part3_knowledge.yaml:EGFR_p.G796D_mutation_analysis
    evidence_level: single_nsclc_case_plus_structural_and_in_vitro_resistance
    cancer_scope: nsclc_osimertinib_resistance_not_crc_benefit
    source_refs:
      - type: pubmed
        id: PMID:28572531
        url: https://pubmed.ncbi.nlm.nih.gov/28572531/

