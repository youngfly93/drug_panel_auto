    drug_name: AZD1775/Adavosertib
    relation: >-
      H3K36me3缺失在细胞和异种移植模型中与WEE1抑制剂敏感性相关[26602815]；该信号属于前临床机制，不构成SETD2变异结直肠癌的潜在获益规则。
    clinical: >-
      SETD2致病变异晚期实体瘤Ⅱ期研究纳入18例患者，两个队列均未观察到客观缓解，研究未进入后续阶段[38920407，NCT03284385]。因此仅保留为带阴性临床结果的研究说明，不进入第二部分获益表。
    evidence_level: preclinical_positive_phase_ii_no_objective_response
    cancer_scope: cross_cancer_research_with_negative_phase_ii_not_crc_benefit
