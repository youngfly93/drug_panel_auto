        url: https://pubmed.ncbi.nlm.nih.gov/28978051/
      - type: pubmed
        id: PMID:27601554
        url: https://pubmed.ncbi.nlm.nih.gov/27601554/

  # EGFR G796D: direct evidence supports osimertinib resistance. Candidate
  # agents are retained only in the research subsection.
  - gene: EGFR
    panels: [crc_301_msi, crc_358_msi]
    c_hgvs: c.2387G>A
    p_hgvs: p.G796D
    type: benefit
    suppress: true
    supersedes: reviewed_part3_drug_contracts_20260721.yaml:EGFR_p.G796D_benefit
    source_refs:
