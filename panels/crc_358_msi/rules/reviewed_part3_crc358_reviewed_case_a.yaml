  drug_name: 奥拉帕利（Olaparib）、芦卡帕利（Rucaparib）、尼拉帕利（Niraparib）、他拉唑帕利（Talazoparib）、奥拉帕利+帕博利珠单抗（Olaparib+Pembrolizumab）、他拉唑帕利+阿替利珠单抗（Talazoparib+Atezolizumab）、LY2606368、SRA737
  relation: '该样本检出ATR基因c.1291del，p.R431Gfs*8碱基缺失引起的移码突变，该突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。临床前研究表明，ATR缺失的细胞系对PARP抑制剂敏感。因此，该患者可能从PARP抑制剂及相关抑制剂的治疗中获益。目前，FDA和/或NMPA批准的PARP抑制剂有奥拉帕利、芦卡帕利、尼拉帕利、他拉唑帕利。FDA批准奥拉帕利用于上皮性卵巢癌、输卵管癌或原发性腹膜癌患者的维持治疗、胰腺癌的维持治疗，卵巢癌和乳腺癌，以及前列腺癌患者的治疗，NMPA批准奥拉帕利用于治疗卵巢癌、前列腺癌。FDA批准芦卡帕利用于治疗卵巢癌、输卵管癌、原发性腹膜癌以及前列腺癌患者。FDA批准尼拉帕利用于治疗上皮性卵巢癌、输卵管癌或原发性腹膜癌患者，中国（香港）批准尼拉帕利用于治疗高级别浆液性上皮性卵巢癌患者，中国大陆（NMPA）批准尼拉帕利用于复发性卵巢癌的维持治疗。FDA批准他拉唑帕利用于治疗前列腺癌和乳腺癌成年患者。NMPA批准他拉唑帕利用于治疗前列腺癌患者。



    相关抑制剂包括帕博利珠单抗、阿替利珠单抗、LY2606368、SRA737。帕博利珠单抗已获FDA批准用于治疗黑色素瘤、转移性非小细胞肺癌、头颈部鳞状细胞癌、对卡介苗无反应的非肌层浸润性膀胱癌、微卫星不稳定性高（MSI-H）或错配修复缺陷的实体瘤（包括结直肠癌）等多种癌症，NMPA批准帕博利珠单抗用于治疗黑色素瘤、非小细胞肺癌患者等。阿替利珠单抗已获FDA批准用于治疗尿路上皮癌、非小细胞癌、小细胞肺癌、肝细胞癌、黑色素瘤患者，已获NMPA批准用于治疗小细胞肺癌、肝细胞癌、非小细胞肺癌患者。LY2606368是一种ATP竞争性CHK1抑制剂，目前正处于临床期。SRA737是一种高效的口服CHK1抑制剂，目前正处于临床期。'
  clinical: '一项II期临床试验，旨在评估奥拉帕利治疗具有DNA修复缺陷（包括ATM、ATR、BARD1、BRCA1、BRCA2、BRIP1、CHEK1、CHEK2、RAD50、FANCG、FANCD2等基因突变）的尿路上皮癌患者的效果，该临床试验目前正在招募中[NCT03375307]。一项II期临床试验，旨在评估奥拉帕利联合帕博利珠单抗治疗携带HR突变相关基因（ARID1A/B、ARID2、ATM、ATR、BARD1、BRCA1/2、BAP1、BRIP1、CHEK2、FANCA、FANCD2、MRN11A、PALB2、RAD50、RAD51、RAD54B）的黑色素瘤患者疗效，目前正在招募中[NCT04633902]。



    已有研究表明，芦卡帕利在同源重组基因敲除的细胞系（如RAD51、FANCM、PALB2、ATR、BARD1），具有“合成致死”作用[29606854]。



    尼拉帕利用于治疗具有BAP1突变或其他DNA损伤修复缺陷（ARID1A、ATM、ATR、BACH1（BRIP1）、BAP1、BARD1、BLM、CHEK1、CHEK2、CDK2、CDK4、ERCC、FAM175A、FEN1、IDH1、IDH2、MRE11A（MRE11）、NBN（NBS1）、PALB2、POLD1、PRKDC（DNA-PK）、PTEN、RAD50、RAD51、RAD52、RAD54、RPA1、SLX4、WRN、XRCC）肿瘤患者的II期临床试验正在开展，暂不招募患者[NCT03207347]。



    他拉唑帕利用于治疗具有ATM、BRCA1、BRCA2、PALB2、ARID1A、MER11、RAD50、NBS1、ATR基因突变的晚期恶性肿瘤患者的II期临床试验正在开展，不招募患者[NCT02286687]。他拉唑帕利联合阿替利珠单抗用于治疗具有BRCA1/2、PALB2、ATM、ATR、CHEK2、FANCA、RAD51C、NBN、MLH1、MRE11A、CDK12体细胞或胚系突变的实体瘤患者的II期临床试验正在招募患者[NCT02693535]。



    LY2606368用于治疗具有同源重组修复缺陷（包括BRCA1、BRCA2、PALB2、RAD51C、RAD51D、ATR、ATM、CHK2或Fanconi贫血途径基因突变）的肿瘤患者的II期临床试验，4个月无进展生存率为25%[NCT02873975]。



    一项临床I/II期试验，旨在评估SRA737用于治疗参与DNA修复过程的基因（包括：CCNE1、MYC、BRCA1、BRCA2、FANC、TP53、RAD50、CHEK1、ATR）相关突变/扩增的晚期癌症患者的疗效，试验结果观察到大肠癌患者（PFS：1.84个月，OS：5.72个月），高级别浆液性卵巢癌患者（PFS：1.94个月，OS：6.93个月），非小细胞肺癌患者（PFS：1.76个月，OS：6.08个月），前列腺癌患者（PFS：3.02个月），头颈部鳞状细胞癌患者（PFS：3.55个月）临床获益[NCT02797964]。'
