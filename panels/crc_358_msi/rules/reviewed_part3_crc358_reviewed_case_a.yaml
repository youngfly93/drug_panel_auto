  drug_name: 曲美替尼（Trametinib）、曲美替尼（Trametinib）+Navitoclax、帕尼单抗+曲美替尼（Panitumumab+Trametinib）、BI 1701963、BI 1701963+曲美替尼（Trametinib）、奈拉替尼+曲美替尼（Neratinib+Trametinib）、福巴替尼+贝美替尼（Futibatinib+Binimetinib）
  relation: 该样本检出KRAS基因c.34G>T，p.G12C错义突变，该突变会引起下游信号通路的上调，从而使细胞过度生长、增殖。携带该突变的肿瘤患者可能从RAS/RAF/MEK/ERK信号通路的下游MEK1/2激酶抑制剂获益。曲美替尼是MEK1/2激酶抑制剂，能够靶向抑制RAS/RAF/MEK/ERK信号通路。FDA批准曲美替尼单药用于治疗黑色素瘤，还批准曲美替尼与达拉非尼联合用于治疗黑色素瘤、非小细胞肺癌和间变性甲状腺癌；NMPA批准曲美替尼与达拉非尼联合用于治疗黑色素瘤。帕尼单抗是一种靶向结合EGFR胞外结构域的单抗药物，已获FDA批准用于治疗结直肠癌。奈拉替尼是一种细胞内激酶抑制剂，已获FDA和NMPA批准用于治疗乳腺癌。Navitoclax是一种BCL-XL/BCL-2抑制剂，目前正在开展临床试验。BI 1701963是一种泛KRAS抑制剂，目前正在开展临床试验。福巴替尼是一种口服的FGFR抑制剂，已获FDA批准用于治疗携带FGFR2基因融合或其他重排的肝内胆管癌成年患者。
  clinical: 一项由美国国家癌症研究所主办的临床Ⅰb/Ⅱ期试验，旨在研究曲美替尼和Navitoclax用于治疗具有KRAS或NRAS突变的晚期或转移性实体瘤患者，产生的副作用以及最佳剂量。目前该试验正在招募患者[NCT02079740]。帕尼单抗联合曲美替尼用于治疗具有KRAS/NRAS/BRAF突变的IV期结直肠癌患者的II期临床试验，目前该临床试验状态未知[NCT03087071]。临床前和临床研究显示，曲美替尼对KRAS突变的非小细胞肺癌（NSCLC）患者显示出抗肿瘤活性[27100819]。一项开放、多中心、随机的Ⅱ期临床试验，旨在比较曲美替尼和多西他赛治疗晚期KRAS突变的NSCLC患者的有效性和安全性。该试验将KRAS突变型NSCLC患者随机分组，其中86例患者接受曲美替尼治疗，43例患者接受多西他赛治疗，曲美替尼组的中位PFS为12周，多西他赛组的中位PFS为11周，HR为1.14，95% CI 0.75-1.75，P=0.5197。曲美替尼组的中位总生存期为8个月，多西他赛组的中位生存期未达到，HR为0.97，95% CI 0.52-1.83，P=0.934。两组的部分缓解率均为12%（P=1.0000）。最终的试验结果表明：在治疗先前接受过治疗的KRAS突变阳性NSCLC患者时，曲美替尼组与多西他赛组的PFS以及反应率相似[NCT01362296，25722381]。除了曲美替尼单药治疗的临床研究外，在临床Ⅰb期研究中，曲美替尼分别联合吉西他滨、培美曲塞、多西他赛针对KRAS突变的NSCLC患者进行了研究，结果显示以上这些联合治疗方法证明的耐受性和临床活性值得进一步研究[NCT01428427，23583440，Kelly K et al. 2013，Gandara DR, et al. 2013，27807303]。BI 1701963单药以及BI 1701963与曲美替尼联合用于治疗具有KRAS突变的不同类型的晚期实体瘤的临床Ⅰ期试验正在开展，不招募患者[NCT04111458]。奈拉替尼联合曲美替尼用于治疗携带KRAS突变的晚期或转移性实体瘤患者的疗效、安全性和耐受性的Ⅰ期试验正在招募中[NCT03065387]。福巴替尼联合贝美替尼用于治疗携带KRAS突变的晚期肿瘤患者疗效的Ⅰb/Ⅱ期试验正在招募中[NCT04965818]。
