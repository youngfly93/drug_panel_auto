  drug_name: 索拉非尼（Sorafenib）、舒尼替尼（Sunitinib）、瑞戈非尼（Regorafenib）
  relation: 该样本检出c.2537G>A，p.G846D错义突变，研究报道，该突变导致FLT3蛋白功能增加，表现在培养细胞中IL3非依赖性生长和Stat5磷酸化增加[38049555]。FLT3基因激活突变，可能从激酶抑制剂的治疗中获益。索拉非尼是多靶点的丝氨酸/苏氨酸以及受体酪氨酸激酶抑制剂，FDA已批准索拉非尼用于治疗肝细胞癌、晚期肾细胞癌、分化型甲状腺癌，NMPA已批准索拉非尼用于肝细胞癌、肾癌及分化型甲状腺癌。舒尼替尼是口服的多激酶抑制剂，FDA和NMPA已批准舒尼替尼用于治疗胃肠道间质瘤、晚期肾细胞癌以及胰腺神经内分泌肿瘤。瑞戈非尼是多靶点的激酶抑制剂，FDA和NMPA已批准瑞戈非尼用于治疗结直肠癌、胃肠道间质瘤、肝细胞癌。
  clinical: 研究显示，在急性髓性白血病中，FLT3激活突变对索拉非尼和舒尼替尼敏感[23969938，15459012]。病例研究报道，1例直肠癌患者检出6个基因变异（FLT3扩增、KRAS激活突变和CDK8扩增等），接受索拉非尼治疗，治疗后7天内，该患者脑部病变快速改善，提示索拉非尼对FLT3激活突变的结直肠癌患者可能具有疗效[25848357]。一项临床II期试验旨在评估索拉非尼联合卡培他滨用于接受过治疗的转移性结肠癌患者的临床获益情况，42例可用于评估的患者结果显示，中位PFS为123天（95%CI：62-132），中位OS为261天（95%CI：132-370）[NCT01471353]。索拉非尼用于治疗具有FLT3突变或扩增的恶性实体瘤的临床II期试验正在招募患者[NCT02029001]。舒尼替尼用于治疗携带CSF1R、PDGFR、VEGFR1/2/3、KIT、FLT3、RET、FGFR1/2/3、VHL扩增或突变的晚期实体瘤的临床II期试验正在招募患者[NCT02693535]。舒尼替尼用于治疗具有FLT3突变或扩增的恶性实体瘤的临床II期试验正在招募患者[NCT03297606]。临床前研究显示，瑞戈非尼能够抑制结直肠癌细胞系的增殖，并且在异种移殖模型中显示减缓肿瘤生长[24347491]。一项临床I期试验显示，瑞戈非尼在治疗晚期实体瘤患者中表现出了抗肿瘤活性，47例可评估的患者中有3例获得PR（分别为肾细胞癌、结肠直肠癌和骨肉瘤）[22421192]。
