  header: ''
  drug_name: Alisertib、Alisertib+AZD1775
  relation: 该样本检出TP53基因c.499C>T，p.Q167*无义突变，该突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。Alisertib是一种ATP竞争性的极光激酶A（AURKA）抑制剂，通过与AURKA激酶的T288结合而抑制AURKA的磷酸化及活化。临床前研究表明，Alisertib可以诱导细胞停滞在G2/M期，引起胃肠道上部肿瘤细胞的凋亡。同时，Alisertib可以下调肿瘤细胞内的多个致癌信号通路，例如NF-κB、AKT、STAT3。多项研究表明，Alisertib可以使p53和p73活化[25987188]。目前该药正处于临床期。AZD1775是一种WEE1激酶抑制剂，可以控制细胞分裂周期的G2检验点，TP53缺失的肿瘤细胞对其敏感[28978051]。目前该药正处于临床期。
  clinical: 一项Alisertib单药治疗实体瘤患者的临床 I 期研究中，Alisertib显示出初步的抗肿瘤活性，37%的患者疾病稳定，而且在某些实体瘤患者中（结直肠癌、软骨肉瘤、平滑肌肉瘤、脂肪肉瘤）疾病稳定超过6个月，同时治疗相关的不良反应控制的很好[22753585]。体内和体外研究显示，Alisertib单药能够抑制TP53突变的头颈部鳞状细胞癌（HNSCC）细胞系的有丝分裂，导致细胞生长停滞，并且Alisertib联合AZD1775能够产生协同抗肿瘤作用，延长总生存期，是TP53突变的癌症的潜在的治疗方法[30755439]。
