  drug_name: AZD1775、AZD1775+奥拉帕利（Olaparib）
  relation: 该样本检出TP53基因c.499C>T，p.Q167*无义突变，该突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。AZD1775是一种WEE1激酶抑制剂，可以控制细胞分裂周期的G2检验点，TP53缺失的肿瘤细胞对其敏感[28978051]。目前该药正处于临床期。FDA批准奥拉帕利用于上皮性卵巢癌、输卵管癌、原发性腹膜癌患者、胰腺癌、乳腺癌，以及前列腺癌；NMPA批准奥拉帕利用于卵巢癌以及前列腺癌。
  clinical: 一项临床I期研究评估了AZD1775单药治疗或联合化药治疗难治性实体瘤的安全性、耐受性、药代动力学、药效动力学。该研究分成两部分，第一部分：患者接受单次剂量AZD1775的治疗，随后观察14天；第二部分：患者接受AZD1775联合吉西他滨或顺铂或卡铂的治疗，观察患者的疾病稳定和缓解情况。该研究共招募了202名患者，第一部分包含9名患者，患者接受单次剂量AZD1775的治疗后，耐受良好，未达到最大耐受剂量。接受AZD1775联合化药治疗的患者，常见的不良反应事件包括：疲劳、恶心呕吐、腹泻和血液毒性。最终有176名患者接受了评估，94名（53%）患者疾病稳定，17名（10%）患者得到部分缓解。携带TP53突变的患者组反应率高于TP53野生型的患者组（21% vs. 12%）。该研究表明，AZD1775单药或联合化药在治疗实体瘤中的耐受良好，有潜在的抗肿瘤活性[27601554]。一项由New York University School of Medicine举办的AZD1775联合伊立替康治疗RAS突变或BRAF突变一线治疗失败的转移性结直肠癌的临床I期研究已完成，但数据尚未公布[NCT02906059]。AZD1775联合奥拉帕利用于治疗携带KRAS突变或TP53突变的实体瘤患者或者同时携带KRAS突变和TP53突变的实体瘤患者的临床试验正在开展，不招募患者[NCT02576444]。
