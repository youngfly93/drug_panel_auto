  relation: 该样本检出KRAS基因c.34G>T，p.G12C错义突变，为已知激活突变，对蛋白功能有重要影响。临床前研究表明，含有KRAS突变的结肠癌细胞系对依维莫司不敏感[29285035，28544747]。因此，该患者可能对依维莫司的治疗负相关。依维莫司已获FDA批准，用于治疗乳腺癌、神经内分泌瘤、肾癌等疾病，并已获NMPA批准，用于治疗肾癌、室管膜下巨细胞型星形细胞瘤。
  clinical: 临床前研究表明，含有KRAS突变的结肠癌细胞系对依维莫司不敏感[29285035，28544747]。在转移性癌症患者中，携带KRAS突变的患者接受依维莫司治疗后对依维莫司缺乏疗效，12例具有KRAS突变的肿瘤患者中11例均出现疾病进展，而31例KRAS野生型患者中仅16例患者未从依维莫司治疗中获益[20664172]。
