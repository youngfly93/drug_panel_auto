  relation: '该样本检出BRCA1基因c.505C>T，p.Q169*无义突变，该突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。BRCA1或/和BRCA2缺陷的癌细胞对PARP抑制剂敏感[24579064]。因此，该患者可能从PARP抑制剂及相关抑制剂的治疗中获益。



    目前，FDA和/或NMPA批准的PARP抑制剂有奥拉帕利、芦卡帕利、尼拉帕利、他拉唑帕利、帕米帕利、氟唑帕利。FDA批准奥拉帕利用于卵巢癌、输卵管癌或原发性腹膜癌、胰腺癌、乳腺癌以及前列腺癌患者的治疗；NMPA批准奥拉帕利用于治疗卵巢癌和前列腺癌患者。FDA批准芦卡帕利用于治疗卵巢癌、输卵管癌或原发性腹膜癌以及前列腺癌患者。FDA批准尼拉帕利用于上皮性卵巢癌、输卵管癌或原发性腹膜癌患者的维持治疗；中国（香港）批准尼拉帕利用于治疗高级别浆液性上皮性卵巢癌患者；中国大陆（NMPA）批准尼拉帕利用于复发性卵巢癌的维持治疗。FDA批准他拉唑帕利用于治疗前列腺癌和乳腺癌成年患者。NMPA批准他拉唑帕利用于治疗前列腺癌患者。NMPA批准帕米帕利用于治疗存在已知致病或疑似致病的胚系BRCA突变的既往接受过两线或两线以上化疗的晚期卵巢癌、输卵管癌或原发性腹膜癌患者。NMPA批准氟唑帕利用于治疗既往经过二线及以上化疗的伴有胚系BRCA突变（gBRCAm）的铂敏感复发性卵巢癌、输卵管癌或原发性腹膜癌患者。



    相关抑制剂包括替雷利珠单抗、盐酸可泮利塞、度伐利尤单抗、帕博利珠单抗、阿维鲁单抗、LY2606368、SRA737、阿替利珠单抗。替雷利珠单抗已获NMPA批准用于治疗经典型霍奇金淋巴瘤、尿路上皮癌、非小细胞肺癌、肝细胞癌患者。盐酸可泮利塞是一种PI3K抑制剂，已获FDA和NMPA批准用于治疗滤泡性淋巴瘤。度伐利尤单抗是一种PD-L1抑制剂，已获FDA和NMPA批准用于治疗广泛期小细胞癌、III期非小细胞肺癌患者。帕博利珠单抗已获FDA批准用于治疗黑色素瘤、转移性非小细胞肺癌、头颈部鳞状细胞癌、对卡介苗无反应的非肌层浸润性膀胱癌、微卫星不稳定性高（MSI-H）或错配修复缺陷的实体瘤等多种癌症，NMPA批准帕博利珠单抗用于治疗黑色素瘤、非小细胞肺癌患者等。阿维鲁单抗是PD-L1抑制剂，已获FDA批准用于治疗默克细胞癌、尿路上皮癌患者。LY2606368是一种ATP竞争性CHK1抑制剂，目前正处于临床期。SRA737是一种高效的口服CHK1抑制剂，目前正处于临床期。阿替利珠单抗已获FDA批准用于治疗尿路上皮癌、非小细胞癌、小细胞肺癌、肝细胞癌、黑色素瘤患者，已获NMPA批准用于治疗小细胞肺癌、肝细胞癌、非小细胞肺癌患者。'
  clinical: '奥拉帕利用于治疗具有BRCA1、BRCA2失活突变以及ATM突变或缺失的肿瘤患者的II期临床试验正在招募中[NCT02693535]。



    一项由美国国家癌症研究所举办的临床I期试验，旨在评估盐酸可泮利塞、奥拉帕利联合度伐利尤单抗用于治疗具有ARID1A、ATM、ATRX、BARD1、BRCA1、BRCA2、BRIP1、CDK12、CHEK1、CHEK2、MSH2等基因突变的转移性或无法手术切术的实体瘤患者的毒副作用和最佳剂量，目前该试验正在招募中[NCT03842228]。一项II期临床试验，旨在评估奥拉帕利联合帕博利珠单抗治疗携带HR突变相关基因（ARID1A/B、ARID2、ATM、ATR、BARD1、BRCA1/2、BAP1、BRIP1、CHEK2、FANCA、FANCD2、MRN11A、PALB2、RAD50、RAD51、RAD54B）的黑色素瘤患者疗效，目前正在招募中[NCT04633902]。



    芦卡帕利用于治疗携带一个或多个同源重组DNA修复基因突变（包括BRCA1、BRCA2、ATM、CHEK2、NBN、RAD50、RAD51C、RAD51D、PALB2、MRE11、FANCA、FANCB、FANCC、FANCD2、FANCE、FANCF、FANCG、FANCI、FANCM）的前列腺癌患者的II期临床试验，正在招募中[NCT03413995]。芦卡帕利联合阿替利珠单抗用于治疗具有ATM、BARD1、BRCA1、BRCA2、BRIP1、CDK12、CHEK2、PALB2、RAD51C、RAD51D、FANCA、NBN、RAD51、RAD54L突变和/或缺失的实体瘤患者的II期临床试验正在招募患者[NCT04276376]。



    一项多机构Ⅰ期剂量递增和剂量扩展试验，旨在评估尼拉帕尼联合卡铂用于治疗具有HRD（同源重组脱氧核糖核酸修复途径缺陷）的实体瘤患者的有效性和安全性。患者需通过下一代DNA测序（NGS）检测出至少一个涉及DNA损伤修复基因的突变（包括但不限于：ARID1A、ATM、ATRX、MRE11A、NBN、PTEN、RAD50/51/51B、BARD1、BLM、BRCA1、BRCA2、BRIP1、FANCA/C/D2/E/F/G/L、PALB2、WRN、CHEK2、CHEK1、BAP1、FAM175A、SLX4、MLL2 或XRCC）才能入组，目前该试验正在招募患者[NCT03209401]。



    他拉唑帕利用于治疗具有ATM、BRCA1、BRCA2、PALB2、ARID1A、MER11、RAD50、NBS1、ATR基因突变的晚期恶性肿瘤患者的II期临床试验正在开展，不招募患者[NCT02286687]。阿维鲁单抗联合他拉唑帕利用于治疗具有BRCA或ATM突变的实体瘤患者的II期临床试验正在进行，暂不招募患者[NCT03565991]。他拉唑帕利联合阿替利珠单抗用于治疗具有BRCA1/2、PALB2、ATM、ATR、CHEK2、FANCA、RAD51C、NBN、MLH1、MRE11A、CDK12体细胞或胚系突变的实体瘤患者的II期临床试验正在招募患者[NCT02693535]。



    氟唑帕利本次获批是基于一项单臂、多中心临床研究的结果，该研究共入组113例既往接受过2~4次含铂方案治疗的BRCA突变复发性卵巢癌患者，研究结果显示，在103例效果可评估的患者中，氟唑帕利治疗铂敏感复发性卵巢癌患者的ORR高达69%，中位DOR长达10.2个月，中位PFS长达12.0个月，显示出出色的疗效[2019 ESMO Abstract 4168]。



    帕米帕利的获批是基于一项I/II期临床试验结果，该试验的关键性II期部分在中国入组了113例既往接受过至少两线标准化疗、携有BRCA1/2突变的高级别上皮性卵巢癌（OC，包括输卵管癌或原发性腹膜癌）或高级别子宫内膜上皮样癌患者。队列1纳入了90例晚期铂敏感OC（PSOC）患者，队列2纳入了23例晚期铂耐药OC（PROC）患者，截至2020年2月2日数据截止时，患者的中位随访时间为12.2个月。该研究结果显示，队列1中PSOC患者的ORR为64.6%，有8例患者实现完全缓解（CR），45例患者实现部分缓解（PRs）。疾病控制率（DCR）为95.1%，肿瘤抗原(CA)-125应答率为79.7%。队列2中PROC患者的ORR为31.6%，有6例患者实现PRs，DCR为94.7%，CA-125应答率为38.1%[Xiaohua Wu，et al]。帕米帕利联合替雷利珠单抗用于治疗具有BRCA1/2突变或其他HR相关基因（ATM、CDK12、PALB2、ARID1A、ATRX、BLM、BARD1、BRIP1、CHEK1、CHEK2、FANCA、FANCF、FANCG、FANCI、FANCL、FANCM、MSH2、NBN、RAD50、RAD51C、RAD51D、WRN）肿瘤患者的II期临床试验正在招募患者[NCT04985721]。



    LY2606368用于治疗具有同源重组修复缺陷（包括BRCA1、BRCA2、PALB2、RAD51C、RAD51D、ATR、ATM、CHK2或Fanconi贫血途径基因突变）的肿瘤患者的II期临床试验，4个月无进展生存率为25%[NCT02873975]。



    一项临床I/II期试验，旨在评估 SRA737 用于治疗参与DNA修复过程的基因（包括：CCNE1、MYC、BRCA1、BRCA2、FANC、TP53、RAD50、CHEK1、ATR）相关突变/扩增的晚期癌症患者的疗效，试验结果观察到大肠癌患者（PFS：1.84 个月，OS： 5.72 个月），高级别浆液性卵巢癌患者（PFS：1.94 个月，OS：6.93 个月），非小细胞肺癌患者（PFS：1.76 个月，OS：6.08 个月），前列腺癌患者（PFS：3.02 个月），头颈部鳞状细胞癌患者（PFS：3.55 个月）临床获益[NCT02797964]。'
