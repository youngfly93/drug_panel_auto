gene_sections:
- gene: APC
  c_hgvs: c.994C>T
  p_hgvs: p.R332*
  intro: APC基因能够编码肿瘤抑制蛋白，并在经典WNT信号通路中起拮抗作用，APC作为β-链蛋白（β-catenin）信号传导的负调节因子，与β-链蛋白的稳定性密切相关。β-链蛋白参与E-钙粘蛋白细胞粘附系统和Wnt信号传导途径[10959075]。APC基因突变导致其不能有效地与β-catenin、GSK-3β和Axin结合而形成复合物，失去了调节表达水平的能力，信号通路下游相关基因转录激活，从而导致细胞增殖异常和肿瘤的发生。研究显示，APC突变在胰腺癌、胃癌中也频繁发生，可能与其疾病的发生发展相关[1338691，12378616，1423316]。对APC的功能研究还发现APC通过其基本结构域与微管细胞骨架结合，参与细胞迁移过程。有助于微管网络的组装和重组，这与细胞分裂密切相关。APC可以间接调节肌动蛋白丝网络的组织，并因此影响细胞形态、极性和迁移[8033082，8698812]。APC-hDLG复合物形成在APC细胞周期阻断信号转导中起重要作用[10656683]。
  mutation_analysis: 'APC基因编码的蛋白全长为2843个氨基酸，主要包含2个卷曲螺旋结构域（2-59位、1869-1893位氨基酸）、1个Suppressor_APC结构域（126-208位氨基酸）、6个ARM结构域（340-392位、459-510位、512-553位、556-597位、599-644位和649-689位氨基酸）、1个Armadillo/beta-catenin-like repeat结构域（691-731位氨基酸）、4个APC_15aa结构域、7个APC_crr结构域、3个SAMP结构域、1个APC基础结构域（2223-2579位氨基酸）以及1个EB-1结合结构域（2670-2843位氨基酸）。该样本检出的p.R332*突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    APC作为看家基因，参与DNA修复，它的突变会导致DNA修复减缓，增加周边其它细胞突变的风险，从而促进癌症的进展[24200292]。有研究表明，结直肠癌患者存在APC基因缺失，从而导致Wnt信号通路失调和C-Myc的反式激活，是潜在的治疗靶点[18593890]。因此，该样本检出的突变可能与疾病的发生发展相关。'
- gene: APC
  c_hgvs: c.4666dupA
  p_hgvs: p.T1556Nfs*3
  intro: APC基因能够编码肿瘤抑制蛋白，并在经典WNT信号通路中起拮抗作用，APC作为β-链蛋白（β-catenin）信号传导的负调节因子，与β-链蛋白的稳定性密切相关。β-链蛋白参与E-钙粘蛋白细胞粘附系统和Wnt信号传导途径[10959075]。APC基因突变导致其不能有效地与β-catenin、GSK-3β和Axin结合而形成复合物，失去了调节表达水平的能力，信号通路下游相关基因转录激活，从而导致细胞增殖异常和肿瘤的发生。研究显示，APC突变在胰腺癌、胃癌中也频繁发生，可能与其疾病的发生发展相关[1338691，12378616，1423316]。对APC的功能研究还发现APC通过其基本结构域与微管细胞骨架结合，参与细胞迁移过程。有助于微管网络的组装和重组，这与细胞分裂密切相关。APC可以间接调节肌动蛋白丝网络的组织，并因此影响细胞形态、极性和迁移[8033082，8698812]。APC-hDLG复合物形成在APC细胞周期阻断信号转导中起重要作用[10656683]。
  mutation_analysis: 'APC基因编码的蛋白全长为2843个氨基酸，主要包含2个卷曲螺旋结构域（2-59位、1869-1893位氨基酸）、1个Suppressor_APC结构域（126-208位氨基酸）、6个ARM结构域（340-392位、459-510位、512-553位、556-597位、599-644位和649-689位氨基酸）、1个Armadillo/beta-catenin-like repeat结构域（691-731位氨基酸）、4个APC_15aa结构域、7个APC_crr结构域、3个SAMP结构域、1个APC基础结构域（2223-2579位氨基酸）以及1个EB-1结合结构域（2670-2843位氨基酸）。该样本检出的p.T1556Nfs*3突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    APC作为看家基因，参与DNA修复，它的突变会导致DNA修复减缓，增加周边其它细胞突变的风险，从而促进癌症的进展[24200292]。有研究表明，结直肠癌患者存在APC基因缺失，从而导致Wnt信号通路失调和C-Myc的反式激活，是潜在的治疗靶点[18593890]。因此，该样本检出的突变可能与疾病的发生发展相关。'
- gene: SMAD4
  c_hgvs: c.1577A>G
  p_hgvs: p.E526G
  intro: SMAD4基因编码信号转导蛋白Smad家族的成员之一[NCBI]。Smads蛋白参与、介导转化生长因子（transformaing growth factor-β，TGF-β）信号转导通路。该通路在调节细胞生长、分化等方面发挥重要作用[17875924]。SMAD4的表达改变或功能异常会显著影响该通路的正常进行。研究表明，TGF-β/Smads 信号通路参与恶性肿瘤的发生发展机制，并可能与胃癌等恶性肿瘤的生物学行为有关[17875924]。SMAD4基因在胰腺癌中发挥肿瘤抑制基因的作用。研究发现50%的胰腺癌发生SMAD4基因的失活，而其他肿瘤中该基因的失活率10%[15855639]。
  mutation_analysis: 'SMAD4基因编码的蛋白全长为552个氨基酸，主要包含DWA结构域（31-140位氨基酸）和DWB结构域（321-530位氨基酸）。DWA结构域主要与特定序列的DNA结合；DWB结构域主要参与同聚体及异聚体的形成，同时也干预DWA区域与DNA的结合，并参与转录的激活以及蛋白在核内的定位。该样本检出的p.E526G突变位于DWB结构域，可能对蛋白功能有一定的影响。

    导致SMAD4基因失活的突变包括无义突变、剪接位点突变、错义突变、移码突变，其中77%的错义突变发生在DWB区域[15014009]。研究表明，SMAD4基因的功能缺失在结直肠癌中较为常见[29720405]。SMAD4基因的突变与结直肠癌的远端转移相关[10340381]。但是，目前该样本检出的突变在结直肠癌中的具体临床意义有待明确。'
- gene: PIK3CA
  c_hgvs: c.1624G>A
  p_hgvs: p.E542K
  intro: PIK3CA编码I型磷酸肌醇3激酶（PI3K）的催化亚基p110α，它与p85调节亚基构成异二聚体[NCBI]。PI3K由生长因子受体和胰岛素受体激活，其主要作用是调控磷脂代谢途径和磷脂源信使分子的产生，从而调节细胞生长、分裂、生存和迁移[17916723]。p110 α催化细胞膜上的PIP2 ，使之转变为PIP3，而PIP3可作为第二信使结合并激活多种细胞内靶蛋白，参与调节细胞的增殖、运动、粘附、侵袭转移等信号通路。例如，PIK3CA点突变和扩增导致PI3K/AKT途径的激活，导致细胞不依赖生长因子增殖，增加细胞侵袭和转移能力[17877460，19697359]。PIK3CA的突变在结肠癌、脑癌、乳腺 癌、肺癌等多种肿瘤发生发展中具有重要作用[15467468]。
  mutation_analysis: 'PIK3CA基因编码的蛋白全长1068个氨基酸，主要为PI3K激酶的P110α催化亚基（1-1068位氨基酸），主要包含：P85结合结构域（31-108位氨基酸）、Ras结合结构域（173-292位氨基酸）、C2结构域（322-425位氨基酸）、PI3Ka结构域（518-704位氨基酸）、卷曲螺旋结构域（707-729位氨基酸）、PI3Kc结构域（798-1065位氨基酸）。该样本检出的p.E542K突变位于PI3Ka结构域，研究显示该突变会导致 PI3K/AKT/MTOR信号通路组成型激活，从而进一步促进细胞的生长、增殖、存活，最终导致肿瘤的发生[20664174，20664172，31088410]。

    PIK3CA点突变和扩增导致PI3K/AKT途径的激活，进而导致细胞不依赖生长因子增殖，增加细胞侵袭和转移能力[17877460，19697359]。因此，该样本检出的突变可能与疾病的发生发展相关。'
- gene: KRAS
  c_hgvs: c.34G>T
  p_hgvs: p.G12C
  intro: KRAS基因是致癌基因，属于RAS基因家族成员，编码P21蛋白。该蛋白在MAPK信号通路中起作用，能够与GDP/GTP结合并促进GTP酶活性。当KRAS基因发生突变时不能被水解酶水解失活，而处于持续激活状态，引起RAF/MAPK的上调，传递多种生存通路信号，从而使细胞过度生长、增殖，抵抗EGFR-TKIs的作用。KRAS突变可以导致肺癌、黏蛋白腺瘤、胰腺导管癌和结肠癌等多种恶性肿瘤。KRAS基因被激活最常见的方式是点突变，多发生在N端的第12、13、61和146密码子，其中以第12密码子突变最常见。不同突变位点对P21蛋白的活化机制不同，第12密码子突变可以减弱P21内在的GTP酶活性，并使细胞凋亡减少，细胞间接触抑制减弱。RAS家族基因在癌症中没有可用的药物直接拮抗靶点，主要影响信号通路上下游靶点药物的使用效果，突变主要导致EGFR靶药和BRAF靶药的耐药性。
  mutation_analysis: 'KRAS基因编码的蛋白全长为189个氨基酸，主要包含RAS结构域（1-166位氨基酸）。该样本检出的p.G12C突变位于上述结构域之内，为已知激活突变，对蛋白功能有重要影响。

    KRAS突变在人体肿瘤发生过程中起着重要的作用，并在胰腺癌、甲状腺癌、结直肠癌和肺癌中普遍存在[23066310]。研究显示，大约有35%-45%的结直肠癌患者携带原癌基因KRAS的突变。常见的KRAS突变多发生在N端第12、13、61和第146号密码子。这些突变会导致KRAS蛋白处于激活状态，并激活下游的信号通路，且已被证实是anti-EGFR抗体药物（如西妥昔单抗、帕尼单抗）耐药的标志[20100961]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。'
- gene: BRCA1
  c_hgvs: c.505C>T
  p_hgvs: p.Q169*
  intro: BRCA1基因编码的蛋白是一个定位于细胞核的磷酸蛋白，属于肿瘤抑制因子。BRCA1主要含有锌指结构域、丝氨酸集群结构域和BRCT结构域，其中BRCT结构域对于BRCA1发挥其DNA修复功能至关重要[NCBI]。该蛋白一方面与其他肿瘤抑制因子、DNA损伤感应元件和信号转导因子相结合形成一个多亚基蛋白复合物BASC，参与双链DNA修复和重组、维持基因组稳定的过程，另一方面还通过RAD50-MRE11-p95复合体起到DNA损伤应答的作用[10426999]。此外，BRCA1还可以与RNA聚合酶II结合，并通过其C末端结构域与组蛋白脱乙酰酶复合物相互作用，发挥其调控基因转录的功能[NCBI]。BRCA1是乳腺上皮细胞生长的负调控因子，该基因突变导致约40％的遗传性乳腺癌和80％以上的遗传性乳腺癌和卵巢癌[7795653]。
  mutation_analysis: 'BRCA1基因编码的蛋白全长为1863个氨基酸，主要包含RING结构域（24-64位氨基酸）、EIN3结构域（648-978位氨基酸）、卷曲螺旋结构域（1392-1424位氨基酸）以及2个BRCT结构域（1644-1726位、1758-1845位氨基酸）。该样本检出的p.Q169*突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    BRCA1蛋白属于肿瘤抑制因子，发挥DNA修复功能，在多种肿瘤中检测到该基因发生突变。BRCA1、BRCA2的体细胞突变和胚系突变均对PARP抑制剂有预测作用[24579064]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。'
- gene: DNMT3A
  c_hgvs: c.1367delA
  p_hgvs: p.K456Sfs*195
  intro: DNMT3A（DNA胞嘧啶-5-甲基转移酶3α）基因编码参与表观遗传学基因调控的蛋白质。DNMT3A在成人组织中普遍表达，并且在某些肿瘤中高表达。有研究发现在正常核型的急性髓系白血病中DNMT3A基因存在一定比例的突变，并可能成为一种独立的预后不良因素。DNMT3A基因在血液恶性肿瘤（例如：急性骨髓性白血病、骨髓增生异常综合征）中发生突变的频率最高，但在其它癌症（包括肺癌）中也发现该基因的突变。
  mutation_analysis: 'DNMT3A基因编码的蛋白全长为912位氨基酸，主要包含PWWP结构域（290-348位氨基酸）和DNA methylase结构域（634-776位氨基酸）。该样本检出的p.K456Sfs*195突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    有一项研究表明，DNM3TA 突变患者在免疫治疗过程中，有4名DNM3TA突变的患者经过伊匹木单抗，帕博利珠单抗，纳武利尤单抗免疫治疗后发生进展，治疗失败的时间少于2个月（OR，9.33，P=0.03）[28351930，28976787]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。'
- gene: TP53
  c_hgvs: c.499C>T
  p_hgvs: p.Q167*
  intro: TP53基因是重要的抑癌基因之一，其编码蛋白为p53，大约有一半人类肿瘤呈现出TP53的失活突变，其余的恶性肿瘤中通过活化p53抑制因子、降低p53活化因子，使p53信号通路失活。p53通过其在细胞核中转录依赖和胞浆中转录不依赖两种途径发挥抑癌作用。p53作为转录因子可靶向结合特定的DNA序列，使与细胞周期停滞、凋亡、细胞代谢改变等功能相关的基因转录活化。除了细胞核内的活性，p53在胞浆中表现出转录非依赖的生物活性，研究表明细胞质中p53的活化有促进细胞凋亡的作用[19407794]。其作用机制为：DNA受损时，p53蛋白活化DNA修复蛋白并阻滞细胞生长周期的进行[22872685]。当细胞DNA受损严重不能修复时，p53蛋白与特定DNA结合，激活WAF1/CIP1等多种基因，启动细胞凋亡程序，抑制细胞分裂，从而避免携带异常遗传信息的细胞继续生长、分裂[21728981]。
  mutation_analysis: 'TP53基因编码的蛋白p53全长393个氨基酸，包含3个结构域：反式激活结构域（5-29位氨基酸）、DNA结合结构域（95-289位氨基酸）和四聚化结构域（318-359位氨基酸）。根据报道TP53突变主要发生在175、245、248、273和282这五个热点突变密码子区[19810096，10612830，12619105]，而TP53基因的K132、C135、P151、V157、R158、Y163、V173、C176、H179、H193、Y205、Y220、Y234、M237、C238、S241、C242、M246、R249、G266、P278、R280、D281和E285也是较为常见的突变密码子区[19336573]。这些位点均处于p53蛋白的DNA结合结构域，均可能会对蛋白功能产生影响。该样本检出的p.Q167*突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    一项研究在389名Ⅲ期结肠癌患者中检测TP53的突变状态，结果表明TP53的突变频率为33%[26425688]。在一项包含276个结直肠癌样本的分子突变分析研究中，发现165个非高频突变的结直肠癌样本中有59%检测到TP53突变，导致TP53信号通路失活[22810696]，说明TP53在结直肠癌的发生发展中具有重要作用。因此，该样本检出的突变可能与疾病的发生发展相关。'
- gene: FLT3
  c_hgvs: c.2537G>A
  p_hgvs: p.G846D
  intro: FLT3（Fms样酪氨酸激酶-3）基因编码的蛋白是调节造血功能的第III类酪氨酸激酶受体，能够激活造血干细胞的增殖和分化途径[27906677]。受体激酶的活化能磷酸化和激活多种细胞过程（细胞凋亡、增殖和骨髓中造血干细胞的分化）的细胞质效应分子。FLT3基因突变导致受体组成性激活，从而导致急性髓性白血病和急性淋巴细胞白血病[NCBI]。在具有FLT3激活突变的癌细胞中，FLT3抑制剂或酪氨酸激酶抑制剂已被证明是有效的[19318574，12124170]。与FLT3相关的信号通路有GPCR和癌症中的信号通路[GeneCards]。
  mutation_analysis: 'FLT3基因编码的蛋白全长为993个氨基酸，主要包含免疫球蛋白功能区（265-331位氨基酸）和蛋白酪氨酸激酶结构域（610-943位氨基酸）。该样本检出的p.G846D突变位于蛋白酪氨酸激酶结构域，研究报道，该突变导致FLT3蛋白功能增加，表现在培养细胞中IL3非依赖性生长和Stat5磷酸化增加[38049555]。

    在实体瘤中，FLT3变异综合分析显示，大多数是基因突变，其次是基因扩增[23550210]。有研究证明，FLT3的激活突变和内部串联重复突变在血液肿瘤、急性髓系白血病中比较常见[19467916，30181385，32241850]。因此，该样本检出的突变可能与疾病的发生发展相关。'
- gene: PMS2
  c_hgvs: c.1273delT
  p_hgvs: p.S425Lfs*23
  intro: PMS2基因编码的蛋白在DNA错配修复中起作用[29755653]。PMS2是DNA错配修复系统（MMR）的组成部分，与MLH1异源化形成MutLα。DNA修复由与dsDNA不匹配结合的MutSα（MSH2-MSH6）或MutSβ（MSH2-MSH6）引发，然后将MutLα引入异源双链体。当存在RFC和PCNA时，MutL-MutS-杂合eroduplex三元复合物的组装足以激活PMS2的核酸内切酶活性。它在错配附近引入单链断裂，从而为外切核酸酶EXO1产生新的入口点，以降解不匹配的链。DNA甲基化会阻止裂解，因此确保只有新突变的DNA链将被修正。PMS2还参与DNA损伤信号传导，这是一种引起细胞周期阻滞并在导致主要DNA损伤的情况下可导致细胞凋亡的过程[GeneCards]。研究表明，PMS2的杂合胚系突是林奇综合征的诱因之一[26320870]。目前，已在子宫内膜癌、肠癌和胃癌中检测到PMS2基因的错义突变、无义突变、沉默突变、移码缺失和插入突变。
  mutation_analysis: 'PMS2基因编码的蛋白全长为862个氨基酸，主要包含HATPase_c结构域（30-131位氨基酸）、DNA错配修复蛋白C端结构域（249-363位氨基酸）和MutLC端二聚化结构域（678-822位氨基酸）。该样本检出的p.S425Lfs*23突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    PMS2基因编码DNA错配修复蛋白[26666765]。多项研究表明，PARP抑制剂用于治疗DNA错配修复缺陷的肿瘤可显示出疗效[28003236]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。'
- gene: ATR
  c_hgvs: c.1291delA
  p_hgvs: p.R431Gfs*8
  intro: ATR基因编码的蛋白是为PI3/PI4激酶家族成员，是与DNA损伤修复和细胞周期阻滞相关的主要信号因子。该蛋白在检查点激酶CHK1、RAD17、RAD9和肿瘤抑制蛋白BRCA1蛋白的磷酸化中起作用，这些蛋白参与细胞周期和DNA损伤信号通路。在肠癌、皮肤癌和胃癌等癌症中已发现该基因的错义突变、无义突变、沉默突变、移码缺失、插入以及整码缺失。
  mutation_analysis: 'ATR基因编码的蛋白全长为2644个氨基酸，主要包含UME结构域（1119-1225位氨基酸）、FAT结构域（1771-2092位氨基酸）以及PI3Kc结构域（2323-2633位氨基酸）。该样本检出的p.R431Gfs*8突变导致蛋白翻译提前终止，产生截短的蛋白，可能导致蛋白功能缺失。

    有研究表明，在人类恶性肿瘤中，ATR或CHEK1发生缺失或突变的频率较低，但有研究报道，在微卫星不稳定性的结直肠癌、子宫内膜癌和散发性胃癌以及乳腺癌中较为常见[27308506]。临床前研究表明，ATR或ATM缺失的细胞系对PARP抑制剂敏感。另研究显示，在转移性尿路上皮癌中，DNA损伤修复（DDR）通路基因突变（包括ATR）与肿瘤突变负荷增加及免疫治疗临床获益相关[29489427]。因此，该样本检出的突变可能与疾病的发生发展及用药相关。'
drug_sections:
- gene: PIK3CA
  c_hgvs: c.1624G>A
  p_hgvs: p.E542K
  type: benefit
  header: PIK3CA：c.1624G>A，p.E542K突变相应靶向药物
  drug_name: 依维莫司（Everolimus）、西罗莫司（Sirolimus）、替西罗莫司（Temsirolimus）、培唑帕尼+依维莫司（Pazopanib + Everolimus）、阿培利司（Alpelisib）、卡匹色替（Capivasertib）
  relation: 该样本检出PIK3CA基因c.1624G>A，p.E542K错义突变，研究显示该突变会导致 PI3K/AKT/MTOR信号通路组成型激活，从而进一步促进细胞的生长、增殖、存活，最终导致肿瘤的发生[20664174，20664172，31088410]。PIK3CA基因激活突变，会导致信号通路PI3K-AKT-mTOR的异常活化，进而促进肿瘤的发生[30636012]，具有PI3K通路激活突变的人类肿瘤细胞，无论在体内还是体外试验中，均表现出对于依维莫司用药的敏感性，因此PIK3CA基因可以作为选择使用mTOR抑制剂治疗的患者的一个靶标基因[20664172]。FDA已批准依维莫司用于治疗肾细胞癌、乳腺癌等，同时NMPA批准用于治疗肾细胞癌、室管膜下巨细胞型星形细胞瘤；FDA已批准西罗莫司用于治疗淋巴管肌瘤病等，同时NMPA批准用于治疗器官排异；FDA批准替西罗莫司用于治疗肾细胞癌；阿培利司是PI3K的抑制剂，FDA批准阿培利司联合氟维司群用于治疗HR阳性、HER2阴性、PIK3CA突变的晚期或转移性乳腺癌的绝经后女性患者和男性患者。培唑帕尼是一种多靶点的酪氨酸激酶抑制剂，FDA批准培唑帕尼用于治疗肾细胞癌、软组织肉瘤，NMPA批准培唑帕尼用于治疗肾细胞癌。卡匹色替是一种口服的AKT通路高效抑制剂，可抑制所有三种AKT异构体（AKT1/2/3）。FDA和NMPA批准卡匹色替联合氟维司群用于治疗激素受体 (HR) 阳性、人表皮生长因子受体2（HER2）阴性、伴有一种或多种生物标志物改变（PIK3CA、AKT1或PTEN）的局部晚期或转移性乳腺癌患者曾接受至少一种内分泌治疗后出现病情进展，或在完成辅助治疗后12个月内复发。
  clinical: "研究表明，具有PI3K通路激活突变的人类肿瘤细胞均表现出对于依维莫司用药的敏感性，因此PIK3CA基因可以作为选择使用mTOR抑制剂治疗的患者的一个靶标基因[20664172]。一项临床用药研究结果显示，对多种肿瘤患者使用依维莫司治疗，其中具有PIK3CA基因H1047R突变的患者的临床疗效明显优于PIK3CA其它突变类型及野生型患者，与其它PIK3CA突变类型患者相比，PR（38% VS 10%），PFS（5.7 个月 VS 2 个月）；与PIK3CA野生型患者相比，PR（38% VS 13%），PFS（5.7 个月 VS 3.5）[23066039]。一项依维莫司联合培唑帕尼用于治疗 PIK3CA 或 PTEN 突变的晚期实体瘤患者的临床I期试验，结果显示，在14例获得SD≥6个月或PR的患者中，有11携带 PIK3CA激活或PTEN失活突变，提示联合治疗具有较好的疗效且可耐受[25902899]。培唑帕尼联合依维莫司用于治疗PIK3CA突变阳性或PTEN缺失的实体瘤患者的I期临床试验正在开展，不招募患者[NCT01430572]。一项Ⅳ期临床试验，旨在评估西罗莫司用于治疗携带PIK3CA突变、PIK3CA扩增、PIK3CA-AKT信号通路激活或对mTOR抑制剂敏感的基因变异的难治性实体瘤的疗效和安全性，该实验已完成，但数据尚未公布[NCT02688881]。另有研究报道了1例携带PIK3CA基因E545K突变、TP53基因E286K突变的乳腺癌患者在接受抗血管生成药物和替西罗莫司联合用药治疗后，获得部分缓解[25320628]。一项Ⅱ期临床试验，旨在评估替西罗莫司用于治疗携带mTOR信号通路上基因（AKT1、AKT2、AKT3、FBXW7、FLCN、mTOR、NF1、NF2、NTRK3、PIK3CA、PIK3R1、PTEN、RHEB、STK11、TSC1、TSC2等）突变的实体瘤的疗效，正在招募患者[NCT03297606]。\n\n\n体外研究显示，阿培利司在多种肿瘤细胞系中具有显著的抗肿瘤活性，且对具有PIK3CA基因突变的细胞系更敏感[24608574]。阿培利司用于携带 PIK3CA 基因突变的部分患者研究显示，阿培利司可有效抑制S6 磷酸化（mTOR信号下游标记），1例携带 PIK3CA基因激活突变的乳腺癌患者，接受阿培利司治疗长达5.6 月，治疗28天时肿瘤缩小34.8%[23903756]。阿培利司用于具有PIK3CA基因突变的实体瘤的临床Ⅰ期试验已完成，数据暂未公布[NCT01219699]。  \n\n\nCAPItello-291是一项Ⅲ期的双盲、随机试验，旨在评估卡匹色替与氟维司群联合治疗与安慰剂加氟维司群联合治疗在局部晚期（不可手术）或转移性激素受体阳性、HER2低表达或阴性且存在AKT通路改变（PIK3CA、AKT1或PTEN突变）的乳腺癌患者中的疗效，结果显示，在总体人群和伴有AKT途径改变的肿瘤患者中，卡匹色替联合氟维司群的无进展生存期显著长于安慰剂联合氟维司群，即在总人群中卡匹色替+氟维司群组中位PFS为7.2个月vs 对照组3.3个月；伴有AKT途径改变的患者中位PFS为7.3个月vs 对照组3.1个月[37256976，NCT04305496]。"
- gene: PIK3CA
  c_hgvs: c.1624G>A
  p_hgvs: p.E542K
  type: benefit
  header: ''
  drug_name: 盐酸可泮利塞（Copanlisib）、Dactolisib、Buparlisib、Taselisib、Serabelisib、伊那利塞（Inavolisib）、伊那利塞+哌柏西利（Inavolisib+Palbociclib）、RLY-2608、WX390
  relation: 该样本检出PIK3CA基因c.1624G>A，p.E542K错义突变，研究显示该突变会导致 PI3K/AKT/MTOR信号通路组成型激活，从而进一步促进细胞的生长、增殖、存活，最终导致肿瘤的发生[20664174，20664172，31088410]。PIK3CA基因激活突变，会导致信号通路PI3K-AKT-mTOR的异常活化，进而促进肿瘤的发生[30636012]，因此，该患者可能从PI3K和mTOR等抑制剂的治疗中获益。盐酸可泮利塞是PI3K的抑制剂，FDA和NMPA批准用于治疗复发性滤泡性淋巴瘤。Dactolisib（NVP-BEZ235）是一种双重 ATP 竞争性 PI3K和mTOR抑制剂，对p110α/γ/δ/β和 mTOR（p70S6K）均有抑制作用；Dactolisib 同时也是 mTORC1/2催化剂的抑制剂，能够明显降低 mTOR激活激酶 p70S6K 的磷酸化水平，还能降低S6核糖体蛋白在 Ser235/236位点的磷酸化水平，目前正在开展临床试验。Buparlisib、Taselisib是选择性的PI3K抑制剂，目前正在开展临床试验。Serabelisib是选择性PI3Kα抑制剂，目前正在开展临床试验。伊那利塞是选择性PI3Kα抑制剂，FDA批准伊那利塞与哌柏西利和氟维司群三药联合用于治疗内分泌耐药、PIK3CA突变/HR+/HER2-晚期乳腺癌患者；NMPA批准伊那利塞联合哌柏西利和氟维司群，用于PIK3CA 突变、激素受体（HR）阳性、人表皮生长因子受体 2（HER2）阴性、局部晚期或转移性乳腺癌成人患者。RLY-2608是一种PI3Kα抑制剂，目前处于临床试验。WX390是一种PI3K/mTOR双重抑制剂，目前处于临床期。
  clinical: 临床前研究显示，Dactolisib在表达PIK3CA基因激活突变的细胞系及小鼠中均表现出有效的抗肿瘤活性[19029981，26627007]。一项由诺华制药公司举办的临床II期试验，旨在评估Buparlisib用于治疗PI3K通路激活的肿瘤患者的疗效，招募的患者携带PIK3CA基因突变、PTEN基因突变、PIK3CA基因扩增或PIK3R1基因突变。结果显示，可评估的146例患者的第16周临床受益率为15.1（95%CI：9.7-21.9），部分反应率为1.4（95%CI：0.2-4.9）[NCT01833169]。 体外和体内的子宫浆液性癌细胞系试验结果显示，Taselisib对携带 PIK3CA基因突变和/或HER2扩增突变的细胞系具有显著的抑制作用[25172762]。Taselisib 临床Ⅰ期潜在生物标记物扩展研究显示，6 例临床局部缓解的患者，5例携带 PIK3CA基因突变，提示携带PIK3CA基因突变的实体瘤患者可能对Taselisib 敏感[2014 AACR Abstract 915]。另有临床Ⅰb期试验结果显示，Taselisib与来曲唑联合用药，在 PIK3CA突变的HR+晚期乳腺癌患者中耐受良好，并且Taselisib在PIK3CA突变患者中的抗肿瘤效果更为明显[2015 AACR Abstract PD5-2]。Taselisib用于PIK3CA基因突变或扩增的实体瘤患者的NCI-MATCH临床试验正在招募中[NCT02465060]。盐酸可泮利塞用于治疗携带PIK3CA突变的结直肠癌患者的II期临床试验中显示出较好疗效，目前该研究达到了主要终点，客观缓解率（ORR）为16%[NCT02465060，35133871]。盐酸可泮利塞联合检查点抑制剂用于治疗携带PIK3CA突变、PTEN缺失的晚期实体瘤患者的I/II期临床试验正在招募中[NCT04317105]。一项旨在评估Serabelisib联合胰岛素抑制饮食在携带PIK3CA突变伴或不伴PTEN缺失的晚期实体瘤疗效的Ⅰb期临床试验正在招募中[NCT05300048]。一项旨在评估Serabelisib联合糖尿病药物在携带PIK3CA突变或KRAS突变的晚期实体瘤疗效的Ⅰb/Ⅱ期临床试验，暂不招募患者[NCT04073680]。一项I期、开放、剂量递增研究，旨在评估伊那利塞作为单药治疗携带PIK3CA突变的局部晚期或转移性实体瘤患者的临床试验正在招募中[NCT03006172]。FDA批准伊那利塞与哌柏西利和氟维司群三药联合用于治疗携带PIK3CA突变的特定乳腺癌患者是基于一项随机双盲、含安慰剂对照的3期临床试验。结果显示，伊那利塞组的中位无进展生存期为15.0个月，而安慰剂组为7.3个月；接受伊那利塞治疗的患者的总体缓解率为58%，显著高于安慰剂组的25%[NCT04191499]。在一项I期临床实验中，评估RLY-2608治疗在携带PIK3CA突变的晚期实体瘤患者中的有效性和安全性，实验共纳入42名患者。结果显示，在16例具有可测量疾病的乳腺癌患者中，56%（n=9）肿瘤缩小，81%（n=13）实现了疾病稳定（SD）或部分缓解（PR）；安全性可控[NCT05216432]。一项开放、单臂、多中心、II期临床研究评估WX390在铂耐药、晚期、复发或转移的PIK3CA基因突变的妇科肿瘤（卵巢癌、或子宫内膜癌、或宫颈鳞癌）患者中有效性与安全性的实验正在进行中[CTR20210445]。
- gene: KRAS
  c_hgvs: c.34G>T
  p_hgvs: p.G12C
  type: benefit
  header: KRAS：c.34G>T，p.G12C突变相应靶向/免疫药物
  drug_name: 索托拉西布/阿达格拉西布+帕尼单抗/西妥昔单抗（Sotorasib/Adagrasib+Panitumumab/Cetuximab）、索托拉西布（Sotorasib）、阿达格拉西布（Adagrasib）、氟泽雷塞（Fulzerasib）、氟泽雷塞+西妥昔单抗（Fulzerasib+Cetuximab）、格索雷塞（Garsorasib）、索托拉西布+阿法替尼（Sotorasib+Afatinib）、索托拉西布+曲美替尼（Sotorasib+Trametinib）、索托拉西布（Sotorasib）+RMC4630、索托拉西布（Sotorasib）+BBP398、戈来雷塞（Glecirasib）、戈来雷塞（Glecirasib）+JAB3312、BBP398+纳武利尤单抗（Nivolumab）、JDQ443、GDC6036、GH35、RMC-6236、JMKX1899、BEBT-607、LY3537982
  relation: 该样本检出 KRAS 基因c.34G>T，p.G12C错义突变，该突变会导致下游信号通路激活，从而引起细胞过度生长、增殖。索托拉西布（AMG-510）是一种有效的、口服生物可利用的、选择性的KRAS G12C共价抑制剂，将 KRAS G12C 锁定在非活跃的GDP约束状态。索托拉西布选择性靶向的 KRAS G12C 突变体，具有抗肿瘤活性。FDA批准索托拉西布用于治疗既往接受过至少一种全身系统治疗且携带KRAS G12C特定突变的局部晚期或转移性NSCLC成人患者。阿达格拉西布是是一种KRAS G12C的不可逆抑制剂，具有高度特异性，已获FDA批准用于治疗携带KRAS G12C突变的局部晚期或转移性非小细胞肺癌（NSCLC）的成年患者，这些患者先前至少接受了一次全身性治疗。FDA和NMPA批准西妥昔单抗用于治疗结直肠癌和头颈部鳞状细胞癌。FDA批准帕尼单抗用于治疗结直肠癌。FDA批准阿达格拉西布联合西妥昔单抗用于既往接受过基于氟尿嘧啶、奥沙利铂和伊立替康的化疗KRAS G12C突变的局部晚期或转移性结直肠癌成人患者。结肠癌和直肠癌NCCN指南推荐携带KRAS G12C突变的患者使用索托拉西布/阿达格拉西布+帕尼单抗/西妥昔单抗治疗。NMPA批准氟泽雷塞用于单药治疗至少接受过一种系统性治疗的KRAS G12C突变型晚期非小细胞肺癌（NSCLC）成人患者。NMPA将氟泽雷塞纳入突破性疗法，用于治疗至少接受过两种系统性治疗的KRAS G12C突变型的晚期结直肠癌患者。格索雷塞被NMPA获批用于治疗至少接受过一种系统性治疗KRAS G12C突变的晚期非小细胞肺癌（NSCLC）成人患者。JDQ443是一款KRAS G12C共价抑制剂，能够不可逆地将KRAS G12C锁定在失活状态，目前处于临床期。阿法替尼是EGFR TKI药物，已获FDA和NMPA批准用于治疗非小细胞肺癌。曲美替尼是MEK1、MEK2的选择性抑制剂。MEK1和MEK2在多种癌症中上调，在RAS/RAF/MEK/ERK信号通路中发挥重要作用，调节细胞生长。FDA已批准曲美替尼单药用于黑色素瘤，或与达拉非尼联合用于治疗手术无法切除的或转移性的BRAF V600E或V600K突变阳性的黑色素瘤、BRAF V600E突变阳性的非小细胞肺癌以及BRAF V600E突变阳性的实体瘤患者（结直肠癌除外）。NMPA批准曲美替尼联合达拉非尼用于治疗黑色素瘤和非小细胞肺癌。FDA/NMPA批准纳武利尤单抗用于黑色素瘤、非小细胞肺癌、头颈部肿瘤、结直肠癌、胃癌、肝癌和食管癌等患者。RMC4630、BBP398、JAB3312均是SHP2抑制剂，目前处于临床期。NMPA批准戈来雷塞（JAB-21822）适用于至少接受过一种系统性治疗的鼠类肉瘤病毒癌基因（KRAS）G12C 突变型的晚期非小细胞肺癌（NSCLC）成人患者。GDC6036是靶向KRAS G12C突变的抑制剂，目前处于临床期。GH35是一种KRAS G12抑制剂，目前处于临床期。RMC-6236是一种泛KRAS抑制剂，目前处于临床期。JMKX1899是一款新型、高效、口服的KRAS抑制剂，其可通过与 KRAS（G12C）特异地、不可逆的结合，阻止GDP转化为GTP，维持在失活状态，从而抑制下游通路的激活，抑制胞外调节蛋白激酶（ERK）磷酸化，阻止肿瘤细胞的增殖和生长，促进细胞凋亡。国家药监局药品审评中心（CDE）官网将其拟纳入突破性治疗品种，拟用于治疗至少接受过一种系统性治疗的KRAS G12C突变的晚期或转移性非小细胞肺癌（NSCLC）患者。BEBT-607是一种高活性KRAS G12C抑制剂，目前处于临床期。LY3537982一种高活性KRAS G12C抑制剂，目前处于临床期。
  clinical: '一项全球、单臂、II期临床研究，旨在评估索托拉西布（口服，每日两次，960mg）用于局部晚期或转移性KRAS G12C突变NSCLC患者的疗效和安全性。经评估，124例患者基线时至少有1个可测量病灶并可评估疗效。46例患者达到确认的缓解，其中3例为完全缓解，43例部分缓解。ORR为37.1%，DCR为80.6%，中位PFS为6.8个月。81%患者（101/124）观察到肿瘤缩小，中位DOR为10个月[2021 WCLC PS01.07]。一项多中心、开放标签的Ⅰ期临床研究，评估索托拉西布 在具有KRAS G12C突变的实体肿瘤中的安全性、耐受性、药效动力学和有效性。该试验共入组 35 例患者，其中 14 例 NSCLC 患者、19 例结直肠癌（CRC）患者、 2 例阑尾癌患者。该试验共有 29 例可评估患者，其中 10 例 NSCLC 患者、18 例 CRC 患者、1 例阑尾癌患者。结果显示，10 例 NSCLC 中有 5 例部分缓解、4 例疾病稳定、1 例疾病进展，ORR 为 50%，疾病控制率 90%。5 例部分缓解的患者仍在继续服药中[NCT03600883]。

    FDA批准阿达格拉西布+西妥昔单抗用于治疗结直肠癌，是基于一项KRYSTAL-1 研究的多中心、单臂、开放标签的扩展队列I/II期临床试验，旨在评估阿达格拉西布联合西妥昔单抗治疗既往接受过治疗KRAS G12C突变的不可切除或转移性结直肠癌患者的疗效和安全性。在94例入组患者中，中位随访时间为11.9个月，ORR为34%（95% CI：25%，45%），疾病控制率（DCR）为85.1% (95% CI, 76.3，91.6），中位DOR为5.8个月（95% CI：4.2，7.6）。31%的应答患者的DOR至少为6个月。中位PFS为6.9个月(95% CI, 5.7，7.4)，中位OS为15.9个月(95% CI, 11.8，18.8)[NCT03785249]。一项Ⅰ期临床研究，评估阿达格拉西布在具有KRAS G12C突变的实体肿瘤中的安全性、耐受性、药效动力学和有效性。纳入了 17例既往接受过全身治疗的 KRAS G12C突变的不可手术或晚期实体瘤患者，12 例患者可供评估，其中 6 例非小细胞肺癌、4 例结直肠癌、2 例阑尾癌。研究表明，6 例非小细胞肺癌患者中，3 例疾病稳定，3 例部分缓解（有 2 例尚未确认），总有效率 50%，疾病控制率 100%；4 例结直肠癌患者）中，1 例产生应答，总有效率 25%，疾病控制率 75%；2 例阑尾癌患者中，2 例疾病稳定，总有效率 0%，疾病控制率 100%。该研究的 I/II 期临床试验，正在招募中[NCT03785249]。阿达格拉西布对比多西他赛在携带 KRAS G12C 突变的晚期非小细胞肺癌患者中的III期研究，正在招募中[NCT04685135]。

    氟泽雷塞获批用于非小细胞肺癌是基于一项在中国开展的临床II期单臂注册研究结果。研究旨在评估氟泽雷塞单药在标准治疗失败或不耐受且携带KRAS G12C突变的晚期非小细胞肺癌受试者中的安全性、耐受性和疗效。共有116例NSCLC受试者纳入分析。研究结果显示，氟泽雷塞片显示出优异的抗肿瘤活性，客观缓解率（ORR）达46.6%，达到了预设的主要终点；疾病控制率（DCR）达90.5%；中位缓解持续时间（DoR）为8.3个月，出现肿瘤缓解的受试者53.7%仍在治疗中；中位无进展生存期（PFS）8.3个月，中位总生存期（OS）尚未达到,患者总体耐受性良好[NCT05005234]。一项评估氟泽雷塞（GFH925/IBI351）在具有KRAS G12C突变的晚期实体瘤患者中的安全性/耐受性、药代动力学和有效性的开放标签、多中心I/II期临床研究正在进行中[NCT05005234，CTR20211933]。一项I期临床试验，氟泽雷塞（GFH925/IBI351）联合西妥昔单抗治疗KRAS G12C突变转移性结肠癌受试者的研究正在进行中[NCT05497336，CTR20221972]。

    格索雷塞的获批是基于一项单臂、多中心的II期临床研究，旨在评估格索雷塞在治疗KRAS G12C突变阳性晚期非小细胞肺癌（NSCLC）患者中的疗效和安全性。该项研究数据表明，在既往接受过治疗且携带KRAS G12C突变的非小细胞肺癌（NSCLC）患者中，格索雷塞显示出了较高的肿瘤缓解率和较长的缓解持续时间（客观缓解率（ORR）：50%，疾病控制率（DCR）：89%，中位缓解持续时间（DOR）：12.8个月，中位无进展生存期（PFS）：7.6个月）[NCT05383898]。

    一项Ⅰb/II期临床研究，纳入33例KRAS G12C突变晚期NSCLC患者经索托拉西布联合阿法替尼治疗后，10名患者获得PR，25名患者获得疾病控制。整体客观有效率30.3%，疾病控制率（DCR）75.8%，中位无进展生存期（PFS）4.1个月[NCT04185883，AACR_2021]。一项Ⅰb/II期临床研究，纳入18例KRAS G12C突变晚期NSCLC患者经索托拉西布联合曲美替尼治疗后，客观有效率20.0%，疾病控制率86.7%，中位无进展生存期4.2月[AACR_2021]。2021年ESMO会议报道Ib 期临床试验CodeBreaK 101剂量探索数据显示，索托拉西布联合帕尼单抗安全可耐受，数据显示，26例结直肠癌患者中客观缓解率(ORR)为27%；疾病控制率（DCR）为81%（ESMO 2021,434P，NCT04185883）。

    JDQ443治疗携带KRAS G12C突变的非小细胞肺癌II期临床研究显示，在20例非小细胞肺癌患者当中，JDQ443治疗的整体缓解率为35%，接受推荐剂量治疗的患者ORR为57%（4/7）[2022 AACR]。JDQ443与多西他赛在局部晚期或转移性KRAS G12C突变非小细胞肺癌患者中的III期比较研究，尚未开始招募[NCT05132075]。

    一项关于RMC4630和索托拉西布联合治疗KRAS G12C突变的非小细胞肺癌开放、多中心的II期研究，目前正在招募患者[NCT05054725]。

    一项BBP398联合索托拉西布用于KRAS G12C突变的晚期实体瘤患者的I期研究，目前正在招募患者[NCT05480865]。一项BBP398联合纳武利尤单抗用于治疗携带KRAS基因突变的晚期非小细胞肺癌患者的I期临床试验正在招募患者[NCT05375084]。

    一项评价戈来雷塞用于治疗对KRAS G12C突变的成人实体肿瘤的安全性、耐受性、药代动力学和抗肿瘤活性的初步证据的多中心、开放性I/II期临床研究，目前正在招募患者[NCT05002270]。戈来雷塞联合JAB3312用于治疗KRAS p.G12C突变的晚期实体瘤的安全性、耐受性、药代动力学和抗肿瘤活性的I/IIa期研究，目前正在招募患者[NCT05288205]。

    一项评估GDC6036作为单一药物并与其他抗癌疗法联合用于治疗携带KRAS G12C突变的晚期或转移性实体瘤患者的安全性，药代动力学和活性的Ia/Ib期临床试验，目前正在招募患者[NCT04449874]。

    一项评价GH35片在KRAS突变的晚期实体瘤患者中有效性、安全性、耐受性、药代动力学特征的II期临床研究正在进行中[CTR20222296]。

    一项RMC-6236用于治疗携带RAS突变（KRAS、NRAS或HRAS在G12、G13或Q61处的任何非同义突变）的晚期实体瘤的多中心、开放标签、I/Ib期临床试验正在招募患者[NCT05379985]。

    一项评价JMKX001899片（英文名通用名 JMKX1899）在KRAS G12C突变的晚期或转移性实体瘤患者（Ⅰa期）和非小细胞肺癌患者（Ⅰb、Ⅱ期）中的安全性、耐受性、药代动力学及抗肿瘤活性的开放、多中心的Ⅰ/Ⅱ期临床研究正在进行中[CTR20220611]。

    一项两阶段、多中心、开放性的Ⅰ期临床研究，评价BEBT-607在伴有KRAS G12C突变的晚期或转移性实体瘤患者中的安全耐受性、药代动力学和初步疗效的试验正在进行中[CTR20231811]。

    一项在携带KRAS G12C突变的晚期实体瘤中国患者中评价LY3537982的药代动力学、安全性、耐受性和抗肿瘤活性的开放标签、单臂、多中心、Ⅰ期研究正在进行中[CTR20240285]。'
