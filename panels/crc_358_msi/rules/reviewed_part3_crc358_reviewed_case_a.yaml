  relation: 该样本检出KRAS基因c.34G>T，p.G12C错义突变，该突变会引起下游信号通路的上调，从而使细胞过度生长、增殖。安卓健是RAS基因强效抑制剂，是直接抑制RAS基因的小分子靶向药物。
  clinical: 研究表明，安卓健可通过调节AMPK（腺苷酸激活蛋白激酶）或PI3K/mTOR途径抑制肺癌和肝癌细胞的生长[29130448]。有研究表明，安卓健可通过诱导多种细胞周期调节剂和线粒体抗凋亡蛋白的下调，从而增加KRAS的表达及其磷酸化。KRAS的表达上调可能通过与Bcl-xL的关联促进细胞凋亡[21840189]。一项由 Golden Biotechnology Corporation 主办、PharmaNet 协办的 I 期临床试验，旨在评估安卓健治疗非小细胞肺癌（NSCLC）患者的安全性、耐受性和疗效，从而确定安卓健的最大可耐受剂量（MTD）。该试验共招募13 例转移性非小细胞肺腺癌患者，其中 3 例患者疾病稳定，最常见的治疗相关的不良事件是腹泻、呕吐和恶心。安卓健每天给药，持续四周，显示出良好的安全性和耐受性，II 期研究的推荐剂量为每天≥600mg[NCT01134016，26807250]。一项评估安卓健用于治疗两种抗癌治疗失败后的IV期非小细胞肺癌（NSCLC）患者的疗效的临床实验，结果发现总人群1年PFS为11.4％，总人群1年OS为39.3％，总体疾病控制率为72.7%，其中，KRAS阴性为100%，KRAS阳性为50%，虽然KRAS阴性组明显优于KRAS阳性组，但安卓健仍然是KRAS阳性患者有效的药物[NCT02047344]。
