  drug_name: 贝美替尼（Binimetinib）、贝美替尼+哌柏西利（Binimetinib+Palbociclib）、贝美替尼+阿培利司（Binimetinib+Alpelisib）、贝美替尼+厄洛替尼（Binimetinib+Erlotinib）
  relation: 该样本检出KRAS基因c.34G>T，p.G12C错义突变，该突变会引起下游信号通路的上调，从而使细胞过度生长、增殖。携带该突变的肿瘤患者可能从RAS/RAF/MEK/ERK信号通路的下游MEK1/2激酶抑制剂获益。贝美替尼（MEK162）是一种MEK1/2激酶抑制剂。FDA批准贝美替尼与康奈非尼联合用于治疗BRAF V600E或V600K突变的不可切除或转移性黑色素瘤。哌柏西利是CDK4/CDK6抑制剂，FDA批准哌柏西利联合芳香酶抑制剂作为以内分泌治疗为基础的初始治疗用于绝经后HR阳性HER2阴性（HR+HER2-）的晚期或转移性乳腺癌；哌柏西利联合氟维司群用于治疗内分泌治疗后疾病进展的HR+HER2-的晚期或转移性乳腺癌。NMPA批准哌柏西利联合芳香酶抑制剂作为以内分泌治疗为基础的初始治疗，用于绝经后HR阳性HER2阴性（HR+HER2-）的晚期或转移性乳腺癌。厄洛替尼是一种表皮生长因子受体酪氨酸激酶抑制剂（EGFR-TKIs）药物。FDA批准厄洛替尼用于治疗非小细胞肺癌、胰腺癌；NMPA批准厄洛替尼用于治疗非小细胞肺癌。阿培利司是磷脂酰肌醇-3-激酶（PI3K）的抑制剂，能够抑制PI3Kα的活性。FDA批准阿培利司联合氟维司群用于治疗HR阳性、HER2阴性、PIK3CA突变的晚期或转移性乳腺癌的绝经后女性患者和男性患者。
  clinical: 体外研究显示，具有KRAS突变的胰腺癌细胞系对贝美替尼（MEK162）高度敏感，在敏感细胞系中贝美替尼可阻断ERK1/2，同时抑制PI3K和S6，增强p27KIP1的水平[25167228]。贝美替尼用于RAS/RAF/MEK激活实体瘤的临床试验已完成，结果显示实体瘤在第 16 周时的临床受益率（CBR）为23.1%[NCT01885195]。贝美替尼联合哌柏西利用于携带KRAS基因突变的晚期非小细胞肺癌患者的临床试验正在招募患者[NCT03170206]。一项贝美替尼联合阿培利司用于实体瘤的临床IB研究显示，58名入组的患者中，18名患者具有超过6周的疾病稳定期；其中4名具有KRAS突变的卵巢癌患者中，有3名患者局部缓解；此外，1名具有NRAS突变的黑色素瘤患者及1名具有KRAS突变的子宫内膜癌患者局部缓解[2014 ASCO Abstract 9051]。一项临床前模型研究表明，MEK抑制剂与CDK4/6抑制剂哌柏西利联合有显著的抗KRAS突变的NSCLC活性，而且有放射增敏作用，为晚期KRAS突变的NSCLC患者提供了一种潜在的治疗策略[26728409]。贝美替尼联合厄洛替尼用于携带KRAS/EGFR基因突变的非小细胞肺癌患者的临床试验正在开展，尚未招募患者[NCT01859026]。
