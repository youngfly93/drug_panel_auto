    Governed corrections for six legacy exact-variant narratives among the
    P3-F2 CRC358-only chromatin genes. Static database absence, domain position,
    expression or knockout experiments, family-level cohort observations, and
    cross-lineage evidence are not treated as proof of the detected variant.
  source_type: reviewed_knowledge_correction_overlay
  source_id: crc358_p3f2_legacy_exact_corrections_20260721
  created_at: "2026-07-21"
  privacy: No patient or sample identifiers are stored.
