schema_version: 1
source:
  panel: crc_358_msi
  purpose: >-
    P3-F2 first-review fallbacks for 24 CRC358-only chromatin remodeling,
    DNA/histone modification, transcriptional corepressor, and lineage
    transcription genes remaining after P3-F1.
  source_type: official_gene_identity_plus_conservative_chromatin_event_boundary
  curated_at: "2026-07-21"
  scope: colorectal_cancer_crc358_only_chromatin_conservative_fallback
  privacy: No patient or sample identifiers are stored.
  content_boundary: >-
    An ordinary tumor sequence variant does not establish a fusion,
    amplification, deletion, expression or methylation phenotype, protein
    complex defect, histone-mark change, biallelic loss, germline syndrome,
    hematologic clone, or drug response. Evidence is not transferred between
    paralogs, family members, tumor lineages, or molecular event types.
