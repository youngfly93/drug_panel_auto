      - {type: pubmed, id: PMID-29872864, url: https://pubmed.ncbi.nlm.nih.gov/29872864/}

  - gene: TRRAP
    panels: [crc_358_msi]
    intro: >-
      TRRAP编码PIKK家族大型支架蛋白，是多种组蛋白乙酰转移酶复合物的共同组分，并参与染色质募集、转录和DNA修复调控。
    mutation_analysis: >-
      TRRAP表达、HAT复合物装配、胚系发育/听觉表型和普通肿瘤序列位点不能互相替代；其PIKK家族归属也不等于具有PI3K或mTOR药物靶点性质。未知结直肠癌位点需直接复合物和功能证据，不能自动形成治疗结论。
