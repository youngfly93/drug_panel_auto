          id: AMP-ASCO-CAP-somatic-variant-interpretation-2017
          url: https://pubmed.ncbi.nlm.nih.gov/27993330/
        - type: guideline
          id: CAP-ASCP-AMP-ASCO-CRC-biomarker-guideline-2017
          url: https://www.cap.org/cap-guidelines/molecular-biomarkers-for-the-evaluation-of-colorectal-carcinoma/

# The CRC358 denominator historically contains both the current symbol NSD2
# and its alias WHSC1. This is one biological entity, not two independent genes.
# Keep both declared input keys for compatibility. P3-F3 implements a
# panel-scoped WHSC1 -> NSD2 identity map: lookup can reuse the governed WHSC1
# knowledge, while report labels retain the first input symbol and identical
# alias/canonical variant rows deduplicate on the canonical identity.
identity_collision_contract:
  - canonical_symbol: NSD2
    ncbi_gene_id: 7468
    historical_aliases: [WHSC1]
    declared_panel_keys: [NSD2, WHSC1]
    identity_status: confirmed_same_biological_gene
    runtime_normalization_status: active_panel_scoped_alias_lookup_and_variant_dedup
    runtime_mapping: {WHSC1: NSD2}
    coverage_accounting: retain_both_declared_keys_but_resolve_both_to_one_biological_identity
    report_display_policy: preserve_first_input_symbol_and_deduplicate_identical_variant_identity
    source_refs:
      - {type: ncbi_gene, id: NCBI-Gene-7468, url: https://www.ncbi.nlm.nih.gov/gene/7468}

