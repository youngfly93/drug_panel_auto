schema_version: 1
source:
  panel: crc_358_msi
  purpose: >-
    Governed corrections for the two legacy exact-variant narratives among
    P3-F3 lineage/transcription genes. Domain position, database absence,
    expression studies, developmental disease, other-cancer cohorts, and
    hematologic-lineage evidence are not treated as proof of the detected CRC
    variant.
  source_type: reviewed_knowledge_correction_overlay
  source_id: crc358_p3f3_legacy_exact_corrections_20260721
  created_at: "2026-07-21"
  privacy: No patient or sample identifiers are stored.
