  schema_version: "1.0"
  policy_id: crc358_p3f3_legacy_exact_correction_first_review_20260721
  defaults:
    gene:
      review_status: approved_for_runtime
      runtime_eligible: true
      review_basis: codex_first_review_correction_of_legacy_domain_expression_developmental_or_cross_tumor_prose
      reviewer: codex
