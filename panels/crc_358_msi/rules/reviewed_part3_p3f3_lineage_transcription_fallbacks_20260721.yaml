schema_version: 1
source:
  panel: crc_358_msi
  purpose: >-
    P3-F3 first-review fallbacks for 18 CRC358-only lineage and transcription
    regulators remaining after P3-F2.
  source_type: official_gene_identity_plus_conservative_lineage_transcription_event_boundary
  curated_at: "2026-07-21"
  scope: colorectal_cancer_crc358_only_lineage_transcription_conservative_fallback
  privacy: No patient or sample identifiers are stored.
  content_boundary: >-
    An ordinary colorectal-cancer sequence variant does not establish a
    fusion or rearrangement, copy-number or expression state, germline
    developmental syndrome, hematologic-lineage event, transcriptional
    program, or treatment response. Evidence is not transferred between
    paralogs, binding partners, family members, or historical symbol aliases.
governance:
  schema_version: "1.0"
  policy_id: crc358_p3f3_lineage_transcription_first_review_20260721
  defaults:
    gene:
      review_status: approved_for_runtime
      runtime_eligible: true
      review_basis: codex_first_review_official_identity_and_lineage_transcription_event_boundary
      reviewer: codex
      reviewer_type: ai_assisted_evidence_review
      reviewed_at: "2026-07-21"
      evidence_as_of: "2026-07-21"
      evidence_level: official_gene_identity_plus_conservative_event_boundary
      cancer_scope: colorectal_cancer_crc358_only_conservative_gene_fallback
      secondary_review_status: report_group_approved
      risk_level: high_requires_secondary_review
      source_refs:
        - type: guideline
          id: AMP-ASCO-CAP-somatic-variant-interpretation-2017
          url: https://pubmed.ncbi.nlm.nih.gov/27993330/
        - type: guideline
          id: CAP-ASCP-AMP-ASCO-CRC-biomarker-guideline-2017
          url: https://www.cap.org/cap-guidelines/molecular-biomarkers-for-the-evaluation-of-colorectal-carcinoma/

