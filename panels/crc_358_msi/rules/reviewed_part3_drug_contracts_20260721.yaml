  - gene: EGFR
    panels: [crc_301_msi, crc_358_msi]
    c_hgvs: c.2387G>A
    p_hgvs: p.G796D
    type: benefit
    header: EGFR：c.2387G>A，p.G796D突变相应靶向药物
    drug_name: 阿法替尼（Afatinib）、TQB3804、EMB01、MCLA-129
    relation: >-
      该样本检出EGFR基因c.2387G>A，p.G796D错义突变。原始研究将G796D报道为奥希替尼耐药机制，而不是阿法替尼、TQB3804、EMB01或MCLA-129在结直肠癌中的位点专属获益证据[28572531]。本条保留历史CRC358终版的四药显示合同，但明确其证据边界：阿法替尼属于EGFR家族抑制剂，TQB3804为在研EGFR抑制剂，EMB01与MCLA-129为EGFR/MET双靶向候选药物；列表命中本身不等同于已经证实G796D结直肠癌对这些药物敏感。
    clinical: >-
      NCT02465060评估阿法替尼治疗携带EGFR激活变异的难治性肿瘤；历史终版另登记了TQB3804和EMB01的早期试验（CTR20192284、CTR20190241）。NCT04868877评估MCLA-129单药或联合方案治疗晚期非小细胞肺癌及其他实体瘤，其中包括部分具有或不具有EGFR/c-MET异常的队列。上述试验均不能作为p.G796D结直肠癌逐位点疗效证明，因此本条仅作历史候选方案和临床试验线索，需报告组二审及临床医生结合适应证判断。
    review_basis: historical_crc358_final_contract_with_corrected_g796d_resistance_attribution
    evidence_level: historical_level_c_display_plus_cross_cancer_early_trial_not_g796d_crc_efficacy
    cancer_scope: colorectal_report_display_contract_direct_g796d_benefit_unproven
