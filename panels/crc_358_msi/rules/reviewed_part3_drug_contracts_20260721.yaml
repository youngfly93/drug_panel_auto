  - &erbb2_g660d_benefit
    gene: ERBB2
    panels: [crc_301_msi, crc_358_msi]
    c_hgvs: c.1979G>A
    p_hgvs: p.G660D
    type: benefit
    header: ERBB2：c.1979G>A，p.G660D突变相应靶向药物
    drug_name: 阿法替尼、曲妥珠单抗、恩美曲妥珠单抗、曲妥珠单抗+帕妥珠单抗、吡咯替尼、德曲妥珠单抗、曲妥珠单抗+图卡替尼、奈拉替尼+依维莫司、奈拉替尼+哌柏西利、奈拉替尼+曲美替尼、波齐替尼、吡咯替尼+曲妥珠单抗、德曲妥珠单抗+奈拉替尼、奈拉替尼±曲妥珠单抗、拉帕替尼
    relation: >-
      该样本检出ERBB2基因c.1979G>A，p.G660D错义突变。G660D位于HER2跨膜结构域，原始研究显示该变异可促进HER2激活；曲妥珠单抗、帕妥珠单抗、奈拉替尼和阿法替尼能够在模型中抑制G660D突变体活性[30449325]，阿法替尼还具有G660D相关临床前和跨癌种病例证据[26545934，29146616]。其余ADC、小分子抑制剂及联合方案主要来自HER2突变、扩增或表达异常类别的历史报告合同和早期研究，并非全部具有p.G660D结直肠癌逐药确证证据。
    clinical: >-
      NCT01953926等篮式研究评估奈拉替尼单药或联合曲妥珠单抗治疗HER2突变实体瘤，并包含结直肠癌队列；NCT05372614评估德曲妥珠单抗联合奈拉替尼治疗HER2阳性或已知HER2激活突变的实体瘤。既有研究提示G660D具有HER2可靶向生物学基础，但不同癌种、不同药物及联合方案的临床证据强度并不相同。本条完整迁移2.1药物集合，同时明确除直接证据外的药物仅为HER2类别候选，不构成逐药获批适应证。
    review_basis: historical_crc358_final_contract_plus_primary_g660d_review
    evidence_level: direct_g660d_preclinical_and_cases_plus_her2_class_early_trials
    cancer_scope: colorectal_report_g660d_direct_and_her2_class_evidence_separated
    variant_evidence_scope: exact_g660d_for_afatinib_and_her2_blockade_other_items_class_level
