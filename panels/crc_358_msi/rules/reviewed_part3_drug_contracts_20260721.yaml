drug_sections:
  - &setd2_lof_benefit
    gene: SETD2
    panels: [crc_301_msi, crc_358_msi]
    type: benefit
    applicability: loss_of_function
    header: SETD2功能缺失型变异相应潜在获益药物
    drug_name: AZD1775
    relation: >-
      SETD2功能缺失可造成H3K36me3下降。细胞和异种移植模型显示，H3K36me3缺失与WEE1抑制剂AZD1775之间存在合成致死效应[26602815]；这一关联只适用于有依据支持功能缺失的变异，不能外推到普通错义变异，也不代表AZD1775已获批用于SETD2变异结直肠癌。
    clinical: >-
      NCT03284385纳入18例携带SETD2致病变异的晚期实体瘤患者评估AZD1775单药，两个队列均未观察到客观缓解，研究在第一阶段后停止入组；部分患者出现轻微肿瘤缩小或疾病稳定[38920407]。因此，历史C级显示仅保留为临床前机制和研究线索，现有临床结果不支持把SETD2功能缺失解释为已确证的AZD1775单药获益标志。
    review_basis: primary_preclinical_signal_with_negative_phase_ii_result
    evidence_level: preclinical_synthetic_lethality_phase_ii_no_objective_response
    cancer_scope: pathogenic_setd2_loss_cross_cancer_not_crc_approval
    variant_evidence_scope: loss_of_function_only_not_any_setd2_variant
    supersedes: unscoped_setd2_gene_override_and_legacy_p_g1644_star_entry
