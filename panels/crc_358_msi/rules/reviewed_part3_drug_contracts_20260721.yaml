  - &erbb2_g660d_caution
    gene: ERBB2
    c_hgvs: c.1979G>A
    p_hgvs: p.G660D
    type: caution
    header: ERBB2：c.1979G>A，p.G660D突变相应负相关靶向药物
    drug_name: 西妥昔单抗、帕尼单抗、奈拉替尼
    relation: >-
      HER2激活变异可在结直肠癌模型中旁路激活下游信号并降低西妥昔单抗、帕尼单抗等抗EGFR单抗的作用，因此这两种药物保留为D级负相关提示[26243863]。奈拉替尼单药的方向属于癌种和方案层级：G660D模型存在对奈拉替尼敏感的直接证据[30449325]，但HER2突变结直肠癌篮式队列中奈拉替尼单药总体活性有限；因此其D级慎用提示不能解释为G660D对奈拉替尼的位点专属耐药，亦不否定上方经研究登记的奈拉替尼联合方案。
    clinical: >-
      结直肠癌中HER2激活可构成抗EGFR治疗的旁路耐药机制，双重HER2靶向策略在模型或临床研究中与单独抑制EGFR具有不同的证据基础。奈拉替尼单药与奈拉替尼联合曲妥珠单抗等方案也必须分开判断；本条按历史2.1方向保留慎用项，并将“单药癌种层级低活性”与“G660D位点直接耐药”明确区分，等待报告组二审。
