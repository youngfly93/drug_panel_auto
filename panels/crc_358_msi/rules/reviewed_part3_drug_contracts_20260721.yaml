  - gene: FLT3
    panels: [crc_301_msi, crc_358_msi]
    c_hgvs: c.2537G>A
    p_hgvs: p.G846D
    type: benefit
    header: FLT3：c.2537G>A，p.G846D突变相应靶向药物
    drug_name: 瑞戈非尼、索拉非尼、舒尼替尼
    relation: >-
      该样本检出FLT3基因c.2537G>A，p.G846D错义突变；既有功能研究提示该位点可增强FLT3相关信号[38049555]。瑞戈非尼、索拉非尼和舒尼替尼均为多靶点激酶抑制剂，但其历史依据主要来自FLT3异常血液肿瘤、FLT3扩增实体瘤或非位点特异研究；FLT3扩增、FLT3-ITD与p.G846D不能视为同一生物标志物，也不能由这些资料推导三种药物已被证实对p.G846D结直肠癌有效。
    clinical: >-
      个案曾报道一例伴FLT3扩增且同时存在其他基因异常的难治性转移性结直肠癌在索拉非尼治疗后出现临床改善[25848357]；另一项FLT3扩增研究同时观察到患者反应与患者来源细胞对瑞戈非尼/索拉非尼缺乏明显抑制，作者认为FLT3扩增尚不能作为可靠的FLT3抑制剂敏感标志[27906677]。NCT02029001是一项按分子改变匹配用药的晚期实体瘤篮式研究，其中索拉非尼队列允许FLT3突变或扩增，但其设计未限定结直肠癌或p.G846D位点，不能作为该位点疗效已获证实的依据。因此，本条仅迁移历史C级候选药物集合并披露证据冲突，不构成p.G846D结直肠癌逐药疗效结论。
    review_basis: historical_flt3_g846d_contract_with_amplification_boundary_and_conflict_disclosed
    evidence_level: functional_variant_signal_plus_cross_event_case_and_conflicting_preclinical_data
