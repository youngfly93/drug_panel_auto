  - gene: TP53
    panels: [crc_301_msi, crc_358_msi]
    c_hgvs: c.821T>A
    p_hgvs: p.V274D
    type: benefit
    header: TP53：c.821T>A，p.V274D突变相应靶向药物
    drug_name: AZD1775、AZD1775+奥拉帕利、Alisertib、Alisertib+AZD1775、Eprenetapopt
    relation: >-
      该样本检出TP53基因c.821T>A，p.V274D错义突变。该位点位于p53蛋白DNA结合结构域；本条药物证据主要来自TP53功能异常或TP53突变类别，而不是p.V274D位点专属疗效研究。AZD1775为WEE1抑制剂，Alisertib为AURKA抑制剂，Eprenetapopt为p53再激活候选药物；这些药物及组合在本报告中均属于跨癌种、早期临床或临床前证据，不等同于已获批的p.V274D结直肠癌适应证[28978051]。
    clinical: >-
      早期临床研究曾评估AZD1775单药或联合治疗难治性实体瘤，并观察TP53状态与反应差异[27601554]；其余方案也主要来自TP53异常肿瘤的临床前或早期研究。由于不存在p.V274D结直肠癌的逐位点确证疗效，本条仅迁移既有2.1显示合同，最终用药应结合癌种、病程、正式适应证和报告组二审。
    variant_evidence_scope: tp53_alteration_class_not_p_v274d_specific
    source_refs:
