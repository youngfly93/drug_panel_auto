  - &atm_class_benefit
    gene: ATM
    panels: [crc_301_msi, crc_358_msi]
    type: benefit
    header: ATM变异相关潜在获益药物
    drug_name: 奥拉帕利、芦卡帕利、尼拉帕利、他拉唑帕利、AZD6738+奥拉帕利、阿维鲁单抗+他拉唑帕利、LY2606368、盐酸可泮利塞+奥拉帕利+度伐利尤单抗、奥拉帕利+帕博利珠单抗、帕米帕利+替雷利珠单抗、芦卡帕利+阿替利珠单抗、他拉唑帕利+阿替利珠单抗
    relation: >-
      ATM参与DNA损伤应答和双链断裂修复。历史规则将PARP、ATR、CHK1及免疫联合候选方案用于ATM异常的研究提示；这些证据主要来自前列腺癌或跨癌种DDR篮式研究，并非任一ATM位点在结直肠癌中的逐药疗效证明。药物列表的命中不等同于这些方案已获批用于ATM变异结直肠癌，尤其不能把证据不足的普通错义变异直接等同于ATM功能缺失。
    clinical: >-
      既有研究和试验登记曾评估奥拉帕利、芦卡帕利、尼拉帕利、他拉唑帕利及多种联合方案用于ATM或其他DDR基因异常肿瘤[26510020，NCT01682772，NCT02576444，NCT03413995，NCT04276376]。这些研究的癌种、入组标志和方案不同，ATM亚组证据也不能合并成十二种药物对结直肠癌的同等获益结论；本条仅迁移既有2.1显示合同并显式保留癌种、变异功能和证据等级边界，等待报告组二审。
    review_basis: historical_atm_display_contract_with_cross_cancer_boundary
