schema_version: '1.0'
panel_id: lung_13
rule_id: medical_candidates
version: 0.2.1
updated: '2026-08-10'
status: controlled_pilot_partial_promotion
description: 'Evidence-bounded, exact-event lung588 treatment catalog. Three treatment candidates across two exact
  events are mirrored into rules/drugs.yaml for the controlled pilot under exact selector and clinical-context checks;
  all other candidates and historical claims remain non-runtime.

  '
governance:
  policy_id: lung588_exact_event_candidate_review_v1
  purpose: 'Preserve a traceable disposition of the historical display contract while preventing cross-cancer, gene-only,
    or unreviewed claims from entering a patient report.

    '
  evidence_as_of: '2026-08-09'
  runtime_policy:
    enabled: true
    runtime_rule_source: false
    promoted_rules_mirrored_to: rules/drugs.yaml
    report_text_allowed: only_for_promoted_exact_rules_after_context_match
    promotion_requires:
    - report_group_event_level_secondary_review
    - exact_selector_and_cancer_scope_review
    - current_label_or_guideline_version_check
    - positive_and_negative_rule_tests
    - case_level_uat
  promotion_context_contract:
    status: implemented_required_for_controlled_pilot
    contract_rule: clinical_context
    runtime_enforcement: implemented_fail_closed
    promotion_blocked: false
    missing_or_uncertain_policy: keep_candidate_hidden
    activation_requirement: 'Every promoted rule requires all event-specific clinical context fields with label-compatible,
      non-uncertain values; download still requires a case-level report-group review record.

      '
  historical_inventory:
    source: two de-identified repaired historical lung588 final reports
    exact_targeted_event_count: 15
    targeted_drug_claim_count: 169
    historical_level_counts:
      A: 9
      B: 0
      C: 146
      D: 14
    selected_candidate_claim_count: 4
    promoted_candidate_claim_count: 3
    not_migrated_claim_count: 165
    disposition: 'Historical report text is evidence of an old display contract, not current medical truth. Only
      the four exact-event candidates below were retained for review. Three evidence-bounded candidates are available
      in the controlled pilot; the fourth and all other claims remain outside runtime.

      '
  default_review:
    review_status: needs_review
    runtime_eligible: false
    secondary_review_status: case_level_report_group_review_required
    reviewer: codex
    reviewer_type: ai_assisted_evidence_triage
    risk_level: high
