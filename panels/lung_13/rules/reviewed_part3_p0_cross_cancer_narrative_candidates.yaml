  c_hgvs: c.1781A>G
  p_hgvs: p.D594G
  variant_kind: missense
  intro: 'BRAF编码RAF家族丝氨酸/苏氨酸蛋白激酶，参与调控MAPK/ERK信号通路， 该通路影响细胞分裂、分化和分泌。

    '
  mutation_analysis: '在转录本NM_004333.6上，c.1781A>G对应p.D594G，为第594位天冬氨酸替换为甘氨酸的错义事件。 该事件不得继承BRAF V600E或其他BRAF位点的功能、治疗和预后证据；
    其精确功能及肺癌临床意义须按独立来源复核，当前不得形成治疗、免疫或预后结论。

    '
