governance:
  schema_version: '1.0'
  policy_id: lung588_p0_cross_cancer_narrative_first_review_v1
  purpose: 'Offer source-bounded replacement wording for secondary review while preventing any candidate from changing
    the current runtime report.

    '
  defaults:
    gene:
      review_status: needs_review
      runtime_eligible: false
      report_text_allowed: false
      patient_visible: false
      review_basis: codex_first_review_ncbi_gene_and_hgvs_consequence
      reviewer: codex
      reviewer_type: ai_assisted_evidence_review
      reviewed_at: '2026-07-24'
      evidence_as_of: '2026-07-24'
      evidence_level: official_gene_function_plus_predicted_sequence_consequence
      cancer_scope: lung_panel_detected_exact_event_candidate
      secondary_review_status: pending_report_group_review
      risk_level: content_requires_secondary_review
  runtime_selector_contract:
    current_overlay_matches_transcript: false
    disposition: promotion_blocked_until_transcript_is_enforced
    reason: 'The current reviewed-overlay runtime key uses gene, c_hgvs and p_hgvs. Transcript is preserved below
      for review identity but is not yet enforced by the runtime loader.

      '
  promotion_requires:
  - report_group_event_level_secondary_review
  - exact_transcript_c_hgvs_p_hgvs_identity_check
  - runtime_selector_enforces_transcript
  - direct_source_supports_every_patient_visible_claim
  - positive_and_negative_rule_tests
  - case_level_uat
