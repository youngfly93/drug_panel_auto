schema_version: '1.0'
source:
  panel: lung_588_pdl1
  purpose: 'First-review replacement candidates for detected P0 events whose existing specific prose contains cross-cancer,
    other-event, treatment, prognostic or hereditary generalization that is not yet approved for lung588.

    '
  source_type: official_gene_identity_plus_hgvs_consequence_boundary
  curated_at: '2026-07-24'
  evidence_as_of: '2026-07-24'
  activation_mode: candidate_only_pending_secondary_review
  consumer_panels:
  - lung_13
  privacy: Only de-identified CASE aliases and structured events are used.
  inherited_from_panel: lung_588_pdl1
