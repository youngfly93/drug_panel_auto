  intro: 'ERBB2编码表皮生长因子受体家族的受体酪氨酸激酶。该蛋白本身没有配体结合域， 可与其他已结合配体的家族成员形成异二聚体，并增强MAPK、PI3K等下游信号通路。

    '
  mutation_analysis: '在转录本NM_004448.4上，c.1979G>A对应p.G660D，为第660位甘氨酸替换为天冬氨酸的错义事件。 本候选文案不将G660D自动等同于HER2扩增、过表达或其他ERBB2变异；
