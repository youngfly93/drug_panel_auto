schema_version: "1.0"
template_id: "crc_301_msi_golden_template_v0"
description: >
  First-pass variable map for a CRC301+MSI golden-template pilot derived from a
  reviewed final report. The map mirrors the CRC358 golden-template model while
  accounting for CRC301 table offsets.

cell_variables:
  - id: "patient_info_name"
    table: 0
    row: 0
    col: 1
    variable: "patient_name"
  - id: "patient_info_sample_type"
    table: 0
    row: 0
    col: 4
    variable: "sample_type"
  - id: "patient_info_gender"
    table: 0
    row: 1
    col: 1
    variable: "gender"
  - id: "patient_info_sampling_method"
    table: 0
    row: 1
    col: 4
    variable: "sampling_method"
  - id: "patient_info_age"
    table: 0
    row: 2
    col: 1
    variable: "age"
  - id: "patient_info_sample_site"
    table: 0
    row: 2
    col: 4
    variable: "sample_site"
  - id: "patient_info_diagnosis"
    table: 0
    row: 3
    col: 1
    variable: "clinical_diagnosis"
  - id: "patient_info_project_code"
    table: 0
    row: 3
    col: 4
    variable: "sample_id"

  - id: "biomarker_tmb_summary"
    table: 2
    row: 1
    col: 1
    variable: "tmb_summary"
  - id: "biomarker_tmb_tips"
    table: 2
    row: 1
    col: 2
    variable: "immuno_tips"
  - id: "biomarker_msi_summary"
    table: 2
    row: 2
    col: 1
    variable: "msi_summary"
  - id: "biomarker_msi_tips"
    table: 2
    row: 2
    col: 2
    variable: "msi_tips"
  - id: "biomarker_immune_positive_result"
    table: 2
    row: 3
    col: 1
    variable: "immune_positive_result"
  - id: "biomarker_immune_negative_result"
    table: 2
    row: 4
    col: 1
    variable: "immune_negative_result"
  - id: "biomarker_immune_hyperprogression_result"
    table: 2
    row: 5
    col: 1
    variable: "immune_hyperprogression_result"

paragraph_variables:
  - id: "tmb_detail_sentence"
    after_heading: "3.1 肿瘤突变负荷（TMB）水平提示"
    nonempty_offset: 1
    variable: "tmb_detail_sentence"
  - id: "tmb_detail_interpretation"
    after_heading: "3.1 肿瘤突变负荷（TMB）水平提示"
    nonempty_offset: 2
    variable: "tmb_detail_interpretation"
  - id: "tmb_drug_note"
    after_heading: "3.1 肿瘤突变负荷（TMB）水平提示"
    nonempty_offset: 3
    variable: "tmb_drug_note"
  - id: "msi_detail_sentence"
    after_heading: "3.2微卫星不稳定性（MSI）检测结果"
    nonempty_offset: 1
    variable: "msi_detail_sentence"

paragraph_templates:
  - id: "targeted_drug_tip_count_sentence"
    contains: "本次共检出体细胞变异"
    text: "*本次共检出体细胞变异：{{ total_variants_count }}个，其中与靶向药物用药相关的变异有：{{ drug_related_count }}个。"

table_loops:
  - id: "targeted_drug_tips"
    table: 1
    collection: "targeted_drug_tips"
    alias: "row"
    template_row: 1
    insert_at: 1
    remove_from: 1
    remove_to: "end"
    columns:
      - "gene"
      - "variant_site"
      - "benefit_drugs"
      - "caution_drugs"

  - id: "variants_2_1"
    table: 4
    collection: "variants_2_1"
    alias: "row"
    template_row: 2
    insert_at: 2
    remove_from: 2
    remove_to: "end"
    columns:
      - "gene"
      - "transcript"
      - "chr"
      - "exon"
      - "locus"
      - "var_type_cn"
      - "af_pct"
      - "benefit_drugs"
      - "caution_drugs"

  - id: "chemotherapy"
    table: 5
    collection: "chemotherapy"
    alias: "row"
    template_row: 1
    insert_at: 1
    remove_from: 1
    remove_to: "end"
    columns:
      - "Drug"
      - "Gene"
      - "药物适应情况"

  - id: "nccn_results"
    table: 6
    collection: "nccn_results"
    alias: "row"
    template_row: 1
    insert_at: 1
    remove_from: 1
    remove_to: "end"
    columns:
      - "gene"
      - "content"
      - "result"

  - id: "immune_positive_results"
    table: 7
    collection: "immune_positive_results"
    alias: "row"
    template_row: 1
    insert_at: 1
    remove_from: 1
    remove_to: "end"
    columns:
      - "gene"
      - "result"
      - "interpretation"

  - id: "immune_negative_results"
    table: 8
    collection: "immune_negative_results"
    alias: "row"
    template_row: 1
    insert_at: 1
    remove_from: 1
    remove_to: "end"
    columns:
      - "gene"
      - "result"
      - "interpretation"

  - id: "immune_hyperprogression_results"
    table: 9
    collection: "immune_hyperprogression_results"
    alias: "row"
    template_row: 1
    insert_at: 1
    remove_from: 1
    remove_to: "end"
    columns:
      - "gene"
      - "result"
      - "interpretation"
