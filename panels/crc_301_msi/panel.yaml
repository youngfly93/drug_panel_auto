schema_version: "1.0"
panel_id: "crc_301_msi"
display_name: "结直肠癌301基因+MSI"
version: "0.1.3"
status: "active"
description: "CRC 301 + MSI panel package reusing the CRC report pipeline."

aliases:
  - "crc_301"
  - "crc301"
  - "colorectal_301_msi"

project_detector_rules:
  keywords:
    - "301基因"
    - "结直肠癌301"
  keyword_groups:
    - any:
        - "结直肠癌301"
        - "301基因"
        - type: regex
          pattern: "(^|\\D)301(\\D|$)"
      weight: 1

enhancer: "reportgen.core.enhancer_registry:CRC358Enhancer"

default_template: "crc_301_msi_golden_template_v1"
templates:
  - id: "crc_301_msi_standard_v1"
    file: "templates/aligned_template_with_cnv_fusion_hla_FIXED.docx"
    version: "1.0.0"
    status: "active"
    description: "Legacy aligned CRC template retained as a rollback option for CRC 301 + MSI."
  - id: "crc_301_msi_golden_template_v0"
    file: "templates/crc_301_msi_golden_template_v0.docx"
    version: "0.1.0"
    status: "deprecated"
    description: "Superseded CRC301+MSI golden-template pilot kept for rollback."
    processors:
      - "part3_formatted_sections"
      - "signature_placeholder"
      - "bullet_lists"
      - "front_matter_spacing"
      - "blank_page_cleanup"
      - "toc_refresh"
      - "final_refresh_cleanup"
      - "underlines_and_styles"
  - id: "crc_301_msi_golden_template_v1"
    file: "templates/crc_301_msi_golden_template_v1.docx"
    version: "0.2.1"
    status: "active"
    description: "CRC301+MSI golden template; inherits crc_358 engine fixes (inline signatures + missing-image warning, citation-driven 5.参考文献, conditional immune-table notes, part3 2.1 formatting/variant-lead, gene-list non-bold)."
    processors:
      - "part3_formatted_sections"
      - "rebuild_references"
      - "signature_placeholder"
      - "targeted_drug_brand_summary"
      - "immune_table_notes"
      - "bullet_lists"
      - "signature_layout"
      - "front_matter_spacing"
      - "blank_page_cleanup"
      - "toc_refresh"
      - "final_refresh_cleanup"
      - "underlines_and_styles"

mappings:
  default: "config/mapping.yaml"

rules:
  panel_rules: "rules/crc.yaml"
  report_text: "rules/report_text.yaml"
  biomarkers: "rules/biomarkers.yaml"
  guideline_tables: "rules/guideline_tables.yaml"
  drugs: "rules/drugs.yaml"
  knowledge_coverage: "rules/knowledge_coverage.yaml"
  style: "rules/style.yaml"
  filtering: "config/filtering.yaml"
  drug_brands: "config/drug_brands.yaml"

# Reviewed Part-3 wording overlay (panel-scoped). CRC-301 reuses CRC-358's
# reviewed wording (same cancer family). Top-level, not under `rules:`.
fixed_domain_source_policy: "internal_curated_column_authoritative"
reviewed_part3_overlay: "panels/crc_358_msi/rules/reviewed_part3_knowledge.yaml"
reviewed_part3_overlay_additions:
  - "rules/reviewed_part3_knowledge.yaml"
  # Protein structure is cancer-independent; reuse the governed CRC358 catalog
  # for shared genes, then fill only CRC301-specific residuals below.
  - "panels/crc_358_msi/rules/reviewed_part3_domain_catalog.yaml"
  - "rules/reviewed_part3_domain_catalog.yaml"
  # Shared CRC corrections replace conflicting legacy domain tails with one
  # official reviewed protein statement (including PIK3CA/SMAD4).
  - "panels/crc_358_msi/rules/reviewed_part3_domain_overlay_20260720.yaml"
  # Shared high-risk gene fallbacks add only stable function and event-class
  # boundaries. Exact variant rules retain precedence and no drug row is added.
  - "panels/crc_358_msi/rules/reviewed_part3_gene_fallbacks_20260721.yaml"
  # Shared CRC-important fallbacks are panel-scoped per row; CRC301 loads only
  # its five declared genes and receives no CRC358-only knowledge.
  - "panels/crc_358_msi/rules/reviewed_part3_crc_important_fallbacks_20260721.yaml"
  # P2-A candidate-gene fallbacks preserve alteration-class boundaries without
  # creating drug matches; CRC358-only rows are filtered by each row's scope.
  - "panels/crc_358_msi/rules/reviewed_part3_drug_candidate_fallbacks_p2a_20260721.yaml"
  # P2-B separates expression/amplification/ligand events from ordinary SNVs;
  # the ESR1 row is explicitly scoped to CRC301.
  - "panels/crc_358_msi/rules/reviewed_part3_drug_candidate_fallbacks_p2b_20260721.yaml"
  # P2-C prevents somatic single variants from implying germline status,
  # biallelic loss, HRD, or a hematologic treatment context.
  - "panels/crc_358_msi/rules/reviewed_part3_drug_candidate_fallbacks_p2c_20260721.yaml"
  # P3-A shares DNA-repair/hereditary boundaries and the exact legacy
  # corrections with CRC358; neither layer creates a drug match.
  - "panels/crc_358_msi/rules/reviewed_part3_p3a_dna_hereditary_fallbacks_20260721.yaml"
  - "panels/crc_358_msi/rules/reviewed_part3_p3a_legacy_exact_corrections_20260721.yaml"
  # P3-B shares antigen-presentation, IFN-γ receptor, and PD-L2 boundaries;
  # ordinary sequence variants are not predictive immune biomarkers.
  - "panels/crc_358_msi/rules/reviewed_part3_p3b_immune_fallbacks_20260721.yaml"
  # P3-C shares chromatin, histone, cohesin, transcription, and splicing
  # boundaries without turning ordinary variants into fusion/hotspot evidence.
  - "panels/crc_358_msi/rules/reviewed_part3_p3c_chromatin_transcription_fallbacks_20260721.yaml"
  # Shared exact corrections remove cross-event/cross-context legacy prose for
  # DEK, EP400, JUN, and ZRSR2 while retaining exact-selector precedence.
  - "panels/crc_358_msi/rules/reviewed_part3_p3c_legacy_exact_corrections_20260721.yaml"
  # P3-D maps 23 legacy histone symbols to current NCBI identities and prevents
  # hotspot/PTM evidence from crossing near-identical histone gene copies.
  - "panels/crc_358_msi/rules/reviewed_part3_p3d_histone_fallbacks_20260721.yaml"
  # P3-E closes the 47 shared residual fallbacks after current-identity review;
  # LBP1B and ZNF278 retain historical keys but map to UBP1 and PATZ1.
  - "panels/crc_358_msi/rules/reviewed_part3_p3e_shared_residual_fallbacks_20260721.yaml"
  # Shared exact corrections remove static database counts, cross-event prose,
  # and domain-location-only inference for seven legacy variant rows.
  - "panels/crc_358_msi/rules/reviewed_part3_p3e_legacy_exact_corrections_20260721.yaml"
  # CRC301 inherits a reviewed subset of CRC358 targeted-drug rules. Load the
  # same evidence-bound Part-3 contracts so inherited Part 2 rows cannot lose
  # their exact analysis or silently fall back to an unrelated variant.
  - "panels/crc_358_msi/rules/reviewed_part3_drug_contracts_20260721.yaml"
  # Shared report-group first-review corrections keep trial/research evidence
  # out of Part 2 benefit/caution conclusions and repair source-scope issues.
  - "panels/crc_358_msi/rules/reviewed_part3_medical_corrections_20260722.yaml"

input_contract:
  required_tables:
    - "Variations"
  optional_tables:
    - "TMB"
    - "Msisensor"
    - "QC"
    - "Cnv"
    - "Fusion"
    - "HLA"
    - "CtDrug"
  required_single_fields:
    - "patient_name"
    - "sample_id"
    - "project_name"
  required_columns:
    Variations:
      - "Gene_Symbol"
      - "cHGVS"
      - "ExistInsmall301"
      - "ExistIn552"
  biomarkers:
    tmb_value:
      required: false
      source_priority: ["excel", "form", "patient_info"]
    msi_status:
      required: true
      allowed_values: ["MSS", "MSI-L", "MSI-H", "未检测"]

template_contract:
  required_variables:
    - "patient_name"
    - "sample_id"
    - "total_variants_count"
    - "drug_related_count"
    - "tmb_summary"
    - "msi_summary"
    - "immuno_tips"
    - "msi_tips"
  required_lists:
    - "targeted_drug_tips"
    - "variants_2_1"
    - "chemotherapy"
  required_markers:
    - "__PART3_MARKER__"
  required_table_structures:
    targeted_drug_tips:
      columns: 4
      required_headers:
        - "基因"
        - "突变位点"
        - "潜在获益靶向药物"
        - "可能耐药"
    biomarker_results:
      columns: 3
      required_headers:
        - "TMB/MSI"
        - "用药提示"
    variant_detail:
      columns: 9
      required_headers:
        - "基因名称"
        - "转录本号"
        - "染色体"
        - "外显子"
        - "频率"
        - "潜在获益靶向药物"
        - "可能耐药"
    chemotherapy:
      columns: 3
      required_headers:
        - "药物名称"
        - "相关基因"
        - "药物适应情况"
    nccn_results:
      columns: 3
      required_headers:
        - "检测基因"
        - "检测内容"
        - "检测结果"

processors:
  - "empty_table_rows"
  - "part3_formatted_sections"
  - "signature_placeholder"
  - "report_content"
  - "bullet_lists"
  - "signature_layout"
  - "cover_artifacts"
  - "section_spacing"
  - "page_layout"
  - "gene_list_and_qc"
  - "variant_tables"
  - "hla_tail"
  - "blank_page_cleanup"
  - "toc_refresh"
  - "final_refresh_cleanup"
  - "underlines_and_styles"

golden_cases:
  - id: "crc_301_msi_basic_generation"
    runner: "reportgen.core.golden_case:run_golden_case"
    command: "pytest backend/tests/test_report_regression.py -q -k crc301"
    synthetic: true
    expected_qa_status: "PASS"
