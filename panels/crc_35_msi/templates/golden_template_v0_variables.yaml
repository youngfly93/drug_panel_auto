schema_version: "1.0"
template_id: "crc_35_msi_golden_template_v0"
description: >
  Draft structural variable map for the CRC35+MSI reviewed-report layout. It is
  safe to version because it contains positions and context variable names only,
  not patient values or source paths. The generated DOCX remains local until the
  chemotherapy/pharmacogenomics detail tables are finalized.

part3_marker:
  marker: "__PART3_MARKER__"
  start_heading: "3.基因变异及相应靶向药物解析"
  end_heading: "4.附录"
  renderer: "part3_formatted_sections"

paragraph_templates:
  - id: "msi_result_summary_sentence"
    contains: "该肿瘤样本为 微卫星稳定（MSS）型。该类患者"
    text: "{{ msi_detail_sentence }}"
  - id: "msi_result_detail_sentence"
    contains: "该肿瘤样本为  微卫星稳定（MSS）型。"
    text: "{{ msi_detail_sentence }}"

