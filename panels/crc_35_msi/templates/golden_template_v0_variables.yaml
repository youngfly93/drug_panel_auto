    table: 1
    collection: "variants_2_1"
    alias: "row"
    template_row: 2
    insert_at: 2
    remove_from: 2
    remove_to: "end"
    columns:
      - "gene"
      - "transcript"
      - "chr"
      - "exon"
      - "locus"
      - "var_type_cn"
      - "af_pct"
      - "benefit_drugs"
      - "caution_drugs"

  - id: "chemotherapy"
