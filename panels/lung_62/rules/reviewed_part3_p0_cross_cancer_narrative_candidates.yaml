  c_hgvs: c.1269G>A
  p_hgvs: p.W423*
  variant_kind: stop_gained
  intro: 'APC编码Wnt信号通路拮抗相关的肿瘤抑制蛋白，也参与细胞迁移、黏附、 转录调控和凋亡等过程。

    '
  mutation_analysis: '在转录本NM_000038.6上，c.1269G>A对应p.W423*，按HGVS标注为终止获得事件， 预计在第423位引入提前终止密码子。是否发生无义介导的mRNA降解、是否形成稳定截短蛋白、
    以及该事件在本例肺癌中的功能和临床意义仍需直接证据； 肿瘤样本中的单个APC事件不得直接推导治疗、预后或遗传性息肉病风险。

    '
