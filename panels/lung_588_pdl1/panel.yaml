schema_version: "1.0"
panel_id: "lung_588_pdl1"
display_name: "肺癌588基因+PD-L1"
version: "0.4.1"
status: "pilot"
description: >
  Independent lung 588-gene + PD-L1 package. The controlled pilot supports
  reviewed I/II/III variant extraction, case-image PD-L1 transcription,
  context-bounded exact-event targeted rules, and exact historical immune
  display contracts. Broad drug, immune and chemotherapy-PGx rules remain
  fail-closed.

aliases:
  - "lung_588"
  - "lung588"
  - "lung_588_pdl1"

project_detector_rules:
  keywords:
    - "肺癌588"
    - "588基因+PD-L1"
    - "肺癌588基因"
  keyword_groups:
    - any:
        - "肺癌588"
        - "肺癌588基因"
        - "588基因+PD-L1"
        - "588基因+pd-l1"
      weight: 1
  structural_fingerprints:
    - id: "lung588_result_workbook_v1"
      confidence: 1.0
      required_tables:
        Variations:
          required_columns:
            - "ExistIn552"
            - "ExistInsmall588"
        Hereditary_tumor:
          required_columns:
            - "ExistInsmall588"
            - "ExistIn178"

batch_generation:
  enabled: false
  clinical_info_mode: "per_case_required"
  reason: >
    The source Excel does not contain PD-L1. A shared batch form would copy one
    TPS/CPS/result into every patient, so batch generation remains blocked until
    per-file clinical payloads are implemented and validated.

release_governance:
  uat_policy: "uat/lung588_risk_based_release_policy.yaml"
  report_group_uat_decisions: "uat/lung588_report_group_uat_decisions.yaml"

review_candidate_contract: >-
  review_baselines/lung588_historical_review_candidate_v1.yaml

part3_knowledge:
  enabled: false
  reason: >
    The shared base workbook contains historical cross-cancer narratives and
    references. Lung588 must use an independently reviewed event-level overlay
    before any patient-visible Part-3 interpretation is enabled.
  disabled_notice: >
    本项目肺癌专属知识当前未启用，暂不提供第三部分的患者级基因解释和药物解析。
    检测结果请以第二部分为准，
    最终临床意义须由专业医师结合病理类型、疾病分期及现行诊疗规范综合判断。

reviewed_part3_overlay_additions:
  - "rules/reviewed_part3_domain_candidates.yaml"
  - "rules/reviewed_part3_p0_event_narrative_candidates.yaml"
  - "rules/reviewed_part3_p0_cross_cancer_narrative_candidates.yaml"

enhancer: "reportgen.core.enhancer_registry:CRC358Enhancer"

default_template: "lung_588_pdl1_historical_golden_v1"
templates:
  - id: "lung_588_pdl1_golden_template_v0"
    file: "templates/lung_588_pdl1_golden_template_v0.docx"
    version: "0.3.0"
    status: "pilot"
    description: >
      Deterministic engineering template derived from the de-identified lung329
      scaffold, relabelled for the independent 588 product and hardened so
      unreviewed treatment/PGx content fails closed and PD-L1 media is supplied
      only through the case-specific upload pipeline.
    processors:
      - "part3_formatted_sections"
      - "rebuild_references"
      - "signature_placeholder"
      - "pdl1_case_image"
      - "immune_table_notes"
      - "bullet_lists"
      - "signature_layout"
      - "front_matter_spacing"
      - "blank_page_cleanup"
      - "toc_refresh"
      - "final_refresh_cleanup"
      - "underlines_and_styles"
  - id: "lung_588_pdl1_historical_golden_v1"
    file: "templates/lung_588_pdl1_historical_golden_v1.docx"
    version: "0.4.0-review.4"
    status: "pilot"
    description: >
      Full-layout report-group review candidate distilled in place from the
      repaired controlled historical lung588 final report. Patient identifiers,
      signatures, case images, historical event narratives and fixed patient
      genotypes are removed; current ReportGen fields drive case results while
      the historical appendix remains visibly labelled for medical review.
    processors:
      - "part3_formatted_sections"
      - "rebuild_references"
      - "signature_placeholder"
      - "pdl1_case_image"
      - "immune_table_notes"
      - "bullet_lists"
      - "signature_layout"
      - "front_matter_spacing"
      - "blank_page_cleanup"
      - "toc_refresh"
      - "final_refresh_cleanup"
      - "underlines_and_styles"

mappings:
  default: "config/mapping.yaml"

rules:
  panel_rules: "rules/panel.yaml"
  report_text: "rules/report_text.yaml"
  biomarkers: "rules/biomarkers.yaml"
  guideline_tables: "rules/guideline_tables.yaml"
  drugs: "rules/drugs.yaml"
  pdl1_product_contract: "rules/pdl1_product_contract.yaml"
  clinical_context: "rules/clinical_context.yaml"
  medical_candidates: "rules/medical_candidates.yaml"
  candidate_evidence_review: "rules/candidate_evidence_review.yaml"
  knowledge_coverage: "rules/knowledge_coverage.yaml"
  knowledge_redactions: "rules/knowledge_redactions.yaml"
  style: "rules/style.yaml"
  filtering: "config/filtering.yaml"
  drug_brands: "config/drug_brands.yaml"

input_contract:
  required_tables:
    - "Variations"
    - "TMB"
    - "Msisensor"
  optional_tables:
    - "QC"
    - "Hereditary_tumor"
    - "CtDrug"
    - "Hotspot"
    - "Cnv"
    - "Fusion"
    - "HLA"
    - "Ct1000"
    - "Ct15"
  required_single_fields:
    - "patient_name"
    - "sample_id"
    - "project_name"
    - "report_date"
  required_columns:
    Variations:
      - "Gene_Symbol"
      - "cHGVS"
      - "ExistIn552"
      - "Transcript"
  required_any_columns:
    Variations:
      - "pHGVS_S"
      - "pHGVS_A"
  biomarkers:
    tmb_value:
      required: true
      minimum: 0
      source_priority: ["excel"]
    msi_status:
      required: true
      allowed_values: ["MSS", "MSI-L", "MSI-H"]
      source_priority: ["excel"]
    pdl1_tps:
      required: false
      minimum: 0
      maximum: 100
      source_priority: ["form"]
    pdl1_cps:
      required: false
      minimum: 0
      maximum: 100
      source_priority: ["form"]
    pdl1_result:
      required: false
      allowed_values: ["阳性（高表达）", "阳性（低表达）", "阴性"]
      source_priority: ["form"]
    pdl1_image_path:
      required: false
      source_priority: ["form"]
    pdl1_assay_profile_id:
      required: false
      source_priority: ["form"]
    pdl1_source_record_id:
      required: false
      source_priority: ["form"]
    pdl1_source_record_date:
      required: false
      source_priority: ["form"]
    pdl1_specimen_id:
      required: false
      source_priority: ["form"]
    pdl1_image_disposition:
      required: false
      allowed_values: ["病例专属图像（报告展示）"]
      source_priority: ["form"]

template_contract:
  required_variables:
    - "patient_name"
    - "sample_id"
    - "pdl1_tps"
    - "pdl1_cps"
    - "pdl1_result"
    - "pdl1_classification_notice"
  required_lists:
    - "variants_2_1"
    - "targeted_drug_tips"
    - "nccn_results"
    - "immune_positive_results"
    - "immune_negative_results"
    - "immune_hyperprogression_results"
  required_markers:
    - "__PART3_MARKER__"
    - "__PDL1_CASE_IMAGE__"

context_contracts:
  case_lung_a: "context_contracts/case_lung_a.yaml"
  case_lung_b: "context_contracts/case_lung_b.yaml"
  case_lung_c: "context_contracts/case_lung_c.yaml"

processors:
  - "empty_table_rows"
  - "part3_formatted_sections"
  - "signature_placeholder"
  - "report_content"
  - "pdl1_case_image"
  - "bullet_lists"
  - "signature_layout"
  - "cover_artifacts"
  - "section_spacing"
  - "page_layout"
  - "gene_list_and_qc"
  - "variant_tables"
  - "hla_tail"
  - "blank_page_cleanup"
  - "toc_refresh"
  - "final_refresh_cleanup"
  - "underlines_and_styles"

golden_cases:
  - id: "lung_588_pdl1_contract"
    runner: "reportgen.core.golden_case:run_golden_case"
    command: >-
      pytest backend/tests/test_lung588_contract.py
      backend/tests/test_lung588_phase_c_governance.py -q
    synthetic: true
    expected_qa_status: "PASS"
  - id: "lung_588_pdl1_controlled_pilot_boundary"
    runner: "reportgen.core.golden_case:run_golden_case"
    command: >-
      python scripts/validate_lung588_pilot_boundary_suite.py
    synthetic: true
    expected_qa_status: "PASS"
