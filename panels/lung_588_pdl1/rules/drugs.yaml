schema_version: "1.0"
panel_id: "lung_588_pdl1"
rule_id: "drugs"
version: "0.2.1"
updated: "2026-08-10"
status: "pilot"
description: >
  Exact-event lung treatment policy. Two exact events yield three evidence-
  bounded treatment combinations during the controlled pilot; broad historical
  and cross-cancer rows remain disabled.

governance:
  schema_version: "1.0"
  policy_id: "lung588_targeted_drug_governance_v1"
  defaults:
    targeted_drug:
      review_status: "needs_review"
      runtime_eligible: false
      review_basis: "event_level_lung_cancer_review_required"
      evidence_level: "not_assigned"
      evidence_as_of: "2026-07-23"
      cancer_scope: "lung_cancer_event_specific"
      secondary_review_status: "pending_report_group_review"
      source_refs:
        - type: "panel_policy"
          id: "lung588_fail_closed_targeted_drug_policy"

drug_rules:
  approved_drug_rows_source: "none"
  brand_lookup_source: "config/drug_brands.yaml"
  immunotherapy_brand_list_source: "config/drug_brands.yaml"
  evidence_levels:
    allowed: ["A", "B", "C", "D"]

targeted_drug_rules:
  enabled: true
  base_db_enabled: false
  allowed_source_dbs: []
  allow_internal_rows: false
  require_cancer_profile_match: true
  approved_drug_rows_enabled: false
  clinical_context_rule: "clinical_context"
  summary_display_scope: "drug_matched_variants"
  summary_display_variant_levels: ["Ⅰ类", "Ⅱ类"]
  overrides: {}
  reviewed_variant_overrides:
    - rule_id: "lung_braf_v600e_regulatory_combinations"
      panels: ["lung_329_pdl1", "lung_588_pdl1"]
      gene: "BRAF"
      transcript: "NM_004333.6"
      c_hgvs: "c.1799T>A"
      p_hgvs: "p.V600E"
      variant_level: ["Ⅰ类", "Ⅱ类"]
      benefit_drugs:
        - "达拉非尼+曲美替尼（A）"
        - "康奈非尼+贝美替尼（A）"
      caution_drugs: ["--"]
      required_context_fields:
        - "lung_histology"
        - "disease_extent"
        - "companion_diagnostic_status"
      context_requirements:
        lung_histology: ["非小细胞肺癌"]
        disease_extent: ["转移性"]
        companion_diagnostic_status: ["已确认符合"]
      review_status: "provisional_runtime"
      runtime_eligible: true
      review_basis: "exact_event_primary_source_review_with_case_delivery_gate"
      evidence_level: "regulatory_label_exact_variant_lung_cancer"
      evidence_as_of: "2026-08-09"
      cancer_scope: "metastatic_nsclc_braf_v600e"
      secondary_review_status: "case_level_report_group_review_required"
      review_metadata:
        reviewer: "codex"
        reviewer_type: "ai_delegated_report_group_first_review"
        reviewed_at: "2026-08-09"
        risk_level: "high"
        secondary_review_status: "case_level_report_group_review_required"
      source_refs:
        - type: "regulatory_label"
          authority: "FDA"
          id: "Tafinlar-Mekinist-label-2024"
          url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2024/202806s031%2C217514s004lbl.pdf"
        - type: "regulatory_approval"
          authority: "FDA"
          id: "FDA-2023-encorafenib-binimetinib-NSCLC"
          url: "https://www.fda.gov/drugs/resources-information-approved-drugs/fda-approves-encorafenib-binimetinib-metastatic-non-small-cell-lung-cancer-braf-v600e-mutation"

    - rule_id: "lung_erbb2_g660d_trastuzumab_deruxtecan"
      panels: ["lung_329_pdl1", "lung_588_pdl1"]
      gene: "ERBB2"
      transcript: "NM_004448.4"
      c_hgvs: "c.1979G>A"
      p_hgvs: "p.G660D"
      variant_level: ["Ⅰ类", "Ⅱ类"]
      benefit_drugs:
        - "德曲妥珠单抗（A）"
      caution_drugs: ["--"]
      required_context_fields:
        - "lung_histology"
        - "disease_extent"
        - "prior_systemic_therapy"
        - "companion_diagnostic_status"
      context_requirements:
        lung_histology: ["非小细胞肺癌"]
        disease_extent: ["不可切除局部晚期", "转移性"]
        prior_systemic_therapy: ["已接受"]
        companion_diagnostic_status: ["已确认符合"]
      review_status: "provisional_runtime"
      runtime_eligible: true
      review_basis: "exact_event_functional_plus_label_biomarker_chain_with_case_gate"
      evidence_level: "functional_exact_event_plus_regulatory_biomarker_label"
      evidence_as_of: "2026-08-09"
      cancer_scope: "previously_treated_unresectable_or_metastatic_nsclc_activating_erbb2"
      secondary_review_status: "case_level_report_group_review_required"
      review_metadata:
        reviewer: "codex"
        reviewer_type: "ai_delegated_report_group_first_review"
        reviewed_at: "2026-08-09"
        risk_level: "high"
        secondary_review_status: "case_level_report_group_review_required"
      source_refs:
        - type: "pubmed"
          id: "PMID:30449325"
          url: "https://pubmed.ncbi.nlm.nih.gov/30449325/"
        - type: "regulatory_label"
          authority: "FDA"
          id: "Enhertu-label-2026"
          url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2026/761139s041s043lbl.pdf"

