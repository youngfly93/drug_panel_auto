schema_version: "1.0"
source:
  panel: "lung_588_pdl1"
  purpose: >
    First-review, exact-event narrative candidates for detected lung588 P0
    events that still fall back to generic Part-3 prose.
  source_type: "official_gene_identity_plus_hgvs_consequence_boundary"
  curated_at: "2026-07-24"
  evidence_as_of: "2026-07-24"
  activation_mode: "candidate_only_pending_secondary_review"
  consumer_panels:
    - "lung_588_pdl1"
  privacy: "Only de-identified CASE aliases and structured events are used."

governance:
  schema_version: "1.0"
  policy_id: "lung588_p0_exact_event_narrative_first_review_v1"
  purpose: >
    Replace generic fallback prose with source-bounded candidate wording
    without making the wording patient-visible or runtime-eligible.
  defaults:
    gene:
      review_status: "needs_review"
      runtime_eligible: false
      report_text_allowed: false
      patient_visible: false
      review_basis: "codex_first_review_ncbi_gene_and_hgvs_consequence"
      reviewer: "codex"
      reviewer_type: "ai_assisted_evidence_review"
      reviewed_at: "2026-07-24"
      evidence_as_of: "2026-07-24"
      evidence_level: "official_gene_function_plus_predicted_sequence_consequence"
      cancer_scope: "lung_panel_detected_exact_event_candidate"
      secondary_review_status: "pending_report_group_review"
      risk_level: "content_requires_secondary_review"
  runtime_selector_contract:
    current_overlay_matches_transcript: false
    disposition: "promotion_blocked_until_transcript_is_enforced"
    reason: >
      The current reviewed-overlay runtime key uses gene, c_hgvs and p_hgvs.
      Transcript is preserved below for review identity but is not yet enforced
      by the runtime loader.
  promotion_requires:
    - "report_group_event_level_secondary_review"
    - "exact_transcript_c_hgvs_p_hgvs_identity_check"
    - "runtime_selector_enforces_transcript"
    - "direct_source_supports_every_patient_visible_claim"
    - "positive_and_negative_rule_tests"
    - "case_level_uat"

gene_sections:
  - candidate_id: "lung588_event_narrative_brip1_w714ter"
    gene: "BRIP1"
    transcript: "NM_032043.3"
    c_hgvs: "c.2142G>A"
    p_hgvs: "p.W714*"
    variant_kind: "stop_gained"
    intro: >
      BRIP1编码BRCA1相互作用DNA解旋酶，属于RecQ DEAH解旋酶家族；
      该蛋白可与BRCA1的BRCT重复区域相互作用，参与正常的DNA双链断裂修复。
    mutation_analysis: >
      在转录本NM_032043.3上，c.2142G>A对应p.W714*，按HGVS标注为终止获得事件，
      预计在第714位引入提前终止密码子。是否发生无义介导的mRNA降解、是否造成蛋白功能缺失，
      以及该事件在本例肺癌中的临床意义，仍需结合直接功能或临床证据与样本背景复核；
      不得仅凭该事件推导靶向、免疫、预后或遗传风险结论。
    source_refs:
      - type: "ncbi_gene"
        authority: "NCBI"
        id: "GeneID:83990"
        url: "https://www.ncbi.nlm.nih.gov/gene/83990"
        supports: "gene_identity_and_function_only"
    evidence_boundaries:
