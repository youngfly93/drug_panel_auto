schema_version: "1.0"
panel_id: "lung_588_pdl1"
rule_id: "biomarkers"
version: "1.0.1"
updated: "2026-09-02"
status: "pilot"
description: >
  Lung comprehensive-panel biomarker display contract transcribed from the
  paired historical final reports. The fixed 15/12/8 rows are always rendered;
  only the current-case result column is derived from source data. Historical
  B/C event associations remain transcript- and HGVS-exact; fixed rows do not
  broaden those reviewed event rules to arbitrary variants in the same gene.

biomarkers:
  tmb:
    field: "tmb_summary"
    low_label: "TMB-L"
    high_label: "TMB-H"
    reference_threshold: "10 mutations/Mb"
  msi:
    field: "msi_summary"
    allowed_values: ["MSS", "MSI-L", "MSI-H"]
  pdl1:
    source: "controlled_form"
    fields: ["pdl1_tps", "pdl1_cps", "pdl1_result"]
  immune_gene_tables:
    enabled: true
    positive:
      genes: [MLH1, MSH2, MSH6, PMS2, POLE, POLD1, CD274, PDCD1LG2, PBRM1, KRAS, TET1, SERPINB3, SERPINB4, ATM, ATR, BRCA1, BRCA2, BRIP1, MSH3, PALB2, CHEK2, ARID1A, ATRX, CDK12, FANCI, FANCM, MRE11A, NBN, RAD50, RAD51]
      rows:
        - {key: MLH1, genes: [MLH1], mode: exact_variant, transcript: "NM_000249.4", c_hgvs: "c.790+1G>A", p_hgvs: "", variant_level: ["Ⅰ类", "Ⅱ类"], display: "MLH1", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: MSH2, genes: [MSH2], mode: direct, display: "MSH2", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: MSH6, genes: [MSH6], mode: direct, display: "MSH6", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: PMS2, genes: [PMS2], mode: exact_variant, transcript: "NM_000535.7", c_hgvs: "c.59G>A", p_hgvs: "p.R20Q", variant_level: ["Ⅰ类", "Ⅱ类"], display: "PMS2", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: POLE, genes: [POLE], mode: direct, display: "POLE", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: POLD1, genes: [POLD1], mode: direct, display: "POLD1", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: CD274, genes: [CD274], mode: direct, display: "CD274（PD-L1）", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: PDCD1LG2, genes: [PDCD1LG2], mode: direct, display: "PDCD1LG2（PD-L2）", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: PBRM1, genes: [PBRM1], mode: direct, display: "PBRM1", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: KRAS, genes: [KRAS], mode: direct, display: "KRAS", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: KRAS_TP53, genes: [KRAS, TP53], mode: co_mutation, display: "KRAS/TP53共突变", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: TET1, genes: [TET1], mode: direct, display: "TET1", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: SERPINB3, genes: [SERPINB3], mode: direct, display: "SERPINB3", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - {key: SERPINB4, genes: [SERPINB4], mode: direct, display: "SERPINB4", interpretation: "检出有害变异时可能疗效较好。", runtime_eligible: true}
        - key: DDR
          genes: [ATM, ATR, BRCA1, BRCA2, BRIP1, MSH3, PALB2, CHEK2, ARID1A, ATRX, CDK12, FANCI, FANCM, MRE11A, NBN, RAD50, RAD51]
          mode: exact_variant_group
          selectors:
            - {genes: [ATM], transcript: "NM_000051.4", c_hgvs: "c.1236-2A>T", p_hgvs: "", variant_level: ["Ⅰ类", "Ⅱ类"]}
            - {genes: [BRIP1], transcript: "NM_032043.3", c_hgvs: "c.2142G>A", p_hgvs: "p.W714*", variant_level: ["Ⅰ类", "Ⅱ类"]}
            - {genes: [MSH3], transcript: "NM_002439.5", c_hgvs: "c.2905C>T", p_hgvs: "p.Q969*", variant_level: ["Ⅰ类", "Ⅱ类"]}
            - {genes: [BRCA2], transcript: "NM_000059.4", c_hgvs: "c.7007G>A", p_hgvs: "p.R2336H", variant_level: ["Ⅰ类", "Ⅱ类"]}
          display: "DDR基因（DNA损伤修复相关基因）"
          interpretation: "检出有害变异时可能疗效较好。"
          runtime_eligible: true
