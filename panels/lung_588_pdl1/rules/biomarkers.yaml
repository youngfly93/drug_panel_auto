schema_version: "1.0"
panel_id: "lung_588_pdl1"
rule_id: "biomarkers"
version: "0.2.0"
updated: "2026-08-09"
status: "pilot"
description: >
  Lung588 biomarker display policy. Immune associations are restricted to
  transcript- and HGVS-exact historical display contracts and remain subject
  to mandatory case-level report-group review.

biomarkers:
