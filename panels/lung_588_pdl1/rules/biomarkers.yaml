        - {key: EGFR_L858R, genes: [EGFR], mode: variant_pattern, patterns: [L858R, EX19], display: "EGFR（L858R/EX19del）", interpretation: "检出有害变异时可能疗效不佳。", runtime_eligible: true}
        - {key: ALK, genes: [ALK], mode: direct, display: "ALK", interpretation: "检出有害变异时可能疗效不佳。", runtime_eligible: true}
