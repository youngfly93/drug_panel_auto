      - {display: "吉西他滨+顺铂", components: ["gemcitabine", "cisplatin"]}
      - {display: "多西他赛+顺铂", components: ["docetaxel", "cisplatin"]}
      - {display: "长春瑞滨+顺铂", components: ["vinorelbine", "cisplatin"]}
      - {display: "培美曲塞+顺铂(仅限于非鳞癌)", components: ["pemetrexed", "cisplatin"]}
      - {display: "紫杉醇+顺铂", components: ["paclitaxel", "cisplatin"]}
      - {display: "白蛋白结合型紫杉醇+卡铂", components: ["paclitaxel", "carboplatin"]}
      - {display: "多西他赛+卡铂", components: ["docetaxel", "carboplatin"]}
      - {display: "吉西他滨+卡铂", components: ["gemcitabine", "carboplatin"]}
      - {display: "紫杉醇+卡铂", components: ["paclitaxel", "carboplatin"]}
      - {display: "依托泊苷+卡铂", components: ["etoposide", "carboplatin"]}
