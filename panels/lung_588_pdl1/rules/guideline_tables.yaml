      - {display: "长春瑞滨", components: ["vinorelbine"]}
      - {display: "依托泊苷", components: ["etoposide"]}
      - {display: "培美曲塞", components: ["pemetrexed"]}
      - {display: "紫杉醇", components: ["paclitaxel"]}
      - {display: "GP（吉西他滨+顺铂）", components: ["gemcitabine", "cisplatin"]}
      - {display: "GC（吉西他滨+卡铂）", components: ["gemcitabine", "carboplatin"]}
      - {display: "DP（多西他赛+顺铂）", components: ["docetaxel", "cisplatin"]}
      - {display: "DC（多西他赛+卡铂）", components: ["docetaxel", "carboplatin"]}
      - {display: "NP（长春瑞滨+顺铂）", components: ["vinorelbine", "cisplatin"]}
      - {display: "NC（长春瑞滨+卡铂）", components: ["vinorelbine", "carboplatin"]}
      - {display: "EP（依托泊苷+顺铂）", components: ["etoposide", "cisplatin"]}
      - {display: "PP（培美曲塞+顺铂）*（仅限于非鳞癌）", components: ["pemetrexed", "cisplatin"]}
      - {display: "PC（培美曲塞+卡铂）*（仅限于非鳞癌）", components: ["pemetrexed", "carboplatin"]}
      - {display: "TP（紫杉醇+顺铂）", components: ["paclitaxel", "cisplatin"]}
      - {display: "TC（紫杉醇+卡铂）", components: ["paclitaxel", "carboplatin"]}
      - {display: "多西他赛单药方案", components: ["docetaxel"]}
      - {display: "培美曲塞单药方案(仅限于非鳞癌)", components: ["pemetrexed"]}
      - {display: "吉西他滨单药方案", components: ["gemcitabine"]}
    dosage_rows:
      - {regimen: "GP（吉西他滨+顺铂）", dosage: "吉西他滨：1000-1250 mg/(m2.d) 静脉滴注 d1,8 每三~四周*4-6顺铂：75 mg/(m2.d) 静脉滴注 d1 每三~四周*4-6或根据患者耐受状况，总剂量分3-5日输注。"}
      - {regimen: "GC（吉西他滨+卡铂）", dosage: "吉西他滨：1000-1250 mg/(m2.d) 静脉滴注 d1,8 每三~四周*4-6卡铂：AUC 4.5-6 静脉滴注 d1 每三~四周*4-6或根据患者耐受状况，总剂量分2-3日输注。"}
      - {regimen: "DP（多西他赛+顺铂）", dosage: "多西他赛：75 mg/(m2.d) 静脉滴注 d1 每三～四周*4-6 或根据患者耐受状况，总剂量分 2 日输注。顺铂：75 mg/(m2.d) 静脉滴注 d1 每三～四周*4-6 或根据患者耐受状况，总剂量分 3-5 日输注。"}
      - {regimen: "DC（多西他赛+卡铂）", dosage: "多西他赛：75 mg/(m2.d) 静脉滴注 d1 每三～四周*4-6 或根据患者耐受状况，总剂量分 2 日输注。卡铂：AUC 4.5-6 静脉滴注 d1 每三~四周*4-6或根据患者耐受状况，总剂量分2-3日输注。"}
      - {regimen: "NP（长春瑞滨+顺铂）", dosage: "长春瑞滨：25 mg/(m2.d) 静脉推注 d1,8 每三～四周*4-6顺铂：75-80 mg/(m2.d) 静脉滴注 d1 每三～四周*4-6 或根据患者耐受状况，总剂量分 3-5 日输注。"}
