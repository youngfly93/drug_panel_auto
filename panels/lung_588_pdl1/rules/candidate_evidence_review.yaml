description: >
  Primary-source scope review for four lung588 targeted-drug candidates. Three
  are mirrored into the controlled-pilot runtime rule file; this catalog is
  not itself a runtime source and the fourth candidate remains held.

governance:
  review_id: "lung588_candidate_evidence_scope_review_20260723"
  evidence_as_of: "2026-08-09"
  reviewer: "codex"
  reviewer_type: "ai_assisted_primary_source_scope_review"
  primary_review_status: "completed_non_authoritative_scope_review"
  secondary_review_status: "case_level_report_group_review_required"
  runtime_rule_source: false
  runtime_eligible_candidate_count: 3
  report_text_allowed_candidate_count: 3
  held_candidate_count: 1
  promotion_blocked: false
  case_delivery_gate_required: true
  review_dimensions:
    - "source_identity"
    - "lung_cancer_scope"
    - "disease_extent_and_prior_therapy_scope"
    - "exact_event_and_transcript_boundary"
    - "assay_or_companion_diagnostic_scope"
    - "direct_exact_drug_event_clinical_outcome"
    - "patient_report_display_boundary"
  interpretation_boundary: >
    A regulatory biomarker class, functional activation study, assay
    reportability statement, or historical report row is not by itself an
    exact-event treatment outcome. Promotion requires report-group secondary
    review, a current label check, positive and negative rule tests, and
    case-level UAT.

reviews:
  - candidate_id: "lung588_braf_v600e_dabrafenib_trametinib"
    gene: "BRAF"
    selector:
      event_type: "snv"
      transcript: "NM_004333.6"
      c_hgvs: "c.1799T>A"
      p_hgvs: "p.V600E"
    therapy:
      generic_name_zh: "达拉非尼+曲美替尼"
      generic_name_en: "dabrafenib + trametinib"
    source_claim_reviews:
      - source_id: "Tafinlar-Mekinist-label-2024"
        source_type: "regulatory_label"
        authority: "FDA"
        url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2024/202806s031%2C217514s004lbl.pdf"
        verification_status: "verified_primary_source"
        supports: >
          Combination treatment for metastatic non-small cell lung cancer with
          BRAF V600E detected by an FDA-approved test.
        does_not_support: >
          Other BRAF events, other cancer types, or either component as
          monotherapy under this candidate.
      - source_id: "PMID:28919011"
        source_type: "phase_2_clinical_study"
        authority: "PubMed"
        url: "https://pubmed.ncbi.nlm.nih.gov/28919011/"
        verification_status: "verified_primary_clinical_source"
        supports: >
          Direct combination-treatment outcomes in metastatic BRAF
          V600E-positive non-small cell lung cancer.
        does_not_support: >
          BRAF D594G, a gene-only BRAF rule, or transcript-independent
          normalization.
    scope_assessment:
      lung_cancer_scope: "direct_metastatic_nsclc"
      disease_extent_scope: "metastatic_only"
      event_scope: "direct_braf_v600e_at_protein_level"
      transcript_scope: >
        Candidate identity is locked to NM_004333.6 plus c.1799T>A and
        p.V600E; the treatment sources name BRAF V600E rather than an NM
        accession, so runtime normalization must retain the transcript-bound
        selector.
      assay_scope: "FDA_approved_test_required"
      direct_exact_drug_event_clinical_outcome: "identified"
      patient_report_display: "allowed_after_context_match_and_case_review"
    primary_review:
      status: "completed_non_authoritative_scope_review"
      decision: "eligible_to_remain_candidate_pending_secondary_review"
      reviewed_at: "2026-07-23"
      reviewer: "codex"
      reviewer_type: "ai_assisted_primary_source_scope_review"
    secondary_review:
      status: "case_level_report_group_review_required"
      decision: "not_preapproved; review every generated report before download"
      reviewer: ""
      reviewed_at: ""
    unresolved_requirements:
      - "case_level_report_group_review_before_download"
      - "current_label_version_recheck_at_promotion"
      - "positive_and_negative_rule_tests"
      - "case_level_uat"
    runtime_eligible: true
    report_text_allowed: true

