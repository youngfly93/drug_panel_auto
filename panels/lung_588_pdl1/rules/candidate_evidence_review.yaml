  - candidate_id: "lung588_erbb2_g660d_trastuzumab_deruxtecan"
    gene: "ERBB2"
    selector:
      event_type: "snv"
      transcript: "NM_004448.4"
      c_hgvs: "c.1979G>A"
      p_hgvs: "p.G660D"
      protein_domain: "transmembrane_domain"
    therapy:
      generic_name_zh: "德曲妥珠单抗"
      generic_name_en: "trastuzumab deruxtecan"
    source_claim_reviews:
      - source_id: "PMID:30449325"
        source_type: "functional_study"
        authority: "PubMed"
        url: "https://pubmed.ncbi.nlm.nih.gov/30449325/"
        verification_status: "verified_primary_functional_source"
        supports: >
          ERBB2 G660D as an activating transmembrane-domain mutation with
          experimentally characterized signaling biology.
        does_not_support: >
          A direct G660D-specific trastuzumab deruxtecan clinical outcome.
      - source_id: "Enhertu-label-2026"
        source_type: "regulatory_label"
        authority: "FDA"
        url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2026/761139s041s043lbl.pdf"
        verification_status: "verified_primary_regulatory_source"
        supports: >
          Treatment of unresectable or metastatic non-small cell lung cancer
          with activating ERBB2 mutations after prior systemic therapy, under
          the label's testing requirements.
        does_not_support: >
          A separately reported G660D efficacy subgroup or use outside the
          labeled disease and prior-treatment context.
      - source_id: "P200010S008"
        source_type: "companion_diagnostic_decision"
        authority: "FDA"
        url: "https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpma/pma.cfm?id=P200010S008"
        verification_status: "verified_primary_regulatory_source"
        supports: >
          Companion-diagnostic use for activating ERBB2 single-nucleotide
          variants and exon 20 insertions in the labeled NSCLC context.
        does_not_support: "A G660D-specific treatment response estimate."
      - source_id: "P200010S008-technical-label"
        source_type: "companion_diagnostic_technical_label"
        authority: "FDA"
        url: "https://www.accessdata.fda.gov/cdrh_docs/pdf20/P200010S008C.pdf"
        verification_status: "verified_primary_regulatory_source"
        supports: >
          G660D under NM_004448 as a reportable ERBB2 alteration within the
          assay documentation.
        does_not_support: >
          A direct G660D-specific trastuzumab deruxtecan clinical outcome.
    scope_assessment:
      lung_cancer_scope: "regulatory_activating_erbb2_mutant_nsclc"
      disease_extent_scope: "unresectable_or_metastatic_after_prior_systemic_therapy"
      event_scope: "exact_g660d_functional_and_assay_support"
      transcript_scope: >
        Candidate identity is locked to NM_004448.4 plus c.1979G>A and
        p.G660D; assay documentation reports NM_004448, while exact accession
        version normalization remains a runtime selector boundary.
      assay_scope: "exact_g660d_reportable_in_companion_diagnostic_documentation"
      direct_exact_drug_event_clinical_outcome: "not_identified"
      evidence_chain: >
        Exact-event functional activation plus exact-event assay
        reportability plus a biomarker-class regulatory indication; this is
        not the same as a direct G660D treatment-outcome subgroup.
      patient_report_display: "allowed_after_context_match_and_case_review"
