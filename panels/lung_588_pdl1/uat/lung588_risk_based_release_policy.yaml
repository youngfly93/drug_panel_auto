schema_version: "1.0"
panel_id: "lung_588_pdl1"
policy_id: "lung588_report_group_self_service_pilot_v2"
status: "active_policy"
effective_date: "2026-09-01"
decision_owner: "product_owner"

supersedes:
  - "fixed_ten_real_case_threshold"

rationale: >
  Report-group pilot drafts are generated first so reviewers can inspect the
  actual Word output and submit feedback. Per-case report-group decisions,
  reviewer names and dates are not prerequisites for draft generation. Formal
  clinical promotion remains a separate decision and is not implied here.

real_case_policy:
  selection: "all_registered_real_cases_available_at_release_freeze"
  fixed_minimum_real_case_count: null
  require_non_empty_case_set: true
  required_review_fraction: 0.0
  required_pass_fraction: 0.0
  p0_allowed: 0

case_requirements:
  ngs_structure_must_pass: true
  pdl1_product_contract_must_pass: true
  verified_case_specific_ihc_source_required: true
  report_group_decision_required: false
  report_group_reviewer_and_date_required: false

product_owner_feedback_source:
  required: true
  minimum_entry_count: 1
  entries:
    - recorded_at: "2026-09-01"
      source: "产品负责人指令：肺癌 pilot 去锁，让报告组自助测试"
      scope: "lung588/lung329 report-group pilot draft generation"

synthetic_boundary_policy:
  required_suite: "lung588_pilot_boundary_suite"
  counts_as_real_case_uat: false
  purpose:
    - "PD-L1 display boundaries"
    - "MSI/TMB boundaries"
    - "exact-event positive and negative controls"
    - "long-table pagination"
    - "cross-case leak protection"

current_release_boundaries:
  batch_generation_enabled: true
  batch_pdl1_mode: "case_isolated_blank_display_not_provided"
  part3_knowledge_enabled: true
  part3_cross_cancer_residual_policy: "qa_warn_non_blocking"
  targeted_drug_rules_enabled: true
  targeted_drug_scope: >
    Reviewed exact A-level events plus historical gene-matched C/D candidates;
    C/D candidates remain visibly marked pending report-group review.
  immune_gene_claims_enabled: true
  immune_gene_scope: >
    Fixed historical 15/12/8 display rows; B/C event associations remain
    transcript-and-HGVS exact.
  chemotherapy_pharmacogenomics_enabled: true
  chemotherapy_detail_levels: ["1B", "2A", "2B"]
  external_delivery_without_manual_review: false
  visible_release_label: "report_group_pilot_draft"

historical_record_policy: >
  Receipts and audits frozen before this effective date retain the former
  ten-case wording as historical evidence. They do not define the current
  promotion denominator and must not be rewritten retroactively.
