  intro: 'FLT3编码参与造血调控的III类受体酪氨酸激酶。配体与其胞外区结合后可诱导受体二聚化和自身磷酸化。

    '
  mutation_analysis: '在转录本NM_004119.3上，c.1159C>T对应p.R387*，按HGVS标注为终止获得事件， 预计在第387位引入提前终止密码子。该事件不得等同于其他FLT3事件， 也不得借用其他事件或血液肿瘤中的证据推导本例肺癌的蛋白功能、治疗或预后结论；
