- candidate_id: lung588_event_narrative_esr1_q414h
  gene: ESR1
  transcript: NM_000125.4
  c_hgvs: c.1242G>T
  p_hgvs: p.Q414H
  variant_kind: missense
  intro: 'ESR1编码雌激素受体和配体激活型转录因子。其经典蛋白包含N端非配体依赖性转录激活区、 DNA结合区、铰链区以及C端配体依赖性转录激活区。

    '
  mutation_analysis: '在转录本NM_000125.4上，c.1242G>T对应p.Q414H，为第414位谷氨酰胺替换为组氨酸的错义事件。 当前官方基因功能来源不能证明该精确位点的功能效应或肺癌临床意义，
    也不得把其他癌种、其他ESR1位点或内分泌治疗证据外推至该事件； 不得由本段形成治疗、免疫、预后或遗传风险结论。

