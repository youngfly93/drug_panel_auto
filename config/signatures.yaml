# Signature image registry.
#
# Keep real signature images outside git, for example under:
#   storage/signatures/<date>/<uuid>.png
#
# Supported forms:
# detector:
#   张三: /absolute/path/to/zhangsan.png
# reviewer:
#   - name: 李四
#     path: storage/signatures/reviewer_lisi.png

detector:
  TEST检测者: storage/signatures/registry/test_detector.png
  # patient_info.yaml 默认签发人，登记后默认/合成报告不再触发"无签名图"警告
  张医生: storage/signatures/registry/test_detector.png
  李晓媛: storage/signatures/registry/lixiaoyuan.png
reviewer:
  TEST审核者: storage/signatures/registry/test_reviewer.png
  李医生: storage/signatures/registry/test_reviewer.png
  默认审核者: storage/signatures/registry/default_reviewer_lz258792.png

# Production deploy preflight validates only these runtime assets. Test-only
# entries above remain optional and must never cause a production false block.
production_required:
  detector: ["李晓媛"]
  reviewer: ["默认审核者"]
